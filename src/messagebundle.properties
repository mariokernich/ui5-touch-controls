# ---------------------------------------------------------------------------
# The texts the controls of this library put on the screen themselves.
#
# Everything else a control shows comes from the application - a button says
# what its text property says. What is collected here is what the library
# decides on its own: the labels of the ready-made dialog actions, the hint on
# an empty signature pad, the two states of a switch, the line a picker shows
# when a search finds nothing. They are read at render time, so an application
# gets them in the language it runs in.
#
# The bundle carries the languages the library is translated into; anything
# else falls back to this file. Keys are upper case with the control they
# belong to in front, the way sap.m writes them.
# ---------------------------------------------------------------------------

# the actions of a QuickDialog, named after the MessageAction they stand for
QUICKDIALOG_ABORT=Abort
QUICKDIALOG_CANCEL=Cancel
QUICKDIALOG_CLOSE=Close
QUICKDIALOG_DELETE=Delete
QUICKDIALOG_IGNORE=Ignore
QUICKDIALOG_NO=No
QUICKDIALOG_OK=Ok
QUICKDIALOG_RETRY=Retry
QUICKDIALOG_YES=Yes
# the link that folds the details of a message open
QUICKDIALOG_SHOW_DETAILS=Show details

# what the picker of a ComboBox says when the typing matches nothing
COMBOBOX_NO_MATCHING_ENTRY=No matching entry

# the hint on the baseline of an empty SignaturePad
SIGNATUREPAD_PLACEHOLDER=Sign here

# the two states of a Switch, where the application names neither
SWITCH_ON=ON
SWITCH_OFF=OFF
