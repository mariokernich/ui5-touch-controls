# The texts in English. The same as messagebundle.properties, which every
# language falls back to - this file is there so English is one of the
# languages the bundle names: UI5 falls back to English, and a fallback that is
# not among them is reported as an error in every application.

# the actions of a QuickDialog, named after the MessageAction they stand for
QUICKDIALOG_ABORT=Abort
QUICKDIALOG_CANCEL=Cancel
QUICKDIALOG_CLOSE=Close
QUICKDIALOG_DELETE=Delete
QUICKDIALOG_IGNORE=Ignore
QUICKDIALOG_NO=No
QUICKDIALOG_OK=Ok
QUICKDIALOG_RETRY=Retry
QUICKDIALOG_YES=Yes
# the link that folds the details of a message open
QUICKDIALOG_SHOW_DETAILS=Show details

# what the picker of a ComboBox says when the typing matches nothing
COMBOBOX_NO_MATCHING_ENTRY=No matching entry

# the hint on the baseline of an empty SignaturePad
SIGNATUREPAD_PLACEHOLDER=Sign here

# the two states of a Switch, where the application names neither
SWITCH_ON=ON
SWITCH_OFF=OFF

# the heading over the list of a Select or a ComboBox on a phone, where the
# list takes the whole screen - unless the application named one
PICKER_TITLE=Select
# the way out of the list of a Select on a phone, without picking anything
SELECT_CANCEL=Cancel
# the way out of the list of a ComboBox on a phone; what was typed there is
# taken over as it is typed, so there is nothing to cancel
COMBOBOX_OK=OK

# the headings over the two columns of a TimePicker
TIMEPICKER_HOURS=Hours
TIMEPICKER_MINUTES=Minutes

# what the space bar of a keyboard says
KEYBOARD_SPACE=Space

# the tooltips of the buttons that show nothing but an icon
OVERFLOWTOOLBAR_MORE=Additional options
STEPINPUT_DECREASE=Decrease
STEPINPUT_INCREASE=Increase
DATEPICKER_PREVIOUS=Previous
DATEPICKER_NEXT=Next
SIGNATUREPAD_CLEAR=Clear
