# The build behind the GitHub Pages deployment: the library plus the demo
# application in docs/, with a preload bundle for every library and one for the
# demo itself. Without those bundles the browser fetches every UI5 module on
# its own - a few hundred requests before the first screen is drawn.
specVersion: "4.0"
metadata:
    name: ui5.touch.controls
type: library
resources:
  configuration:
    paths:
      src: src
      # the demo application, called "docs" because that is what it is; the
      # tooling still serves it under /test-resources
      test: docs
framework:
  name: OpenUI5
  version: 1.151.0
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.f
    - name: sap.tnt
    - name: sap.ui.codeeditor
    - name: sap.ui.unified
    - name: themelib_sap_horizon
    - name: themelib_sap_fiori_3
builder:
    customTasks:
        - name: ui5-tooling-transpile-task
          afterTask: replaceVersion
          configuration:
              generateTsInterfaces: true # always generate the TS interfaces in build
