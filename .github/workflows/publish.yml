name: Publish to npm & GitHub Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write # create tags and GitHub releases
  id-token: write # npm provenance (OIDC)

concurrency:
  group: "publish"
  cancel-in-progress: false

jobs:
  publish:
    name: Publish npm package & GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: 🔨 setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Read package name & version
        id: pkg
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check if version is already published
        id: check
        run: |
          if npm view "${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }}" version > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }} is already published - skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.exists == 'false'
        run: pnpm install

      - name: Run checks
        if: steps.check.outputs.exists == 'false'
        run: |
          npm run check:ts
          npm run check:lint

      - name: Publish to npm
        if: steps.check.outputs.exists == 'false'
        # prepack (clean + fresh build) runs automatically before publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release draft
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.pkg.outputs.version }}"
          # listed rather than looked up by tag: a draft has no tag yet, and
          # "gh release view" resolves a release through it
          EXISTING=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName')
          if grep -qx "$TAG" <<< "$EXISTING"; then
            echo "::notice::Release $TAG already exists - skipping."
          else
            # a draft, so the notes can be looked over before they go out. The
            # tag is only written when the draft is published, which is why the
            # commit it belongs to is pinned here.
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --draft \
              --generate-notes
            echo "::notice::Release $TAG created as a draft - publish it to tag $GITHUB_SHA."
          fi
