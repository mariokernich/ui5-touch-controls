kbIntroSubtitle=अक्षरों की कीबोर्ड, एक पंक्ति में कही गई
kbIntroText=<p>उत्पादन स्थल के किसी टर्मिनल पर, किसी कियोस्क पर या दस्तानों से चलाए जाने वाले उपकरण पर अक्सर कोई हार्डवेयर कीबोर्ड नहीं होती, और ऑपरेटिंग सिस्टम का ऑन-स्क्रीन कीबोर्ड या तो उपलब्ध नहीं होता या आधी स्क्रीन ढक लेती है। पाठ के फ़ील्ड का उत्तर <code>tc:Keyboard</code> है: <code>mode</code> किसी देश का विन्यास चुनता है, और कुछ स्विच तय करते हैं कि उस पर और क्या है। कोई लेआउट लिखकर देने की ज़रूरत नहीं।</p><p>यह तीन कीबोर्ड में से एक है, और जो कुछ कुंजियों से नहीं जुड़ा, वह सब उनमें साझा है: मान, <code>size</code>, <code>docked</code>, <code>hardwareKeys</code> के ज़रिये असली कीबोर्ड की कुंजियाँ, और <code>change</code>, <code>keyPress</code>, <code>enter</code> तथा <code>escape</code> इवेंट। अंकों के फ़ील्ड के लिए <code>tc:NumberPad</code> है, अपनी कुंजियों के लिए <code>tc:CustomKeyboard</code>। तीनों किसी <code>tc:Input</code> या <code>tc:TextArea</code> की <code>keyboard</code> एग्रीगेशन में फ़िट होती हैं।</p>
padIntroSubtitle=अंकों का पैड, एक पंक्ति में कहा गया
padIntroText=<p>कोई मात्रा, कोई गिनती, कोई कोड, कोई क़ीमत &mdash; किसी टर्मिनल के फ़ील्ड अक्षरों से ज़्यादा अंक होते हैं, और तीन स्तंभों का पैड अंगूठा बिना देखे ढूँढ़ लेता है। <code>tc:NumberPad</code> वही पैड है: <code>mode</code> अंकों का ब्लॉक चुनता है, और उसके बगल के स्विच वह जोड़ते हैं जो फ़ील्ड को अंकों से आगे चाहिए।</p><p>यह तीन कीबोर्ड में से एक है, और जो कुछ कुंजियों से नहीं जुड़ा, वह सब उनमें साझा है: मान, <code>size</code>, <code>docked</code>, <code>hardwareKeys</code> के ज़रिये असली कीबोर्ड की कुंजियाँ, और <code>change</code>, <code>keyPress</code>, <code>enter</code> तथा <code>escape</code> इवेंट। पाठ के फ़ील्ड के लिए <code>tc:Keyboard</code> है, अपनी कुंजियों के लिए <code>tc:CustomKeyboard</code>।</p>
customIntroSubtitle=कुंजियाँ उसे पंक्ति दर पंक्ति सौंपी जाती हैं
customIntroText=<p><code>tc:CustomKeyboard</code> उस सबके लिए कीबोर्ड है जो तैयार कीबोर्ड नहीं ढँकतीं: किसी दुकान के बेचे जाने वाले आकार, किसी गाड़ी के नंबर में आने वाले अक्षर, किसी मशीन की कुंजियाँ। <code>layout</code> प्रॉपर्टी एक समूह की पंक्तियाँ हैं; <code>layouts</code> एग्रीगेशन जितने समूह चाहिए उतने रखता है, और किसी समूह का नाम रखने वाली कुंजी उसी पर स्विच कर देती है। <code>display</code> एग्रीगेशन बताता है कि किसी एक कुंजी पर क्या लिखा है।</p><p>यह तीन कीबोर्ड में से एक है, और जो कुछ कुंजियों से नहीं जुड़ा, वह सब उनमें साझा है: मान, <code>size</code>, <code>docked</code>, <code>hardwareKeys</code> के ज़रिये असली कीबोर्ड की कुंजियाँ, और <code>change</code>, <code>keyPress</code>, <code>enter</code> तथा <code>escape</code> इवेंट। जहाँ अक्षरों की कीबोर्ड या अंकों का पैड चाहिए, वहाँ <code>tc:Keyboard</code> और <code>tc:NumberPad</code> वही बात एक पंक्ति में कह देते हैं।</p>
colProperty=Property
colDefault=Default
baseNote=tc:KeyboardBase एक आधार वर्ग है और इसे कभी किसी व्यू में नहीं रखा जाता। tc:Keyboard, tc:NumberPad या tc:CustomKeyboard का उपयोग करें; यह पेज बताता है कि तीनों में क्या समान है।
baseIntroSubtitle=तीनों कीबोर्ड में क्या समान है
baseIntroText=<p>इस लाइब्रेरी की तीनों कीबोर्ड सिर्फ़ एक बात में अलग हैं: कुंजियाँ कहाँ से आती हैं। <code>tc:Keyboard</code> उन्हें एक भाषा और कुछ स्विच से बनाती है, <code>tc:NumberPad</code> अंकों के ब्लॉक से, और <code>tc:CustomKeyboard</code> उन्हें पंक्ति दर पंक्ति सौंपी जाती हैं। बाकी सब कुछ यही वर्ग है, और वह तीनों में एक जैसा काम करता है।</p><p>यानी मान और कोई कुंजी उसे कैसे बदलती है, कुंजी-समूह और उनके बीच स्विच करना, shift और caps lock, असली कीबोर्ड की कुंजियाँ, आकार, चौड़ाई और डॉकिंग। कुंजियाँ स्वयं इस लाइब्रेरी के <code>tc:Button</code> कंट्रोल हैं &mdash; उन्हें वही लेबल देता है, और जो <code>size</code> प्रॉपर्टी बाकी सब कुछ का आकार तय करती है वही उनका आकार तय करती है।</p><p>यह वही प्रकार भी है जिस पर किसी <code>tc:Input</code> और <code>tc:TextArea</code> की <code>keyboard</code> एग्रीगेशन टाइप की गई है — इसी वजह से तीनों में से कोई भी किसी फ़ील्ड पर फ़िट होती है।</p>
basePropsTitle=तीनों में क्या समान है
basePropsSubtitle=वे प्रॉपर्टी जो इस लाइब्रेरी की हर कीबोर्ड में हैं
basePropsText=इनके अलावा तीनों में से हर एक के पास वे प्रॉपर्टी हैं जो उसकी अपनी कुंजियाँ बनाती हैं &mdash; <code>tc:Keyboard</code> और <code>tc:NumberPad</code> में <code>mode</code> तथा स्विच, <code>tc:CustomKeyboard</code> में <code>layout</code> और <code>layouts</code>।
baseEventsTitle=इवेंट
baseEventsSubtitle=इस लाइब्रेरी की हर कीबोर्ड इन्हें ट्रिगर करती है
baseKeysTitle=अपने अर्थ वाली कुंजियाँ
baseKeysSubtitle=तीनों कीबोर्ड इन्हें समझती हैं
baseKeysText=एक पंक्ति रिक्त स्थान से अलग की गई कुंजियों की शृंखला है, और घुँघराले कोष्ठकों में लिपटी कुंजी नीचे दी गई कुंजियों में से एक है। इन्हें यहीं सँभाला जाता है, इसलिए तीनों कीबोर्ड पर इनका अर्थ एक ही रहता है; कीबोर्ड केवल यह तय करती है कि उन्हें स्क्रीन पर लाए या नहीं।
baseSubclassesTitle=तीनों कीबोर्ड
baseSubclassesSubtitle=कब कौन-सी सही है
baseHowTitle=ज्यामिति पर एक बात
baseHowText=<p>जगह चाहे कितनी भी तंग हो, कीबोर्ड को कभी बगल में स्क्रॉल नहीं करना पड़ता: कोई कुंजी उतनी ही चौड़ी होना चाहती है जितनी ऊँची है, और जगह तंग होने पर वह चौड़ाई छोड़ देती है। उसकी ऊँचाई <code>size</code> से आती है और वैसी ही बनी रहती है।</p><p><code>docked</code> के साथ कीबोर्ड पेज के प्रवाह से निकल जाती है और सामग्री के ऊपर, स्क्रीन के निचले किनारे पर बैठ जाती है — जैसे किसी फ़ोन की स्क्रीन कीबोर्ड करती है। फ़ोन या टैबलेट पर वह तब पूरी स्क्रीन की चौड़ाई ले लेती है और <code>width</code> पर ध्यान नहीं दिया जाता। किसी फ़ील्ड की कीबोर्ड भी इसी तरह लगती है, बस उसका पॉपओवर उसे स्थिर क्षेत्र में रखता है, इसलिए वह किसी मोडल डायलॉग को भी ढँक लेती है &mdash; और यही किसी डायलॉग के भीतर के फ़ील्ड में टाइप कर पाना संभव बनाता है।</p>
propValue=कीबोर्ड का मौजूदा इनपुट मान।
propEmphasizedKeys=वे कुंजियाँ जो उभरी हुई खींची जाती हैं; उन्हें वैसे ही लिखा जाता है जैसे वे लेआउट में खड़ी हैं — किसी विशेष कुंजी के घुँघराले कोष्ठक वैकल्पिक हैं। कोई मॉडिफ़ायर जब तक चालू है तब तक उभरा हुआ दिखता है।
propMaxLength=वर्णों की अधिकतम संख्या। 0 का अर्थ है असीमित।
propEnabled=कीबोर्ड का उपयोग किया जा सकता है या नहीं।
propHardwareKeys=कीबोर्ड के फ़ोकस में रहते हुए असली कीबोर्ड से आने वाला इनपुट स्वीकार किया जाए या नहीं। केवल वही कुंजियाँ ली जाती हैं जो लेआउट का हिस्सा हैं; Enter और Backspace हमेशा सँभाले जाते हैं।
propSize=हर कुंजी का स्पर्श आकार। पूरी ज्यामिति उसी का अनुसरण करती है।
propWidth=कीबोर्ड की चौड़ाई। फ़ोन या टैबलेट पर लगी हुई कीबोर्ड में इस पर ध्यान नहीं दिया जाता।
propDocked=कीबोर्ड पेज के प्रवाह में खड़ी रहने के बजाय सामग्री के ऊपर, स्क्रीन के निचले किनारे पर बैठती है या नहीं।
evtChange=जब भी मान बदलता है तब ट्रिगर होता है — कोई कुंजी, backspace, जो भी उसे हिलाए।
evtKeyPress=दबाई गई हर कुंजी पर ट्रिगर होता है; कुंजी उसी रूप में मिलती है जिस रूप में वह लेआउट में है।
evtEnter=Enter कुंजी दबाने पर मौजूदा मान के साथ ट्रिगर होता है।
evtEscape=Escape कुंजी दबाने पर ट्रिगर होता है। कीबोर्ड स्वयं इसका कुछ नहीं करती; जो फ़ील्ड उसे दिखाता है, वह इस पर अपना पॉपओवर बंद कर देता है।
subKeyboard=पाठ का फ़ील्ड: किसी देश का विन्यास, एक पंक्ति में कहा गया।
subNumberPad=अंकों का फ़ील्ड: तीन स्तंभों का पैड — कंप्यूटर, टेलीफ़ोन या कैलकुलेटर वाले ब्लॉक में।
subCustomKeyboard=बाकी सब कुछ: कुंजियाँ पंक्ति दर पंक्ति लिखी जाती हैं, और जितने समूह चाहिए उतने।
colType=Type
colParameters=Parameters
exampleBaseField=तीनों में से कोई भी किसी फ़ील्ड पर (XML व्यू)

