# ---------------------------------------------------------------------------
# Getting Started
# ---------------------------------------------------------------------------
gsTitle=शुरुआत करें
gsSubtitle=मानक UI5 कंट्रोल, टच के लिए नए सिरे से बनाए गए — और वे भी जो sap.m में नहीं हैं

gsWhatTitle=यह क्या है
gsWhatSubtitle=टच डिवाइस पर अकेला sap.m क्यों पर्याप्त नहीं है
gsWhatText1=<code>sap.m</code> कंट्रोल माउस और कीबोर्ड के लिए बने हैं। टैबलेट पर, शॉप फ़्लोर टर्मिनल पर या दस्ताने पहनकर चलाए जाने वाले डिवाइस पर वे बस बहुत छोटे पड़ जाते हैं &mdash; और "cozy" कंटेंट डेंसिटी आपको केवल एक कदम आगे ले जाती है।
gsWhatText2=यह लाइब्रेरी इसके लिए दो काम करती है:<ul><li><strong>यह सबसे ज़रूरी <code>sap.m</code> कंट्रोल को उनकी मूल संरचना पर दोबारा बनाती है</strong> और उन्हें एक केंद्रीय <code>size</code> प्रॉपर्टी (<code>S</code>&ndash;<code>6XL</code>) के ज़रिए आकार बदलने के लिए खोलती है, जो हर कंट्रोल पर एक जैसी काम करती है। आपको अपना ऐप दोबारा बनाने की ज़रूरत नहीं है: कंट्रोल अपने मूल रूपों की परिचित प्रॉपर्टीज़, एग्रीगेशन और इवेंट बनाए रखते हैं, इसलिए उन्हें सीधे प्रतिस्थापन के रूप में इस्तेमाल किया जा सकता है।</li><li><strong>यह ऐसे कंट्रोल जोड़ती है जो <code>sap.m</code> में हैं ही नहीं</strong>, उन स्थितियों के लिए जो केवल टच डिवाइस पर आती हैं &mdash; इसका सबसे अच्छा उदाहरण ऑन-स्क्रीन कीबोर्ड हैं।</li></ul>

gsSizesTitle=एक प्रॉपर्टी, नौ आकार
gsSizesSubtitle=S · M (डिफ़ॉल्ट) · L · XL · 2XL · 3XL · 4XL · 5XL · 6XL
gsSizesText=आकार फ़ॉन्ट साइज़, आइकन साइज़, पैडिंग और ऊँचाई को एक साथ बढ़ाता है, जिससे कंट्रोल हर चरण पर आनुपातिक बने रहते हैं। पूरे ऐप का आकार रनटाइम पर बदलने के लिए <code>size</code> को किसी मॉडल से बाइंड करें।

gsDropInTitle=सीधा प्रतिस्थापन
gsDropInSubtitle=नेमस्पेस जोड़ें, कंट्रोल के आगे tc: लगाएँ, एक आकार चुनें
gsBeforeTitle=पहले — सादा sap.m
gsAfterTitle=बाद में — ui5.touch.controls
gsDropInText=वही एग्रीगेशन, वही प्रॉपर्टीज़, वही इवेंट हैंडलर &mdash; <code>press=".onSave"</code> आपके कंट्रोलर में अब भी उसी मेथड को बुलाता है। <code>ToolbarSpacer</code> जैसे <code>sap.m</code> कंट्रोल ठीक वहीं रह सकते हैं जहाँ वे हैं।

gsRequirementsTitle=आवश्यकताएँ
gsRequirementsStrip=UI5 संस्करण 1.116 या उससे ऊपर (OpenUI5 या SAPUI5) आवश्यक है।
gsRequirementsText=यह लाइब्रेरी npm पर <code>ui5.touch.controls</code> के रूप में प्रकाशित है और किसी भी ऐसे UI5 ऐप्लिकेशन में इस्तेमाल की जा सकती है जो UI5 Tooling (v3 या उससे ऊपर) से बनाया गया हो। यह अपनी <code>ui5.yaml</code> साथ लाती है, इसलिए टूलिंग इसे अपने आप लाइब्रेरी निर्भरता के रूप में हल कर लेती है।

gsNextTitle=आगे के कदम
gsNextSubtitle=यहाँ से कहाँ जाएँ
gsNextText=<ul><li><strong>Setup</strong> &mdash; पैकेज इंस्टॉल करें, लाइब्रेरी घोषित करें और TypeScript सेट करें।</li><li><strong>दस्तावेज़ीकरण</strong> &mdash; पूरी कंट्रोल रेफ़रेंस, आकार पैमाना, <code>ISized</code> इंटरफ़ेस और ज्ञात कठिनाइयाँ।</li><li><strong>कंट्रोल</strong> &mdash; हर कंट्रोल के लिए एक इंटरैक्टिव पृष्ठ, <code>sap.m</code> मूल के साथ-साथ।</li></ul>

# ---------------------------------------------------------------------------
# Setup
# ---------------------------------------------------------------------------
setupTitle=Setup
setupSubtitle=लाइब्रेरी इंस्टॉल करें, अपने ऐप में घोषित करें और TypeScript सेट करें

setupPrereqTitle=पूर्वापेक्षाएँ
setupPrereqSubtitle=शुरू करने से पहले आपके प्रोजेक्ट में क्या चाहिए
setupPrereqStrip=UI5 संस्करण 1.116 या उससे ऊपर (OpenUI5 या SAPUI5) और UI5 Tooling v3 या उससे ऊपर।
setupPrereqText=यह लाइब्रेरी npm पर <a href="https://www.npmjs.com/package/ui5.touch.controls" target="_blank">ui5.touch.controls</a> के रूप में प्रकाशित है और किसी भी ऐसे UI5 ऐप्लिकेशन में इस्तेमाल की जा सकती है जो <a href="https://sap.github.io/ui5-tooling/" target="_blank">UI5 Tooling</a> से बनाया गया हो।

setupInstallTitle=1. पैकेज इंस्टॉल करें
setupInstallSubtitle=सामान्य निर्भरता के रूप में, devDependency के रूप में नहीं
setupInstallText=लाइब्रेरी को <strong>सामान्य निर्भरता</strong> के रूप में इंस्टॉल करें ताकि UI5 Tooling इसे प्रोजेक्ट निर्भरता के रूप में पहचाने। पैकेज एक <code>ui5.yaml</code> साथ लाता है, इसलिए टूलिंग इसे अपने आप लाइब्रेरी निर्भरता के रूप में हल कर लेती है।

setupMiddlewareTitle=1b. UI5 मिडलवेयर के साथ (वैकल्पिक सेटअप)
setupMiddlewareSubtitle=लाइब्रेरी को प्रोजेक्ट निर्भरता के बजाय स्टैटिक रूप से परोसें
setupMiddlewareText=लाइब्रेरी को UI5 Tooling की प्रोजेक्ट निर्भरता बनाने के बजाय आप इसे <a href="https://www.npmjs.com/package/ui5-middleware-servestatic" target="_blank">ui5-middleware-servestatic</a> के साथ स्टैटिक रूप से परोस सकते हैं।

setupManifestTitle=2. manifest.json में लाइब्रेरी घोषित करें
setupManifestSubtitle=ताकि ऐप शुरू होते ही लाइब्रेरी लोड करे

setupNamespaceTitle=3. अपने व्यू में नेमस्पेस जोड़ें
setupNamespaceSubtitle=उपसर्ग tc केवल एक परंपरा है — कोई भी उपसर्ग चलेगा

setupTypeScriptTitle=4. TypeScript समर्थन (वैकल्पिक)
setupTypeScriptSubtitle=पूरी टाइपिंग शुरू से ही
setupTypeScriptStrip="types" प्रविष्टि के बिना UI5 Tooling लाइब्रेरी को अपने आप लोड नहीं करता।
setupTypeScriptText=TypeScript प्रोजेक्ट में पैकेज को अपनी <code>tsconfig.json</code> की <code>types</code> प्रविष्टि में जोड़ें। पैकेज में टाइप परिभाषाएँ शामिल हैं (<code>dist/index.d.ts</code>)।

# ---------------------------------------------------------------------------
# Documentation
# ---------------------------------------------------------------------------
docTitle=दस्तावेज़ीकरण
docSubtitle=कंट्रोल रेफ़रेंस, आकार पैमाना, ISized इंटरफ़ेस और ज्ञात कठिनाइयाँ

docPortedTitle=sap.m कंट्रोल के टच संस्करण
docPortedSubtitle="प्रतिस्थापित करता है" स्तंभ बताता है कि हर कंट्रोल किस sap.m कंट्रोल की जगह लेता है
docPortedText=ये मानक कंट्रोल के नए सिरे से बनाए गए रूप हैं। सामान्य मामलों के लिए ये अपने मूल रूपों की प्रॉपर्टीज़, एग्रीगेशन और इवेंट बनाए रखते हैं, इसलिए इन्हें सीधे प्रतिस्थापन के रूप में इस्तेमाल किया जा सकता है। किसी कंट्रोल पर क्लिक करके उसका इंटरैक्टिव पृष्ठ खोलें।

docNewTitle=बिना sap.m समकक्ष वाले कंट्रोल
docNewSubtitle=ये केवल इसी लाइब्रेरी में हैं
docNewText=ये उन स्थितियों को संभालते हैं जो केवल टच डिवाइस पर आती हैं: बिना हार्डवेयर कीबोर्ड वाला टर्मिनल, टाइप करने के बजाय बारकोड स्कैनर, स्क्रीन पर हस्ताक्षर। किसी कंट्रोल पर क्लिक करके उसका इंटरैक्टिव पृष्ठ खोलें।

docClassesTitle=क्लासेज़
docClassesSubtitle=कंट्रोलर से उपयोग होती हैं, व्यू में नहीं रखी जातीं
docClassesText=लाइब्रेरी जो कुछ जोड़ती है, वह सब कंट्रोल नहीं है। ये कंट्रोलर कोड से बुलाई जाती हैं और अपना इंटरफ़ेस स्वयं टच कंट्रोल से बनाती हैं। इंटरैक्टिव पेज खोलने के लिए क्लास पर क्लिक करें।

docThemesTitle=थीम अनुकूलता
docThemesSubtitle=सभी कंट्रोल इन थीम के लिए अपनी थीम लाइब्रेरी साथ लाते हैं
docThemesText1=कंट्रोल अपने रंग, बॉर्डर और छाया सक्रिय थीम के थीम पैरामीटर से लेते हैं, इसलिए वे आसपास के <code>sap.m</code> कंट्रोल के साथ घुल-मिल जाते हैं। थीम हमेशा की तरह बूटस्ट्रैप में <code>data-sap-ui-theme</code> से या रनटाइम पर <code>Theming.setTheme()</code> से सेट करें।
docThemesText2=जो थीम यहाँ सूचीबद्ध नहीं हैं, वे लाइब्रेरी के साथ नहीं आतीं। ऐसे में UI5 <code>ui5.touch.controls</code> के लिए बेस थीम पर लौट जाता है; कंट्रोल काम करते रहते हैं, पर उनके रंग बाकी ऐप्लिकेशन से मेल नहीं खाएँगे।

docSizesTitle=आकार
docSizesSubtitle=हर कंट्रोल में वही size प्रॉपर्टी है
docSizesText1=उपलब्ध मान: <code>S</code> &middot; <code>M</code> (डिफ़ॉल्ट) &middot; <code>L</code> &middot; <code>XL</code> &middot; <code>2XL</code> &middot; <code>3XL</code> &middot; <code>4XL</code> &middot; <code>5XL</code> &middot; <code>6XL</code>
docSizesText2=आकार फ़ॉन्ट साइज़, आइकन साइज़, पैडिंग और ऊँचाई को एक साथ बढ़ाता है, जिससे कंट्रोल हर चरण पर आनुपातिक बने रहते हैं। पूरे ऐप का आकार रनटाइम पर बदलने के लिए <code>size</code> को किसी मॉडल से बाइंड करें।

docISizedTitle=ISized
docISizedSubtitle=ui5.touch.controls.ISized
docISizedText=<code>size</code> प्रॉपर्टी वाले सभी कंट्रोल मार्कर इंटरफ़ेस <code>ui5.touch.controls.ISized</code> लागू करते हैं। इससे आकार को सामान्य रूप से संभाला जा सकता है, जैसे किसी उपयोगकर्ता सेटिंग को पूरे व्यू पर लागू करना।

docKeyboardTitle=टच के लिए नए कंट्रोल — कीबोर्ड
docKeyboardSubtitle=इसका कोई sap.m समकक्ष नहीं है
docKeyboardText1=शॉप फ़्लोर टर्मिनल, कियोस्क या दस्ताने पहनकर चलाए जाने वाले डिवाइस पर अक्सर हार्डवेयर कीबोर्ड नहीं होता, और ऑपरेटिंग सिस्टम का ऑन-स्क्रीन कीबोर्ड या तो उपलब्ध नहीं होता या आधी स्क्रीन ढक लेता है। UI5 में इसके लिए कोई कंट्रोल नहीं है। लाइब्रेरी तीन ऑन-स्क्रीन कीबोर्ड लाती है, जो उसके अपने बटनों से बने हैं &mdash; बिना किसी बाहरी निर्भरता के, और उसी <code>size</code> प्रॉपर्टी से आकार बदलता है जैसे बाकी सब कुछ।
docKeyboardText2=<code>tc:Keyboard</code> अक्षरों वाली कीबोर्ड है: <code>mode</code> किसी देश का विन्यास है, और कुछ स्विच तय करते हैं कि अंक अक्षरों के ऊपर हों या किसी कुंजी के पीछे, विशेष चिह्न हों या नहीं, और वह किस लिपि-रूप में लिखती है। <code>tc:NumberPad</code> अंकों के फ़ील्ड के लिए वही विचार है। <code>tc:CustomKeyboard</code> को उसकी कुंजियाँ पंक्ति दर पंक्ति सौंपी जाती हैं, उस सब के लिए जो बाकी दो नहीं ढँकतीं: <code>&#123;shift&#125;</code>, <code>&#123;space&#125;</code>, <code>&#123;bksp&#125;</code> और <code>&#123;enter&#125;</code> विशेष कुंजियाँ हैं, हर दूसरी कुंजी अपना ही लेबल लिखती है। तीनों <code>hardwareKeys="true"</code> के साथ असली कीबोर्ड की कुंजियाँ लेती हैं, <code>docked</code> के साथ स्क्रीन के निचले किनारे पर लगती हैं, और किसी फ़ील्ड की <code>keyboard</code> एग्रीगेशन में फ़िट होती हैं।

docPitfallTitle=कठिनाई: वे एग्रीगेशन जो केवल sap.m.Button स्वीकार करते हैं
docPitfallSubtitle=sap.m.Dialog के buttons, beginButton और endButton
docPitfallStrip=कुछ मानक एग्रीगेशन sap.m.Button पर टाइप किए गए हैं और रनटाइम पर tc:Button को अस्वीकार कर देते हैं: "Element ui5.touch.controls.Button#__button0" is not valid for aggregation "buttons".
docPitfallText1=और ये बटन-स्थान बड़े किए जाने के लिए बने भी नहीं हैं &mdash; इनका लेआउट मानक बटन ऊँचाई के हिसाब से है।
docPitfallText2=<strong>इसका रास्ता <code>footer</code> एग्रीगेशन है।</strong> यह <code>sap.m.Toolbar</code> पर टाइप किया गया है (UI5 1.110 से उपलब्ध), और चूँकि <code>tc:Toolbar</code> तथा <code>tc:OverflowToolbar</code> <code>sap.m.Toolbar</code> से विरासत लेते हैं, वे सीधे उसमें बैठ जाते हैं। डायलॉग तब अपने फ़ुटर को टूलबार के अनुसार आकार देता है, जिससे टच-आकार के बटन ठीक से रेंडर होते हैं। जब डायलॉग संकरा हो सकता हो, तब <code>tc:OverflowToolbar</code> को प्राथमिकता दें।
docPitfallText3=सामान्य QuickDialog जैसे डायलॉग के लिए आपको यह स्वयं बनाने की ज़रूरत नहीं &mdash; <code>QuickDialog</code> अपना फ़ुटर पहले से इसी तरह बनाता है, अपने <code>size</code> विकल्प से आकार लेकर।
docSizesExample=आकार को बाइंड करना
docPitfallBrokenTitle=काम नहीं करता
docPitfallWorksTitle=काम करता है

# ---------------------------------------------------------------------------
# control pages
# ---------------------------------------------------------------------------
barcodeHint=इसका कोई <code>sap.m</code> समकक्ष नहीं है: कीबोर्ड-वेज मोड में बारकोड स्कैनर कोड को कुछ ही मिलीसेकंड में फ़ोकस किए गए फ़ील्ड में टाइप कर देता है और <kbd>Enter</kbd> से पूरा करता है। कंट्रोल कुंजी-दबावों के बीच का समय मापता है, इसलिए स्कैन पर <code>scan</code> चलता है जबकि वही अक्षर हाथ से टाइप करने पर <code>change</code> चलता है।
signatureHint=इसका कोई <code>sap.m</code> समकक्ष नहीं है। यह पैड एक कैनवस पर बनाता है और परिणाम को <code>value</code> में PNG डेटा-URL के रूप में देता है, ताकि इसे किसी मॉडल से बाइंड करके किसी भी अन्य मान की तरह बैकएंड को भेजा जा सके। स्ट्रोक की मोटाई, प्लेसहोल्डर और साफ़ करने का बटन <code>size</code> प्रॉपर्टी के अनुसार बदलते हैं।

overflowPlainHint=स्लाइडर को बाईं ओर खींचें: जो सामग्री अब नहीं समाती, वह तीन बिंदुओं वाले बटन के पीछे चली जाती है। पूरी चौड़ाई पर कोई ओवरफ़्लो बटन होता ही नहीं।
overflowPriorityHint="Print" की प्राथमिकता Low है, इसलिए वह सबसे पहले ओवरफ़्लो में जाता है। "Save" पर NeverOverflow है और जब तक ज़रा भी जगह है, वह टूलबार में बना रहता है — सबसे कम चौड़ाई पर वह भी पॉपओवर में चला जाता है, ताकि ओवरफ़्लो बटन पहुँच में रहे। "About" पर AlwaysOverflow है और वह हमेशा पॉपओवर में रहता है — इसीलिए यह टूलबार भरपूर जगह होने पर भी तीन बिंदुओं वाला बटन दिखाती है।
overflowFooterHint=फ़ुटर टूलबार का ओवरफ़्लो देखने के लिए ब्राउज़र विंडो संकरी करें — तब पॉपओवर टूलबार के ऊपर खुलता है।
overflowDialogHint=sap.m.Dialog की buttons एग्रीगेशन केवल sap.m.Button लेती है, जबकि footer कोई भी sap.m.Toolbar लेता है — इसलिए टच OverflowToolbar सीधे उसमें फ़िट हो जाती है। दोनों टूलबार में से यहाँ यही बेहतर है: डायलॉग स्वभाव से संकरा होता है, और जो नहीं समाता वह कटने के बजाय ओवरफ़्लो मेनू में चला जाता है।
inputKeyboardHint="वर्चुअल कीबोर्ड" चालू होने पर keyboard एग्रीगेशन का कीबोर्ड फ़ील्ड के नीचे तब तक खुला रहता है जब तक फ़ील्ड पर फ़ोकस है, और फ़ोकस हटते ही बंद हो जाता है।
textAreaKeyboardHint="वर्चुअल कीबोर्ड" चालू होने पर keyboard एग्रीगेशन का कीबोर्ड फ़ील्ड के नीचे तब तक खुला रहता है जब तक फ़ील्ड पर फ़ोकस है, और फ़ोकस हटते ही बंद हो जाता है। उसकी Enter कुंजी नई पंक्ति जोड़ती है, जैसा बहुपंक्ति फ़ील्ड में Enter करता है।

