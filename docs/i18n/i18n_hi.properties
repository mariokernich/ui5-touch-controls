kbIntroSubtitle=A keyboard of letters, said in one line
kbIntroText=<p>On a shop floor terminal, a kiosk or a device operated with gloves there is often no hardware keyboard, and the on-screen keyboard of the operating system is either unavailable or covers half the screen. <code>tc:Keyboard</code> is the answer for a field of text: the <code>mode</code> is the arrangement of a country, and a handful of switches say what else is on it. There is no layout to write out.</p><p>It is one of three keyboards, and they share everything that is not about the keys: the value, the <code>size</code>, <code>docked</code>, the keys of a real keyboard through <code>hardwareKeys</code>, and the events <code>change</code>, <code>keyPress</code>, <code>enter</code> and <code>escape</code>. Reach for <code>tc:NumberPad</code> where the field takes digits, and for <code>tc:CustomKeyboard</code> where the keys are yours to write. All three fit into the <code>keyboard</code> aggregation of a <code>tc:Input</code> or a <code>tc:TextArea</code>.</p>
padIntroSubtitle=A pad of digits, said in one line
padIntroText=<p>A quantity, a count, a code, a price &mdash; the fields of a terminal are digits more often than they are letters, and a pad of three columns is what a thumb finds without looking. <code>tc:NumberPad</code> is that pad: the <code>mode</code> picks the block of digits, and the switches beside it add what the field needs beyond them.</p><p>It is one of three keyboards, and they share everything that is not about the keys: the value, the <code>size</code>, <code>docked</code>, the keys of a real keyboard through <code>hardwareKeys</code>, and the events <code>change</code>, <code>keyPress</code>, <code>enter</code> and <code>escape</code>. Reach for <code>tc:Keyboard</code> where the field takes text, and for <code>tc:CustomKeyboard</code> where the keys are yours to write.</p>
customIntroSubtitle=The keys are handed to it, row by row
customIntroText=<p><code>tc:CustomKeyboard</code> is the keyboard for everything the ready-made ones do not cover: the sizes a shop sells, the letters a licence plate may have, the keys of a machine. The <code>layout</code> property is the rows of one set; the <code>layouts</code> aggregation carries as many sets as are needed, and a key written as the name of a set switches to it. The <code>display</code> aggregation says what a single key reads.</p><p>It is one of three keyboards, and they share everything that is not about the keys: the value, the <code>size</code>, <code>docked</code>, the keys of a real keyboard through <code>hardwareKeys</code>, and the events <code>change</code>, <code>keyPress</code>, <code>enter</code> and <code>escape</code>. Where a keyboard of letters or a pad of digits is what is wanted, <code>tc:Keyboard</code> and <code>tc:NumberPad</code> say the same thing in one line.</p>
colProperty=Property
colDefault=Default
baseNote=tc:KeyboardBase is a base class and is never put into a view. Use tc:Keyboard, tc:NumberPad or tc:CustomKeyboard; this page says what the three of them have in common.
baseIntroSubtitle=What the three keyboards share
baseIntroText=<p>The three keyboards of this library differ in one thing only: where the keys come from. <code>tc:Keyboard</code> builds them from a language and a handful of switches, <code>tc:NumberPad</code> from a block of digits, <code>tc:CustomKeyboard</code> is handed them row by row. Everything else is this class, and it works the same on all three.</p><p>That is the value and how a key changes it, the sets of keys and the switching between them, shift and the caps lock, the keys of a real keyboard, the size, the width and the docking. The keys themselves are <code>tc:Button</code> controls of this library &mdash; there is no third-party keyboard behind them, and the same <code>size</code> property that scales everything else scales them.</p><p>It is also the type the <code>keyboard</code> aggregation of a <code>tc:Input</code> and a <code>tc:TextArea</code> is typed to, which is why any of the three fits on a field.</p>
basePropsTitle=What the three have in common
basePropsSubtitle=The properties every keyboard of this library has
basePropsText=Beside these, each of the three has the properties that make its own keys &mdash; <code>mode</code> and the switches on <code>tc:Keyboard</code> and <code>tc:NumberPad</code>, <code>layout</code> and <code>layouts</code> on <code>tc:CustomKeyboard</code>.
baseEventsTitle=The events
baseEventsSubtitle=Fired by every keyboard of this library
baseKeysTitle=The keys with a meaning of their own
baseKeysSubtitle=Understood by all three keyboards
baseKeysText=A row is a string of keys separated by spaces, and a key wrapped in curly braces is one of those below. They are handled here, so they mean the same on all three keyboards; a keyboard only decides whether it puts them on screen.
baseSubclassesTitle=The three keyboards
baseSubclassesSubtitle=Which of them to reach for
baseHowTitle=A word on the geometry
baseHowText=<p>However narrow the room is, a keyboard never has to be scrolled sideways: a key would like to be as wide as it is tall and gives that width up when the room is tight. Its height comes from the <code>size</code> and stays as it is.</p><p>With <code>docked</code> the keyboard leaves the flow of the page and sits at the bottom edge of the screen, over the content, the way the on-screen keyboard of a phone does. On a phone or a tablet it then takes the full width of the screen and <code>width</code> is not looked at. A keyboard on a field is docked the same way, only that its popover puts it into the static area, so it covers a modal dialog as well &mdash; which is what makes a field inside a dialog typeable.</p>
propValue=The current input value of the keyboard.
propEmphasizedKeys=The keys that are drawn as emphasized, written the way they stand in the layout — the braces of a special key are optional. A modifier is emphasized while it is on whatever this says.
propMaxLength=Maximum number of characters. 0 means unlimited.
propEnabled=Whether the keyboard can be used at all.
propHardwareKeys=Whether input from a real keyboard is accepted while the keyboard has the focus. Only keys that are part of the layout are taken; Enter and Backspace are always handled.
propSize=The touch size of every key. The whole geometry follows it.
propWidth=Width of the keyboard. Not looked at for a docked keyboard on a phone or a tablet.
propDocked=Whether the keyboard sits at the bottom edge of the screen, over the content, instead of standing in the flow of the page.
evtChange=Fired whenever the value changes — a key, the backspace, whatever moves it.
evtKeyPress=Fired for every key that is pressed, with the key as it stands in the layout.
evtEnter=Fired when the Enter key is pressed, with the current value.
evtEscape=Fired when the Escape key is pressed. The keyboard does nothing about it by itself; a field that shows one closes its popover on it.
subKeyboard=A field of text: the arrangement of a country, said in one line.
subNumberPad=A field of digits: a pad of three columns, in the block a computer, a telephone or a calculator has.
subCustomKeyboard=Everything else: the keys are written out, row by row, and as many sets as are needed.
