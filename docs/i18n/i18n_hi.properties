docButtonSummary=एक बटन जिसकी पूरी ज्यामिति एक ही size प्रॉपर्टी का अनुसरण करती है, इसलिए उँगली को जो क्षेत्र छूना है वह भी बड़ा होता जाता है। बाकी सब कुछ — टेक्स्ट, आइकन, प्रकार और press — sap.m.Button जैसा ही है।
docButtonOriginal=sap.m का मानक बटन: टेक्स्ट, आइकन, आइकन की स्थिति, एक बटन प्रकार और एक press इवेंट। इसकी ऊँचाई थीम तय करती है और वह बदलती नहीं।
docButtonDescription=समायोज्य आकार, आइकन, आइकन स्थिति, प्रकार (sap.m.ButtonType के सभी मान), पार्श्व पैडिंग और चौड़ाई वाला बटन। press ट्रिगर करता है।
docSegmentedButtonSummary=जुड़े हुए बटनों की एक पंक्ति जिनमें से ठीक एक चुना होता है, इतनी बड़ी कि हर खंड उँगली से छुआ जा सके।
docSegmentedButtonOriginal=जुड़े हुए बटनों की एक पंक्ति जिनमें से ठीक एक चुना होता है, sap.m.SegmentedButtonItem से भरी जाती है। selectionChange ट्रिगर करता है।
docSegmentedButtonDescription=जुड़े हुए बटनों की एक पंक्ति जिनमें से ठीक एक चुना होता है, tc:SegmentedButtonItem (key, text, icon, enabled) से भरी जाती है। समान रूप से बँटे खंडों के लिए selectedKey और width का समर्थन करता है, selectionChange ट्रिगर करता है।
docCheckBoxSummary=एक चेकबॉक्स जिसका डिब्बा, निशान, लेबल और स्पर्श-क्षेत्र एक साथ बड़े होते हैं, बजाय उस आकार पर टिके रहने के जो थीम देती है।
docCheckBoxOriginal=sap.m का मानक चेकबॉक्स, लेबल, त्रि-अवस्था चयन और वैल्यू स्टेट के साथ। डिब्बे और स्पर्श-क्षेत्र का आकार थीम तय करती है।
docCheckBoxDescription=चेकबॉक्स जिसका डिब्बा, निशान, लेबल और स्पर्श-क्षेत्र एक साथ बड़े होते हैं — आकार M पर ज्यामिति sap.m.CheckBox जैसी ही होती है। selected, partiallySelected, text, editable, wrapping, वैल्यू स्टेट और width का समर्थन करता है। select ट्रिगर करता है।
docRadioButtonSummary=एक रेडियो बटन जो अपनी size प्रॉपर्टी के साथ बड़ा होता है, और एक समूह कंट्रोल जो कई बटनों को स्तंभों में सजाता है और अपनी सेटिंग्स उन्हें सौंपता है।
docRadioButtonOriginal=एक रेडियो बटन जो अपने groupName के बाकी बटनों के साथ परस्पर अनन्य है, और एक समूह कंट्रोल जो कई बटनों को स्तंभों में सजाता है।
docRadioButtonDescription=वृत्त, बिंदु, लेबल और स्पर्श-क्षेत्र एक साथ बड़े होते हैं — आकार M पर ज्यामिति sap.m.RadioButton जैसी ही होती है। एक ही groupName वाले बटन परस्पर अनन्य हैं; tc:RadioButtonGroup उन्हें स्तंभों में सजाता है और अपने size, enabled, editable तथा वैल्यू स्टेट उन्हें सौंपता है। select ट्रिगर करता है।
docSwitchSummary=एक चालू/बंद स्विच जो अपनी size प्रॉपर्टी के साथ बड़ा होता है, जबकि sap.m.Switch 4rem × 2rem पर स्थिर रहता है।
docSwitchOriginal=निश्चित आकार का एक चालू/बंद स्विच, accept/reject रूप और दोनों अवस्थाओं के लिए अपने टेक्स्ट के साथ।
docSwitchDescription=पटरी, हैंडल और लेबल एक साथ बड़े होते हैं, जबकि sap.m.Switch 4rem × 2rem पर स्थिर रहता है। state, customTextOn, customTextOff और AcceptReject प्रकार का समर्थन करता है; रंग @sapButton_Track_* / @sapButton_Handle_* थीम पैरामीटर से आते हैं। change ट्रिगर करता है।
docSelectSummary=एक ड्रॉप-डाउन जिसकी सूची उतनी बड़ी पंक्तियों में खुलती है जितना बड़ा फ़ील्ड स्वयं है, ताकि प्रविष्टि उँगली से चुनी जा सके।
docSelectOriginal=sap.ui.core.Item तत्वों से भरा एक ड्रॉप-डाउन। जो सूची यह खोलता है वह मानक पंक्ति-ऊँचाई पर बनी रहती है, फ़ील्ड चाहे कितना भी बड़ा हो।
docSelectDescription=सामान्य sap.ui.core.Item तत्वों से भरा ड्रॉप-डाउन। सूची एक पॉपओवर में खुलती है जिसकी पंक्तियाँ फ़ील्ड जितनी बड़ी होती हैं और इसलिए उँगली से छुई जा सकती हैं — sap.m.Select की मूल सूची अपनी मानक पंक्ति-ऊँचाई पर बनी रहती है, फ़ील्ड चाहे कितना भी बड़ा हो। selectedKey, editable, forceSelection, वैल्यू स्टेट और width का समर्थन करता है। फ़ोन पर सूची पूरी स्क्रीन ले लेती है, जैसा sap.m में भी होता है। change ट्रिगर करता है।
docComboBoxSummary=एक Select जिसमें टाइप भी किया जा सकता है: मुक्त पाठ मान्य है, जो टाइप होता है वह सूची छाँटता है, और पंक्तियाँ फ़ील्ड जितनी बड़ी होती हैं।
docComboBoxOriginal=एक ड्रॉप-डाउन जिसमें टाइप भी किया जा सकता है: जो टाइप होता है वह सूची छाँटता है, और सूची से बाहर का मान भी मान्य है।
docComboBoxDescription=एक Select जिसमें टाइप किया जा सकता है: मुक्त पाठ मान्य है, जो टाइप होता है वह सूची छाँटता है, और उसकी पंक्तियाँ फ़ील्ड जितनी बड़ी होती हैं। बिना अपनी कीबोर्ड वाले उपकरण पर यह इस लाइब्रेरी की कीबोर्ड के साथ मिलकर काम करता है। value, selectedKey, placeholder, editable, वैल्यू स्टेट, width और showSecondaryValues का समर्थन करता है, जो sap.ui.core.ListItem का additionalText पंक्ति के अंत में रखता है। फ़ोन पर सूची पूरी स्क्रीन ले लेती है और आगे टाइप करने के लिए अपना फ़ील्ड साथ लाती है, जैसा sap.m में भी होता है। change और selectionChange ट्रिगर करता है।
docDatePickerSummary=एक दिनांक फ़ील्ड जिसका कैलेंडर इस लाइब्रेरी के बटनों से बना है, इसलिए एक दिन एक वर्ग है जो size प्रॉपर्टी के साथ बड़ा होता है।
docDatePickerOriginal=sap.ui.unified.Calendar पर आधारित कैलेंडर पॉपअप वाला एक फ़ील्ड, minDate/maxDate तथा समायोज्य मान- और प्रदर्शन-प्रारूप के साथ।
docDatePickerDescription=लाइब्रेरी के अपने बटनों से बने कैलेंडर वाला फ़ील्ड: एक दिन एक वर्ग है जो size प्रॉपर्टी के साथ बड़ा होता है, sap.ui.unified.Calendar के निश्चित ग्रिड की जगह। दिन और महीने का दृश्य, minDate/maxDate, valueFormat और displayFormat (शैली या पैटर्न)। value, dateValue और valid के साथ change ट्रिगर करता है।
docTimePickerSummary=एक समय फ़ील्ड जो घंटे पर एक और मिनट पर एक टैप से भर जाता है, उस स्लाइडर की जगह जिसे खींचना पड़ता है।
docTimePickerOriginal=एक फ़ील्ड जिसके पॉपअप में घंटे और मिनट उन स्लाइडरों पर सेट होते हैं जिन्हें खींचना पड़ता है।
docTimePickerDescription=बटनों के दो स्तंभों वाला फ़ील्ड — घंटे और मिनट: समय एक टैप से चुना जाता है, और लक्ष्य size के साथ बड़ा होता है, जबकि sap.m.TimePicker खींचे जाने वाले स्लाइडर का उपयोग करता है। minutesStep, valueFormat और displayFormat का समर्थन करता है। change एक ही बार ट्रिगर करता है, जब पॉपओवर बंद होता है।
docInputSummary=एकपंक्ति इनपुट जो अपनी size प्रॉपर्टी के साथ बड़ा होता है और बिना अपनी कीबोर्ड वाले उपकरण के लिए इस लाइब्रेरी की एक कीबोर्ड साथ ला सकता है।
docInputOriginal=sap.m का मानक एकपंक्ति इनपुट, प्लेसहोल्डर, अधिकतम लंबाई, वैल्यू स्टेट और सुझावों के साथ।
docInputDescription=समायोज्य आकार वाला एकपंक्ति इनपुट। इसकी keyboard एग्रीगेशन में इस लाइब्रेरी की एक कीबोर्ड रखी जा सकती है — tc:Keyboard, tc:NumberPad या tc:CustomKeyboard; showKeyboard के साथ वह फ़ील्ड के नीचे एक पॉपओवर में खुलती है जब तक फ़ील्ड पर फ़ोकस है, और उसी में लिखती है।
docTextAreaSummary=बहुपंक्ति इनपुट जो अपनी size प्रॉपर्टी के साथ बड़ा होता है और इस लाइब्रेरी की कीबोर्ड लेता है, जहाँ उसकी Enter कुंजी पंक्ति-विराम जोड़ती है।
docTextAreaOriginal=sap.m का मानक बहुपंक्ति इनपुट, पंक्ति-संख्या, अधिकतम लंबाई और वैल्यू स्टेट के साथ।
docTextAreaDescription=समायोज्य आकार, पंक्ति-संख्या, अधिकतम लंबाई और वैल्यू स्टेट वाला बहुपंक्ति इनपुट। Input की तरह अपनी keyboard एग्रीगेशन में एक कीबोर्ड लेता है; वहाँ Enter कुंजी पंक्ति-विराम जोड़ती है। change / liveChange ट्रिगर करता है।
docTextSummary=एक टेक्स्ट जिसका फ़ॉन्ट आकार उसी size प्रॉपर्टी का अनुसरण करता है जिसका लाइब्रेरी का हर दूसरा कंट्रोल, इसलिए लेबल बगल के फ़ील्ड के अनुपात में रहता है।
docTextOriginal=रैपिंग और अधिकतम पंक्ति-संख्या वाला एक टेक्स्ट कंट्रोल।
docTextDescription=समायोज्य आकार और रंग वाला टेक्स्ट। press ट्रिगर करता है।
docLinkSummary=एक लिंक जिसका लेबल — और उसके साथ वह क्षेत्र जिसे उँगली छू सकती है — size प्रॉपर्टी के साथ बड़ा होता है।
docLinkOriginal=href और target वाला एक लिंक, साथ में subtle और emphasized रूप।
docLinkDescription=समायोज्य आकार वाला लिंक: उँगली जिस क्षेत्र को छू सकती है वह लेबल के साथ बड़ा होता है। href, target, wrapping, subtle, emphasized और width का समर्थन करता है; target="_blank" वाले लिंक को स्वतः rel="noopener noreferrer" मिलता है। press ट्रिगर करता है।
docToolbarSummary=इस लाइब्रेरी के कंट्रोल के लिए एक पट्टी जो फिर भी वहीं फ़िट होती है जहाँ sap.m अपनी टूलबार की अपेक्षा करता है — जैसे किसी Page या Dialog के फ़ुटर में।
docToolbarOriginal=एक पट्टी जो अपनी सामग्री को एक पंक्ति में सजाती है। sap.m की कई हेडर और फ़ुटर एग्रीगेशन इसी पर टाइप की गई हैं।
docToolbarDescription=content एग्रीगेशन वाला टूलबार कंटेनर। मानक एग्रीगेशन में प्रयोग योग्य, जैसे किसी Page या Dialog के फ़ुटर में।
docOverflowToolbarSummary=एक टूलबार जो न समाने वाली सामग्री को तीन बिंदुओं वाले बटन के पीछे एक पॉपओवर में ले जाती है, sap.m.OverflowToolbarLayoutData की प्राथमिकताओं से नियंत्रित।
docOverflowToolbarOriginal=एक टूलबार जो न समाने वाली सामग्री को तीन बिंदुओं वाले बटन के पीछे एक पॉपओवर में ले जाती है, sap.m.OverflowToolbarLayoutData की प्राथमिकताओं से नियंत्रित।
docOverflowToolbarDescription=tc:Toolbar जैसी ही, बस उपलब्ध चौड़ाई में न समाने वाली सामग्री तीन बिंदुओं वाले बटन के पीछे चली जाती है, जो शेष सामग्री के साथ एक पॉपओवर खोलता है। sap.m.OverflowToolbarLayoutData की प्राथमिकताएँ समझता है।
docStepInputSummary=माइनस और प्लस बटन वाला एक संख्या फ़ील्ड जो उसके साथ ही बड़े होते हैं, ताकि मान अंगूठे से बदला जा सके।
docStepInputOriginal=माइनस और प्लस बटन वाला एक संख्या फ़ील्ड, min, max और step के साथ।
docStepInputDescription=माइनस बटन, इनपुट और प्लस बटन, एक साथ आकारित। min, max और step का समर्थन करता है। change ट्रिगर करता है।
docBarcodeInputSummary=एक इनपुट फ़ील्ड जो बारकोड स्कैनर और टाइप करते व्यक्ति में अंतर करता है और दोनों को अलग-अलग इवेंट के रूप में बताता है।
docBarcodeInputDescription=इनपुट फ़ील्ड जो बारकोड स्कैनर और टाइप करते व्यक्ति में अंतर करता है: कम से कम minLength वर्णों की ऐसी शृंखला जिसके अंतराल scanTimeout से कम रहें और जो Enter से समाप्त हो, scan ट्रिगर करती है, बाकी सब change। prefix और suffix कोड से काट दिए जाते हैं, clearOnScan अगले कोड के लिए फ़ील्ड खाली कर देता है।
docKeyboardSummary=अपनी कीबोर्ड न रखने वाले उपकरणों के लिए अक्षरों वाली स्क्रीन कीबोर्ड। mode किसी देश का विन्यास चुनता है; कुछ स्विच तय करते हैं कि उस पर और क्या है।
docKeyboardDescription=अक्षरों वाली स्क्रीन कीबोर्ड, लाइब्रेरी के अपने बटनों से बनी। mode प्रॉपर्टी किसी देश का विन्यास चुनती है — अंग्रेज़ी, जर्मन, फ़्रेंच, स्पेनिश, यूक्रेनी, रूसी, हिन्दी — और कुछ स्विच तय करते हैं कि उस पर और क्या है: displayNumbers अंकों को अक्षरों के ऊपर या एक कुंजी के पीछे रखता है, showSpecialCharacters चिह्नों का एक समूह जोड़ता है, letterCase कीबोर्ड को बड़े या छोटे अक्षरों पर बाँधता है, showCapsLock और showEscape एक-एक कुंजी जोड़ते हैं। साथ ही असली कीबोर्ड से इनपुट, बाइंड करने योग्य मान और change / keyPress / enter / escape इवेंट।
docNumberPadSummary=तीन स्तंभों वाला स्क्रीन अंक-पैड, हर उस चीज़ के लिए जो संख्या के रूप में दर्ज होती है। mode ब्लॉक चुनता है: कंप्यूटर का, टेलीफ़ोन का या कैलकुलेटर का।
docNumberPadDescription=तीन स्तंभों वाला स्क्रीन अंक-पैड। mode प्रॉपर्टी ब्लॉक चुनती है — Simple (कंप्यूटर का पैड), Phone (टेलीफ़ोन का) या Calculator (चार मूल संक्रियाओं के साथ) — और showDecimalSeparator, decimalSeparator, showSign तथा showSpecialCharacters वह जोड़ते हैं जो फ़ील्ड को अंकों से आगे चाहिए। मान का संचालन, आकार और डॉकिंग यह बाकी कीबोर्ड के साथ साझा करता है।
docCustomKeyboardSummary=वह कीबोर्ड जिसकी कुंजियाँ उसे पंक्ति दर पंक्ति सौंपी जाती हैं। यह हर उस बात का उत्तर है जो तैयार कीबोर्ड नहीं ढँकतीं।
docCustomKeyboardDescription=स्क्रीन कीबोर्ड जिसकी कुंजियाँ उसे सौंपी जाती हैं: layout प्रॉपर्टी एक समूह की पंक्तियाँ हैं, layouts एग्रीगेशन जितने समूह चाहिए उतने रखता है, और किसी समूह का नाम लिखी कुंजी उसी समूह पर स्विच कर देती है। display एग्रीगेशन तय करता है कि किसी एक कुंजी पर क्या लिखा है। यह हर उस बात के लिए कीबोर्ड है जो तैयार कीबोर्ड नहीं ढँकतीं।
docKeyboardBaseSummary=तीनों कीबोर्ड के पीछे की मशीनरी। इसे स्वयं किसी व्यू में नहीं रखा जाता — जो इसमें नहीं है वह यह तय करना कि कौन-सी कुंजियाँ दिखें, और वही इसकी उपवर्गों को अलग करता है।
docKeyboardBaseDescription=इस लाइब्रेरी की स्क्रीन कीबोर्ड का आधार वर्ग, लाइब्रेरी के अपने Button कंट्रोल से मूल रूप से बना, बिना किसी बाहरी निर्भरता के। कुंजियों के चयन को छोड़कर सब कुछ यहीं है: मान और कोई कुंजी उसे कैसे बदलती है, कुंजी-समूह और उनके बीच स्विच करना, शिफ़्ट और कैप्स लॉक, hardwareKeys के ज़रिये असली कीबोर्ड की कुंजियाँ, आकार, चौड़ाई और डॉकिंग। Input तथा TextArea की keyboard एग्रीगेशन इसी पर टाइप की गई है, इसलिए Keyboard, NumberPad और CustomKeyboard तीनों उसमें फ़िट होते हैं।
docSignaturePadSummary=उँगली या स्टाइलस से हस्ताक्षर करने का फ़ील्ड। हस्ताक्षर PNG डेटा URL के रूप में निकलता है और इसलिए किसी भी दूसरे मान की तरह मॉडल से बाँधा जा सकता है।
docSignaturePadDescription=उँगली या स्टाइलस से हस्ताक्षर करने का फ़ील्ड। कैनवस पर बनाता है और हस्ताक्षर को value में PNG डेटा URL के रूप में देता है, ताकि उसे मॉडल से बाँधा जा सके। रेखा की मोटाई, प्लेसहोल्डर और साफ़-करने वाला बटन size प्रॉपर्टी का अनुसरण करते हैं; आकार बदलने पर रेखाएँ बनी रहती हैं। change ट्रिगर करता है।
docQuickDialogSummary=टच कंट्रोल से बने तैयार डायलॉग, जो व्यू में लिखे जाने के बजाय कंट्रोलर से बुलाए जाते हैं। हर विधि एक Promise लौटाती है।
docQuickDialogDescription=टच के अनुकूल डायलॉग के लिए सहायक वर्ग, व्यू के बजाय कंट्रोलर से प्रयुक्त: show, confirm, information, error, input, select, details। हर विधि एक Promise लौटाती है।
