keyboardLayoutsText=<code>mode</code> किसी देश की कीबोर्ड है, जिसका नाम उस भाषा से आता है जिसके लिए वह चलती है। नीचे की पंक्तियाँ दिखाती हैं कि वह विन्यास <code>displayNumbers=&quot;Always&quot;</code> के साथ क्या दिखाता है; कीबोर्ड पर और क्या है, यह उसके बगल के स्विच तय करते हैं। ऊपर की कीबोर्ड को किसी विन्यास पर लाने के लिए उस विन्यास पर क्लिक करें। जहाँ किसी भाषा में ऐसे अक्षर होते हैं जिन्हें कुंजियों वाला कीबोर्ड डेड की से बनाता है — पुर्तगाली और इतालवी के स्वराघात वाले स्वर —, वे अपने अलग सेट में होते हैं, जो स्पेस बार के पास की एक कुंजी से खुलता है।
keyboardSwitchesTitle=स्विच
keyboardSwitchesSubtitle=इनमें से हर एक कीबोर्ड में क्या जोड़ता है
keyboardSwitchesText=<p><b>displayNumbers</b> तय करता है कि अंकों का क्या हो। <code>Always</code> उनकी एक पंक्ति अक्षरों के ऊपर रखता है, जैसी कुंजियों वाली कीबोर्ड पर होती है। <code>Toggle</code> अक्षरों को अपने हाल पर छोड़ता है और अंकों को <code>{numbers}</code> कुंजी के पीछे कर देता है, जैसे कोई फ़ोन करता है &mdash; वहाँ अंकों की एक पंक्ति हर कुंजी को पतला कर देती है। <code>ToggleOnMobile</code>, यानी डिफ़ॉल्ट, कंप्यूटर और टैबलेट पर पहला है और फ़ोन पर दूसरा; इनमें से कौन-सा, यह एक ही बार तय होता है — उस उपकरण से जिस पर पेज खोला गया। <code>Never</code> अंकों को पूरी तरह छोड़ देता है।</p><p><b>showSpecialCharacters</b> कोष्ठकों, चिह्नों और मुद्राओं का एक समूह जोड़ता है। जहाँ अंक पहले से अपनी कुंजी के पीछे हैं, वहाँ यह समूह उनके पीछे बैठता है — जैसे फ़ोन अक्षरों से अंकों पर, फिर चिह्नों पर और वापस जाता है; अन्यथा वहाँ तक एक <code>{symbols}</code> कुंजी ले जाती है।</p><p><b>letterCase</b> कीबोर्ड को एक ही अक्षर रूप पर बाँध देता है। <code>Upper</code> और <code>Lower</code> के साथ shift और caps lock दोनों नहीं दिखते &mdash; बदलने को कुछ है ही नहीं, और अपने तय अक्षर रूप वाला फ़ील्ड यही चाहता है: कोई सामग्री संख्या, कोई गाड़ी का नंबर, कोई बैच। हिन्दी के लिए इसे नहीं देखा जाता, क्योंकि वहाँ बड़े अक्षरों की जगह अक्षरों का दूसरा समूह है।</p><p><b>showEmojis</b> चेहरों का एक समूह अपनी कुंजी के पीछे टाँग देता है, ठीक उसी तरह जैसे अंकों और विशेष चिह्नों तक पहुँचा जाता है। उस पर केवल वे चेहरे हैं जो एक ही वर्ण के हैं: कई वर्णों से जुड़ा हुआ चेहरा &mdash; कोई परिवार, कोई झंडा &mdash; backspace से फिर टुकड़ों में बँट जाता।</p><p><b>extraKeys</b> वे कुंजियाँ हैं जो हर समूह में स्पेस बार के बगल में खड़ी रहती हैं, स्क्रीन पर चाहे कोई भी समूह हो। वहीं वह कुंजी जाती है जो किसी फ़ील्ड को स्विच के पीछे नहीं, हाथ के पास चाहिए: किसी पते के लिए <code>extraKeys=&quot;@,.&quot;</code>, किसी मात्रा के लिए कोई इकाई। ऐट चिह्न विशेष चिह्नों के समूह में भी है — एक कुंजी और दूर।</p><p><b>showCapsLock</b> shift कुंजी के बगल में एक <code>{lock}</code> जोड़ता है। Shift एक अक्षर के बाद हट जाती है, लॉक तब तक चालू रहती है जब तक उसे दोबारा न दबाया जाए &mdash; और लॉक चालू रहते हुए shift छोटे अक्षर लिखती है, जैसे किसी कीबोर्ड पर होता है।</p><p><b>showEscape</b> हर समूह में सबसे ऊपर की पंक्ति की पहली कुंजी के रूप में एक <code>{esc}</code> जोड़ता है, वहीं जहाँ वह कुंजियों वाली कीबोर्ड पर होती है। यह <code>escape</code> ट्रिगर करती है और कुछ नहीं करती; इसका अर्थ क्या हो, यह ऐप्लिकेशन पर छोड़ा गया है।</p><p><b>enterText</b> वह है जो Enter कुंजी पर लिखा होता है। खाली छोड़ने पर उस पर वही तीर रहता है जो पहले से है।</p>
padLayoutsTitle=अंक-ब्लॉक
padLayoutsSubtitle=mode प्रॉपर्टी का हर मान क्या दिखाता है
padLayoutsText=<code>mode</code> अंकों का ब्लॉक चुनता है, और और कुछ भी चालू हो, ब्लॉक अपना रूप बनाए रखता है: ऋण चिह्न और दशमलव विभाजक शून्य की पंक्ति में जाते हैं, विशेष चिह्नों वाली कुंजी और escape कुंजी उसके नीचे फलन-कुंजियों की पंक्ति में। जब न ऋण चिह्न माँगा गया हो और न विभाजक, तब शून्य की पंक्ति में उनके बजाय backspace और enter आ जाते हैं &mdash; अकेली पंक्ति में खड़ा शून्य तीन स्तंभ चौड़ी कुंजी बन जाता। ऊपर के पैड को किसी मोड पर लाने के लिए उस मोड पर क्लिक करें।
customKeysTitle=Writing a layout
customKeysSubtitle=पंक्तियाँ, कुंजियाँ और वे जिनका अपना अर्थ है
customKeysText=एक पंक्ति रिक्त स्थान से अलग की गई कुंजियों की शृंखला है; व्यू में पंक्तियाँ अल्पविरामों से अलग होती हैं। नीचे की तालिका में जो नहीं है, वह सब स्वयं को लिखता है &mdash; एक अक्षर, एक अंक, पूरा शब्द। <code>layouts</code> एग्रीगेशन के किसी समूह के नाम से लिखी कुंजी उसी समूह पर स्विच कर देती है, और जो कुंजी उसी समूह का नाम रखती है जिस पर वह पहले से है, वह वहाँ से वापस ले आती है।
