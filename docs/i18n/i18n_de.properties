keyboardSwitchesSubtitle=Was jeder von ihnen zur Tastatur hinzufügt
keyboardSwitchesText=<p><b>displayNumbers</b> entscheidet über die Ziffern. <code>Always</code> legt eine Reihe davon über die Buchstaben, so wie es eine Tastatur mit Tasten hat. <code>Toggle</code> lässt die Buchstaben für sich und legt die Ziffern hinter eine <code>{numbers}</code>-Taste, so wie es ein Handy tut &mdash; eine Ziffernreihe würde dort jede Taste schmal machen. <code>ToggleOnMobile</code>, der Standard, ist auf Rechner und Tablet das Erste und auf dem Handy das Zweite; welches von beiden, entscheidet sich einmal, am Gerät, auf dem die Seite geöffnet wurde. <code>Never</code> lässt die Ziffern ganz weg.</p><p><b>showSpecialCharacters</b> fügt einen Satz Klammern, Zeichen und Währungen hinzu. Liegen die Ziffern hinter einer eigenen Taste, sitzt der Satz dahinter &mdash; wie ein Handy von den Buchstaben zu den Ziffern zu den Symbolen und zurück geht; sonst führt eine <code>{symbols}</code>-Taste dorthin.</p><p><b>letterCase</b> legt die Tastatur auf eine Schreibweise fest. <code>Upper</code> und <code>Lower</code> lassen Umschalt- und Feststelltaste weg &mdash; es gibt nichts umzuschalten, und genau das will ein Feld mit eigener Schreibweise: eine Materialnummer, ein Kennzeichen, eine Charge. Bei Hindi nicht ausgewertet, dort gibt es statt Großbuchstaben einen zweiten Satz Buchstaben.</p><p><b>showEmojis</b> hängt einen Satz Gesichter hinter eine eigene Taste, so wie die Ziffern und die Sonderzeichen erreicht werden. Darauf liegen nur Gesichter aus einem einzigen Zeichen: eines, das aus mehreren zusammengesetzt ist &mdash; eine Familie, eine Flagge &mdash; würde der Rückschritt wieder auseinandernehmen.</p><p><b>extraKeys</b> sind Tasten, die auf jedem Satz neben der Leertaste stehen, welcher auch gerade auf dem Schirm ist. Dorthin gehört eine Taste, die ein Feld zur Hand braucht statt hinter einem Schalter: <code>extraKeys=&quot;@,.&quot;</code> für eine Adresse, eine Einheit für eine Menge. Das At-Zeichen liegt außerdem auf dem Satz der Sonderzeichen, eine Taste weiter weg.</p><p><b>showCapsLock</b> fügt neben der Umschalttaste eine <code>{lock}</code> hinzu. Umschalt fällt nach einem Buchstaben weg, die Feststelltaste bleibt an, bis sie erneut gedrückt wird &mdash; und Umschalt bei aktiver Feststelltaste schreibt klein, so wie an einer Tastatur mit Tasten.</p><p><b>showEscape</b> fügt eine <code>{esc}</code>-Taste als erste Taste der obersten Reihe hinzu, dort, wo eine Tastatur mit Tasten sie hat, und das auf jedem Satz. Sie feuert <code>escape</code> und tut sonst nichts; was das bedeuten soll, bleibt der Anwendung überlassen.</p><p><b>enterText</b> ist das, was auf der Enter-Taste steht. Leer belässt sie beim Pfeil.</p>
padLayoutsTitle=Die Ziffernblöcke
padLayoutsSubtitle=Was jeder Wert der Property mode anzeigt
padLayoutsText=<code>mode</code> wählt den Ziffernblock, und der Block behält seine Form, was auch immer sonst eingeschaltet ist: Minus und Dezimaltrennzeichen kommen in die Reihe der Null, die Taste zu den Sonderzeichen und die Escape-Taste in die Reihe der Funktionstasten darunter. Ist weder Minus noch Trennzeichen gefragt, rücken Rückschritt und Enter in die Reihe der Null &mdash; eine Null auf einer eigenen Zeile wäre eine Taste über drei Spalten. Klicken Sie einen Modus an, um das Pad oben darauf umzustellen.
customKeysTitle=Ein Layout schreiben
customKeysSubtitle=Reihen, Tasten und die mit eigener Bedeutung
customKeysText=Eine Reihe ist eine Folge von Tasten, durch Leerzeichen getrennt; in einer View trennen Kommas die Reihen. Alles, was nicht in der Tabelle unten steht, schreibt sich selbst &mdash; ein Buchstabe, eine Ziffer, ein ganzes Wort. Eine Taste, die den Namen eines Satzes aus der <code>layouts</code>-Aggregation trägt, schaltet zu diesem Satz um, und eine Taste, die den Satz nennt, auf dem sie schon steht, führt wieder heraus.
