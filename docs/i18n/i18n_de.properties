kbIntroSubtitle=Eine Buchstabentastatur, in einer Zeile gesagt
kbIntroText=<p>Auf einem Shopfloor-Terminal, einem Kiosk oder einem Gerät, das mit Handschuhen bedient wird, gibt es oft keine Hardware-Tastatur, und die Bildschirmtastatur des Betriebssystems ist entweder nicht verfügbar oder verdeckt den halben Bildschirm. UI5 hat dafür kein Control. Die Library bringt drei Bildschirmtastaturen mit, gerendert aus ihren eigenen Buttons &mdash; ohne Fremdabhängigkeit und über dieselbe <code>size</code>-Property skalierbar wie alles andere.</p><p>Es ist eine von drei Tastaturen, und sie teilen sich alles, was nicht die Tasten betrifft: den Wert, die <code>size</code>, <code>docked</code>, die Tasten einer echten Tastatur über <code>hardwareKeys</code> und die Events <code>change</code>, <code>keyPress</code>, <code>enter</code> und <code>escape</code>. Für Ziffernfelder gibt es <code>tc:NumberPad</code>, für eigene Tasten <code>tc:CustomKeyboard</code>. Alle drei passen in die <code>keyboard</code>-Aggregation eines <code>tc:Input</code> oder einer <code>tc:TextArea</code>.</p>
padIntroSubtitle=Ein Ziffernpad, in einer Zeile gesagt
padIntroText=<p>Eine Menge, eine Anzahl, ein Code, ein Preis &mdash; die Felder eines Terminals sind öfter Ziffern als Buchstaben, und ein Pad aus drei Spalten findet ein Daumen ohne hinzusehen. <code>tc:NumberPad</code> ist dieses Pad: <code>mode</code> wählt den Ziffernblock, und die Schalter daneben ergänzen, was das Feld darüber hinaus braucht.</p><p>Es ist eine von drei Tastaturen, und sie teilen sich alles, was nicht die Tasten betrifft: den Wert, die <code>size</code>, <code>docked</code>, die Tasten einer echten Tastatur über <code>hardwareKeys</code> und die Events <code>change</code>, <code>keyPress</code>, <code>enter</code> und <code>escape</code>. Für Textfelder gibt es <code>tc:Keyboard</code>, für eigene Tasten <code>tc:CustomKeyboard</code>.</p>
customIntroSubtitle=Die Tasten werden ihr übergeben, Reihe für Reihe
customIntroText=<p><code>tc:CustomKeyboard</code> ist die Tastatur für alles, was die fertigen nicht abdecken: die Größen, die ein Laden führt, die Buchstaben, die ein Kennzeichen haben darf, die Tasten einer Maschine. Die Property <code>layout</code> sind die Reihen eines Satzes; die Aggregation <code>layouts</code> trägt so viele Sätze wie nötig, und eine Taste, die den Namen eines Satzes trägt, schaltet zu ihm um. Die Aggregation <code>display</code> sagt, was auf einer einzelnen Taste steht.</p><p>Es ist eine von drei Tastaturen, und sie teilen sich alles, was nicht die Tasten betrifft: den Wert, die <code>size</code>, <code>docked</code>, die Tasten einer echten Tastatur über <code>hardwareKeys</code> und die Events <code>change</code>, <code>keyPress</code>, <code>enter</code> und <code>escape</code>. Wo eine Buchstabentastatur oder ein Ziffernpad gemeint ist, sagen <code>tc:Keyboard</code> und <code>tc:NumberPad</code> dasselbe in einer Zeile.</p>
colProperty=Property
colDefault=Standard
baseNote=tc:KeyboardBase ist eine Basisklasse und wird nie in einen View gestellt. Zu verwenden sind tc:Keyboard, tc:NumberPad oder tc:CustomKeyboard; diese Seite sagt, was die drei gemeinsam haben.
baseIntroSubtitle=Was die drei Tastaturen teilen
baseIntroText=<p>Die drei Tastaturen dieser Library unterscheiden sich in genau einem: woher die Tasten kommen. <code>tc:Keyboard</code> baut sie aus einer Sprache und einer Handvoll Schalter, <code>tc:NumberPad</code> aus einem Ziffernblock, <code>tc:CustomKeyboard</code> bekommt sie Reihe für Reihe übergeben. Alles andere ist diese Klasse, und es funktioniert bei allen dreien gleich.</p><p>Das ist der Wert und wie eine Taste ihn ändert, die Tastensätze und das Umschalten zwischen ihnen, Shift und die Feststelltaste, die Tasten einer echten Tastatur, die Größe, die Breite und das Andocken. Die Tasten selbst sind <code>tc:Button</code>-Controls dieser Library &mdash; es steckt keine Fremdtastatur dahinter, und dieselbe <code>size</code>-Property, die alles andere skaliert, skaliert auch sie.</p><p>Sie ist außerdem der Typ, auf den die <code>keyboard</code>-Aggregation eines <code>tc:Input</code> und einer <code>tc:TextArea</code> typisiert ist &mdash; deshalb passt jede der drei an ein Feld.</p>
basePropsTitle=Was die drei gemeinsam haben
basePropsSubtitle=Die Properties, die jede Tastatur dieser Library hat
basePropsText=Daneben hat jede der drei die Properties, die ihre eigenen Tasten ausmachen &mdash; <code>mode</code> und die Schalter bei <code>tc:Keyboard</code> und <code>tc:NumberPad</code>, <code>layout</code> und <code>layouts</code> bei <code>tc:CustomKeyboard</code>.
baseEventsTitle=Die Events
baseEventsSubtitle=Von jeder Tastatur dieser Library gefeuert
baseKeysTitle=Die Tasten mit eigener Bedeutung
baseKeysSubtitle=Von allen drei Tastaturen verstanden
baseKeysText=Eine Reihe ist eine Zeichenkette aus Tasten, getrennt durch Leerzeichen; eine Taste in geschweiften Klammern ist eine der unten stehenden. Sie werden hier behandelt und bedeuten deshalb auf allen drei Tastaturen dasselbe; eine Tastatur entscheidet nur, ob sie sie auf den Schirm bringt.
baseSubclassesTitle=Die drei Tastaturen
baseSubclassesSubtitle=Zu welcher zu greifen ist
baseHowTitle=Ein Wort zur Geometrie
baseHowText=<p>Wie eng es auch wird, eine Tastatur muss nie seitlich gescrollt werden: Eine Taste möchte so breit sein, wie sie hoch ist, und gibt diese Breite auf, wenn der Platz knapp wird. Ihre Höhe kommt aus der <code>size</code> und bleibt, wie sie ist.</p><p>Mit <code>docked</code> verlässt die Tastatur den Fluss der Seite und sitzt am unteren Bildschirmrand über dem Inhalt, so wie es die Bildschirmtastatur eines Telefons tut. Auf einem Telefon oder Tablet nimmt sie dann die volle Bildschirmbreite ein, und <code>width</code> wird nicht angesehen. Eine Tastatur an einem Feld dockt genauso an, nur dass ihr Popover sie in den statischen Bereich stellt &mdash; sie überdeckt damit auch einen modalen Dialog, und genau das macht ein Feld in einem Dialog beschreibbar.</p>
propValue=Der aktuelle Eingabewert der Tastatur.
propEmphasizedKeys=Die Tasten, die hervorgehoben gezeichnet werden, geschrieben wie im Layout — die Klammern einer Sondertaste sind optional. Ein Modifier ist hervorgehoben, solange er an ist.
propMaxLength=Maximale Anzahl Zeichen. 0 bedeutet unbegrenzt.
propEnabled=Ob die Tastatur überhaupt bedient werden kann.
propHardwareKeys=Ob Eingaben einer echten Tastatur angenommen werden, solange die Tastatur den Fokus hat. Genommen werden nur Tasten, die Teil des Layouts sind; Enter und Backspace immer.
propSize=Die Touch-Größe jeder Taste. Die gesamte Geometrie folgt ihr.
propWidth=Breite der Tastatur. Bei einer angedockten Tastatur auf Telefon oder Tablet nicht angesehen.
propDocked=Ob die Tastatur am unteren Bildschirmrand über dem Inhalt sitzt, statt im Fluss der Seite zu stehen.
evtChange=Wird gefeuert, sobald sich der Wert ändert — eine Taste, die Rücktaste, was ihn auch bewegt.
evtKeyPress=Wird für jede gedrückte Taste gefeuert, mit der Taste, wie sie im Layout steht.
evtEnter=Wird gefeuert, wenn die Enter-Taste gedrückt wird, mit dem aktuellen Wert.
evtEscape=Wird gefeuert, wenn die Escape-Taste gedrückt wird. Die Tastatur tut von sich aus nichts damit; ein Feld, das eine zeigt, schließt daraufhin sein Popover.
subKeyboard=Ein Textfeld: die Anordnung eines Landes, in einer Zeile gesagt.
subNumberPad=Ein Ziffernfeld: ein Pad aus drei Spalten, im Block eines Computers, eines Telefons oder eines Taschenrechners.
subCustomKeyboard=Alles andere: Die Tasten werden ausgeschrieben, Reihe für Reihe, und so viele Sätze wie nötig.
