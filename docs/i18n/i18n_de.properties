# ---------------------------------------------------------------------------
# Control-Referenz: was ein Control ist, was das sap.m-Original tut und was
# diese Library daraus gemacht hat. Steht am Kopf der Seite eines Controls
# und in den Tabellen der Dokumentationsseite.
# ---------------------------------------------------------------------------
docButtonSummary=Ein Button, dessen gesamte Geometrie einer einzigen size-Property folgt: Die Fläche, die ein Finger treffen muss, wächst mit. Alles andere — Text, Icon, Typ und press — verhält sich wie bei sap.m.Button.
docButtonOriginal=Der Standard-Button von sap.m: Text, Icon, Icon-Position, ein Button-Typ und ein press-Event. Seine Höhe gibt das Theme vor, sie ändert sich nicht.
docButtonDescription=Button mit einstellbarer Größe, Icon, Icon-Position, Typ (alle Werte von sap.m.ButtonType), seitlichem Innenabstand und Breite. Löst press aus.
docSegmentedButtonSummary=Eine Reihe zusammenhängender Buttons, von denen genau einer ausgewählt ist — groß genug, dass jedes Segment mit dem Finger zu treffen ist.
docSegmentedButtonOriginal=Eine Reihe zusammenhängender Buttons, von denen genau einer ausgewählt ist, gefüllt über sap.m.SegmentedButtonItem. Löst selectionChange aus.
docSegmentedButtonDescription=Eine Reihe zusammenhängender Buttons, von denen genau einer ausgewählt ist, gefüllt über tc:SegmentedButtonItem (key, text, icon, enabled). Unterstützt selectedKey und width für gleichmäßig verteilte Segmente, löst selectionChange aus.
docCheckBoxSummary=Eine Checkbox, deren Kästchen, Haken, Beschriftung und Trefferfläche gemeinsam mitwachsen, statt bei der Größe zu bleiben, die das Theme vorgibt.
docCheckBoxOriginal=Die Standard-Checkbox von sap.m, mit Beschriftung, dreiwertiger Auswahl und Value States. Kästchen und Trefferfläche haben die Größe, die das Theme vorgibt.
docCheckBoxDescription=Checkbox, deren Kästchen, Haken, Beschriftung und Trefferfläche gemeinsam mitwachsen — bei Größe M entspricht die Geometrie sap.m.CheckBox. Unterstützt selected, partiallySelected, text, editable, wrapping, Value States und width. Löst select aus.
docRadioButtonSummary=Ein Radio-Button, der mit seiner size-Property mitwächst, dazu ein Gruppen-Control, das mehrere davon in Spalten anordnet und seine Einstellungen an sie weitergibt.
docRadioButtonOriginal=Ein Radio-Button, der sich mit den anderen seines groupName gegenseitig ausschließt, dazu ein Gruppen-Control, das mehrere davon in Spalten anordnet.
docRadioButtonDescription=Kreis, Punkt, Beschriftung und Trefferfläche wachsen gemeinsam mit — bei Größe M entspricht die Geometrie sap.m.RadioButton. Buttons mit demselben groupName schließen sich gegenseitig aus; tc:RadioButtonGroup ordnet sie in Spalten an und gibt size, enabled, editable und den Value State an sie weiter. Löst select aus.
docSwitchSummary=Ein Ein-/Aus-Schalter, der mit seiner size-Property wächst, wo sap.m.Switch fest bei 4rem × 2rem bleibt.
docSwitchOriginal=Ein Ein-/Aus-Schalter fester Größe, mit einer Accept/Reject-Variante und eigenen Texten für die beiden Zustände.
docSwitchDescription=Schiene, Griff und Beschriftung wachsen gemeinsam mit, wo sap.m.Switch fest bei 4rem × 2rem bleibt. Unterstützt state, customTextOn, customTextOff und den Typ AcceptReject; die Farben kommen aus den Theme-Parametern @sapButton_Track_* / @sapButton_Handle_*. Löst change aus.
docSelectSummary=Eine Auswahlliste, deren Liste in Zeilen aufgeht, die so groß sind wie das Feld selbst — ein Eintrag lässt sich damit mit dem Finger treffen.
docSelectOriginal=Eine Auswahlliste, gefüllt mit sap.ui.core.Item-Elementen. Die Liste, die sie öffnet, behält die Standard-Zeilenhöhe, wie groß das Feld auch ist.
docSelectDescription=Auswahlliste, gefüllt mit gewöhnlichen sap.ui.core.Item-Elementen. Die Liste öffnet in einem Popover, dessen Zeilen so groß sind wie das Feld und sich deshalb mit dem Finger treffen lassen — die native Liste von sap.m.Select behält ihre Standard-Zeilenhöhe, wie groß das Feld auch ist. Unterstützt selectedKey, editable, forceSelection, Value States und width. Auf dem Telefon nimmt die Liste den ganzen Bildschirm ein, wie in sap.m auch. Löst change aus.
docComboBoxSummary=Ein Select, in das sich tippen lässt: Freitext ist erlaubt, das Getippte filtert die Liste, und deren Zeilen sind so groß wie das Feld.
docComboBoxOriginal=Eine Auswahlliste, in die sich auch tippen lässt: Das Getippte filtert die Liste, und ein Wert außerhalb der Liste ist erlaubt.
docComboBoxDescription=Ein Select, in das sich tippen lässt: Freitext ist erlaubt, das Getippte filtert die Liste, und deren Zeilen sind so groß wie das Feld. Auf einem Gerät ohne eigene Tastatur arbeitet es mit den Tastaturen dieser Library zusammen. Unterstützt value, selectedKey, placeholder, editable, Value States, width und showSecondaryValues, was den additionalText eines sap.ui.core.ListItem ans Ende der Zeile setzt. Auf dem Telefon nimmt die Liste den ganzen Bildschirm ein und bringt zum Weitertippen ein eigenes Feld mit, wie in sap.m auch. Löst change und selectionChange aus.
docDatePickerSummary=Ein Datumsfeld, dessen Kalender aus den Buttons dieser Library gebaut ist — ein Tag ist damit ein Quadrat, das mit der size-Property wächst.
docDatePickerOriginal=Ein Feld mit Kalender-Popup auf Basis von sap.ui.unified.Calendar, mit minDate/maxDate und einstellbarem Wert- und Anzeigeformat.
docDatePickerDescription=Feld mit einem Kalender aus den eigenen Buttons der Library: Ein Tag ist ein Quadrat, das mit der size-Property wächst, statt im festen Raster von sap.ui.unified.Calendar zu stehen. Tages- und Monatsansicht, minDate/maxDate, valueFormat und displayFormat (Stil oder Muster). Löst change mit value, dateValue und valid aus.
docTimePickerSummary=Ein Zeitfeld, das mit je einem Tipp auf Stunde und Minute gefüllt wird, statt mit einem Schieberegler, den man ziehen muss.
docTimePickerOriginal=Ein Feld mit einem Popup, in dem Stunden und Minuten über Schieberegler eingestellt werden, die gezogen werden müssen.
docTimePickerDescription=Feld mit zwei Spalten aus Buttons — Stunden und Minuten: Eine Uhrzeit ist mit einem Tipp auf ein Ziel gewählt, das mit size wächst, während sap.m.TimePicker einen Schieberegler zum Ziehen verwendet. Unterstützt minutesStep, valueFormat und displayFormat. Löst change einmal aus, beim Schließen des Popovers.
docInputSummary=Ein einzeiliges Eingabefeld, das mit seiner size-Property skaliert und für Geräte ohne eigene Tastatur eine Tastatur dieser Library mitbringen kann.
docInputOriginal=Das einzeilige Standard-Eingabefeld von sap.m, mit Platzhalter, Maximallänge, Value States und Vorschlägen.
docInputDescription=Einzeiliges Eingabefeld mit einstellbarer Größe. In seine keyboard-Aggregation lässt sich eine Tastatur dieser Library stellen — tc:Keyboard, tc:NumberPad oder tc:CustomKeyboard; mit showKeyboard öffnet sie dann in einem Popover unter dem Feld, solange das Feld den Fokus hat, und schreibt hinein.
docTextAreaSummary=Ein mehrzeiliges Eingabefeld, das mit seiner size-Property skaliert und eine Tastatur dieser Library aufnimmt, deren Enter-Taste hier einen Zeilenumbruch einfügt.
docTextAreaOriginal=Das mehrzeilige Standard-Eingabefeld von sap.m, mit Zeilenzahl, Maximallänge und Value States.
docTextAreaDescription=Mehrzeiliges Eingabefeld mit einstellbarer Größe, Zeilenzahl, Maximallänge und Value States. Nimmt wie das Input eine Tastatur in seiner keyboard-Aggregation auf; dort fügt die Enter-Taste einen Zeilenumbruch ein. Löst change / liveChange aus.
docTextSummary=Ein Text, dessen Schriftgröße derselben size-Property folgt wie jedes andere Control der Library — eine Beschriftung steht damit im Maßstab des Feldes daneben.
docTextOriginal=Ein Text-Control mit Umbruch und einer Höchstzahl an Zeilen.
docTextDescription=Text mit einstellbarer Größe und Farbe. Löst press aus.
docLinkSummary=Ein Link, dessen Beschriftung — und mit ihr die Fläche, die ein Finger treffen kann — mit der size-Property wächst.
docLinkOriginal=Ein Link mit href und target sowie den Varianten subtle und emphasized.
docLinkDescription=Link mit einstellbarer Größe: Die Fläche, die ein Finger treffen kann, wächst mit der Beschriftung. Unterstützt href, target, wrapping, subtle, emphasized und width; ein Link mit target="_blank" bekommt automatisch rel="noopener noreferrer". Löst press aus.
docToolbarSummary=Eine Leiste für die Controls dieser Library, die trotzdem überall dorthin passt, wo sap.m eine eigene Toolbar erwartet — etwa in den Footer einer Page oder eines Dialogs.
docToolbarOriginal=Eine Leiste, die ihren Inhalt in einer Zeile anordnet. Viele Header- und Footer-Aggregationen in sap.m sind auf sie typisiert.
docToolbarDescription=Toolbar-Container mit einer content-Aggregation. In Standard-Aggregationen verwendbar, etwa im Footer einer Page oder eines Dialogs.
docOverflowToolbarSummary=Eine Toolbar, die alles, was nicht mehr passt, hinter einen Button mit drei Punkten in ein Popover verschiebt — gesteuert über die Prioritäten von sap.m.OverflowToolbarLayoutData.
docOverflowToolbarOriginal=Eine Toolbar, die alles, was nicht mehr passt, hinter einen Button mit drei Punkten in ein Popover verschiebt — gesteuert über die Prioritäten von sap.m.OverflowToolbarLayoutData.
docOverflowToolbarDescription=Wie tc:Toolbar, nur dass Inhalt, der nicht in die verfügbare Breite passt, hinter einen Button mit drei Punkten wandert, der ein Popover mit dem Rest öffnet. Versteht die Prioritäten von sap.m.OverflowToolbarLayoutData.
docStepInputSummary=Ein Zahlenfeld mit Minus- und Plus-Button, die mit ihm gemeinsam skalieren — ein Wert lässt sich damit mit dem Daumen verstellen.
docStepInputOriginal=Ein Zahlenfeld mit Minus- und Plus-Button, mit min, max und step.
docStepInputDescription=Minus-Button, Eingabefeld und Plus-Button, gemeinsam skaliert. Unterstützt min, max und step. Löst change aus.
docBarcodeInputSummary=Ein Eingabefeld, das einen Barcode-Scanner von einem tippenden Menschen unterscheidet und beides als verschiedene Events meldet.
docBarcodeInputDescription=Eingabefeld, das einen Barcode-Scanner von einem tippenden Menschen unterscheidet: Eine Folge von mindestens minLength Zeichen, deren Abstände unter scanTimeout bleiben und die mit Enter abgeschlossen wird, löst scan aus, alles andere change. prefix und suffix werden vom Code abgeschnitten, clearOnScan leert das Feld für den nächsten.
docKeyboardSummary=Eine Bildschirmtastatur mit Buchstaben für Geräte, die keine eigene haben. mode wählt die Belegung eines Landes; eine Handvoll Schalter bestimmt, was sonst noch darauf liegt.
docKeyboardDescription=Bildschirmtastatur mit Buchstaben, gebaut aus den eigenen Buttons der Library. Die Property mode wählt die Belegung eines Landes — Englisch, Deutsch, Französisch, Spanisch, Ukrainisch, Russisch, Hindi —, und eine Handvoll Schalter bestimmt, was sonst noch darauf liegt: displayNumbers legt die Ziffern über die Buchstaben oder hinter eine Taste, showSpecialCharacters ergänzt einen Satz Zeichen, letterCase legt die Tastatur auf Groß- oder Kleinschreibung fest, showCapsLock und showEscape ergänzen je eine Taste. Dazu Eingaben von einer echten Tastatur, ein bindbarer Wert und die Events change / keyPress / enter / escape.
docNumberPadSummary=Ein Bildschirm-Ziffernblock in drei Spalten, für alles, was als Zahl eingegeben wird. mode wählt den Block: den eines Computers, den eines Telefons oder den eines Taschenrechners.
docNumberPadDescription=Bildschirm-Ziffernblock in drei Spalten. Die Property mode wählt den Block — Simple (der Block eines Computers), Phone (der eines Telefons) oder Calculator (mit den vier Grundrechenarten) —, und showDecimalSeparator, decimalSeparator, showSign und showSpecialCharacters ergänzen, was ein Feld über die Ziffern hinaus braucht. Den Umgang mit dem Wert, die Skalierung und das Andocken teilt er sich mit den anderen Tastaturen.
docCustomKeyboardSummary=Die Tastatur, der ihre Tasten Reihe für Reihe übergeben werden. Sie ist die Antwort auf alles, was die fertigen Tastaturen nicht abdecken.
docCustomKeyboardDescription=Bildschirmtastatur, der ihre Tasten übergeben werden: Die Property layout sind die Reihen eines Satzes, die Aggregation layouts trägt so viele Sätze wie nötig, und eine Taste, die den Namen eines Satzes trägt, schaltet zu ihm um. Die Aggregation display bestimmt, was auf einer einzelnen Taste steht. Das ist die Tastatur für alles, was die fertigen nicht abdecken.
docKeyboardBaseSummary=Die Mechanik hinter allen drei Tastaturen. Sie selbst wird nicht in eine View gestellt — was ihr fehlt, ist die Entscheidung, welche Tasten zu zeigen sind, und genau die unterscheidet ihre Unterklassen.
docKeyboardBaseDescription=Basisklasse der Bildschirmtastaturen dieser Library, nativ aus den eigenen Button-Controls gebaut, ohne Fremdabhängigkeit. Alles, was nicht die Auswahl der Tasten betrifft, steckt hier: der Wert und wie eine Taste ihn ändert, die Tastensätze und das Umschalten zwischen ihnen, Umschalt- und Feststelltaste, die Tasten einer echten Tastatur über hardwareKeys, die Größe, die Breite und das Andocken. Auf sie ist die keyboard-Aggregation eines Input und einer TextArea typisiert — deshalb passen Keyboard, NumberPad und CustomKeyboard gleichermaßen hinein.
docSignaturePadSummary=Ein Feld zum Unterschreiben mit Finger oder Stift. Die Unterschrift kommt als PNG-Data-URL heraus und lässt sich damit wie jeder andere Wert an ein Modell binden.
docSignaturePadDescription=Ein Feld zum Unterschreiben mit Finger oder Stift. Zeichnet auf einem Canvas und gibt die Unterschrift als PNG-Data-URL in value heraus, sodass sie sich an ein Modell binden lässt. Strichstärke, Platzhalter und Löschen-Button folgen der size-Property; die Striche überstehen eine Größenänderung. Löst change aus.
docQuickDialogSummary=Fertige Dialoge aus den Touch-Controls, aus dem Controller aufgerufen statt in eine View geschrieben. Jede Methode gibt ein Promise zurück.
docQuickDialogDescription=Hilfsklasse für touch-taugliche Dialoge, aus dem Controller heraus verwendet statt aus einer View: show, confirm, information, error, input, select, details. Jede Methode gibt ein Promise zurück.
docThemeHorizon=Standard-Theme der Demo
docThemeHorizonDark=Dunkle Variante von Horizon
docThemeHorizonHcb=Hoher Kontrast, dunkler Hintergrund
docThemeHorizonHcw=Hoher Kontrast, heller Hintergrund
docThemeFiori3=Früheres Standard-Theme von UI5
docThemeFiori3Dark=Dunkle Variante von Fiori 3
