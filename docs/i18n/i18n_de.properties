# ---------------------------------------------------------------------------
# Getting Started
# ---------------------------------------------------------------------------
gsTitle=Erste Schritte
gsSubtitle=Standard-OpenUI5-Controls, neu gebaut für Touch — plus die, die sap.m fehlen

gsWhatTitle=Worum es geht
gsWhatSubtitle=Warum sap.m allein auf einem Touch-Gerät nicht reicht
gsWhatText1=<code>sap.m</code>-Controls sind für Maus und Tastatur gemacht. Auf einem Tablet, einem Shopfloor-Terminal oder einem Gerät, das mit Handschuhen bedient wird, sind sie schlicht zu klein &mdash; und die Content Density "cozy" bringt Sie nur einen Schritt weiter.
gsWhatText2=Die Library setzt an zwei Punkten an:<ul><li><strong>Sie baut die wichtigsten <code>sap.m</code>-Controls nach</strong>, auf deren ursprünglicher Struktur, und öffnet sie über eine zentrale <code>size</code>-Property (<code>S</code>&ndash;<code>6XL</code>) für die Skalierung, die auf jedem Control gleich funktioniert. Sie müssen Ihre App nicht neu bauen: Die Controls behalten die gewohnten Properties, Aggregationen und Events ihrer Originale und lassen sich als direkter Ersatz einsetzen.</li><li><strong>Sie ergänzt Controls, die es in <code>sap.m</code> überhaupt nicht gibt</strong>, für Situationen, die nur auf Touch-Geräten auftreten &mdash; das Paradebeispiel ist die <code>VirtualKeyboard</code>.</li></ul>

gsSizesTitle=Eine Property, neun Größen
gsSizesSubtitle=S · M (Standard) · L · XL · 2XL · 3XL · 4XL · 5XL · 6XL
gsSizesText=Die Größe skaliert Schriftgröße, Icon-Größe, Padding und Höhe gemeinsam, damit die Controls in jeder Stufe proportional bleiben. Binden Sie <code>size</code> an ein Modell, um die Größe der ganzen App zur Laufzeit umzuschalten.

gsDropInTitle=Direkter Ersatz
gsDropInSubtitle=Namespace ergänzen, tc: vor das Control setzen, eine Größe wählen
gsDropInText=Gleiche Aggregationen, gleiche Properties, gleiche Event-Handler &mdash; <code>press=".onSave"</code> ruft weiterhin dieselbe Methode in Ihrem Controller auf. <code>sap.m</code>-Controls wie <code>ToolbarSpacer</code> können genau dort bleiben, wo sie sind.

gsRequirementsTitle=Voraussetzungen
gsRequirementsStrip=Erforderlich ist UI5 ab Version 1.116 (OpenUI5 oder SAPUI5).
gsRequirementsText=Die Library ist auf npm als <code>ui5.touch.controls</code> veröffentlicht und lässt sich in jeder UI5-Anwendung nutzen, die mit dem UI5 Tooling (ab v3) gebaut wird. Sie bringt ihre eigene <code>ui5.yaml</code> mit, sodass das Tooling sie automatisch als Library-Abhängigkeit auflöst.

gsNextTitle=Wie es weitergeht
gsNextSubtitle=Wohin von hier aus
gsNextText=<ul><li><strong>Setup</strong> &mdash; Paket installieren, Library deklarieren und TypeScript einrichten.</li><li><strong>Dokumentation</strong> &mdash; die vollständige Control-Referenz, die Größenskala, das <code>ISized</code>-Interface und die bekannten Fallstricke.</li><li><strong>Controls</strong> &mdash; eine interaktive Seite je Control, direkt neben dem <code>sap.m</code>-Original.</li></ul>

# ---------------------------------------------------------------------------
# Setup
# ---------------------------------------------------------------------------
setupTitle=Setup
setupSubtitle=Library installieren, in der App deklarieren und TypeScript einrichten

setupPrereqTitle=Voraussetzungen
setupPrereqSubtitle=Was Ihr Projekt vorher braucht
setupPrereqStrip=UI5 ab Version 1.116 (OpenUI5 oder SAPUI5) und UI5 Tooling ab v3.
setupPrereqText=Die Library ist auf npm als <a href="https://www.npmjs.com/package/ui5.touch.controls" target="_blank">ui5.touch.controls</a> veröffentlicht und lässt sich in jeder UI5-Anwendung nutzen, die mit dem <a href="https://sap.github.io/ui5-tooling/" target="_blank">UI5 Tooling</a> gebaut wird.

setupInstallTitle=1. Paket installieren
setupInstallSubtitle=Als reguläre Abhängigkeit, nicht als devDependency
setupInstallText=Installieren Sie die Library als <strong>reguläre Abhängigkeit</strong>, damit das UI5 Tooling sie als Projekt-Abhängigkeit erkennt. Das Paket bringt eine <code>ui5.yaml</code> mit, sodass das Tooling sie automatisch als Library-Abhängigkeit auflöst.

setupMiddlewareTitle=1b. Mit UI5-Middleware (alternatives Setup)
setupMiddlewareSubtitle=Die Library statisch ausliefern, statt sie als Projekt-Abhängigkeit aufzulösen
setupMiddlewareText=Statt die Library als Projekt-Abhängigkeit des UI5 Tooling einzubinden, können Sie sie mit <a href="https://www.npmjs.com/package/ui5-middleware-servestatic" target="_blank">ui5-middleware-servestatic</a> statisch ausliefern.

setupManifestTitle=2. Library in der manifest.json deklarieren
setupManifestSubtitle=Damit die App die Library beim Start lädt

setupNamespaceTitle=3. Namespace in den Views ergänzen
setupNamespaceSubtitle=Das Präfix tc ist nur Konvention — jedes Präfix funktioniert

setupTypeScriptTitle=4. TypeScript-Unterstützung (optional)
setupTypeScriptSubtitle=Vollständige Typisierung ab Werk
setupTypeScriptStrip=Ohne den Eintrag unter "types" lädt das UI5 Tooling die Library nicht automatisch.
setupTypeScriptText=Ergänzen Sie in TypeScript-Projekten das Paket im Eintrag <code>types</code> Ihrer <code>tsconfig.json</code>. Das Paket enthält die Typdefinitionen (<code>dist/index.d.ts</code>).

# ---------------------------------------------------------------------------
# Documentation
# ---------------------------------------------------------------------------
docTitle=Dokumentation
docSubtitle=Control-Referenz, Größenskala, das ISized-Interface und bekannte Fallstricke

docPortedTitle=Touch-Varianten der sap.m-Controls
docPortedSubtitle=Die Spalte "Ersetzt" nennt das sap.m-Control, für das es einspringt
docPortedText=Das sind Nachbauten der Standard-Controls. Sie behalten für die üblichen Fälle die Properties, Aggregationen und Events ihrer Originale und lassen sich damit als direkter Ersatz einsetzen. Klicken Sie ein Control an, um seine interaktive Seite zu öffnen.

docNewTitle=Controls ohne sap.m-Entsprechung
docNewSubtitle=Die gibt es nur in dieser Library
docNewText=Sie decken Situationen ab, die nur auf einem Touch-Gerät auftreten: ein Terminal ohne Hardware-Tastatur, ein Barcode-Scanner statt Tippen, eine Unterschrift auf dem Bildschirm. Klicken Sie ein Control an, um seine interaktive Seite zu öffnen.

docClassesTitle=Klassen
docClassesSubtitle=Werden aus einem Controller heraus benutzt, nicht in eine View gestellt
docClassesText=Nicht alles, was die Library ergänzt, ist ein Control. Diese hier werden aus Controller-Code aufgerufen und bauen ihre Oberfläche selbst aus den Touch-Controls. Klicken Sie eine Klasse an, um ihre interaktive Seite zu öffnen.

docThemesTitle=Theme-Kompatibilität
docThemesSubtitle=Alle Controls bringen für diese Themes eine eigene Theme-Library mit
docThemesText1=Die Controls beziehen Farben, Rahmen und Schatten aus den Theme-Parametern des aktiven Themes und fügen sich so in die umgebenden <code>sap.m</code>-Controls ein. Das Theme setzen Sie wie gewohnt über <code>data-sap-ui-theme</code> im Bootstrap oder zur Laufzeit über <code>Theming.setTheme()</code>.
docThemesText2=Themes, die hier nicht aufgeführt sind, liefert die Library nicht mit. UI5 fällt dann für <code>ui5.touch.controls</code> auf das Base-Theme zurück; die Controls bleiben nutzbar, passen farblich aber nicht zum Rest der Anwendung.

docSizesTitle=Größen
docSizesSubtitle=Jedes Control hat dieselbe size-Property
docSizesText1=Mögliche Werte: <code>S</code> &middot; <code>M</code> (Standard) &middot; <code>L</code> &middot; <code>XL</code> &middot; <code>2XL</code> &middot; <code>3XL</code> &middot; <code>4XL</code> &middot; <code>5XL</code> &middot; <code>6XL</code>
docSizesText2=Die Größe skaliert Schriftgröße, Icon-Größe, Padding und Höhe gemeinsam, damit die Controls in jeder Stufe proportional bleiben. Binden Sie <code>size</code> an ein Modell, um die Größe der ganzen App zur Laufzeit umzuschalten.

docISizedTitle=ISized
docISizedSubtitle=ui5.touch.controls.ISized
docISizedText=Alle Controls mit einer <code>size</code>-Property implementieren das Marker-Interface <code>ui5.touch.controls.ISized</code>. Damit lässt sich die Größe generisch behandeln, etwa um eine Benutzereinstellung auf eine ganze View anzuwenden.

docKeyboardTitle=Neue Controls für Touch — VirtualKeyboard
docKeyboardSubtitle=Es gibt keine sap.m-Entsprechung
docKeyboardText1=Auf einem Shopfloor-Terminal, einem Kiosk oder einem Gerät, das mit Handschuhen bedient wird, gibt es oft keine Hardware-Tastatur, und die Bildschirmtastatur des Betriebssystems ist entweder nicht verfügbar oder verdeckt den halben Bildschirm. OpenUI5 hat dafür kein Control. <code>tc:VirtualKeyboard</code> ist eine Bildschirmtastatur, die aus den Buttons der Library gerendert wird &mdash; ohne Fremdabhängigkeit und über dieselbe <code>size</code>-Property skalierbar wie alles andere.
docKeyboardText2=Das Layout ist einfach eine Liste von Zeilen, sodass ein Ziffernblock, eine vollständige QWERTY-Tastatur oder ein fachspezifischer Tastensatz jeweils nur eine Property sind. <code>&#123;shift&#125;</code>, <code>&#123;space&#125;</code>, <code>&#123;bksp&#125;</code> und <code>&#123;enter&#125;</code> sind die Sondertasten; jede andere Taste fügt ihre eigene Beschriftung in den Wert ein. Mit <code>hardwareKeys="true"</code> nimmt das Control zusätzlich Eingaben von einer echten Tastatur an.

docPitfallTitle=Fallstrick: Aggregationen, die nur sap.m.Button annehmen
docPitfallSubtitle=buttons, beginButton und endButton von sap.m.Dialog
docPitfallStrip=Einige Standard-Aggregationen sind auf sap.m.Button typisiert und weisen einen tc:Button zur Laufzeit ab: "Element ui5.touch.controls.Button#__button0" is not valid for aggregation "buttons".
docPitfallText1=Und diese Button-Plätze sind auch nicht dafür gedacht, vergrößert zu werden &mdash; sie sind auf die Standard-Buttonhöhe ausgelegt.
docPitfallText2=<strong>Der Weg darum herum ist die <code>footer</code>-Aggregation.</strong> Sie ist auf <code>sap.m.Toolbar</code> typisiert (verfügbar ab UI5 1.110), und weil <code>tc:Toolbar</code> und <code>tc:OverflowToolbar</code> von <code>sap.m.Toolbar</code> erben, passen sie direkt hinein. Der Dialog richtet seinen Footer dann an der Toolbar aus, sodass touch-große Buttons sauber gerendert werden. Bevorzugen Sie <code>tc:OverflowToolbar</code>, wenn der Dialog schmal werden kann.
docPitfallText3=Für einfache QuickDialog-artige Dialoge müssen Sie das nicht selbst bauen &mdash; <code>QuickDialog</code> erzeugt seinen Footer bereits auf diese Weise, skaliert über seine <code>size</code>-Option.
docSizesExample=Die Größe binden
docPitfallBrokenTitle=Funktioniert nicht
docPitfallWorksTitle=Funktioniert

# ---------------------------------------------------------------------------
# control pages
# ---------------------------------------------------------------------------
barcodeHint=Es gibt keine <code>sap.m</code>-Entsprechung: Ein Barcode-Scanner im Keyboard-Wedge-Modus tippt den Code innerhalb weniger Millisekunden in das fokussierte Feld und schließt ihn mit <kbd>Enter</kbd> ab. Das Control misst die Zeit zwischen den Tastenanschlägen; ein Scan löst deshalb <code>scan</code> aus, während dieselben Zeichen von Hand getippt <code>change</code> auslösen.
signatureHint=Es gibt keine <code>sap.m</code>-Entsprechung. Das Pad zeichnet auf einem Canvas und gibt das Ergebnis als PNG-Data-URL in <code>value</code> heraus, sodass es an ein Modell gebunden und wie jeder andere Wert ans Backend geschickt werden kann. Strichstärke, Platzhalter und Löschen-Button folgen der <code>size</code>-Property.

overflowPlainHint=Ziehen Sie den Slider nach links: Was nicht mehr passt, wandert hinter den Button mit den drei Punkten. Bei voller Breite gibt es gar keinen Overflow-Button.
overflowPriorityHint="Print" hat die Priorität Low und wandert deshalb zuerst in den Overflow. "Save" hat NeverOverflow und bleibt in der Toolbar, solange überhaupt Platz ist — bei der kleinsten Breite wandert es ebenfalls in das Popover, damit der Overflow-Button erreichbar bleibt. "About" hat AlwaysOverflow und ist immer im Popover — deshalb zeigt diese Toolbar den Button mit den drei Punkten auch dann, wenn reichlich Platz ist.
overflowFooterHint=Machen Sie das Browserfenster schmaler, um den Overflow der Footer-Toolbar zu sehen — das Popover öffnet dann oberhalb der Toolbar.
overflowDialogHint=Die buttons-Aggregation von sap.m.Dialog akzeptiert nur sap.m.Button, der Footer nimmt dagegen jede sap.m.Toolbar — eine Touch-OverflowToolbar passt also direkt hinein. Von den beiden Toolbars ist sie hier die bessere: Ein Dialog ist von Haus aus schmal, und was nicht mehr passt, wandert ins Overflow-Menü, statt abgeschnitten zu werden.
inputKeyboardHint=Mit "Virtuelle Tastatur" öffnet sich die Tastatur aus der Aggregation virtualKeyboard unterhalb des Feldes, solange das Feld den Fokus hat, und schließt sich, sobald der Fokus es verlässt.
textAreaKeyboardHint=Mit "Virtuelle Tastatur" öffnet sich die Tastatur aus der Aggregation virtualKeyboard unterhalb des Feldes, solange das Feld den Fokus hat, und schließt sich, sobald der Fokus es verlässt. Ihre Enter-Taste fügt einen Zeilenumbruch ein, wie Enter es in einem mehrzeiligen Feld tut.
keyboardLayoutsTitle=Die fertigen Modi
keyboardLayoutsSubtitle=Was jeder Wert der Property mode anzeigt
keyboardLayoutsText=Wählen Sie einen Modus, und die Tastatur bringt ihr Layout mit. Nur <code>Custom</code> wertet die Property <code>layout</code> aus &mdash; eine einfache Liste von Reihen: Tasten durch Leerzeichen getrennt, Reihen durch Kommas, Sondertasten in geschweiften Klammern. Klicken Sie einen Modus an, um die Tastatur oben darauf umzustellen.

