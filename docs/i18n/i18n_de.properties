keyboardLayoutsText=<code>mode</code> ist die Tastatur eines Landes, benannt nach der Sprache, für die sie verwendet wird. Die Reihen unten zeigen, was die Belegung mit <code>displayNumbers=&quot;Always&quot;</code> darstellt; was sonst noch auf der Tastatur liegt, entscheiden die Schalter daneben. Klicken Sie eine Belegung an, um die Tastatur oben darauf umzustellen.
