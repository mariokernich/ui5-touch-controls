keyboardLayoutsTitle=Układy
keyboardLayoutsSubtitle=Co pokazuje każda wartość właściwości mode
keyboardLayoutsText=<code>mode</code> to klawiatura danego kraju, nazwana od języka, do którego służy. Wiersze poniżej to to, co pokazuje ten układ przy <code>displayNumbers=&quot;Always&quot;</code>; przełączniki obok decydują, co jeszcze znajdzie się na klawiaturze. Kliknij układ, aby przestawić na niego klawiaturę powyżej.
keyboardSwitchesTitle=Przełączniki
keyboardSwitchesSubtitle=Co każdy z nich dokłada do klawiatury
keyboardSwitchesText=<p><b>displayNumbers</b> decyduje o losie cyfr. <code>Always</code> układa ich rząd nad literami, jak na klawiaturze z klawiszami. <code>Toggle</code> zostawia litery same sobie i chowa cyfry za klawiszem <code>{numbers}</code>, tak jak robi to telefon &mdash; rząd cyfr zwęziłby tam każdy klawisz. <code>ToggleOnMobile</code>, wartość domyślna, to pierwsze na komputerze i tablecie, a drugie na telefonie; które z dwóch, rozstrzyga się raz, na podstawie urządzenia, na którym stronę otwarto. <code>Never</code> pomija cyfry zupełnie.</p><p><b>showSpecialCharacters</b> dokłada zestaw nawiasów, znaków i walut. Tam, gdzie cyfry są za własnym klawiszem, zestaw staje zaraz za nimi, tak jak telefon przechodzi od liter do cyfr, do symboli i z powrotem; w przeciwnym razie prowadzi do niego klawisz <code>{symbols}</code>.</p><p><b>letterCase</b> ustala klawiaturę na jednej wielkości liter. <code>Upper</code> i <code>Lower</code> pomijają klawisz shift i Caps Lock &mdash; nie ma czego przełączać, a właśnie tego chce pole o narzuconej wielkości liter: numer materiału, tablica rejestracyjna, partia. Nieuwzględniane dla hindi, które zamiast wielkich liter ma drugi zestaw znaków.</p><p><b>showEmojis</b> dowiesza zestaw buziek za własnym klawiszem, tak samo jak sięga się po cyfry i znaki specjalne. Są na nim tylko buźki złożone z jednego znaku: taka złożona z kilku &mdash; rodzina, flaga &mdash; zostałaby rozebrana przez backspace.</p><p><b>extraKeys</b> to klawisze stojące obok spacji w każdym zestawie, niezależnie od tego, który jest na ekranie. Tam trafia klawisz, który pole chce mieć pod ręką, a nie za przełącznikiem: <code>extraKeys=&quot;@,.&quot;</code> dla adresu, jednostka dla ilości. Małpa jest też w zestawie znaków specjalnych, o jeden klawisz dalej.</p><p><b>showCapsLock</b> dokłada <code>{lock}</code> obok klawisza shift. Shift odpada po jednej literze, blokada trzyma do ponownego naciśnięcia &mdash; a shift przy włączonej blokadzie pisze małą literą, tak jak na klawiaturze z klawiszami.</p><p><b>showEscape</b> dokłada klawisz <code>{esc}</code> na początku górnego rzędu, tam gdzie ma go klawiatura z klawiszami, w każdym zestawie. Wyzwala <code>escape</code> i nic poza tym; co ma znaczyć, pozostawiono aplikacji.</p><p><b>enterText</b> to napis na klawiszu Enter. Puste zostawia go strzałką, którą jest.</p>
padLayoutsTitle=Bloki cyfr
padLayoutsSubtitle=Co pokazuje każda wartość właściwości mode
padLayoutsText=<code>mode</code> wybiera blok cyfr, a blok zachowuje swój kształt niezależnie od tego, co jeszcze włączysz: minus i separator dziesiętny trafiają do rzędu zera, klawisz do znaków specjalnych i klawisz Esc do rzędu funkcyjnego pod nim. Gdy nie zażądano ani minusa, ani separatora, do rzędu zera trafiają zamiast nich backspace i enter &mdash; zero samo w wierszu byłoby klawiszem szerokim na trzy kolumny. Kliknij tryb, aby przestawić na niego blok powyżej.
customKeysTitle=Zapisywanie układu
customKeysSubtitle=Wiersze, klawisze i te o własnym znaczeniu
customKeysText=Wiersz to ciąg klawiszy rozdzielonych spacjami; w widoku wiersze rozdziela się przecinkami. Wszystko, czego nie ma w tabeli poniżej, pisze samo siebie &mdash; litera, cyfra, całe słowo. Klawisz zapisany jako nazwa jednego z zestawów w agregacji <code>layouts</code> przełącza na ten zestaw, a klawisz nazywający zestaw, na którym już jesteśmy, wyprowadza z niego z powrotem.
colKey=Klawisz
colKeyMeaning=Co robi
keyBksp=usuwa ostatni znak
keyEnter=wyzwala zdarzenie enter
keySpace=pisze spację i jest szerszy od pozostałych klawiszy
