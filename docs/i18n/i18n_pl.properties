# ---------------------------------------------------------------------------
# Pierwsze kroki
# ---------------------------------------------------------------------------
gsTitle=Pierwsze kroki
gsSubtitle=Standardowe kontrolki UI5 przebudowane pod palec — oraz te, których w sap.m brakuje
gsWhatTitle=O co tu chodzi
gsWhatSubtitle=Dlaczego sam sap.m nie wystarcza na urządzeniu dotykowym
gsWhatText1=Kontrolki <code>sap.m</code> powstały z myślą o myszy i klawiaturze. Na tablecie, na terminalu hali produkcyjnej albo na urządzeniu obsługiwanym w rękawicach są po prostu za małe &mdash; a gęstość treści „cozy” pomaga tylko o krok.
gsWhatText2=Biblioteka podchodzi do tego dwutorowo:<ul><li><strong>Przebudowuje najważniejsze kontrolki <code>sap.m</code></strong> na ich oryginalnej strukturze i otwiera je na skalowanie jedną wspólną właściwością <code>size</code> (<code>S</code>&ndash;<code>6XL</code>), która działa tak samo w każdej z nich. Nie trzeba przebudowywać aplikacji: kontrolki zachowują znane właściwości, agregacje i zdarzenia swoich oryginałów, więc podmieniasz je jeden do jednego.</li><li><strong>Dokłada kontrolki, których <code>sap.m</code> w ogóle nie ma</strong>, na sytuacje występujące tylko na urządzeniach dotykowych &mdash; sztandarowym przykładem są klawiatury ekranowe.</li></ul>
gsSizesTitle=Jedna właściwość, dziewięć rozmiarów
gsSizesSubtitle=S · M (domyślny) · L · XL · 2XL · 3XL · 4XL · 5XL · 6XL
gsSizesText=Rozmiar skaluje razem wielkość czcionki, wielkość ikon, wypełnienie i wysokość, więc kontrolki na każdym szczeblu pozostają proporcjonalne. Powiąż <code>size</code> z modelem, aby przełączać rozmiar całej aplikacji w czasie działania.
gsDropInTitle=Zamiennik jeden do jednego
gsDropInSubtitle=Dodaj przestrzeń nazw, postaw tc: przed kontrolką, ustaw rozmiar
gsBeforeTitle=Przed — czysty sap.m
gsAfterTitle=Po — ui5.touch.controls
gsDropInText=Te same agregacje, te same właściwości, te same procedury obsługi zdarzeń &mdash; <code>press=".onSave"</code> nadal wywołuje tę samą metodę w twoim kontrolerze. Kontrolki <code>sap.m</code> takie jak <code>ToolbarSpacer</code> mogą zostać dokładnie tam, gdzie są.
gsRequirementsTitle=Wymagania
gsRequirementsStrip=Wymagany jest UI5 w wersji 1.116 lub nowszej (OpenUI5 albo SAPUI5).
gsRequirementsText=Biblioteka jest publikowana w npm jako <code>ui5.touch.controls</code> i można jej użyć w każdej aplikacji UI5 budowanej za pomocą UI5 Tooling (v3 lub nowszego). Ma własny plik <code>ui5.yaml</code>, więc narzędzia same rozpoznają ją jako zależność bibliotekę.
gsNextTitle=Kolejne kroki
gsNextSubtitle=Gdzie dalej
gsNextText=<ul><li><strong>Instalacja</strong> &mdash; zainstalowanie pakietu, zadeklarowanie biblioteki i przygotowanie TypeScriptu.</li><li><strong>Dokumentacja</strong> &mdash; pełny wykaz kontrolek, skala rozmiarów, interfejs <code>ISized</code> i znane pułapki.</li><li><strong>Kontrolki</strong> &mdash; po jednej interaktywnej stronie na kontrolkę, obok oryginału z <code>sap.m</code>.</li></ul>

# ---------------------------------------------------------------------------
# Instalacja
# ---------------------------------------------------------------------------
setupTitle=Instalacja
setupSubtitle=Zainstaluj bibliotekę, zadeklaruj ją w aplikacji i przygotuj TypeScript
setupPrereqTitle=Wymagania wstępne
setupPrereqSubtitle=Czego potrzebuje projekt, zanim zaczniesz
setupPrereqStrip=UI5 1.116 lub nowszy (OpenUI5 albo SAPUI5) oraz UI5 Tooling v3 lub nowszy.
setupPrereqText=Biblioteka jest publikowana w npm jako <a href="https://www.npmjs.com/package/ui5.touch.controls" target="_blank">ui5.touch.controls</a> i można jej użyć w każdej aplikacji UI5 budowanej za pomocą <a href="https://sap.github.io/ui5-tooling/" target="_blank">UI5 Tooling</a>.
setupInstallTitle=1. Zainstaluj pakiet
setupInstallSubtitle=Jako zwykłą zależność, nie jako devDependency
setupInstallText=Zainstaluj bibliotekę jako <strong>zwykłą zależność</strong>, aby UI5 Tooling rozpoznał ją jako zależność projektu. Pakiet zawiera plik <code>ui5.yaml</code>, więc narzędzia same rozpoznają ją jako zależność bibliotekę.
setupMiddlewareTitle=1b. Z warstwą pośredniczącą UI5 (wariant alternatywny)
setupMiddlewareSubtitle=Serwowanie biblioteki jako plików statycznych zamiast rozwiązywania jej jako zależności projektu
setupMiddlewareText=Zamiast używać biblioteki jako zależności projektu UI5 Tooling, możesz serwować ją jako pliki statyczne za pomocą <a href="https://www.npmjs.com/package/ui5-middleware-servestatic" target="_blank">ui5-middleware-servestatic</a>.
setupManifestTitle=2. Zadeklaruj bibliotekę w manifest.json
setupManifestSubtitle=Aby aplikacja wczytała ją przy starcie
setupNamespaceTitle=3. Dodaj przestrzeń nazw do swoich widoków
setupNamespaceSubtitle=Przedrostek tc to tylko konwencja — sprawdzi się dowolny
setupTypeScriptTitle=4. Obsługa TypeScriptu (opcjonalnie)
setupTypeScriptSubtitle=Pełne typowanie od razu po instalacji
setupTypeScriptStrip=Bez wpisu „types” UI5 Tooling nie wczyta biblioteki automatycznie.
setupTypeScriptText=W projektach TypeScript dodaj pakiet do wpisu <code>types</code> w pliku <code>tsconfig.json</code>. Pakiet zawiera definicje typów (<code>dist/index.d.ts</code>).

# ---------------------------------------------------------------------------
# Dokumentacja
# ---------------------------------------------------------------------------
docTitle=Dokumentacja
docSubtitle=Wykaz kontrolek, skala rozmiarów, interfejs ISized i znane pułapki
docPortedTitle=Dotykowe wersje kontrolek sap.m
docPortedSubtitle=Kolumna „Zastępuje” wskazuje kontrolkę sap.m, w której miejsce wchodzi każda z nich
docPortedText=To przebudowane kontrolki standardowe. W typowych zastosowaniach zachowują właściwości, agregacje i zdarzenia swoich oryginałów, więc podmieniasz je jeden do jednego. Kliknij kontrolkę, aby otworzyć jej interaktywną stronę.
docNewTitle=Kontrolki dodatkowe pod dotyk
docNewSubtitle=Istnieją wyłącznie w tej bibliotece
docNewText=Obsługują sytuacje występujące tylko na urządzeniu dotykowym: terminal bez fizycznej klawiatury, czytnik kodów kreskowych zamiast pisania, podpis na ekranie. Kliknij kontrolkę, aby otworzyć jej interaktywną stronę.
docClassesTitle=Klasy
docClassesSubtitle=Używane z poziomu kontrolera, nie umieszczane w widoku
docClassesText=Nie wszystko, co dokłada biblioteka, jest kontrolką. Te klasy wywołuje się z kodu kontrolera, a interfejs budują same, z kontrolek dotykowych. Kliknij klasę, aby otworzyć jej interaktywną stronę.
docThemesTitle=Obsługiwane motywy
docThemesSubtitle=Wszystkie kontrolki mają własną bibliotekę motywów dla tych właśnie motywów
docThemesText1=Kontrolki biorą kolory, obramowania i cienie z parametrów aktywnego motywu, więc wtapiają się w otaczające je kontrolki <code>sap.m</code>. Motyw ustaw jak zwykle: przez <code>data-sap-ui-theme</code> w bootstrapie albo w czasie działania przez <code>Theming.setTheme()</code>.
docThemesText2=Motywy, których tu nie ma, nie są dostarczane z biblioteką. UI5 sięga wtedy po motyw bazowy dla <code>ui5.touch.controls</code>: kontrolki pozostają używalne, ale nie będą pasować kolorystycznie do reszty aplikacji.
docSizesTitle=Rozmiary
docSizesSubtitle=Każda kontrolka ma tę samą właściwość size
docSizesText1=Dostępne wartości: <code>S</code> &middot; <code>M</code> (domyślny) &middot; <code>L</code> &middot; <code>XL</code> &middot; <code>2XL</code> &middot; <code>3XL</code> &middot; <code>4XL</code> &middot; <code>5XL</code> &middot; <code>6XL</code>
docSizesText2=Rozmiar skaluje razem wielkość czcionki, wielkość ikon, wypełnienie i wysokość, więc kontrolki na każdym szczeblu pozostają proporcjonalne. Powiąż <code>size</code> z modelem, aby przełączać rozmiar całej aplikacji w czasie działania.
docISizedTitle=ISized
docISizedSubtitle=ui5.touch.controls.ISized
docISizedText=Wszystkie kontrolki z właściwością <code>size</code> noszą interfejs znacznikowy <code>ui5.touch.controls.ISized</code>. Pozwala on obsłużyć rozmiar w sposób ogólny, na przykład zastosować ustawienie użytkownika do całego widoku.
docKeyboardTitle=Klawiatury
docKeyboardSubtitle=sap.m nie ma odpowiednika
docKeyboardText1=Na terminalu hali produkcyjnej, w kiosku albo na urządzeniu obsługiwanym w rękawicach często nie ma fizycznej klawiatury, a klawiatura ekranowa systemu jest albo niedostępna, albo zasłania pół ekranu. UI5 nie ma na to żadnej kontrolki. Biblioteka daje trzy klawiatury ekranowe zbudowane z jej własnych przycisków &mdash; bez zależności zewnętrznych i skalowane tą samą właściwością <code>size</code> co wszystko inne.
docKeyboardText2=<code>tc:Keyboard</code> to klawiatura liter: <code>mode</code> to układ danego kraju, a garść przełączników decyduje, czy cyfry stoją nad literami czy za klawiszem, czy są znaki specjalne i jaką wielkością liter pisze. <code>tc:NumberPad</code> to ten sam pomysł dla pola cyfr. <code>tc:CustomKeyboard</code> dostaje swoje klawisze wiersz po wierszu, na wszystko, czego pozostałe dwie nie obejmują: <code>&#123;shift&#125;</code>, <code>&#123;space&#125;</code>, <code>&#123;bksp&#125;</code> i <code>&#123;enter&#125;</code> to klawisze specjalne, każdy inny klawisz pisze własny napis. Wszystkie trzy przyjmują klawisze prawdziwej klawiatury przez <code>hardwareKeys="true"</code>, dokują do dolnej krawędzi ekranu przez <code>docked</code> i mieszczą się w agregacji <code>keyboard</code> pola.
docPitfallTitle=Pułapka: agregacje przyjmujące wyłącznie sap.m.Button
docPitfallSubtitle=buttons, beginButton i endButton w sap.m.Dialog
docPitfallStrip=Niektóre agregacje standardowe są typowane na sap.m.Button i w czasie działania odrzucają tc:Button: "Element ui5.touch.controls.Button#__button0" is not valid for aggregation "buttons".
docPitfallText1=Te miejsca na przyciski i tak nie są przewidziane na zmianę rozmiaru &mdash; są rozplanowane pod standardową wysokość przycisku.
docPitfallText2=<strong>Wyjściem jest agregacja <code>footer</code>.</strong> Jest typowana na <code>sap.m.Toolbar</code> (dostępna od UI5 1.110), a ponieważ <code>tc:Toolbar</code> i <code>tc:OverflowToolbar</code> dziedziczą po <code>sap.m.Toolbar</code>, wchodzą tam wprost. Okno dopasowuje wtedy wysokość stopki do paska narzędzi, więc przyciski w rozmiarze dotykowym rysują się poprawnie. Gdy okno może się zwęzić, wybieraj <code>tc:OverflowToolbar</code>.
docPitfallText3=Dla zwykłych okien w stylu MessageBox nie musisz tego budować sam &mdash; <code>QuickDialog</code> składa swoją stopkę właśnie tak, w rozmiarze podanym w opcji <code>size</code>.
docSizesExample=Powiązanie rozmiaru
docPitfallBrokenTitle=Nie działa
docPitfallWorksTitle=Działa

# ---------------------------------------------------------------------------
# strony kontrolek
# ---------------------------------------------------------------------------
barcodeHint=<code>sap.m</code> nie ma odpowiednika: w trybie „keyboard wedge” czytnik kodów kreskowych wpisuje kod do pola z fokusem w kilka milisekund i kończy go klawiszem <kbd>Enter</kbd>. Kontrolka mierzy czas między naciśnięciami, więc skan wyzwala <code>scan</code>, a te same znaki wpisane ręcznie wyzwalają <code>change</code>.
signatureHint=<code>sap.m</code> nie ma odpowiednika. Pole rysuje na płótnie i oddaje wynik jako adres URL danych PNG we właściwości <code>value</code>, więc można je powiązać z modelem i wysłać do zaplecza jak każdą inną wartość. Grubość kreski, tekst zastępczy i przycisk czyszczenia idą za właściwością <code>size</code>.
overflowPlainHint=Przesuń suwak w lewo: treść, która przestaje się mieścić, przenosi się za przycisk z trzema kropkami. Przy pełnej szerokości przycisku przepełnienia nie ma w ogóle.
overflowPriorityHint=„Drukuj” ma priorytet Low i dlatego przepełnia się jako pierwszy. „Zapisz” ma NeverOverflow i zostaje na pasku tak długo, jak jest choć trochę miejsca — przy najmniejszej szerokości również przenosi się do wyskakującego okienka, żeby przycisk przepełnienia pozostał osiągalny. „O programie” ma AlwaysOverflow i zawsze jest w okienku — dlatego ten pasek pokazuje przycisk z trzema kropkami nawet wtedy, gdy miejsca jest w bród.
overflowFooterHint=Zwęź okno przeglądarki, aby zobaczyć przepełnienie paska w stopce — okienko otwiera się wtedy nad paskiem.
overflowDialogHint=Agregacja buttons w sap.m.Dialog przyjmuje wyłącznie sap.m.Button, ale stopka przyjmuje dowolny sap.m.Toolbar — dotykowy OverflowToolbar wchodzi tam więc wprost. To lepszy z dwóch pasków w tym miejscu: okno dialogowe z natury jest wąskie, a to, co się nie mieści, przenosi się do menu przepełnienia zamiast zostać ucięte.
inputKeyboardHint=Przy włączonej „Klawiaturze wirtualnej” klawiatura z agregacji keyboard otwiera się pod polem, dopóki pole ma fokus, i zamyka się, gdy tylko go straci.
textAreaKeyboardHint=Przy włączonej „Klawiaturze wirtualnej” klawiatura z agregacji keyboard otwiera się pod polem, dopóki pole ma fokus, i zamyka się, gdy tylko go straci. Jej klawisz Enter wstawia złamanie wiersza, tak jak Enter w polu wielowierszowym.

