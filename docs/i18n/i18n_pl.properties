kbIntroSubtitle=Klawiatura liter, powiedziana w jednej linijce
kbIntroText=<p>Na terminalu hali produkcyjnej, w kiosku albo na urządzeniu obsługiwanym w rękawicach często nie ma fizycznej klawiatury, a klawiatura ekranowa systemu jest albo niedostępna, albo zasłania pół ekranu. <code>tc:Keyboard</code> to odpowiedź dla pola tekstowego: <code>mode</code> to układ danego kraju, a garść przełączników mówi, co jeszcze się na niej znajdzie. Nie trzeba wypisywać żadnego układu.</p><p>To jedna z trzech klawiatur, a wspólne mają wszystko, co nie dotyczy klawiszy: wartość, <code>size</code>, <code>docked</code>, klawisze prawdziwej klawiatury przez <code>hardwareKeys</code> oraz zdarzenia <code>change</code>, <code>keyPress</code>, <code>enter</code> i <code>escape</code>. Po <code>tc:NumberPad</code> sięgnij tam, gdzie pole przyjmuje cyfry, a po <code>tc:CustomKeyboard</code> tam, gdzie klawisze piszesz sam. Wszystkie trzy mieszczą się w agregacji <code>keyboard</code> kontrolki <code>tc:Input</code> albo <code>tc:TextArea</code>.</p>
padIntroSubtitle=Blok cyfr, powiedziany w jednej linijce
padIntroText=<p>Ilość, liczba sztuk, kod, cena &mdash; pola na terminalu częściej są cyframi niż literami, a blok o trzech kolumnach to coś, co kciuk odnajduje bez patrzenia. <code>tc:NumberPad</code> to właśnie ten blok: <code>mode</code> wybiera układ cyfr, a przełączniki obok dokładają to, czego pole potrzebuje ponadto.</p><p>To jedna z trzech klawiatur, a wspólne mają wszystko, co nie dotyczy klawiszy: wartość, <code>size</code>, <code>docked</code>, klawisze prawdziwej klawiatury przez <code>hardwareKeys</code> oraz zdarzenia <code>change</code>, <code>keyPress</code>, <code>enter</code> i <code>escape</code>. Po <code>tc:Keyboard</code> sięgnij tam, gdzie pole przyjmuje tekst, a po <code>tc:CustomKeyboard</code> tam, gdzie klawisze piszesz sam.</p>
customIntroSubtitle=Klawisze podaje się jej wiersz po wierszu
customIntroText=<p><code>tc:CustomKeyboard</code> to klawiatura na wszystko, czego gotowe nie obejmują: rozmiary sprzedawane w sklepie, litery dopuszczalne na tablicy rejestracyjnej, klawisze maszyny. Właściwość <code>layout</code> to wiersze jednego zestawu; agregacja <code>layouts</code> niesie tyle zestawów, ile trzeba, a klawisz zapisany jako nazwa zestawu przełącza na niego. Agregacja <code>display</code> mówi, co pisze pojedynczy klawisz.</p><p>To jedna z trzech klawiatur, a wspólne mają wszystko, co nie dotyczy klawiszy: wartość, <code>size</code>, <code>docked</code>, klawisze prawdziwej klawiatury przez <code>hardwareKeys</code> oraz zdarzenia <code>change</code>, <code>keyPress</code>, <code>enter</code> i <code>escape</code>. Tam, gdzie potrzebna jest klawiatura liter albo blok cyfr, <code>tc:Keyboard</code> i <code>tc:NumberPad</code> mówią to samo w jednej linijce.</p>
colProperty=Właściwość
colDefault=Domyślnie
baseNote=tc:KeyboardBase to klasa bazowa i nigdy nie umieszcza się jej w widoku. Użyj tc:Keyboard, tc:NumberPad albo tc:CustomKeyboard; ta strona opisuje to, co wspólne dla całej trójki.
baseIntroSubtitle=Co łączy trzy klawiatury
baseIntroText=<p>Trzy klawiatury tej biblioteki różnią się tylko jednym: skąd biorą się klawisze. <code>tc:Keyboard</code> buduje je z języka i garści przełączników, <code>tc:NumberPad</code> z bloku cyfr, a <code>tc:CustomKeyboard</code> dostaje je wiersz po wierszu. Cała reszta to ta klasa i we wszystkich trzech działa tak samo.</p><p>To wartość i sposób, w jaki zmienia ją klawisz, zestawy klawiszy i przechodzenie między nimi, shift i Caps Lock, klawisze prawdziwej klawiatury, rozmiar, szerokość i dokowanie. Same klawisze to kontrolki <code>tc:Button</code> z tej biblioteki &mdash; nie stoi za nimi żadna obca klawiatura, a ta sama właściwość <code>size</code>, która skaluje wszystko inne, skaluje również je.</p><p>To także typ, na który typowana jest agregacja <code>keyboard</code> kontrolek <code>tc:Input</code> i <code>tc:TextArea</code>, i dlatego każda z trzech pasuje na pole.</p>
basePropsTitle=Co mają wspólne
basePropsSubtitle=Właściwości, które ma każda klawiatura tej biblioteki
basePropsText=Obok nich każda z trójki ma właściwości tworzące jej własne klawisze &mdash; <code>mode</code> i przełączniki w <code>tc:Keyboard</code> oraz <code>tc:NumberPad</code>, <code>layout</code> i <code>layouts</code> w <code>tc:CustomKeyboard</code>.
baseEventsTitle=Zdarzenia
baseEventsSubtitle=Wyzwalane przez każdą klawiaturę tej biblioteki
baseKeysTitle=Klawisze o własnym znaczeniu
baseKeysSubtitle=Rozumiane przez wszystkie trzy klawiatury
baseKeysText=Wiersz to ciąg klawiszy rozdzielonych spacjami, a klawisz w nawiasach klamrowych to jeden z poniższych. Obsługiwane są tutaj, więc na wszystkich trzech klawiaturach znaczą to samo; klawiatura decyduje jedynie, czy je pokazać.
baseSubclassesTitle=Trzy klawiatury
baseSubclassesSubtitle=Po którą sięgnąć
baseHowTitle=Słowo o geometrii
baseHowText=<p>Choćby miejsca było jak na lekarstwo, klawiatury nigdy nie trzeba przewijać w bok: klawisz chciałby być tak szeroki, jak jest wysoki, i rezygnuje z tej szerokości, gdy robi się ciasno. Wysokość bierze z <code>size</code> i pozostaje bez zmian.</p><p>Przy <code>docked</code> klawiatura opuszcza przepływ strony i staje przy dolnej krawędzi ekranu, nad treścią, tak jak klawiatura ekranowa telefonu. Na telefonie albo tablecie zajmuje wtedy całą szerokość ekranu, a <code>width</code> nie jest brane pod uwagę. Klawiatura na polu dokuje się tak samo, tyle że jej wyskakujące okienko umieszcza ją w obszarze statycznym: zasłania więc także modalne okno dialogowe &mdash; i to właśnie sprawia, że w polu wewnątrz okna da się pisać.</p>
propValue=Bieżąca wartość wprowadzona na klawiaturze.
propEmphasizedKeys=Klawisze rysowane jako wyróżnione, zapisane tak, jak stoją w układzie — klamry klawisza specjalnego są opcjonalne. Modyfikator jest wyróżniony, dopóki jest włączony, niezależnie od tego, co tu podano.
propMaxLength=Maksymalna liczba znaków. 0 oznacza bez ograniczenia.
propEnabled=Czy klawiatury można w ogóle używać.
propHardwareKeys=Czy przyjmowane jest wprowadzanie z prawdziwej klawiatury, dopóki klawiatura ma fokus. Brane są tylko klawisze należące do układu; Enter i Backspace są obsługiwane zawsze.
propSize=Rozmiar dotykowy każdego klawisza. Cała geometria idzie za nim.
propWidth=Szerokość klawiatury. Nie jest brana pod uwagę dla zadokowanej klawiatury na telefonie albo tablecie.
propDocked=Czy klawiatura stoi przy dolnej krawędzi ekranu, nad treścią, zamiast w przepływie strony.
evtChange=Wyzwalane za każdym razem, gdy wartość się zmienia — klawisz, backspace, cokolwiek nią poruszy.
evtKeyPress=Wyzwalane przy każdym naciśniętym klawiszu, z klawiszem w postaci, w jakiej stoi w układzie.
evtEnter=Wyzwalane po naciśnięciu klawisza Enter, z bieżącą wartością.
evtEscape=Wyzwalane po naciśnięciu klawisza Esc. Sama klawiatura nic z tym nie robi; pole, które ją pokazuje, zamyka na to swoje okienko.
subKeyboard=Pole tekstowe: układ danego kraju, powiedziany w jednej linijce.
subNumberPad=Pole cyfr: blok o trzech kolumnach, w układzie komputera, telefonu albo kalkulatora.
subCustomKeyboard=Cała reszta: klawisze wypisuje się wiersz po wierszu, w tylu zestawach, ile trzeba.
colType=Typ
colParameters=Parametry
exampleBaseField=Dowolna z trzech na polu (widok XML)

