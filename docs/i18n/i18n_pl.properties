docButtonSummary=Przycisk, którego cała geometria idzie za jedną właściwością size, więc pole, w które musi trafić palec, rośnie razem z nią. Cała reszta — tekst, ikona, typ i press — czyta się jak w sap.m.Button.
docButtonOriginal=Standardowy przycisk sap.m: tekst, ikona, położenie ikony, typ przycisku i zdarzenie press. Wysokość ma taką, jaką narzuca motyw, i nie zmienia jej.
docButtonDescription=Przycisk z konfigurowalnym rozmiarem, ikoną, położeniem ikony, typem (wszystkie wartości sap.m.ButtonType), wypełnieniem bocznym i szerokością. Wyzwala press.
docSegmentedButtonSummary=Rząd stykających się przycisków, z których dokładnie jeden jest wybrany, wymiarowany tak, aby w każdy segment dało się trafić palcem.
docSegmentedButtonOriginal=Rząd stykających się przycisków, z których dokładnie jeden jest wybrany, wypełniany przez sap.m.SegmentedButtonItem. Wyzwala selectionChange.
docSegmentedButtonDescription=Rząd stykających się przycisków, z których dokładnie jeden jest wybrany, wypełniany przez tc:SegmentedButtonItem (key, text, icon, enabled). Obsługuje selectedKey, width dla równo rozłożonych segmentów i wyzwala selectionChange.
docCheckBoxSummary=Pole wyboru, w którym kwadrat, znacznik, etykieta i pole dotyku skalują się razem, zamiast trzymać się rozmiaru narzuconego przez motyw.
docCheckBoxOriginal=Standardowe pole wyboru sap.m, z etykietą, zaznaczeniem trójstanowym i stanami wartości. Kwadrat i pole dotyku mają rozmiar narzucony przez motyw.
docCheckBoxDescription=Pole wyboru, w którym kwadrat, znacznik, etykieta i pole dotyku skalują się razem — przy rozmiarze M geometria odpowiada sap.m.CheckBox. Obsługuje selected, partiallySelected, text, editable, wrapping, stany wartości i width. Wyzwala select.
docRadioButtonSummary=Przycisk opcji skalujący się swoją właściwością size oraz kontrolka grupy, która układa ich zestaw w kolumnach i przekazuje im swoje ustawienia.
docRadioButtonOriginal=Przycisk opcji wykluczający się z pozostałymi o tym samym groupName oraz kontrolka grupy, która układa ich zestaw w kolumnach.
docRadioButtonDescription=Okrąg, punkt, etykieta i pole dotyku skalują się razem — przy rozmiarze M geometria odpowiada sap.m.RadioButton. Przyciski o wspólnym groupName wykluczają się wzajemnie; tc:RadioButtonGroup układa je w kolumnach i przekazuje im swoje size, enabled, editable oraz stan wartości. Wyzwala select.
docSwitchSummary=Przełącznik wł./wył. rosnący ze swoją właściwością size, podczas gdy sap.m.Switch jest przybity do 4rem na 2rem.
docSwitchOriginal=Przełącznik wł./wył. o stałym rozmiarze, z wariantem akceptuj/odrzuć i własnymi tekstami dla obu stanów.
docSwitchDescription=Tor, suwak i etykieta skalują się razem, podczas gdy sap.m.Switch jest przybity do 4rem x 2rem. Obsługuje state, customTextOn, customTextOff oraz typ AcceptReject; kolory pochodzą z parametrów motywu @sapButton_Track_* / @sapButton_Handle_*. Wyzwala change.
docSelectSummary=Lista rozwijana, która otwiera się w wierszach tak wysokich jak samo pole, więc pozycję da się wybrać palcem.
docSelectOriginal=Lista rozwijana wypełniana elementami sap.ui.core.Item. Lista, którą otwiera, trzyma standardową wysokość wiersza, niezależnie od tego, jak duże jest pole.
docSelectDescription=Lista rozwijana wypełniana zwykłymi elementami sap.ui.core.Item. Lista otwiera się w wyskakującym okienku, którego wiersze są tak wysokie jak pole, więc da się w nie trafić palcem — natywna lista sap.m.Select trzyma standardową wysokość wiersza, niezależnie od wielkości pola. Obsługuje selectedKey, editable, forceSelection, stany wartości i width. Na telefonie lista zajmuje cały ekran, tak jak w sap.m. Wyzwala change.
docComboBoxSummary=Select, w którym można pisać: dozwolony jest dowolny tekst, wpisywana treść filtruje listę, a wiersze są tak wysokie jak pole.
docComboBoxOriginal=Lista rozwijana, w której można też pisać: wpisywana treść filtruje listę, a wartość spoza listy jest dozwolona.
docComboBoxDescription=Select, w którym można pisać: dozwolony jest dowolny tekst, a wpisywana treść filtruje listę, której wiersze są tak wysokie jak pole. Współpracuje z klawiaturami tej biblioteki na urządzeniu, które własnej nie ma. Obsługuje value, selectedKey, placeholder, editable, stany wartości, width oraz showSecondaryValues, które umieszcza additionalText elementu sap.ui.core.ListItem na końcu wiersza. Na telefonie lista zajmuje cały ekran i przynosi własne pole do dalszego pisania, tak jak w sap.m. Wyzwala change i selectionChange.
docDatePickerSummary=Pole daty, którego kalendarz zbudowano z przycisków tej biblioteki, więc dzień to kwadrat rosnący z właściwością size.
docDatePickerOriginal=Pole z wyskakującym kalendarzem opartym na sap.ui.unified.Calendar, z minDate/maxDate oraz konfigurowalnymi formatami wartości i wyświetlania.
docDatePickerDescription=Pole z kalendarzem zbudowanym z własnych przycisków biblioteki, więc dzień to kwadrat rosnący z właściwością size zamiast sztywnej siatki sap.ui.unified.Calendar. Widok dni i miesięcy, minDate/maxDate, valueFormat i displayFormat (styl albo wzorzec). Wyzwala change z value, dateValue i valid.
docTimePickerSummary=Pole godziny wypełniane jednym stuknięciem w godzinę i jednym w minutę, zamiast suwaka, który trzeba przeciągać.
docTimePickerOriginal=Pole z wyskakującym okienkiem, w którym godziny i minuty ustawia się suwakami wymagającymi przeciągania.
docTimePickerDescription=Pole z dwiema kolumnami przycisków — godziny i minuty — więc godzinę wybiera się jednym stuknięciem w cel rosnący z size, podczas gdy sap.m.TimePicker używa suwaka wymagającego przeciągania. Obsługuje minutesStep, valueFormat i displayFormat. Wyzwala change raz, przy zamknięciu okienka.
docInputSummary=Pole wprowadzania jednowierszowego skalujące się swoją właściwością size, które może przynieść ze sobą klawiaturę tej biblioteki — dla urządzenia, które własnej nie ma.
docInputOriginal=Standardowe jednowierszowe pole wprowadzania sap.m, z tekstem zastępczym, maksymalną długością, stanami wartości i podpowiedziami.
docInputDescription=Jednowierszowe pole wprowadzania z konfigurowalnym rozmiarem. W jego agregacji keyboard można umieścić klawiaturę tej biblioteki — tc:Keyboard, tc:NumberPad albo tc:CustomKeyboard; przy showKeyboard otwiera się ona wtedy w wyskakującym okienku pod polem, dopóki pole ma fokus, i pisze do niego.
docTextAreaSummary=Pole wprowadzania wielowierszowego skalujące się swoją właściwością size, przyjmujące klawiaturę tej biblioteki, której klawisz Enter wstawia tu złamanie wiersza.
docTextAreaOriginal=Standardowe wielowierszowe pole wprowadzania sap.m, z liczbą wierszy, maksymalną długością i stanami wartości.
docTextAreaDescription=Pole wielowierszowe z konfigurowalnym rozmiarem, liczbą wierszy, maksymalną długością i stanami wartości. Przyjmuje klawiaturę w agregacji keyboard tak samo jak Input; tam klawisz Enter wstawia złamanie wiersza. Wyzwala change / liveChange.
docTextSummary=Tekst, którego wielkość czcionki idzie za tą samą właściwością size co każda inna kontrolka biblioteki, więc etykieta stoi w skali sąsiedniego pola.
docTextOriginal=Kontrolka tekstu z zawijaniem i maksymalną liczbą wierszy.
docTextDescription=Tekst z konfigurowalnym rozmiarem i kolorem. Wyzwala press.
docLinkSummary=Odnośnik, którego napis — a wraz z nim pole, w które da się trafić palcem — rośnie z właściwością size.
docLinkOriginal=Odnośnik z href i target oraz warianty stonowany i wyróżniony.
docLinkDescription=Odnośnik z konfigurowalnym rozmiarem, więc pole, w które da się trafić palcem, rośnie razem z napisem. Obsługuje href, target, wrapping, subtle, emphasized i width; odnośnik z target="_blank" automatycznie dostaje rel="noopener noreferrer". Wyzwala press.
docToolbarSummary=Pasek na kontrolki tej biblioteki, który mimo to mieści się wszędzie tam, gdzie sap.m spodziewa się własnego paska — na przykład w stopce Page albo Dialog.
docToolbarOriginal=Pasek układający swoją treść w rzędzie. Wiele agregacji nagłówka i stopki w sap.m jest na niego typowanych.
docToolbarDescription=Kontener paska narzędzi z agregacją content. Do użycia w standardowych agregacjach, takich jak stopka Page albo Dialog.
docOverflowToolbarSummary=Toolbar przenoszący to, co się nie mieści, do wyskakującego okienka za przyciskiem z trzema kropkami, sterowany priorytetami sap.m.OverflowToolbarLayoutData.
docOverflowToolbarOriginal=Toolbar przenoszący to, co się nie mieści, do wyskakującego okienka za przyciskiem z trzema kropkami, sterowany priorytetami sap.m.OverflowToolbarLayoutData.
docOverflowToolbarDescription=Jak tc:Toolbar, ale treść, która nie mieści się w dostępnej szerokości, przenosi się za przycisk z trzema kropkami, otwierający okienko z resztą. Rozumie priorytety sap.m.OverflowToolbarLayoutData.
docStepInputSummary=Pole liczbowe z przyciskiem minus i plus wymiarowanymi razem z nim, więc wartość da się przestawiać kciukiem.
docStepInputOriginal=Pole liczbowe z przyciskiem minus i plus, z min, max i krokiem.
docStepInputDescription=Przycisk minus, pole wprowadzania i przycisk plus, wymiarowane razem. Obsługuje min, max, step. Wyzwala change.
docBarcodeInputSummary=Pole wprowadzania, które odróżnia czytnik kodów kreskowych od piszącego człowieka i zgłasza jedno i drugie jako osobne zdarzenia.
docBarcodeInputDescription=Pole wprowadzania odróżniające czytnik kodów kreskowych od piszącego człowieka: ciąg co najmniej minLength znaków, w którym przerwy nie przekraczają scanTimeout i który kończy się klawiszem Enter, wyzwala scan, wszystko inne wyzwala change. prefix i suffix są odcinane od kodu, clearOnScan opróżnia pole na następny.
docKeyboardSummary=Ekranowa klawiatura liter dla urządzenia, które własnej nie ma. mode wybiera układ danego kraju; garść przełączników mówi, co jeszcze się na niej znajdzie.
docKeyboardDescription=Ekranowa klawiatura liter, zbudowana z własnych przycisków biblioteki. Właściwość mode wybiera układ danego kraju — angielski, niemiecki, francuski, hiszpański, ukraiński, rosyjski, hindi — a garść przełączników mówi, co jeszcze się na niej znajdzie: displayNumbers umieszcza cyfry nad literami albo za klawiszem, showSpecialCharacters dokłada zestaw znaków, letterCase ustala klawiaturę na wielkich albo małych literach, showCapsLock i showEscape dokładają po klawiszu. Opcjonalne wprowadzanie z klawiatury fizycznej, powiązanie wartości oraz zdarzenia change / keyPress / enter / escape.
docNumberPadSummary=Ekranowy blok cyfr w trzech kolumnach, na wszystko, co wpisuje się jako liczbę. mode wybiera układ: blok komputerowy, telefoniczny albo kalkulator.
docNumberPadDescription=Ekranowy blok cyfr w trzech kolumnach. Właściwość mode wybiera układ — Simple (blok komputera), Phone (blok telefonu) albo Calculator (z czterema działaniami) — a showDecimalSeparator, decimalSeparator, showSign i showSpecialCharacters dokładają to, czego pole potrzebuje poza cyframi. Obsługę wartości, skalowanie i dokowanie dzieli z pozostałymi klawiaturami.
docCustomKeyboardSummary=Klawiatura, której klawisze podaje się wiersz po wierszu. To odpowiedź na wszystko, czego gotowe klawiatury nie obejmują.
docCustomKeyboardDescription=Klawiatura ekranowa, której klawisze się podaje: właściwość layout to wiersze jednego zestawu, agregacja layouts niesie tyle zestawów, ile trzeba, a klawisz zapisany jako nazwa zestawu przełącza na niego. Agregacja display mówi, co pisze pojedynczy klawisz. To klawiatura na wszystko, czego gotowe nie obejmują.
docKeyboardBaseSummary=Maszyneria stojąca za wszystkimi trzema klawiaturami. Sama nie trafia do widoku — nie wie jednego: jakie klawisze pokazać, a to właśnie odróżnia jej podklasy.
docKeyboardBaseDescription=Klasa bazowa klawiatur ekranowych tej biblioteki, zbudowana natywnie z jej własnych kontrolek Button, bez zależności zewnętrznych. Wszystko, co nie dotyczy doboru klawiszy, mieszka tutaj: wartość i sposób, w jaki zmienia ją klawisz, zestawy klawiszy i przechodzenie między nimi, shift i Caps Lock, klawisze prawdziwej klawiatury przez hardwareKeys, rozmiar, szerokość i dokowanie. To typ, na który typowana jest agregacja keyboard kontrolek Input i TextArea, więc mieszczą się w niej zarówno Keyboard, jak NumberPad i CustomKeyboard.
docSignaturePadSummary=Pole do podpisu palcem albo rysikiem. Podpis wychodzi jako adres URL danych PNG, więc da się go powiązać z modelem jak każdą inną wartość.
docSignaturePadDescription=Pole do podpisu palcem albo rysikiem. Rysuje na płótnie i oddaje podpis jako adres URL danych PNG we właściwości value, więc da się go powiązać z modelem. Grubość kreski, tekst zastępczy i przycisk czyszczenia idą za właściwością size; kreski przetrwają zmianę rozmiaru. Wyzwala change.
docQuickDialogSummary=Gotowe okna dialogowe zbudowane z kontrolek dotykowych, wywoływane z kontrolera zamiast wypisywane w widoku. Każda metoda zwraca Promise.
docQuickDialogDescription=Klasa pomocnicza do okien dialogowych przygotowanych pod dotyk, używana z kontrolera zamiast z widoku: show, confirm, information, error, input, select, details. Każda metoda zwraca Promise.
docThemeHorizon=Domyślny motyw wersji demonstracyjnej
docThemeHorizonDark=Ciemny wariant Horizon
docThemeHorizonHcb=Wysoki kontrast, ciemne tło
docThemeHorizonHcw=Wysoki kontrast, jasne tło
docThemeFiori3=Poprzedni motyw domyślny UI5
docThemeFiori3Dark=Ciemny wariant Fiori 3
