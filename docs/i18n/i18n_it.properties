# ---------------------------------------------------------------------------
# Per iniziare
# ---------------------------------------------------------------------------
gsTitle=Per iniziare
gsSubtitle=I controlli standard di UI5, rifatti per il dito — e quelli che a sap.m mancano
gsWhatTitle=Di cosa si tratta
gsWhatSubtitle=Perché sap.m da solo non basta su un dispositivo tattile
gsWhatText1=I controlli <code>sap.m</code> sono fatti per mouse e tastiera. Su un tablet, su un terminale di fabbrica o su un apparecchio usato con i guanti sono semplicemente troppo piccoli &mdash; e la densità di contenuto «cozy» fa fare solo un passo avanti.
gsWhatText2=La libreria interviene su due fronti:<ul><li><strong>Rifà i controlli <code>sap.m</code> più importanti</strong> sulla loro struttura originale e li apre al dimensionamento tramite un'unica proprietà <code>size</code> (<code>S</code>&ndash;<code>6XL</code>) che funziona allo stesso modo su ognuno. Non serve rifare l'applicazione: i controlli mantengono le proprietà, le aggregazioni e gli eventi noti dei loro originali e si sostituiscono a essi direttamente.</li><li><strong>Aggiunge controlli che <code>sap.m</code> non ha affatto</strong>, per situazioni che si presentano solo su dispositivi tattili &mdash; l'esempio principale sono le tastiere a schermo.</li></ul>
gsSizesTitle=Una proprietà, nove dimensioni
gsSizesSubtitle=S · M (predefinita) · L · XL · 2XL · 3XL · 4XL · 5XL · 6XL
gsSizesText=La dimensione scala insieme corpo del testo, dimensione delle icone, spaziatura interna e altezza, così i controlli restano proporzionati a ogni gradino. Collega <code>size</code> a un modello per cambiare la dimensione dell'intera applicazione a runtime.
gsDropInTitle=Sostituto diretto
gsDropInSubtitle=Aggiungere il namespace, mettere tc: davanti al controllo, scegliere una dimensione
gsBeforeTitle=Prima — solo sap.m
gsAfterTitle=Dopo — ui5.touch.controls
gsDropInText=Stesse aggregazioni, stesse proprietà, stessi gestori di eventi &mdash; <code>press=".onSave"</code> chiama sempre lo stesso metodo del tuo controller. I controlli <code>sap.m</code> come <code>ToolbarSpacer</code> possono restare esattamente dove sono.
gsRequirementsTitle=Requisiti
gsRequirementsStrip=Serve UI5 1.116 o superiore (OpenUI5 o SAPUI5).
gsRequirementsText=La libreria è pubblicata su npm come <code>ui5.touch.controls</code> e si può usare in qualsiasi applicazione UI5 costruita con l'UI5 Tooling (v3 o superiore). Porta con sé il proprio <code>ui5.yaml</code>, così gli strumenti la risolvono da soli come dipendenza di libreria.
gsNextTitle=Prossimi passi
gsNextSubtitle=Da dove proseguire
gsNextText=<ul><li><strong>Installazione</strong> &mdash; installare il pacchetto, dichiararla nell'applicazione e predisporre TypeScript.</li><li><strong>Documentazione</strong> &mdash; il riferimento completo dei controlli, la scala delle dimensioni, l'interfaccia <code>ISized</code> e le insidie note.</li><li><strong>Controlli</strong> &mdash; una pagina interattiva per controllo, accanto all'originale <code>sap.m</code>.</li></ul>

# ---------------------------------------------------------------------------
# Installazione
# ---------------------------------------------------------------------------
setupTitle=Installazione
setupSubtitle=Installare la libreria, dichiararla nell'applicazione e predisporre TypeScript
setupPrereqTitle=Prerequisiti
setupPrereqSubtitle=Ciò che serve al progetto prima di cominciare
setupPrereqStrip=UI5 1.116 o superiore (OpenUI5 o SAPUI5) e UI5 Tooling v3 o superiore.
setupPrereqText=La libreria è pubblicata su npm come <a href="https://www.npmjs.com/package/ui5.touch.controls" target="_blank">ui5.touch.controls</a> e si può usare in qualsiasi applicazione UI5 costruita con l'<a href="https://sap.github.io/ui5-tooling/" target="_blank">UI5 Tooling</a>.
setupInstallTitle=1. Installare il pacchetto
setupInstallSubtitle=Come dipendenza normale, non come devDependency
setupInstallText=Installa la libreria come <strong>dipendenza normale</strong>, così l'UI5 Tooling la riconosce come dipendenza del progetto. Il pacchetto contiene un <code>ui5.yaml</code>, così gli strumenti la risolvono da soli come dipendenza di libreria.
setupMiddlewareTitle=1b. Con un middleware UI5 (in alternativa)
setupMiddlewareSubtitle=Servire la libreria come file statici invece di risolverla come dipendenza del progetto
setupMiddlewareText=Invece di usare la libreria come dipendenza di progetto dell'UI5 Tooling, puoi servirla come file statici con <a href="https://www.npmjs.com/package/ui5-middleware-servestatic" target="_blank">ui5-middleware-servestatic</a>.
setupManifestTitle=2. Dichiarare la libreria in manifest.json
setupManifestSubtitle=Perché l'applicazione la carichi all'avvio
setupNamespaceTitle=3. Aggiungere il namespace alle tue viste
setupNamespaceSubtitle=Il prefisso tc è solo una convenzione — va bene qualsiasi prefisso
setupTypeScriptTitle=4. Supporto a TypeScript (facoltativo)
setupTypeScriptSubtitle=Tipizzazione completa fin da subito
setupTypeScriptStrip=Senza la voce «types» l'UI5 Tooling non carica la libreria automaticamente.
setupTypeScriptText=Nei progetti TypeScript aggiungi il pacchetto alla voce <code>types</code> del tuo <code>tsconfig.json</code>. Il pacchetto contiene le definizioni dei tipi (<code>dist/index.d.ts</code>).

# ---------------------------------------------------------------------------
# Documentazione
# ---------------------------------------------------------------------------
docTitle=Documentazione
docSubtitle=Riferimento dei controlli, scala delle dimensioni, interfaccia ISized e insidie note
docPortedTitle=Versioni tattili dei controlli sap.m
docPortedSubtitle=La colonna «Sostituisce» indica il controllo sap.m a cui ciascuno subentra
docPortedText=Sono ricostruzioni di controlli standard. Mantengono proprietà, aggregazioni ed eventi dei loro originali per i casi comuni, quindi si sostituiscono a essi direttamente. Fai clic su un controllo per aprirne la pagina interattiva.
docNewTitle=Controlli aggiuntivi per il tocco
docNewSubtitle=Esistono solo in questa libreria
docNewText=Coprono situazioni che si presentano solo su un dispositivo tattile: un terminale senza tastiera fisica, un lettore di codici a barre al posto della digitazione, una firma sullo schermo. Fai clic su un controllo per aprirne la pagina interattiva.
docClassesTitle=Classi
docClassesSubtitle=Si usano da un controller, non si mettono in una vista
docClassesText=Non tutto ciò che la libreria aggiunge è un controllo. Queste classi si chiamano dal codice del controller e costruiscono da sé la propria interfaccia, a partire dai controlli tattili. Fai clic su una classe per aprirne la pagina interattiva.
docThemesTitle=Temi supportati
docThemesSubtitle=Tutti i controlli portano con sé la propria libreria di temi per questi
docThemesText1=I controlli prendono colori, bordi e ombre dai parametri del tema attivo, quindi si accordano ai controlli <code>sap.m</code> che li circondano. Imposta il tema come al solito, con <code>data-sap-ui-theme</code> nel bootstrap o a runtime con <code>Theming.setTheme()</code>.
docThemesText2=I temi che non compaiono qui non sono forniti con la libreria. UI5 ripiega allora sul tema di base per <code>ui5.touch.controls</code>: i controlli restano utilizzabili, ma non si accorderanno ai colori del resto dell'applicazione.
docSizesTitle=Dimensioni
docSizesSubtitle=Ogni controllo ha la stessa proprietà size
docSizesText1=Valori possibili: <code>S</code> &middot; <code>M</code> (predefinita) &middot; <code>L</code> &middot; <code>XL</code> &middot; <code>2XL</code> &middot; <code>3XL</code> &middot; <code>4XL</code> &middot; <code>5XL</code> &middot; <code>6XL</code>
docSizesText2=La dimensione scala insieme corpo del testo, dimensione delle icone, spaziatura interna e altezza, così i controlli restano proporzionati a ogni gradino. Collega <code>size</code> a un modello per cambiare la dimensione dell'intera applicazione a runtime.
docISizedTitle=ISized
docISizedSubtitle=ui5.touch.controls.ISized
docISizedText=Tutti i controlli con una proprietà <code>size</code> portano l'interfaccia marcatore <code>ui5.touch.controls.ISized</code>. Permette di trattare la dimensione in modo generico, per esempio per applicare una preferenza dell'utente a un'intera vista.
docKeyboardTitle=Le tastiere
docKeyboardSubtitle=sap.m non ha un equivalente
docKeyboardText1=Su un terminale di fabbrica, un chiosco o un apparecchio usato con i guanti spesso non c'è una tastiera fisica, e la tastiera a schermo del sistema operativo o non è disponibile o copre metà schermo. UI5 non ha alcun controllo per questo. La libreria porta tre tastiere a schermo, disegnate con i propri pulsanti &mdash; senza dipendenze di terzi, e dimensionate dalla stessa proprietà <code>size</code> di tutto il resto.
docKeyboardText2=<code>tc:Keyboard</code> è una tastiera di lettere: il <code>mode</code> è la disposizione di un paese, e una manciata di interruttori dice se le cifre stanno sopra le lettere o dietro un tasto, se ci sono caratteri speciali e in quale maiuscolo/minuscolo scrive. <code>tc:NumberPad</code> è la stessa idea per un campo di cifre. A <code>tc:CustomKeyboard</code> i tasti vengono consegnati riga per riga, per tutto ciò che le altre due non coprono: <code>&#123;shift&#125;</code>, <code>&#123;space&#125;</code>, <code>&#123;bksp&#125;</code> e <code>&#123;enter&#125;</code> sono i tasti speciali, ogni altro tasto scrive la propria etichetta. Tutte e tre accettano i tasti di una tastiera vera con <code>hardwareKeys="true"</code>, si agganciano al bordo inferiore dello schermo con <code>docked</code> ed entrano nell'aggregazione <code>keyboard</code> di un campo.
docPitfallTitle=Insidia: aggregazioni che accettano solo sap.m.Button
docPitfallSubtitle=buttons, beginButton e endButton di sap.m.Dialog
docPitfallStrip=Alcune aggregazioni standard sono tipizzate a sap.m.Button e rifiutano un tc:Button a runtime: "Element ui5.touch.controls.Button#__button0" is not valid for aggregation "buttons".
docPitfallText1=E quegli spazi per i pulsanti non sono pensati nemmeno per essere ridimensionati &mdash; sono impostati sull'altezza standard di un pulsante.
docPitfallText2=<strong>La via d'uscita è l'aggregazione <code>footer</code>.</strong> È tipizzata a <code>sap.m.Toolbar</code> (disponibile da UI5 1.110), e poiché <code>tc:Toolbar</code> e <code>tc:OverflowToolbar</code> ereditano da <code>sap.m.Toolbar</code>, ci entrano direttamente. La finestra di dialogo adatta allora l'altezza del suo piè di pagina alla barra degli strumenti, e i pulsanti a misura di dito vengono disegnati correttamente. Preferisci <code>tc:OverflowToolbar</code> ogni volta che la finestra di dialogo può diventare stretta.
docPitfallText3=Per semplici finestre di dialogo in stile MessageBox non devi costruire nulla di tutto ciò &mdash; <code>QuickDialog</code> compone già così il suo piè di pagina, nella dimensione indicata dalla sua opzione <code>size</code>.
docSizesExample=Collegare la dimensione
docPitfallBrokenTitle=Non funziona
docPitfallWorksTitle=Funziona

# ---------------------------------------------------------------------------
# pagine dei controlli
# ---------------------------------------------------------------------------
barcodeHint=<code>sap.m</code> non ha un equivalente: in modalità «keyboard wedge» un lettore di codici a barre digita il codice nel campo attivo in pochi millisecondi e lo chiude con <kbd>Invio</kbd>. Il controllo misura il tempo tra i tasti, quindi una lettura scatena <code>scan</code>, mentre digitare gli stessi caratteri a mano scatena <code>change</code>.
signatureHint=<code>sap.m</code> non ha un equivalente. Il riquadro disegna su un canvas e restituisce il risultato come URL di dati PNG in <code>value</code>, quindi si può collegare a un modello e inviare al backend come qualsiasi altro valore. Spessore del tratto, testo indicativo e pulsante di cancellazione seguono la proprietà <code>size</code>.
overflowPlainHint=Trascina il cursore verso sinistra: ciò che non ci sta più passa dietro il pulsante con i tre puntini. A larghezza piena non c'è alcun pulsante di overflow.
overflowPriorityHint=«Stampa» ha priorità Low e quindi va in overflow per prima. «Salva» ha NeverOverflow e resta nella barra finché c'è un minimo di spazio — alla larghezza minima passa anch'esso nel popover, così il pulsante di overflow resta raggiungibile. «Informazioni» ha AlwaysOverflow ed è sempre nel popover — per questo la barra mostra il pulsante con i tre puntini anche quando lo spazio abbonda.
overflowFooterHint=Restringi la finestra del browser per vedere la barra del piè di pagina andare in overflow — il popover si apre allora sopra la barra.
overflowDialogHint=L'aggregazione buttons di sap.m.Dialog accetta solo sap.m.Button, ma il piè di pagina accoglie qualsiasi sap.m.Toolbar — quindi una OverflowToolbar tattile ci entra direttamente. È la migliore delle due barre qui: una finestra di dialogo è stretta per natura, e ciò che non ci sta passa nel menu di overflow invece di essere tagliato.
inputKeyboardHint=Con «Tastiera virtuale» la tastiera dell'aggregazione keyboard si apre sotto il campo finché questo ha il focus, e si chiude appena lo perde.
textAreaKeyboardHint=Con «Tastiera virtuale» la tastiera dell'aggregazione keyboard si apre sotto il campo finché questo ha il focus, e si chiude appena lo perde. Il suo tasto Invio inserisce un'interruzione di riga, come fa Invio in un campo a più righe.

