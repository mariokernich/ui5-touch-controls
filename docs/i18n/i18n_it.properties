kbIntroSubtitle=Una tastiera di lettere, detta in una riga
kbIntroText=<p>Su un terminale di fabbrica, un chiosco o un apparecchio usato con i guanti spesso non c'è una tastiera fisica, e la tastiera a schermo del sistema operativo o non è disponibile o copre metà schermo. <code>tc:Keyboard</code> è la risposta per un campo di testo: il <code>mode</code> è la disposizione di un paese, e una manciata di interruttori dice cos'altro c'è sopra. Non c'è alcuna disposizione da scrivere.</p><p>È una delle tre tastiere, e condividono tutto ciò che non riguarda i tasti: il valore, la <code>size</code>, <code>docked</code>, i tasti di una tastiera vera tramite <code>hardwareKeys</code>, e gli eventi <code>change</code>, <code>keyPress</code>, <code>enter</code> ed <code>escape</code>. Ricorri a <code>tc:NumberPad</code> dove il campo prende cifre, e a <code>tc:CustomKeyboard</code> dove i tasti li scrivi tu. Tutte e tre entrano nell'aggregazione <code>keyboard</code> di un <code>tc:Input</code> o di un <code>tc:TextArea</code>.</p>
padIntroSubtitle=Un tastierino di cifre, detto in una riga
padIntroText=<p>Una quantità, un conteggio, un codice, un prezzo &mdash; i campi di un terminale sono cifre più spesso che lettere, e un tastierino di tre colonne è ciò che il pollice trova senza guardare. <code>tc:NumberPad</code> è quel tastierino: il <code>mode</code> sceglie il blocco di cifre, e gli interruttori accanto aggiungono ciò che al campo serve oltre a esse.</p><p>È una delle tre tastiere, e condividono tutto ciò che non riguarda i tasti: il valore, la <code>size</code>, <code>docked</code>, i tasti di una tastiera vera tramite <code>hardwareKeys</code>, e gli eventi <code>change</code>, <code>keyPress</code>, <code>enter</code> ed <code>escape</code>. Ricorri a <code>tc:Keyboard</code> dove il campo prende testo, e a <code>tc:CustomKeyboard</code> dove i tasti li scrivi tu.</p>
customIntroSubtitle=I tasti le vengono consegnati, riga per riga
customIntroText=<p><code>tc:CustomKeyboard</code> è la tastiera per tutto ciò che quelle già pronte non coprono: le taglie che un negozio vende, le lettere che una targa può avere, i tasti di una macchina. La proprietà <code>layout</code> sono le righe di un insieme; l'aggregazione <code>layouts</code> porta quanti insiemi servono, e un tasto scritto con il nome di un insieme ci passa. L'aggregazione <code>display</code> dice cosa mostra un singolo tasto.</p><p>È una delle tre tastiere, e condividono tutto ciò che non riguarda i tasti: il valore, la <code>size</code>, <code>docked</code>, i tasti di una tastiera vera tramite <code>hardwareKeys</code>, e gli eventi <code>change</code>, <code>keyPress</code>, <code>enter</code> ed <code>escape</code>. Quando serve una tastiera di lettere o un tastierino di cifre, <code>tc:Keyboard</code> e <code>tc:NumberPad</code> lo dicono in una riga.</p>
colProperty=Proprietà
colDefault=Predefinito
baseNote=tc:KeyboardBase è una classe base e non si mette mai in una vista. Usa tc:Keyboard, tc:NumberPad o tc:CustomKeyboard; questa pagina dice ciò che le tre hanno in comune.
baseIntroSubtitle=Ciò che le tre tastiere condividono
baseIntroText=<p>Le tre tastiere di questa libreria differiscono in una cosa sola: da dove vengono i tasti. <code>tc:Keyboard</code> li costruisce da una lingua e una manciata di interruttori, <code>tc:NumberPad</code> da un blocco di cifre, a <code>tc:CustomKeyboard</code> vengono consegnati riga per riga. Tutto il resto è questa classe, e funziona allo stesso modo su tutte e tre.</p><p>Cioè il valore e come un tasto lo cambia, gli insiemi di tasti e il passaggio tra loro, il maiuscolo e il blocco maiuscole, i tasti di una tastiera vera, la dimensione, la larghezza e l'aggancio. I tasti stessi sono controlli <code>tc:Button</code> di questa libreria &mdash; non c'è alcuna tastiera di terzi dietro, e la stessa proprietà <code>size</code> che scala tutto il resto scala anche loro.</p><p>È inoltre il tipo dell'aggregazione <code>keyboard</code> di un <code>tc:Input</code> e di un <code>tc:TextArea</code>, ed è per questo che una qualsiasi delle tre va bene su un campo.</p>
basePropsTitle=Ciò che le tre hanno in comune
basePropsSubtitle=Le proprietà che ogni tastiera di questa libreria ha
basePropsText=Oltre a queste, ognuna delle tre ha le proprietà che fanno i propri tasti &mdash; <code>mode</code> e gli interruttori su <code>tc:Keyboard</code> e <code>tc:NumberPad</code>, <code>layout</code> e <code>layouts</code> su <code>tc:CustomKeyboard</code>.
baseEventsTitle=Gli eventi
baseEventsSubtitle=Scatenati da ogni tastiera di questa libreria
baseKeysTitle=I tasti con un significato proprio
baseKeysSubtitle=Compresi da tutte e tre le tastiere
baseKeysText=Una riga è una sequenza di tasti separati da spazi, e un tasto tra parentesi graffe è uno di quelli qui sotto. Sono gestiti qui, quindi significano lo stesso su tutte e tre le tastiere; una tastiera decide solo se metterli a schermo.
baseSubclassesTitle=Le tre tastiere
baseSubclassesSubtitle=A quale ricorrere
baseHowTitle=Due parole sulla geometria
baseHowText=<p>Per quanto stretto sia lo spazio, una tastiera non deve mai essere fatta scorrere lateralmente: un tasto vorrebbe essere largo quanto è alto e rinuncia a quella larghezza quando lo spazio stringe. La sua altezza viene dalla <code>size</code> e non cambia.</p><p>Con <code>docked</code> la tastiera esce dal flusso della pagina e si posa sul bordo inferiore dello schermo, sopra il contenuto, come fa la tastiera a schermo di un telefono. Su un telefono o un tablet occupa allora tutta la larghezza dello schermo e <code>width</code> non viene considerata. Una tastiera su un campo è agganciata allo stesso modo, solo che il suo popover la mette nell'area statica: così copre anche una finestra di dialogo modale &mdash; ed è ciò che rende digitabile un campo dentro una finestra di dialogo.</p>
propValue=Il valore di input attuale della tastiera.
propEmphasizedKeys=I tasti disegnati in evidenza, scritti come compaiono nella disposizione — le graffe di un tasto speciale sono facoltative. Un modificatore è in evidenza finché è attivo, qualunque cosa dica questo.
propMaxLength=Numero massimo di caratteri. 0 significa senza limite.
propEnabled=Se la tastiera può essere usata.
propHardwareKeys=Se l'input da una tastiera vera è accettato mentre la tastiera ha il focus. Vengono presi solo i tasti che fanno parte della disposizione; Invio e Backspace sono sempre gestiti.
propSize=La dimensione tattile di ogni tasto. L'intera geometria la segue.
propWidth=Larghezza della tastiera. Non viene considerata per una tastiera agganciata su un telefono o un tablet.
propDocked=Se la tastiera si posa sul bordo inferiore dello schermo, sopra il contenuto, invece di stare nel flusso della pagina.
evtChange=Scatenato ogni volta che il valore cambia — un tasto, il backspace, qualunque cosa lo muova.
evtKeyPress=Scatenato per ogni tasto premuto, con il tasto come compare nella disposizione.
evtEnter=Scatenato quando si preme il tasto Invio, con il valore attuale.
evtEscape=Scatenato quando si preme il tasto Esc. La tastiera da sé non fa nulla; un campo che ne mostra una chiude con esso il suo popover.
subKeyboard=Un campo di testo: la disposizione di un paese, detta in una riga.
subNumberPad=Un campo di cifre: un tastierino di tre colonne, nel blocco di un computer, di un telefono o di una calcolatrice.
subCustomKeyboard=Tutto il resto: i tasti si scrivono, riga per riga, e in quanti insiemi servono.
colType=Tipo
colParameters=Parametri
exampleBaseField=Una qualsiasi delle tre su un campo (vista XML)

