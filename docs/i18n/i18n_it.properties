docButtonSummary=Un pulsante la cui intera geometria segue un'unica proprietà size, così l'area che il dito deve centrare cresce insieme a essa. Tutto il resto — testo, icona, tipo e press — si legge come su sap.m.Button.
docButtonOriginal=Il pulsante standard di sap.m: testo, icona, posizione dell'icona, tipo di pulsante ed evento press. La sua altezza è quella prescritta dal tema e non cambia.
docButtonDescription=Pulsante con dimensione configurabile, icona, posizione dell'icona, tipo (tutti i valori di sap.m.ButtonType), spaziatura laterale e larghezza. Scatena press.
docSegmentedButtonSummary=Una fila di pulsanti uniti di cui esattamente uno è selezionato, dimensionata perché ogni segmento si possa centrare con il dito.
docSegmentedButtonOriginal=Una fila di pulsanti uniti di cui esattamente uno è selezionato, riempita tramite sap.m.SegmentedButtonItem. Scatena selectionChange.
docSegmentedButtonDescription=Una fila di pulsanti uniti di cui esattamente uno è selezionato, riempita tramite tc:SegmentedButtonItem (key, text, icon, enabled). Supporta selectedKey, width per distribuire i segmenti in modo uniforme, e scatena selectionChange.
docCheckBoxSummary=Una casella di spunta il cui riquadro, segno di spunta, etichetta e area tattile scalano insieme invece di restare alla dimensione che dà loro il tema.
docCheckBoxOriginal=La casella di spunta standard di sap.m, con etichetta, selezione a tre stati e stati del valore. Riquadro e area tattile hanno la dimensione che dà loro il tema.
docCheckBoxDescription=Casella di spunta il cui riquadro, segno di spunta, etichetta e area tattile scalano insieme — alla dimensione M la geometria corrisponde a quella di sap.m.CheckBox. Supporta selected, partiallySelected, text, editable, wrapping, gli stati del valore e width. Scatena select.
docRadioButtonSummary=Un pulsante di opzione che scala con la sua proprietà size, e un controllo di gruppo che ne dispone un insieme in colonne e trasmette loro le proprie impostazioni.
docRadioButtonOriginal=Un pulsante di opzione che si esclude a vicenda con gli altri del suo groupName, più un controllo di gruppo che ne dispone un insieme in colonne.
docRadioButtonDescription=Cerchio, punto, etichetta e area tattile scalano insieme — alla dimensione M la geometria corrisponde a quella di sap.m.RadioButton. I pulsanti che condividono un groupName si escludono a vicenda; tc:RadioButtonGroup li dispone in colonne e trasmette loro i propri size, enabled, editable e stato del valore. Scatena select.
docSwitchSummary=Un interruttore acceso/spento che cresce con la sua proprietà size, mentre sap.m.Switch è fisso a 4rem per 2rem.
docSwitchOriginal=Un interruttore acceso/spento di dimensione fissa, con una variante accetta/rifiuta e testi personalizzati per i due stati.
docSwitchDescription=Binario, cursore ed etichetta scalano insieme, mentre sap.m.Switch è fisso a 4rem x 2rem. Supporta state, customTextOn, customTextOff e il tipo AcceptReject; i colori vengono dai parametri di tema @sapButton_Track_* / @sapButton_Handle_*. Scatena change.
docSelectSummary=Un menu a discesa il cui elenco si apre in righe alte quanto il campo stesso, così una voce si può scegliere con il dito.
docSelectOriginal=Un menu a discesa riempito con elementi sap.ui.core.Item. L'elenco che apre mantiene l'altezza di riga standard, per quanto grande sia il campo.
docSelectDescription=Menu a discesa riempito con semplici elementi sap.ui.core.Item. L'elenco si apre in un popover le cui righe sono alte quanto il campo, così si possono centrare con il dito — l'elenco nativo di sap.m.Select mantiene la sua altezza di riga standard per quanto grande sia il campo. Supporta selectedKey, editable, forceSelection, gli stati del valore e width. Su un telefono l'elenco occupa tutto lo schermo, come in sap.m. Scatena change.
docComboBoxSummary=Un Select in cui si può digitare: il testo libero è ammesso, ciò che si digita filtra l'elenco, e le righe sono alte quanto il campo.
docComboBoxOriginal=Un menu a discesa in cui si può anche digitare: ciò che si digita filtra l'elenco, e un valore che non è nell'elenco è ammesso.
docComboBoxDescription=Un Select in cui si può digitare: il testo libero è ammesso e ciò che si digita filtra l'elenco, le cui righe sono alte quanto il campo. Funziona insieme alle tastiere di questa libreria su un dispositivo che non ne ha. Supporta value, selectedKey, placeholder, editable, gli stati del valore, width e showSecondaryValues, che mette l'additionalText di un sap.ui.core.ListItem in fondo alla riga. Su un telefono l'elenco occupa tutto lo schermo e porta un campo proprio per continuare a digitare, come in sap.m. Scatena change e selectionChange.
docDatePickerSummary=Un campo data il cui calendario è costruito con i pulsanti di questa libreria, così un giorno è un quadrato che cresce con la proprietà size.
docDatePickerOriginal=Un campo con un calendario a comparsa basato su sap.ui.unified.Calendar, con minDate/maxDate e formati di valore e visualizzazione configurabili.
docDatePickerDescription=Campo con un calendario costruito con i pulsanti della libreria stessa, così un giorno è un quadrato che cresce con la proprietà size, invece della griglia fissa di sap.ui.unified.Calendar. Viste per giorni e mesi, minDate/maxDate, valueFormat e displayFormat (stile o schema). Scatena change con value, dateValue e valid.
docTimePickerSummary=Un campo orario che si riempie con un tocco sull'ora e uno sul minuto, invece di un cursore da trascinare.
docTimePickerOriginal=Un campo con una finestra a comparsa in cui ore e minuti si impostano su cursori da trascinare.
docTimePickerDescription=Campo con due colonne di pulsanti — ore e minuti — per scegliere un orario con un solo tocco su un bersaglio che cresce con size, mentre sap.m.TimePicker usa un cursore da trascinare. Supporta minutesStep, valueFormat e displayFormat. Scatena change una volta sola, alla chiusura del popover.
docInputSummary=Un campo di immissione a riga singola che scala con la sua proprietà size e può portare con sé una tastiera di questa libreria, per un dispositivo che non ne ha.
docInputOriginal=Il campo di immissione standard a riga singola di sap.m, con testo indicativo, lunghezza massima, stati del valore e suggerimenti.
docInputDescription=Campo di immissione a riga singola con dimensione configurabile. Una tastiera di questa libreria — tc:Keyboard, tc:NumberPad o tc:CustomKeyboard — si può mettere nella sua aggregazione keyboard; con showKeyboard si apre allora in un popover sotto il campo finché questo ha il focus, e ci scrive dentro.
docTextAreaSummary=Un campo di immissione a più righe che scala con la sua proprietà size e accoglie una tastiera di questa libreria, il cui tasto Invio qui inserisce un'interruzione di riga.
docTextAreaOriginal=Il campo di immissione standard a più righe di sap.m, con numero di righe, lunghezza massima e stati del valore.
docTextAreaDescription=Campo a più righe con dimensione configurabile, numero di righe, lunghezza massima e stati del valore. Accoglie una tastiera nella sua aggregazione keyboard come fa l'Input; lì il tasto Invio inserisce un'interruzione di riga. Scatena change / liveChange.
docTextSummary=Un testo il cui corpo segue la stessa proprietà size di ogni altro controllo della libreria, così un'etichetta sta alla scala del campo accanto.
docTextOriginal=Un controllo di testo con a capo automatico e numero massimo di righe.
docTextDescription=Testo con dimensione e colore configurabili. Scatena press.
docLinkSummary=Un link la cui etichetta — e con essa l'area che si può centrare con il dito — cresce con la proprietà size.
docLinkOriginal=Un link con href e target, e le varianti discreta e in evidenza.
docLinkDescription=Link con dimensione configurabile, così l'area che si può centrare con il dito cresce insieme all'etichetta. Supporta href, target, wrapping, subtle, emphasized e width; un link con target="_blank" riceve automaticamente rel="noopener noreferrer". Scatena press.
docToolbarSummary=Una barra per i controlli di questa libreria che entra comunque ovunque sap.m si aspetti una barra propria — il piè di pagina di una Page o di un Dialog, per esempio.
docToolbarOriginal=Una barra che dispone il suo contenuto in una riga. Molte aggregazioni di intestazione e piè di pagina di sap.m sono tipizzate a essa.
docToolbarDescription=Contenitore di barra degli strumenti con un'aggregazione content. Utilizzabile in aggregazioni standard come il piè di pagina di una Page o di un Dialog.
docOverflowToolbarSummary=Una Toolbar che sposta ciò che non ci sta in un popover dietro un pulsante con tre puntini, guidata dalle priorità di sap.m.OverflowToolbarLayoutData.
docOverflowToolbarOriginal=Una Toolbar che sposta ciò che non ci sta in un popover dietro un pulsante con tre puntini, guidata dalle priorità di sap.m.OverflowToolbarLayoutData.
docOverflowToolbarDescription=Come tc:Toolbar, ma il contenuto che non ci sta nella larghezza disponibile passa dietro un pulsante con tre puntini che apre un popover con il resto. Comprende le priorità di sap.m.OverflowToolbarLayoutData.
docStepInputSummary=Un campo numerico con un pulsante meno e uno più dimensionati insieme a esso, così il valore si regola con il pollice.
docStepInputOriginal=Un campo numerico con un pulsante meno e uno più, con min, max e passo.
docStepInputDescription=Pulsante meno, campo di immissione e pulsante più, dimensionati insieme. Supporta min, max, step. Scatena change.
docBarcodeInputSummary=Un campo di immissione che distingue un lettore di codici a barre da una persona che digita e riferisce i due come eventi diversi.
docBarcodeInputDescription=Campo di immissione che distingue un lettore di codici a barre da una persona che digita: una sequenza di almeno minLength caratteri i cui intervalli restano sotto scanTimeout e che si chiude con Invio scatena scan, tutto il resto scatena change. prefix e suffix vengono tolti dal codice, clearOnScan svuota il campo per il successivo.
docKeyboardSummary=Una tastiera di lettere a schermo per un dispositivo che non ne ha. Il mode sceglie la disposizione di un paese; una manciata di interruttori dice cos'altro c'è sopra.
docKeyboardDescription=Tastiera di lettere a schermo, costruita con i pulsanti della libreria stessa. La proprietà mode sceglie la disposizione di un paese — inglese, tedesco, francese, spagnolo, ucraino, russo, hindi — e una manciata di interruttori dice cos'altro c'è sopra: displayNumbers mette le cifre sopra le lettere o dietro un tasto, showSpecialCharacters aggiunge un insieme di segni, letterCase fissa la tastiera su maiuscolo o minuscolo, showCapsLock e showEscape aggiungono un tasto ciascuno. Input da tastiera fisica facoltativo, collegamento del valore ed eventi change / keyPress / enter / escape.
docNumberPadSummary=Un tastierino di cifre a schermo su tre colonne, per tutto ciò che si digita come numero. Il mode sceglie il blocco: tastierino di un computer, di un telefono o di una calcolatrice.
docNumberPadDescription=Tastierino di cifre a schermo su tre colonne. La proprietà mode sceglie il blocco — Simple (il tastierino di un computer), Phone (quello di un telefono) o Calculator (con le quattro operazioni) — e showDecimalSeparator, decimalSeparator, showSign e showSpecialCharacters aggiungono ciò che al campo serve oltre alle cifre. Condivide con le altre tastiere la gestione del valore, il dimensionamento e l'aggancio.
docCustomKeyboardSummary=La tastiera a cui i tasti vengono consegnati, riga per riga. È la risposta a tutto ciò che le tastiere già pronte non coprono.
docCustomKeyboardDescription=Tastiera a schermo a cui i tasti vengono consegnati: la proprietà layout sono le righe di un insieme, l'aggregazione layouts porta quanti insiemi servono, e un tasto scritto con il nome di un insieme ci passa. L'aggregazione display dice cosa mostra un singolo tasto. È la tastiera per tutto ciò che quelle già pronte non coprono.
docKeyboardBaseSummary=Il meccanismo dietro tutte e tre le tastiere. Non si mette essa stessa in una vista — ciò che non sa è quali tasti mostrare, ed è proprio questo a distinguere le sue sottoclassi.
docKeyboardBaseDescription=Classe base delle tastiere a schermo di questa libreria, costruita in modo nativo con i controlli Button della libreria stessa, senza dipendenze di terzi. Tutto ciò che non riguarda quali tasti mostrare vive qui: il valore e come un tasto lo cambia, gli insiemi di tasti e il passaggio tra loro, il maiuscolo e il blocco maiuscole, i tasti di una tastiera vera tramite hardwareKeys, la dimensione, la larghezza e l'aggancio. È il tipo dell'aggregazione keyboard di un Input o di un TextArea, così una Keyboard, un NumberPad e una CustomKeyboard ci entrano tutte.
docSignaturePadSummary=Un campo su cui firmare con il dito o un pennino. La firma esce come URL di dati PNG, così si può collegare a un modello come qualsiasi altro valore.
docSignaturePadDescription=Un campo su cui firmare con il dito o un pennino. Disegna su un canvas e restituisce la firma come URL di dati PNG in value, per collegarla a un modello. Spessore del tratto, testo indicativo e pulsante di cancellazione seguono la proprietà size; i tratti sopravvivono a un ridimensionamento. Scatena change.
docQuickDialogSummary=Finestre di dialogo già pronte costruite con i controlli tattili, chiamate dal controller invece di essere scritte in una vista. Ogni metodo restituisce una Promise.
docQuickDialogDescription=Classe di supporto per finestre di dialogo pronte per il tocco, usata dal controller invece che da una vista: show, confirm, information, error, input, select, details. Ogni metodo restituisce una Promise.
docThemeHorizon=Tema predefinito della demo
docThemeHorizonDark=Variante scura di Horizon
docThemeHorizonHcb=Contrasto elevato, sfondo scuro
docThemeHorizonHcw=Contrasto elevato, sfondo chiaro
docThemeFiori3=Precedente tema predefinito di UI5
docThemeFiori3Dark=Variante scura di Fiori 3
