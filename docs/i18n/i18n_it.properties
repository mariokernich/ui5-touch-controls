keyboardLayoutsSubtitle=Ciò che mostra ogni valore della proprietà mode
keyboardLayoutsText=Il <code>mode</code> è la tastiera di un paese, chiamata come la lingua per cui serve. Le righe qui sotto sono ciò che quella disposizione mostra con <code>displayNumbers=&quot;Always&quot;</code>; gli interruttori accanto decidono cos'altro c'è sulla tastiera. Fai clic su una disposizione per passarci con la tastiera qui sopra.
keyboardSwitchesTitle=Gli interruttori
keyboardSwitchesSubtitle=Ciò che ognuno aggiunge alla tastiera
keyboardSwitchesText=<p><b>displayNumbers</b> decide che ne è delle cifre. <code>Always</code> ne mette una riga sopra le lettere, come su una tastiera a tasti. <code>Toggle</code> lascia le lettere da sole e mette le cifre dietro un tasto <code>{numbers}</code>, come fa un telefono &mdash; una riga di cifre lì renderebbe ogni tasto stretto. <code>ToggleOnMobile</code>, il valore predefinito, è il primo su un computer e un tablet e il secondo su un telefono; quale dei due si decide una volta sola, in base al dispositivo su cui la pagina è stata aperta. <code>Never</code> lascia fuori del tutto le cifre.</p><p><b>showSpecialCharacters</b> aggiunge un insieme di parentesi, segni e valute. Dove le cifre stanno dietro un tasto proprio, l'insieme si mette dopo di esse, come un telefono passa dalle sue lettere alle sue cifre ai suoi simboli e torna indietro; altrimenti un tasto <code>{symbols}</code> ci porta.</p><p><b>letterCase</b> fissa la tastiera su un solo caso. <code>Upper</code> e <code>Lower</code> lasciano fuori il tasto maiuscolo e il blocco &mdash; non c'è nulla da commutare, ed è ciò che vuole un campo con un caso imposto: un codice materiale, una targa, un lotto. Non viene considerato per l'hindi, che ha un secondo insieme di lettere invece delle maiuscole.</p><p><b>showEmojis</b> appende un insieme di faccine dietro un tasto proprio, allo stesso modo in cui si raggiungono le cifre e i caratteri speciali. Ci sono solo faccine di un unico carattere: una composta da più caratteri &mdash; una famiglia, una bandiera &mdash; verrebbe smontata dal tasto indietro.</p><p><b>extraKeys</b> sono tasti che stanno accanto alla barra spaziatrice su ogni insieme, qualunque sia quello a schermo. Lì va il tasto che un campo vuole a portata di mano invece che dietro un cambio: <code>extraKeys=&quot;@,.&quot;</code> per un indirizzo, un'unità per una quantità. La chiocciola è anche nell'insieme dei caratteri speciali, un tasto più in là.</p><p><b>showCapsLock</b> aggiunge un <code>{lock}</code> accanto al tasto maiuscolo. Il maiuscolo decade dopo una lettera, il blocco resta finché non viene premuto di nuovo &mdash; e il maiuscolo con il blocco attivo scrive in minuscolo, come su una tastiera a tasti.</p><p><b>showEscape</b> aggiunge un tasto <code>{esc}</code> come primo tasto della riga in alto, dove lo ha una tastiera a tasti, su ogni insieme. Scatena <code>escape</code> e nient'altro; cosa debba significare è lasciato all'applicazione.</p><p><b>enterText</b> è ciò che dice il tasto Invio. Vuoto, resta la freccia che è.</p>
padLayoutsTitle=I blocchi di cifre
padLayoutsSubtitle=Ciò che mostra ogni valore della proprietà mode
padLayoutsText=Il <code>mode</code> sceglie il blocco di cifre, e il blocco mantiene la sua forma qualunque cosa si attivi: un meno e un separatore decimale vanno nella riga dello zero, il tasto verso i caratteri speciali e il tasto Esc nella riga di funzioni sotto di essa. Dove non sono stati chiesti né il meno né il separatore, il tasto indietro e l'invio vengono invece nella riga dello zero &mdash; uno zero da solo sulla sua riga sarebbe un tasto largo tre colonne. Fai clic su una modalità per passarci con il tastierino qui sopra.
customKeysTitle=Scrivere una disposizione
customKeysSubtitle=Righe, tasti e quelli con un significato proprio
customKeysText=Una riga è una sequenza di tasti separati da spazi; in una vista le righe sono separate da virgole. Tutto ciò che non è nella tabella qui sotto scrive sé stesso &mdash; una lettera, una cifra, una parola intera. Un tasto scritto con il nome di uno degli insiemi dell'aggregazione <code>layouts</code> passa a quell'insieme, e un tasto che nomina l'insieme in cui ci si trova già ne riporta fuori.
colKey=Tasto
colKeyMeaning=Cosa fa
keyBksp=cancella l'ultimo carattere
keyEnter=scatena l'evento enter
keySpace=scrive uno spazio, ed è più largo degli altri tasti
keyShift=la lettera successiva in maiuscolo, poi decade
keyLock=il blocco maiuscole: resta finché non viene premuto di nuovo
keyTab=scrive un carattere di tabulazione
keyEsc=scatena l'evento escape e nient'altro
keySet=passa all'insieme di quel nome, p. es. {numbers}
exPlate=Targa
