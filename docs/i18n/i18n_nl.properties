kbIntroSubtitle=Een lettertoetsenbord, in één regel gezegd
kbIntroText=<p>Op een werkvloerterminal, een kiosk of een apparaat dat met handschoenen wordt bediend is er vaak geen fysiek toetsenbord, en het schermtoetsenbord van het besturingssysteem is óf niet beschikbaar óf bedekt het halve scherm. <code>tc:Keyboard</code> is het antwoord voor een tekstveld: de <code>mode</code> is de indeling van een land, en een handvol schakelaars bepaalt wat er verder op staat. Er valt geen indeling uit te schrijven.</p><p>Het is een van de drie toetsenborden, en ze delen alles wat niet over de toetsen gaat: de waarde, de <code>size</code>, <code>docked</code>, de toetsen van een echt toetsenbord via <code>hardwareKeys</code>, en de events <code>change</code>, <code>keyPress</code>, <code>enter</code> en <code>escape</code>. Grijp naar <code>tc:NumberPad</code> waar het veld cijfers vraagt, en naar <code>tc:CustomKeyboard</code> waar u de toetsen zelf schrijft. Alle drie passen in de aggregatie <code>keyboard</code> van een <code>tc:Input</code> of een <code>tc:TextArea</code>.</p>
padIntroSubtitle=Een cijferpaneel, in één regel gezegd
padIntroText=<p>Een hoeveelheid, een aantal, een code, een prijs &mdash; de velden van een terminal zijn vaker cijfers dan letters, en een paneel van drie kolommen is wat een duim zonder kijken vindt. <code>tc:NumberPad</code> is dat paneel: de <code>mode</code> kiest het cijferblok, en de schakelaars ernaast voegen toe wat het veld daarnaast nodig heeft.</p><p>Het is een van de drie toetsenborden, en ze delen alles wat niet over de toetsen gaat: de waarde, de <code>size</code>, <code>docked</code>, de toetsen van een echt toetsenbord via <code>hardwareKeys</code>, en de events <code>change</code>, <code>keyPress</code>, <code>enter</code> en <code>escape</code>. Grijp naar <code>tc:Keyboard</code> waar het veld tekst vraagt, en naar <code>tc:CustomKeyboard</code> waar u de toetsen zelf schrijft.</p>
customIntroSubtitle=De toetsen worden aangereikt, rij voor rij
customIntroText=<p><code>tc:CustomKeyboard</code> is het toetsenbord voor alles wat de kant-en-klare niet dekken: de maten die een winkel verkoopt, de letters die een kenteken mag hebben, de toetsen van een machine. De eigenschap <code>layout</code> is de rijen van één set; de aggregatie <code>layouts</code> draagt zoveel sets als nodig, en een toets die als de naam van een set is geschreven, schakelt daarheen. De aggregatie <code>display</code> bepaalt wat er op een afzonderlijke toets staat.</p><p>Het is een van de drie toetsenborden, en ze delen alles wat niet over de toetsen gaat: de waarde, de <code>size</code>, <code>docked</code>, de toetsen van een echt toetsenbord via <code>hardwareKeys</code>, en de events <code>change</code>, <code>keyPress</code>, <code>enter</code> en <code>escape</code>. Waar een lettertoetsenbord of een cijferpaneel gewenst is, zeggen <code>tc:Keyboard</code> en <code>tc:NumberPad</code> hetzelfde in één regel.</p>
colProperty=Eigenschap
colDefault=Standaard
baseNote=tc:KeyboardBase is een basisklasse en wordt nooit in een view gezet. Gebruik tc:Keyboard, tc:NumberPad of tc:CustomKeyboard; deze pagina beschrijft wat de drie gemeen hebben.
baseIntroSubtitle=Wat de drie toetsenborden delen
baseIntroText=<p>De drie toetsenborden van deze bibliotheek verschillen in maar één ding: waar de toetsen vandaan komen. <code>tc:Keyboard</code> bouwt ze uit een taal en een handvol schakelaars, <code>tc:NumberPad</code> uit een cijferblok, <code>tc:CustomKeyboard</code> krijgt ze rij voor rij aangereikt. Al het andere is deze klasse, en dat werkt op alle drie hetzelfde.</p><p>Dat is de waarde en hoe een toets die verandert, de sets toetsen en het schakelen ertussen, shift en de caps lock, de toetsen van een echt toetsenbord, de grootte, de breedte en het verankeren. De toetsen zelf zijn <code>tc:Button</code>-controls van deze bibliotheek &mdash; er zit geen toetsenbord van derden achter, en dezelfde eigenschap <code>size</code> die al het andere schaalt, schaalt ook hen.</p><p>Het is bovendien het type waarop de aggregatie <code>keyboard</code> van een <code>tc:Input</code> en een <code>tc:TextArea</code> is getypeerd, en daarom past elk van de drie op een veld.</p>
basePropsTitle=Wat de drie gemeen hebben
basePropsSubtitle=De eigenschappen die elk toetsenbord van deze bibliotheek heeft
basePropsText=Daarnaast heeft elk van de drie de eigenschappen die zijn eigen toetsen maken &mdash; <code>mode</code> en de schakelaars op <code>tc:Keyboard</code> en <code>tc:NumberPad</code>, <code>layout</code> en <code>layouts</code> op <code>tc:CustomKeyboard</code>.
baseEventsTitle=De events
baseEventsSubtitle=Worden door elk toetsenbord van deze bibliotheek afgevuurd
baseKeysTitle=De toetsen met een eigen betekenis
baseKeysSubtitle=Worden door alle drie de toetsenborden begrepen
baseKeysText=Een rij is een reeks toetsen gescheiden door spaties, en een toets tussen accolades is een van de onderstaande. Ze worden hier afgehandeld, dus ze betekenen op alle drie de toetsenborden hetzelfde; een toetsenbord bepaalt alleen of het ze op het scherm zet.
baseSubclassesTitle=De drie toetsenborden
baseSubclassesSubtitle=Naar welk u moet grijpen
baseHowTitle=Een woord over de geometrie
baseHowText=<p>Hoe smal de ruimte ook is, een toetsenbord hoeft nooit zijwaarts te worden gescrold: een toets wil het liefst zo breed zijn als hij hoog is en geeft die breedte op zodra de ruimte krap wordt. Zijn hoogte komt uit de <code>size</code> en blijft zoals hij is.</p><p>Met <code>docked</code> verlaat het toetsenbord de stroom van de pagina en gaat het aan de onderrand van het scherm staan, over de content heen, zoals het schermtoetsenbord van een telefoon dat doet. Op een telefoon of een tablet neemt het dan de volle breedte van het scherm en wordt <code>width</code> niet bekeken. Een toetsenbord op een veld is op dezelfde manier verankerd, alleen zet zijn popover het in het statische gebied: zo bedekt het ook een modale dialoog &mdash; en dat is wat een veld binnen een dialoog beschrijfbaar maakt.</p>
propValue=De huidige invoerwaarde van het toetsenbord.
propEmphasizedKeys=De toetsen die benadrukt worden getekend, geschreven zoals ze in de indeling staan — de accolades van een speciale toets zijn optioneel. Een modificatietoets is benadrukt zolang hij aanstaat, wat hier ook staat.
propMaxLength=Maximaal aantal tekens. 0 betekent onbeperkt.
propEnabled=Of het toetsenbord überhaupt gebruikt kan worden.
propHardwareKeys=Of invoer van een echt toetsenbord wordt aangenomen zolang het toetsenbord de focus heeft. Alleen toetsen die deel uitmaken van de indeling worden aangenomen; Enter en Backspace worden altijd afgehandeld.
propSize=De aanraakgrootte van elke toets. De hele geometrie volgt haar.
propWidth=Breedte van het toetsenbord. Wordt niet bekeken bij een verankerd toetsenbord op een telefoon of een tablet.
propDocked=Of het toetsenbord aan de onderrand van het scherm staat, over de content heen, in plaats van in de stroom van de pagina.
evtChange=Wordt afgevuurd zodra de waarde verandert — een toets, de backspace, wat haar ook verzet.
evtKeyPress=Wordt afgevuurd voor elke ingedrukte toets, met de toets zoals hij in de indeling staat.
evtEnter=Wordt afgevuurd als de Enter-toets wordt ingedrukt, met de huidige waarde.
evtEscape=Wordt afgevuurd als de Esc-toets wordt ingedrukt. Het toetsenbord doet er zelf niets mee; een veld dat er een toont, sluit daarop zijn popover.
subKeyboard=Een tekstveld: de indeling van een land, in één regel gezegd.
subNumberPad=Een cijferveld: een paneel van drie kolommen, in het blok van een computer, een telefoon of een rekenmachine.
subCustomKeyboard=Al het andere: de toetsen worden uitgeschreven, rij voor rij, en in zoveel sets als nodig.
