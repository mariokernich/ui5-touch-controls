# Installatie
# ---------------------------------------------------------------------------
setupTitle=Installatie
setupSubtitle=De bibliotheek installeren, in uw app declareren en TypeScript inrichten
setupPrereqTitle=Voorwaarden
setupPrereqSubtitle=Wat uw project nodig heeft voordat u begint
setupPrereqStrip=UI5 1.116 of hoger (OpenUI5 of SAPUI5) en UI5 Tooling v3 of hoger.
setupPrereqText=De bibliotheek staat op npm als <a href="https://www.npmjs.com/package/ui5.touch.controls" target="_blank">ui5.touch.controls</a> en is te gebruiken in elke UI5-applicatie die met de <a href="https://sap.github.io/ui5-tooling/" target="_blank">UI5 Tooling</a> wordt gebouwd.
setupInstallTitle=1. Het pakket installeren
setupInstallSubtitle=Als gewone dependency, niet als devDependency
setupInstallText=Installeer de bibliotheek als <strong>gewone dependency</strong>, zodat de UI5 Tooling haar als projectafhankelijkheid herkent. Het pakket bevat een <code>ui5.yaml</code>, zodat de tooling haar vanzelf als bibliotheekafhankelijkheid oplost.
setupMiddlewareTitle=1b. Met UI5-middleware (alternatief)
setupMiddlewareSubtitle=De bibliotheek statisch uitserveren in plaats van haar als projectafhankelijkheid op te lossen
setupMiddlewareText=In plaats van de bibliotheek als projectafhankelijkheid van de UI5 Tooling te gebruiken, kunt u haar statisch uitserveren met <a href="https://www.npmjs.com/package/ui5-middleware-servestatic" target="_blank">ui5-middleware-servestatic</a>.
setupManifestTitle=2. De bibliotheek in manifest.json declareren
setupManifestSubtitle=Zodat de app haar bij het opstarten laadt
setupNamespaceTitle=3. De namespace aan uw views toevoegen
setupNamespaceSubtitle=Het prefix tc is slechts een afspraak — elk prefix voldoet
setupTypeScriptTitle=4. TypeScript-ondersteuning (optioneel)
setupTypeScriptSubtitle=Volledige typering meteen na installatie
setupTypeScriptStrip=Zonder de vermelding «types» laadt de UI5 Tooling de bibliotheek niet automatisch.
setupTypeScriptText=Voeg het pakket in TypeScript-projecten toe aan de vermelding <code>types</code> in uw <code>tsconfig.json</code>. Het pakket bevat de typedefinities (<code>dist/index.d.ts</code>).

# ---------------------------------------------------------------------------
# Documentatie
# ---------------------------------------------------------------------------
docTitle=Documentatie
docSubtitle=Controlreferentie, de groottenschaal, de interface ISized en bekende valkuilen
docPortedTitle=Aanraakversies van de sap.m-controls
docPortedSubtitle=De kolom «Vervangt» noemt de sap.m-control waarvoor elk van hen in de plaats komt
docPortedText=Dit zijn herbouwde standaardcontrols. Ze houden voor de gangbare gevallen de eigenschappen, aggregaties en events van hun originelen, zodat ze als directe vervanger dienen. Klik op een control om de interactieve pagina ervan te openen.
docNewTitle=Extra controls voor aanraakbediening
docNewSubtitle=Ze bestaan alleen in deze bibliotheek
docNewText=Ze dekken situaties af die alleen op een aanraakapparaat voorkomen: een terminal zonder fysiek toetsenbord, een barcodescanner in plaats van tikken, een handtekening op het scherm. Klik op een control om de interactieve pagina ervan te openen.
docClassesTitle=Klassen
docClassesSubtitle=Worden vanuit een controller gebruikt, niet in een view gezet
docClassesText=Niet alles wat de bibliotheek toevoegt is een control. Deze klassen worden vanuit controllercode aangeroepen en bouwen hun interface zelf op, uit de aanraakcontrols. Klik op een klasse om de interactieve pagina ervan te openen.
docThemesTitle=Ondersteunde thema's
docThemesSubtitle=Alle controls brengen hun eigen themabibliotheek voor deze thema's mee
docThemesText1=De controls halen hun kleuren, randen en schaduwen uit de themaparameters van het actieve thema, zodat ze aansluiten bij de omringende <code>sap.m</code>-controls. Stel het thema als vanouds in, via <code>data-sap-ui-theme</code> in de bootstrap of tijdens runtime via <code>Theming.setTheme()</code>.
docThemesText2=Thema's die hier niet staan worden niet met de bibliotheek meegeleverd. UI5 valt dan terug op het basisthema voor <code>ui5.touch.controls</code>: de controls blijven bruikbaar, maar ze sluiten niet aan bij de kleuren van de rest van de applicatie.
docSizesTitle=Groottes
docSizesSubtitle=Elke control heeft dezelfde eigenschap size
docSizesText1=Mogelijke waarden: <code>S</code> &middot; <code>M</code> (standaard) &middot; <code>L</code> &middot; <code>XL</code> &middot; <code>2XL</code> &middot; <code>3XL</code> &middot; <code>4XL</code> &middot; <code>5XL</code> &middot; <code>6XL</code>
docSizesText2=De grootte schaalt tekstgrootte, pictogramgrootte, opvulling en hoogte samen mee, zodat de controls op elke trede in verhouding blijven. Bind <code>size</code> aan een model om de grootte van de hele app tijdens runtime om te schakelen.
docISizedTitle=ISized
docISizedSubtitle=ui5.touch.controls.ISized
docISizedText=Alle controls met een eigenschap <code>size</code> dragen de marker-interface <code>ui5.touch.controls.ISized</code>. Daarmee is de grootte generiek te behandelen, bijvoorbeeld om een gebruikersinstelling op een hele view toe te passen.
docKeyboardTitle=De toetsenborden
docKeyboardSubtitle=sap.m heeft hier geen tegenhanger voor
docKeyboardText1=Op een werkvloerterminal, een kiosk of een apparaat dat met handschoenen wordt bediend is er vaak geen fysiek toetsenbord, en het schermtoetsenbord van het besturingssysteem is óf niet beschikbaar óf bedekt het halve scherm. UI5 heeft hier geen control voor. De bibliotheek brengt drie schermtoetsenborden mee, opgebouwd uit haar eigen knoppen &mdash; zonder afhankelijkheid van derden, en geschaald via dezelfde eigenschap <code>size</code> als al het andere.
docKeyboardText2=<code>tc:Keyboard</code> is een lettertoetsenbord: de <code>mode</code> is de indeling van een land, en een handvol schakelaars bepaalt of de cijfers boven de letters of achter een toets staan, of er speciale tekens zijn en in welke kast het schrijft. <code>tc:NumberPad</code> is hetzelfde idee voor een cijferveld. <code>tc:CustomKeyboard</code> krijgt zijn toetsen rij voor rij aangereikt, voor alles wat de andere twee niet dekken: <code>&#123;shift&#125;</code>, <code>&#123;space&#125;</code>, <code>&#123;bksp&#125;</code> en <code>&#123;enter&#125;</code> zijn de speciale toetsen, elke andere toets schrijft haar eigen opschrift. Alle drie nemen de toetsen van een echt toetsenbord aan met <code>hardwareKeys="true"</code>, verankeren zich aan de onderrand van het scherm met <code>docked</code> en passen in de aggregatie <code>keyboard</code> van een veld.
docPitfallTitle=Valkuil: aggregaties die alleen sap.m.Button aannemen
docPitfallSubtitle=buttons, beginButton en endButton van sap.m.Dialog
docPitfallStrip=Sommige standaardaggregaties zijn getypeerd op sap.m.Button en weigeren een tc:Button tijdens runtime: "Element ui5.touch.controls.Button#__button0" is not valid for aggregation "buttons".
docPitfallText1=En die knopplaatsen zijn ook niet bedoeld om van grootte te veranderen &mdash; ze zijn ingericht op de standaard knophoogte.
docPitfallText2=<strong>De uitweg is de aggregatie <code>footer</code>.</strong> Die is getypeerd op <code>sap.m.Toolbar</code> (beschikbaar sinds UI5 1.110), en omdat <code>tc:Toolbar</code> en <code>tc:OverflowToolbar</code> van <code>sap.m.Toolbar</code> erven, passen ze er zo in. De dialoog past dan de hoogte van zijn voettekst aan de werkbalk aan, zodat knoppen op aanraakformaat netjes worden weergegeven. Kies <code>tc:OverflowToolbar</code> zodra de dialoog smal kan worden.
docPitfallText3=Voor eenvoudige dialogen in MessageBox-stijl hoeft u dit niet zelf te bouwen &mdash; <code>QuickDialog</code> stelt zijn voettekst al zo samen, op de grootte uit zijn optie <code>size</code>.
docSizesExample=De grootte binden
docPitfallBrokenTitle=Werkt niet
docPitfallWorksTitle=Werkt

# ---------------------------------------------------------------------------
# pagina's van de controls
# ---------------------------------------------------------------------------
barcodeHint=<code>sap.m</code> heeft hier geen tegenhanger voor: in de «keyboard wedge»-modus tikt een barcodescanner de code binnen enkele milliseconden in het veld met de focus en sluit hem af met <kbd>Enter</kbd>. De control meet de tijd tussen de aanslagen, zodat een scan <code>scan</code> afvuurt, terwijl dezelfde tekens met de hand tikken <code>change</code> afvuurt.
signatureHint=<code>sap.m</code> heeft hier geen tegenhanger voor. Het vlak tekent op een canvas en geeft het resultaat als PNG-data-URL terug in <code>value</code>, zodat het aan een model gebonden en als elke andere waarde naar de backend gestuurd kan worden. Lijndikte, plaatsaanduiding en wisknop volgen de eigenschap <code>size</code>.
overflowPlainHint=Sleep de schuifregelaar naar links: wat niet meer past, verhuist achter de knop met de drie puntjes. Op volle breedte is er helemaal geen overloopknop.
overflowPriorityHint=«Afdrukken» heeft prioriteit Low en loopt daarom als eerste over. «Opslaan» heeft NeverOverflow en blijft in de balk zolang er ook maar enige ruimte is — op de kleinste breedte verhuist het ook naar de popover, zodat de overloopknop bereikbaar blijft. «Info» heeft AlwaysOverflow en zit altijd in de popover — daarom toont deze balk de knop met de drie puntjes zelfs als er ruimte genoeg is.
overflowFooterHint=Maak het browservenster smaller om de voettekstbalk te zien overlopen — de popover gaat dan boven de balk open.
overflowDialogHint=De aggregatie buttons van sap.m.Dialog accepteert alleen sap.m.Button, maar de voettekst neemt elke sap.m.Toolbar aan — dus een aanraak-OverflowToolbar past er zo in. Van de twee balken is dit hier de betere: een dialoog is van nature smal, en wat niet past verhuist naar het overloopmenu in plaats van afgesneden te worden.
inputKeyboardHint=Met «Virtueel toetsenbord» gaat het toetsenbord uit de aggregatie keyboard onder het veld open zolang het veld de focus heeft, en het sluit zodra de focus weggaat.
textAreaKeyboardHint=Met «Virtueel toetsenbord» gaat het toetsenbord uit de aggregatie keyboard onder het veld open zolang het veld de focus heeft, en het sluit zodra de focus weggaat. De Enter-toets voegt een regeleinde in, zoals Enter dat in een veld met meerdere regels doet.

