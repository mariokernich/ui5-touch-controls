keyboardLayoutsTitle=De indelingen
keyboardLayoutsSubtitle=Wat elke waarde van de eigenschap mode laat zien
keyboardLayoutsText=De <code>mode</code> is het toetsenbord van een land, genoemd naar de taal waarvoor het dient. De rijen hieronder zijn wat die indeling laat zien met <code>displayNumbers=&quot;Always&quot;</code>; de schakelaars ernaast bepalen wat er verder op het toetsenbord staat. Klik op een indeling om het toetsenbord hierboven daarnaar om te schakelen.
keyboardSwitchesTitle=De schakelaars
keyboardSwitchesSubtitle=Wat elk van hen aan het toetsenbord toevoegt
keyboardSwitchesText=<p><b>displayNumbers</b> bepaalt wat er met de cijfers gebeurt. <code>Always</code> zet er een rij van boven de letters, zoals een toetsenbord met toetsen dat heeft. <code>Toggle</code> laat de letters met rust en zet de cijfers achter een toets <code>{numbers}</code>, zoals een telefoon dat doet &mdash; een rij cijfers zou daar elke toets smal maken. <code>ToggleOnMobile</code>, de standaardwaarde, is het eerste op een computer en een tablet en het tweede op een telefoon; welke van de twee wordt één keer bepaald, door het apparaat waarop de pagina is geopend. <code>Never</code> laat de cijfers helemaal weg.</p><p><b>showSpecialCharacters</b> voegt een set haakjes, tekens en valuta's toe. Waar de cijfers achter een eigen toets zitten, komt de set daarachter, zoals een telefoon van zijn letters naar zijn cijfers naar zijn symbolen gaat en terug; anders leidt een toets <code>{symbols}</code> erheen.</p><p><b>letterCase</b> zet het toetsenbord in één kast vast. <code>Upper</code> en <code>Lower</code> laten de shift-toets en de caps lock weg &mdash; er valt niets om te schakelen, en dat is precies wat een veld met een eigen kast wil: een materiaalnummer, een kenteken, een charge. Wordt bij Hindi niet bekeken, dat in plaats van hoofdletters een tweede set letters heeft.</p><p><b>showEmojis</b> hangt een set gezichtjes achter een eigen toets, op dezelfde manier waarop de cijfers en de speciale tekens bereikbaar zijn. Er staan alleen gezichtjes van één teken op: een dat uit meerdere is samengesteld &mdash; een gezin, een vlag &mdash; zou door de backspace weer uit elkaar worden gehaald.</p><p><b>extraKeys</b> zijn toetsen die op elke set naast de spatiebalk staan, welke set er ook op het scherm is. Daar hoort de toets die een veld bij de hand wil hebben in plaats van achter een omschakeling: <code>extraKeys=&quot;@,.&quot;</code> voor een adres, een eenheid voor een hoeveelheid. Het apenstaartje staat ook op de set speciale tekens, één toets verderop.</p><p><b>showCapsLock</b> voegt een <code>{lock}</code> naast de shift-toets toe. Shift valt na één letter weg, de lock blijft aan tot hij opnieuw wordt ingedrukt &mdash; en shift terwijl de lock aanstaat schrijft in kleine letters, net als op een toetsenbord met toetsen.</p><p><b>showEscape</b> voegt op elke set een toets <code>{esc}</code> toe als eerste toets van de bovenste rij, waar een toetsenbord met toetsen hem heeft. Hij vuurt <code>escape</code> af en verder niets; wat hij moet betekenen, wordt aan de applicatie overgelaten.</p><p><b>enterText</b> is wat er op de Enter-toets staat. Leeg blijft hij de pijl die hij is.</p>
padLayoutsTitle=De cijferblokken
padLayoutsSubtitle=Wat elke waarde van de eigenschap mode laat zien
padLayoutsText=De <code>mode</code> kiest het cijferblok, en het blok houdt zijn vorm wat er verder ook aanstaat: een min en een decimaalteken komen in de rij van de nul, de toets naar de speciale tekens en de Esc-toets in de functierij eronder. Waar noch de min noch het scheidingsteken is gevraagd, komen de backspace en de enter in plaats daarvan in de rij van de nul &mdash; een nul alleen op zijn regel zou een toets van drie kolommen breed zijn. Klik op een modus om het paneel hierboven daarnaar om te schakelen.
customKeysTitle=Een indeling schrijven
customKeysSubtitle=Rijen, toetsen, en de toetsen met een eigen betekenis
customKeysText=Een rij is een reeks toetsen gescheiden door spaties; in een view worden de rijen door komma's gescheiden. Alles wat niet in de tabel hieronder staat, schrijft zichzelf &mdash; een letter, een cijfer, een heel woord. Een toets die als de naam van een van de sets uit de aggregatie <code>layouts</code> is geschreven, schakelt naar die set, en een toets die de set noemt waarop men al is, leidt er weer uit.
