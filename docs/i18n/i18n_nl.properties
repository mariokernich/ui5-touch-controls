docButtonSummary=Een knop waarvan de hele geometrie één eigenschap size volgt, zodat het gebied dat een vinger moet raken meegroeit. Al het andere — tekst, pictogram, type en press — leest als sap.m.Button.
docButtonOriginal=De standaardknop van sap.m: tekst, pictogram, pictogrampositie, een knoptype en een press-event. Zijn hoogte is die welke het thema voorschrijft en verandert niet.
docButtonDescription=Knop met instelbare grootte, pictogram, pictogrampositie, type (alle waarden van sap.m.ButtonType), zijopvulling en breedte. Vuurt press af.
docSegmentedButtonSummary=Een rij aaneengesloten knoppen waarvan er precies één geselecteerd is, zo gedimensioneerd dat elk segment met een vinger te raken is.
docSegmentedButtonOriginal=Een rij aaneengesloten knoppen waarvan er precies één geselecteerd is, gevuld via sap.m.SegmentedButtonItem. Vuurt selectionChange af.
docSegmentedButtonDescription=Een rij aaneengesloten knoppen waarvan er precies één geselecteerd is, gevuld via tc:SegmentedButtonItem (key, text, icon, enabled). Ondersteunt selectedKey, width voor gelijk verdeelde segmenten, en vuurt selectionChange af.
docCheckBoxSummary=Een selectievakje waarvan het vakje, het vinkje, het label en het aanraakgebied samen meeschalen in plaats van op de grootte te blijven die het thema hun geeft.
docCheckBoxOriginal=Het standaardselectievakje van sap.m, met een label, een selectie met drie standen en waardestatussen. Vakje en aanraakgebied hebben de grootte die het thema hun geeft.
docCheckBoxDescription=Selectievakje waarvan het vakje, het vinkje, het label en het aanraakgebied samen meeschalen — bij grootte M komt de geometrie overeen met die van sap.m.CheckBox. Ondersteunt selected, partiallySelected, text, editable, wrapping, waardestatussen en width. Vuurt select af.
docRadioButtonSummary=Een keuzerondje dat met zijn eigenschap size meeschaalt, en een groepscontrol die er een set van in kolommen zet en zijn instellingen aan hen doorgeeft.
docRadioButtonOriginal=Een keuzerondje dat elkaar uitsluit met de andere van zijn groupName, plus een groepscontrol die er een set van in kolommen zet.
docRadioButtonDescription=Cirkel, punt, label en aanraakgebied schalen samen mee — bij grootte M komt de geometrie overeen met die van sap.m.RadioButton. Knoppen met dezelfde groupName sluiten elkaar uit; tc:RadioButtonGroup zet ze in kolommen en geeft zijn size, enabled, editable en waardestatus aan hen door. Vuurt select af.
docSwitchSummary=Een aan/uit-schakelaar die met zijn eigenschap size meegroeit, waar sap.m.Switch vastligt op 4rem bij 2rem.
docSwitchOriginal=Een aan/uit-schakelaar met een vaste grootte, met een accepteren/afwijzen-variant en eigen teksten voor de twee standen.
docSwitchDescription=Baan, greep en label schalen samen mee, waar sap.m.Switch vastligt op 4rem x 2rem. Ondersteunt state, customTextOn, customTextOff en het type AcceptReject; de kleuren komen uit de themaparameters @sapButton_Track_* / @sapButton_Handle_*. Vuurt change af.
docSelectSummary=Een dropdown waarvan de lijst opengaat in regels zo hoog als het veld zelf, zodat een item met een vinger te kiezen is.
docSelectOriginal=Een dropdown gevuld met sap.ui.core.Item-elementen. De lijst die hij opent houdt de standaard regelhoogte, hoe groot het veld ook is.
docSelectDescription=Dropdown gevuld met gewone sap.ui.core.Item-elementen. De lijst gaat open in een popover waarvan de regels zo hoog zijn als het veld, zodat ze met een vinger te raken zijn — de eigen lijst van sap.m.Select houdt zijn standaard regelhoogte, hoe groot het veld ook is. Ondersteunt selectedKey, editable, forceSelection, waardestatussen en width. Op een telefoon neemt de lijst het hele scherm, net als in sap.m. Vuurt change af.
docComboBoxSummary=Een Select waarin getikt kan worden: vrije tekst is toegestaan, wat er getikt wordt filtert de lijst, en de regels zijn zo hoog als het veld.
docComboBoxOriginal=Een dropdown waarin ook getikt kan worden: wat er getikt wordt filtert de lijst, en een waarde die niet in de lijst staat is toegestaan.
docComboBoxDescription=Een Select waarin getikt kan worden: vrije tekst is toegestaan en wat er getikt wordt filtert de lijst, waarvan de regels zo hoog zijn als het veld. Werkt samen met de toetsenborden van deze bibliotheek op een apparaat dat er geen heeft. Ondersteunt value, selectedKey, placeholder, editable, waardestatussen, width en showSecondaryValues, dat de additionalText van een sap.ui.core.ListItem aan het eind van de regel zet. Op een telefoon neemt de lijst het hele scherm en brengt ze een eigen veld mee om verder te tikken, net als in sap.m. Vuurt change en selectionChange af.
docDatePickerSummary=Een datumveld waarvan de kalender uit de knoppen van deze bibliotheek is opgebouwd, zodat een dag een vierkant is dat met de eigenschap size meegroeit.
docDatePickerOriginal=Een veld met een kalenderpopup op basis van sap.ui.unified.Calendar, met minDate/maxDate en instelbare waarde- en weergaveformaten.
docDatePickerDescription=Veld met een kalender die uit de eigen knoppen van de bibliotheek is opgebouwd, zodat een dag een vierkant is dat met de eigenschap size meegroeit in plaats van het vaste raster van sap.ui.unified.Calendar. Dag- en maandweergave, minDate/maxDate, valueFormat en displayFormat (stijl of patroon). Vuurt change af met value, dateValue en valid.
docTimePickerSummary=Een tijdveld dat met één tik op een uur en één op een minuut wordt gevuld, in plaats van een schuifregelaar die gesleept moet worden.
docTimePickerOriginal=Een veld met een popup waarin uren en minuten op schuifregelaars worden gezet die gesleept moeten worden.
docTimePickerDescription=Veld met twee kolommen knoppen — uren en minuten — zodat een tijd met één tik op een doel wordt gekozen dat met size meegroeit, waar sap.m.TimePicker een schuifregelaar gebruikt die gesleept moet worden. Ondersteunt minutesStep, valueFormat en displayFormat. Vuurt change één keer af, als de popover sluit.
docInputSummary=Een invoerveld van één regel dat met zijn eigenschap size meeschaalt en een toetsenbord van deze bibliotheek kan meebrengen, voor een apparaat dat er zelf geen heeft.
docInputOriginal=Het standaard eenregelige invoerveld van sap.m, met plaatsaanduiding, maximale lengte, waardestatussen en suggesties.
docInputDescription=Eenregelig invoerveld met instelbare grootte. Een toetsenbord van deze bibliotheek — tc:Keyboard, tc:NumberPad of tc:CustomKeyboard — kan in de aggregatie keyboard worden gezet; met showKeyboard gaat het dan open in een popover onder het veld zolang dat de focus heeft, en tikt het erin.
docTextAreaSummary=Een invoerveld van meerdere regels dat met zijn eigenschap size meeschaalt en een toetsenbord van deze bibliotheek opneemt, waarvan de Enter-toets hier een regeleinde invoegt.
docTextAreaOriginal=Het standaard meerregelige invoerveld van sap.m, met een aantal regels, een maximale lengte en waardestatussen.
docTextAreaDescription=Meerregelig invoerveld met instelbare grootte, aantal regels, maximale lengte en waardestatussen. Neemt net als de Input een toetsenbord op in de aggregatie keyboard; daar voegt de Enter-toets een regeleinde in. Vuurt change / liveChange af.
docTextSummary=Een tekst waarvan de tekstgrootte dezelfde eigenschap size volgt als elke andere control van de bibliotheek, zodat een label op de schaal van het veld ernaast staat.
docTextOriginal=Een tekstcontrol met terugloop en een maximaal aantal regels.
docTextDescription=Tekst met instelbare grootte en kleur. Vuurt press af.
docLinkSummary=Een link waarvan het opschrift — en daarmee het gebied dat met een vinger te raken is — met de eigenschap size meegroeit.
docLinkOriginal=Een link met href en target, en de ingetogen en benadrukte varianten.
docLinkDescription=Link met instelbare grootte, zodat het gebied dat met een vinger te raken is met het opschrift meegroeit. Ondersteunt href, target, wrapping, subtle, emphasized en width; een link met target="_blank" krijgt automatisch rel="noopener noreferrer". Vuurt press af.
docToolbarSummary=Een balk voor de controls van deze bibliotheek die toch nog past waar sap.m een eigen werkbalk verwacht — de voettekst van een Page of een Dialog bijvoorbeeld.
docToolbarOriginal=Een balk die zijn content in een rij zet. Veel kop- en voettekstaggregaties in sap.m zijn erop getypeerd.
docToolbarDescription=Werkbalkcontainer met een aggregatie content. Bruikbaar in standaardaggregaties zoals de voettekst van een Page of een Dialog.
docOverflowToolbarSummary=Een Toolbar die verplaatst wat niet past naar een popover achter een knop met drie puntjes, gestuurd door de prioriteiten van sap.m.OverflowToolbarLayoutData.
docOverflowToolbarOriginal=Een Toolbar die verplaatst wat niet past naar een popover achter een knop met drie puntjes, gestuurd door de prioriteiten van sap.m.OverflowToolbarLayoutData.
docOverflowToolbarDescription=Als tc:Toolbar, maar content die niet in de beschikbare breedte past verhuist achter een knop met drie puntjes die een popover met de rest opent. Begrijpt de prioriteiten van sap.m.OverflowToolbarLayoutData.
docStepInputSummary=Een numeriek veld met een min- en een plusknop die er samen mee worden gedimensioneerd, zodat een waarde met een duim te verzetten is.
docStepInputOriginal=Een numeriek veld met een min- en een plusknop, met min, max en stap.
docStepInputDescription=Minknop, invoerveld en plusknop, samen gedimensioneerd. Ondersteunt min, max, step. Vuurt change af.
docBarcodeInputSummary=Een invoerveld dat een barcodescanner van een tikkende persoon onderscheidt en de twee als verschillende events meldt.
docBarcodeInputDescription=Invoerveld dat een barcodescanner van een tikkende persoon onderscheidt: een reeks van minstens minLength tekens waarvan de tussenpozen onder scanTimeout blijven en die met Enter wordt afgesloten, vuurt scan af, al het andere vuurt change af. prefix en suffix worden van de code afgehaald, clearOnScan maakt het veld leeg voor de volgende.
docKeyboardSummary=Een lettertoetsenbord op het scherm voor een apparaat dat er zelf geen heeft. De mode kiest de indeling van een land; een handvol schakelaars bepaalt wat er verder op staat.
docKeyboardDescription=Lettertoetsenbord op het scherm, opgebouwd uit de eigen knoppen van de bibliotheek. De eigenschap mode kiest de indeling van een land — Engels, Duits, Frans, Spaans, Oekraïens, Russisch, Hindi — en een handvol schakelaars bepaalt wat er verder op staat: displayNumbers zet de cijfers boven de letters of achter een toets, showSpecialCharacters voegt een set tekens toe, letterCase zet het toetsenbord vast op hoofd- of kleine letters, showCapsLock en showEscape voegen elk een toets toe. Optionele invoer via een fysiek toetsenbord, waardebinding en de events change / keyPress / enter / escape.
docNumberPadSummary=Een cijferpaneel op het scherm in drie kolommen, voor alles wat als getal wordt ingevoerd. De mode kiest het blok: een computerpaneel, een telefoonpaneel of een rekenmachine.
docNumberPadDescription=Cijferpaneel op het scherm in drie kolommen. De eigenschap mode kiest het blok — Simple (het paneel van een computer), Phone (dat van een telefoon) of Calculator (met de vier basisbewerkingen) — en showDecimalSeparator, decimalSeparator, showSign en showSpecialCharacters voegen toe wat een veld naast de cijfers nodig heeft. Deelt de waardeafhandeling, de schaling en het verankeren met de andere toetsenborden.
docCustomKeyboardSummary=Het toetsenbord dat zijn toetsen rij voor rij aangereikt krijgt. Het is het antwoord op alles wat de kant-en-klare toetsenborden niet dekken.
docCustomKeyboardDescription=Schermtoetsenbord dat zijn toetsen aangereikt krijgt: de eigenschap layout is de rijen van één set, de aggregatie layouts draagt zoveel sets als nodig, en een toets die als de naam van een set is geschreven, schakelt daarheen. De aggregatie display bepaalt wat er op een afzonderlijke toets staat. Dit is het toetsenbord voor alles wat de kant-en-klare niet dekken.
docKeyboardBaseSummary=Het raderwerk achter alle drie de toetsenborden. Het wordt zelf niet in een view gezet — wat het niet weet, is welke toetsen te tonen, en juist dat onderscheidt zijn subklassen.
docKeyboardBaseDescription=Basisklasse van de schermtoetsenborden van deze bibliotheek, opgebouwd uit de eigen Button-controls van de bibliotheek zonder afhankelijkheid van derden. Alles wat niet over de keuze van de toetsen gaat, woont hier: de waarde en hoe een toets die verandert, de sets toetsen en het schakelen ertussen, shift en de caps lock, de toetsen van een echt toetsenbord via hardwareKeys, de grootte, de breedte en het verankeren. Het is het type waarop de aggregatie keyboard van een Input of een TextArea is getypeerd, zodat een Keyboard, een NumberPad en een CustomKeyboard er alle drie in passen.
docSignaturePadSummary=Een vlak om met een vinger of een stylus in te ondertekenen. De handtekening komt eruit als PNG-data-URL, zodat ze als elke andere waarde aan een model te binden is.
docSignaturePadDescription=Een vlak om met een vinger of een stylus in te ondertekenen. Tekent op een canvas en geeft de handtekening als PNG-data-URL terug in value, zodat ze aan een model gebonden kan worden. Lijndikte, plaatsaanduiding en wisknop volgen de eigenschap size; de lijnen overleven een grootteverandering. Vuurt change af.
docQuickDialogSummary=Kant-en-klare dialogen opgebouwd uit de aanraakcontrols, aangeroepen vanuit de controller in plaats van uitgeschreven in een view. Elke methode geeft een Promise terug.
docQuickDialogDescription=Hulpklasse voor dialogen die op aanraakbediening zijn ingericht, gebruikt vanuit de controller in plaats van een view: show, confirm, information, error, input, select, details. Elke methode geeft een Promise terug.
docThemeHorizon=Standaardthema van de demo
docThemeHorizonDark=Donkere variant van Horizon
docThemeHorizonHcb=Hoog contrast, donkere achtergrond
docThemeHorizonHcw=Hoog contrast, lichte achtergrond
docThemeFiori3=Vorig standaardthema van UI5
docThemeFiori3Dark=Donkere variant van Fiori 3
