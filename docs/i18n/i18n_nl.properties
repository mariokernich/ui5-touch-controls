# ---------------------------------------------------------------------------
# Aan de slag
# ---------------------------------------------------------------------------
gsTitle=Aan de slag
gsSubtitle=De standaard UI5-controls, herbouwd voor de vinger — plus de controls die sap.m mist
gsWhatTitle=Waar het om gaat
gsWhatSubtitle=Waarom sap.m alleen niet volstaat op een aanraakapparaat
gsWhatText1=<code>sap.m</code>-controls zijn gemaakt voor muis en toetsenbord. Op een tablet, op een werkvloerterminal of op een apparaat dat met handschoenen wordt bediend zijn ze eenvoudigweg te klein &mdash; en de contentdichtheid «cozy» brengt u maar één stap verder.
gsWhatText2=De bibliotheek pakt dat op twee manieren aan:<ul><li><strong>Ze bouwt de belangrijkste <code>sap.m</code>-controls opnieuw</strong> op hun oorspronkelijke structuur en opent ze voor schaling via één centrale eigenschap <code>size</code> (<code>S</code>&ndash;<code>6XL</code>) die op elke control hetzelfde werkt. U hoeft uw app niet te herbouwen: de controls houden de vertrouwde eigenschappen, aggregaties en events van hun originelen en zijn zo een directe vervanger.</li><li><strong>Ze voegt controls toe die <code>sap.m</code> helemaal niet heeft</strong>, voor situaties die alleen op aanraakapparaten voorkomen &mdash; het voorbeeld bij uitstek zijn de schermtoetsenborden.</li></ul>
gsSizesTitle=Eén eigenschap, negen groottes
gsSizesSubtitle=S · M (standaard) · L · XL · 2XL · 3XL · 4XL · 5XL · 6XL
gsSizesText=De grootte schaalt tekstgrootte, pictogramgrootte, opvulling en hoogte samen mee, zodat de controls op elke trede in verhouding blijven. Bind <code>size</code> aan een model om de grootte van de hele app tijdens runtime om te schakelen.
gsDropInTitle=Directe vervanger
gsDropInSubtitle=Namespace toevoegen, tc: voor de control zetten, een grootte kiezen
gsBeforeTitle=Voor — kaal sap.m
gsAfterTitle=Na — ui5.touch.controls
gsDropInText=Dezelfde aggregaties, dezelfde eigenschappen, dezelfde event-handlers &mdash; <code>press=".onSave"</code> roept nog steeds dezelfde methode in uw controller aan. <code>sap.m</code>-controls zoals <code>ToolbarSpacer</code> kunnen precies blijven waar ze zijn.
gsRequirementsTitle=Vereisten
gsRequirementsStrip=UI5 1.116 of hoger (OpenUI5 of SAPUI5) is vereist.
gsRequirementsText=De bibliotheek staat op npm als <code>ui5.touch.controls</code> en is te gebruiken in elke UI5-applicatie die met de UI5 Tooling (v3 of hoger) wordt gebouwd. Ze brengt haar eigen <code>ui5.yaml</code> mee, zodat de tooling haar vanzelf als bibliotheekafhankelijkheid oplost.
gsNextTitle=Volgende stappen
gsNextSubtitle=Waar u verder kunt
gsNextText=<ul><li><strong>Installatie</strong> &mdash; het pakket installeren, de bibliotheek declareren en TypeScript inrichten.</li><li><strong>Documentatie</strong> &mdash; de volledige controlreferentie, de groottenschaal, de interface <code>ISized</code> en de bekende valkuilen.</li><li><strong>Controls</strong> &mdash; één interactieve pagina per control, naast het <code>sap.m</code>-origineel.</li></ul>

