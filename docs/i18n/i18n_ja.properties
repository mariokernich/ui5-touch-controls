# ---------------------------------------------------------------------------
# はじめに
# ---------------------------------------------------------------------------
gsTitle=はじめに
gsSubtitle=指で扱えるように作り直した標準の UI5 コントロール ― そして sap.m に足りないもの
gsWhatTitle=どういうものか
gsWhatSubtitle=タッチ端末で sap.m だけでは足りない理由
gsWhatText1=<code>sap.m</code> のコントロールはマウスとキーボードのために作られています。タブレット、工場の端末、手袋をして操作する機器では単純に小さすぎます &mdash; コンテンツ密度 cozy にしても一歩進むだけです。
gsWhatText2=本ライブラリはそこに二つの方向から取り組みます。<ul><li><strong>主要な <code>sap.m</code> コントロールを元の構造のまま作り直し</strong>、どのコントロールでも同じように働く一つの <code>size</code> プロパティ（<code>S</code>&ndash;<code>6XL</code>）でサイズを変えられるようにしました。アプリを作り直す必要はありません。コントロールはオリジナルでおなじみのプロパティ、アグリゲーション、イベントをそのまま備えているので、そのまま差し替えられます。</li><li><strong><code>sap.m</code> にまったく存在しないコントロールを追加します</strong>。タッチ端末でしか起きない場面のためのもので、その代表例が画面上のキーボードです。</li></ul>
gsSizesTitle=一つのプロパティ、九段階のサイズ
gsSizesSubtitle=S · M（既定）· L · XL · 2XL · 3XL · 4XL · 5XL · 6XL
gsSizesText=サイズは文字サイズ、アイコンサイズ、余白、高さをまとめて拡大縮小するので、どの段階でもコントロールの釣り合いは崩れません。<code>size</code> をモデルにバインドすれば、実行中にアプリ全体のサイズを切り替えられます。
gsDropInTitle=そのまま差し替え
gsDropInSubtitle=名前空間を足し、コントロールの前に tc: を付け、サイズを指定する
gsBeforeTitle=変更前 ― 素の sap.m
gsAfterTitle=変更後 ― ui5.touch.controls
gsDropInText=アグリゲーションも、プロパティも、イベントハンドラも同じです &mdash; <code>press=".onSave"</code> は今までどおりコントローラの同じメソッドを呼びます。<code>ToolbarSpacer</code> のような <code>sap.m</code> のコントロールはそのままの位置に置いておけます。
gsRequirementsTitle=動作要件
gsRequirementsStrip=UI5 1.116 以降（OpenUI5 または SAPUI5）が必要です。
gsRequirementsText=本ライブラリは npm に <code>ui5.touch.controls</code> として公開されており、UI5 Tooling（v3 以降）でビルドするあらゆる UI5 アプリケーションで利用できます。<code>ui5.yaml</code> を同梱しているため、ツールが自動的にライブラリ依存として解決します。
gsNextTitle=次のステップ
gsNextSubtitle=ここからどこへ進むか
gsNextText=<ul><li><strong>セットアップ</strong> &mdash; パッケージのインストール、ライブラリの宣言、TypeScript の設定。</li><li><strong>ドキュメント</strong> &mdash; コントロール一覧、サイズの段階、<code>ISized</code> インタフェース、既知の落とし穴。</li><li><strong>コントロール</strong> &mdash; コントロールごとに 1 ページ、<code>sap.m</code> のオリジナルと並べて操作できます。</li></ul>

# ---------------------------------------------------------------------------
# セットアップ
# ---------------------------------------------------------------------------
setupTitle=セットアップ
setupSubtitle=ライブラリをインストールし、アプリで宣言し、TypeScript を設定する
setupPrereqTitle=前提条件
setupPrereqSubtitle=始める前にプロジェクトに必要なもの
setupPrereqStrip=UI5 1.116 以降（OpenUI5 または SAPUI5）と UI5 Tooling v3 以降。
setupPrereqText=本ライブラリは npm に <a href="https://www.npmjs.com/package/ui5.touch.controls" target="_blank">ui5.touch.controls</a> として公開されており、<a href="https://sap.github.io/ui5-tooling/" target="_blank">UI5 Tooling</a> でビルドするあらゆる UI5 アプリケーションで利用できます。
setupInstallTitle=1. パッケージをインストールする
setupInstallSubtitle=devDependency ではなく、通常の依存として
setupInstallText=UI5 Tooling がプロジェクトの依存として認識できるよう、ライブラリは<strong>通常の依存</strong>としてインストールしてください。パッケージには <code>ui5.yaml</code> が含まれているため、ツールが自動的にライブラリ依存として解決します。
setupMiddlewareTitle=1b. UI5 ミドルウェアを使う場合（別の方法）
setupMiddlewareSubtitle=プロジェクト依存として解決させず、静的ファイルとして配信する
setupMiddlewareText=UI5 Tooling のプロジェクト依存として取り込む代わりに、<a href="https://www.npmjs.com/package/ui5-middleware-servestatic" target="_blank">ui5-middleware-servestatic</a> で静的ファイルとして配信することもできます。
setupManifestTitle=2. manifest.json でライブラリを宣言する
setupManifestSubtitle=アプリが起動時に読み込むようにする
setupNamespaceTitle=3. ビューに名前空間を追加する
setupNamespaceSubtitle=接頭辞 tc は慣習にすぎません ― どんな接頭辞でも構いません
setupTypeScriptTitle=4. TypeScript のサポート（任意）
setupTypeScriptSubtitle=導入した時点で型が揃っています
setupTypeScriptStrip=「types」の記述がないと、UI5 Tooling はライブラリを自動的に読み込みません。
setupTypeScriptText=TypeScript のプロジェクトでは、パッケージを <code>tsconfig.json</code> の <code>types</code> に追加してください。型定義（<code>dist/index.d.ts</code>）はパッケージに含まれています。

# ---------------------------------------------------------------------------
# ドキュメント
# ---------------------------------------------------------------------------
docTitle=ドキュメント
docSubtitle=コントロール一覧、サイズの段階、ISized インタフェース、既知の落とし穴
docPortedTitle=sap.m コントロールのタッチ版
docPortedSubtitle=「代替対象」の列に、それぞれが置き換える sap.m のコントロールを示します
docPortedText=これらは標準コントロールを作り直したものです。よくある使い方についてはオリジナルのプロパティ、アグリゲーション、イベントをそのまま備えているため、そのまま差し替えられます。コントロールをクリックすると、その操作ページが開きます。
docNewTitle=タッチ向けの追加コントロール
docNewSubtitle=本ライブラリにしかありません
docNewText=タッチ端末でしか起きない場面に応えるものです。ハードウェアキーボードのない端末、入力の代わりのバーコードスキャナ、画面上の署名など。コントロールをクリックすると、その操作ページが開きます。
docClassesTitle=クラス
docClassesSubtitle=ビューに置くのではなく、コントローラから使います
docClassesText=ライブラリが加えるものがすべてコントロールというわけではありません。これらはコントローラのコードから呼び出され、タッチコントロールを使って自分で画面を組み立てます。クラスをクリックすると、その操作ページが開きます。
docThemesTitle=対応テーマ
docThemesSubtitle=すべてのコントロールが、これらのテーマ向けのテーマライブラリを同梱しています
docThemesText1=コントロールは色、境界線、影を現在のテーマのテーマパラメータから取るため、周囲の <code>sap.m</code> コントロールになじみます。テーマはこれまでどおり、ブートストラップの <code>data-sap-ui-theme</code> か、実行中なら <code>Theming.setTheme()</code> で設定してください。
docThemesText2=ここに挙がっていないテーマはライブラリに同梱されていません。その場合 UI5 は <code>ui5.touch.controls</code> についてベーステーマにフォールバックします。コントロールは使えますが、アプリの他の部分と色は揃いません。
docSizesTitle=サイズ
docSizesSubtitle=どのコントロールにも同じ size プロパティがあります
docSizesText1=指定できる値: <code>S</code> &middot; <code>M</code>（既定）&middot; <code>L</code> &middot; <code>XL</code> &middot; <code>2XL</code> &middot; <code>3XL</code> &middot; <code>4XL</code> &middot; <code>5XL</code> &middot; <code>6XL</code>
docSizesText2=サイズは文字サイズ、アイコンサイズ、余白、高さをまとめて拡大縮小するので、どの段階でもコントロールの釣り合いは崩れません。<code>size</code> をモデルにバインドすれば、実行中にアプリ全体のサイズを切り替えられます。
docISizedTitle=ISized
docISizedSubtitle=ui5.touch.controls.ISized
docISizedText=<code>size</code> プロパティを持つすべてのコントロールは、マーカーインタフェース <code>ui5.touch.controls.ISized</code> を実装しています。これによりサイズをまとめて扱えます。たとえばユーザの設定をビュー全体に適用する、といった具合です。
docKeyboardTitle=キーボード
docKeyboardSubtitle=sap.m に相当するものはありません
docKeyboardText1=工場の端末、キオスク、手袋をして操作する機器では、ハードウェアキーボードがないことが多く、OS の画面キーボードは使えないか、画面の半分を覆ってしまいます。UI5 にはこれに当たるコントロールがありません。本ライブラリは画面上のキーボードを 3 種類そろえており、いずれも自前のボタンで描かれています &mdash; 外部依存はなく、他のすべてと同じ <code>size</code> プロパティで大きさが決まります。
docKeyboardText2=<code>tc:Keyboard</code> は文字のキーボードです。<code>mode</code> が国ごとの配列で、いくつかのスイッチが、数字を文字の上に並べるかキーの奥に置くか、記号を出すか、どちらの字種で書くかを決めます。<code>tc:NumberPad</code> は数字を入れる項目向けの同じ発想です。<code>tc:CustomKeyboard</code> にはキーを行ごとに渡します。他の 2 つで足りないものはすべてこれで賄えます。<code>&#123;shift&#125;</code>、<code>&#123;space&#125;</code>、<code>&#123;bksp&#125;</code>、<code>&#123;enter&#125;</code> が特殊キーで、それ以外のキーは自分のラベルを入力します。3 つとも <code>hardwareKeys="true"</code> で実際のキーボードの打鍵を受け取り、<code>docked</code> で画面下端に固定でき、項目の <code>keyboard</code> アグリゲーションに収まります。
docPitfallTitle=落とし穴: sap.m.Button しか受け付けないアグリゲーション
docPitfallSubtitle=sap.m.Dialog の buttons、beginButton、endButton
docPitfallStrip=一部の標準アグリゲーションは sap.m.Button 型のため、実行時に tc:Button を拒否します: "Element ui5.touch.controls.Button#__button0" is not valid for aggregation "buttons"。
docPitfallText1=そもそもこれらのボタン枠はサイズを変える前提で作られていません &mdash; 標準のボタン高さに合わせて配置されています。
docPitfallText2=<strong>回避策は <code>footer</code> アグリゲーションです。</strong>こちらは <code>sap.m.Toolbar</code> 型で（UI5 1.110 以降で利用可能）、<code>tc:Toolbar</code> と <code>tc:OverflowToolbar</code> は <code>sap.m.Toolbar</code> を継承しているため、そのまま収まります。ダイアログはフッタの高さをツールバーに合わせるので、タッチサイズのボタンも正しく描画されます。ダイアログが狭くなりうる場面では <code>tc:OverflowToolbar</code> を選んでください。
docPitfallText3=MessageBox 風の単純なダイアログなら、自分で組み立てる必要はありません &mdash; <code>QuickDialog</code> はすでにこの方法でフッタを組み立てており、大きさは <code>size</code> オプションで決まります。
docSizesExample=サイズをバインドする
docPitfallBrokenTitle=動きません
docPitfallWorksTitle=動きます

# ---------------------------------------------------------------------------
# コントロールのページ
# ---------------------------------------------------------------------------
barcodeHint=<code>sap.m</code> に相当するものはありません。キーボードウェッジ方式のバーコードスキャナは、フォーカスのある項目に数ミリ秒でコードを打ち込み、<kbd>Enter</kbd> で締めくくります。本コントロールは打鍵の間隔を測るので、読み取りでは <code>scan</code> が、同じ文字を手で打った場合は <code>change</code> が発生します。
signatureHint=<code>sap.m</code> に相当するものはありません。署名欄は canvas に描画し、結果を PNG のデータ URL として <code>value</code> に渡すので、モデルにバインドして他の値と同じようにバックエンドへ送れます。線の太さ、プレースホルダ、消去ボタンは <code>size</code> プロパティに従います。
overflowPlainHint=スライダを左へドラッグしてください。収まりきらなくなった内容が三点ボタンの奥へ移動します。幅いっぱいのときはオーバーフローボタン自体がありません。
overflowPriorityHint=「印刷」は優先度 Low なので最初にあふれます。「保存」は NeverOverflow なので、多少でも場所がある限りツールバーに残ります &mdash; 最も狭い幅ではこれもポップオーバーへ移り、オーバーフローボタンに手が届くようにします。「情報」は AlwaysOverflow で常にポップオーバーの中にあります &mdash; だからこのツールバーは、場所が十分にあるときでも三点ボタンを表示します。
overflowFooterHint=ブラウザのウィンドウを狭くすると、フッタのツールバーがあふれる様子が見られます。ポップオーバーはツールバーの上側に開きます。
overflowDialogHint=sap.m.Dialog の buttons アグリゲーションは sap.m.Button しか受け付けませんが、フッタは任意の sap.m.Toolbar を受け入れます &mdash; だからタッチ版の OverflowToolbar がそのまま収まります。ここでは 2 つのツールバーのうちこちらが適しています。ダイアログはもともと狭く、収まらないものは切り詰められる代わりにオーバーフローメニューへ移るからです。
inputKeyboardHint=「仮想キーボード」を有効にすると、keyboard アグリゲーションのキーボードが、項目にフォーカスがある間だけ項目の下に開き、フォーカスが外れると閉じます。
textAreaKeyboardHint=「仮想キーボード」を有効にすると、keyboard アグリゲーションのキーボードが、項目にフォーカスがある間だけ項目の下に開き、フォーカスが外れると閉じます。その Enter キーは改行を入れます。複数行の項目で Enter が果たす役割と同じです。

