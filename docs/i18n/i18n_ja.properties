keyboardLayoutsTitle=各配列
keyboardLayoutsSubtitle=mode プロパティの値ごとに何が表示されるか
keyboardLayoutsText=<code>mode</code> は国ごとのキーボードで、使われる言語の名で呼ばれます。下の行は、その配列を <code>displayNumbers=&quot;Always&quot;</code> で表示したものです。隣のスイッチが、キーボードに他に何を載せるかを決めます。配列をクリックすると、上のキーボードがそれに切り替わります。
keyboardSwitchesTitle=各スイッチ
keyboardSwitchesSubtitle=それぞれがキーボードに何を加えるか
keyboardSwitchesText=<p><b>displayNumbers</b> は数字の扱いを決めます。<code>Always</code> は実物のキーボードのように、文字の上に数字を 1 行並べます。<code>Toggle</code> は文字だけを残し、数字を <code>{numbers}</code> キーの奥に置きます。携帯電話と同じやり方です &mdash; そこに数字を 1 行並べるとキーが細くなってしまいます。既定値の <code>ToggleOnMobile</code> は、パソコンとタブレットでは前者、携帯電話では後者になります。どちらになるかは、ページを開いた端末によって一度だけ決まります。<code>Never</code> は数字をまったく載せません。</p><p><b>showSpecialCharacters</b> は括弧、記号、通貨のセットを加えます。数字が専用キーの奥にある場合、このセットはその次に置かれます。携帯電話が文字から数字、記号へと進んで戻るのと同じです。そうでなければ <code>{symbols}</code> キーがそこへ導きます。</p><p><b>letterCase</b> はキーボードを一方の字種に固定します。<code>Upper</code> と <code>Lower</code> では Shift キーと Caps Lock が省かれます &mdash; 切り替えるものがないからで、字種が決まっている項目、たとえば品目番号、ナンバープレート、ロット番号などにはそれが望ましいのです。ヒンディー語では参照されません。大文字の代わりに 2 組目の文字を持つためです。</p><p><b>showEmojis</b> は顔文字のセットを専用キーの奥に置きます。数字や記号にたどり着くのと同じ仕組みです。載るのは 1 文字の絵文字だけです。複数の文字からできた絵文字 &mdash; 家族や旗など &mdash; はバックスペースでばらばらに分解されてしまうためです。</p><p><b>extraKeys</b> は、画面に出ているのがどのセットであっても、スペースキーの脇に並ぶキーです。切り替えの奥ではなく手元に置きたいキーはここに入れます。住所なら <code>extraKeys=&quot;@,.&quot;</code>、数量なら単位、といった具合です。アットマークは記号のセットにもありますが、キー 1 つ分だけ遠くなります。</p><p><b>showCapsLock</b> は Shift キーの隣に <code>{lock}</code> を加えます。Shift は 1 文字で解除されますが、ロックはもう一度押すまで続きます &mdash; そしてロック中の Shift は小文字を書きます。実物のキーボードと同じです。</p><p><b>showEscape</b> は、実物のキーボードと同じ位置、つまり最上段の先頭に <code>{esc}</code> キーをどのセットにも加えます。<code>escape</code> を発生させるだけで、それ以上は何もしません。何を意味するかはアプリケーションに委ねられます。</p><p><b>enterText</b> は Enter キーに書かれる文字です。空欄なら矢印のままです。</p>
padLayoutsTitle=数字の並び
padLayoutsSubtitle=mode プロパティの値ごとに何が表示されるか
padLayoutsText=<code>mode</code> は数字の並びを選びます。他に何を有効にしても並びの形は変わりません。マイナスと小数点はゼロの行に、記号へのキーと Esc キーはその下の機能キーの行に入ります。マイナスも小数点も指定されていない場合は、代わりにバックスペースと Enter がゼロの行に入ります &mdash; ゼロだけの行にすると 3 列分の幅のキーになってしまうからです。モードをクリックすると、上のパッドがそれに切り替わります。
customKeysTitle=配列を書く
customKeysSubtitle=行、キー、そして固有の意味を持つキー
customKeysText=1 行は空白で区切ったキーの並びです。ビューでは行どうしをカンマで区切ります。下の表にないものはすべて、それ自身を入力します &mdash; 1 文字でも、数字でも、単語ひとつでも構いません。<code>layouts</code> アグリゲーションのセット名を書いたキーはそのセットに切り替え、いま開いているセットの名を書いたキーはそこから戻ります。
