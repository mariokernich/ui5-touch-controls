kbIntroSubtitle=1 行で書ける文字のキーボード
kbIntroText=<p>工場の端末、キオスク、手袋をして操作する機器では、ハードウェアキーボードがないことが多く、OS の画面キーボードは使えないか、画面の半分を覆ってしまいます。テキストの項目には <code>tc:Keyboard</code> が答えになります。<code>mode</code> が国ごとの配列で、いくつかのスイッチが他に何を載せるかを決めます。配列を書き出す必要はありません。</p><p>これは 3 つのキーボードの 1 つで、キーに関わらない部分はすべて共通です。値、<code>size</code>、<code>docked</code>、<code>hardwareKeys</code> による実際のキーボードからの入力、そして <code>change</code>、<code>keyPress</code>、<code>enter</code>、<code>escape</code> の各イベントです。項目が数字を受け取るなら <code>tc:NumberPad</code> を、キーを自分で書くなら <code>tc:CustomKeyboard</code> を選んでください。3 つとも <code>tc:Input</code> や <code>tc:TextArea</code> の <code>keyboard</code> アグリゲーションに収まります。</p>
padIntroSubtitle=1 行で書ける数字のパッド
padIntroText=<p>数量、個数、コード、金額 &mdash; 端末の項目は文字より数字であることのほうが多く、3 列のパッドは親指が見ずに探し当てられるものです。<code>tc:NumberPad</code> がそのパッドです。<code>mode</code> が数字の並びを選び、隣のスイッチが、数字のほかに項目が必要とするものを加えます。</p><p>これは 3 つのキーボードの 1 つで、キーに関わらない部分はすべて共通です。値、<code>size</code>、<code>docked</code>、<code>hardwareKeys</code> による実際のキーボードからの入力、そして <code>change</code>、<code>keyPress</code>、<code>enter</code>、<code>escape</code> の各イベントです。項目が文字を受け取るなら <code>tc:Keyboard</code> を、キーを自分で書くなら <code>tc:CustomKeyboard</code> を選んでください。</p>
customIntroSubtitle=キーは行ごとに渡します
customIntroText=<p><code>tc:CustomKeyboard</code> は、出来合いのキーボードでは足りないすべてに応えるキーボードです。店が扱うサイズ、ナンバープレートに使える文字、機械のキーなど。<code>layout</code> プロパティは 1 セット分の行です。<code>layouts</code> アグリゲーションは必要なだけセットを持て、セット名を書いたキーがそこへ切り替えます。<code>display</code> アグリゲーションは、あるキーに何を表示するかを決めます。</p><p>これは 3 つのキーボードの 1 つで、キーに関わらない部分はすべて共通です。値、<code>size</code>、<code>docked</code>、<code>hardwareKeys</code> による実際のキーボードからの入力、そして <code>change</code>、<code>keyPress</code>、<code>enter</code>、<code>escape</code> の各イベントです。文字のキーボードや数字のパッドが欲しいだけなら、<code>tc:Keyboard</code> と <code>tc:NumberPad</code> が同じことを 1 行で言ってくれます。</p>
colProperty=プロパティ
colDefault=既定値
baseNote=tc:KeyboardBase は基底クラスであり、ビューに置くことはありません。tc:Keyboard、tc:NumberPad、tc:CustomKeyboard のいずれかを使ってください。このページは 3 つに共通する部分を説明します。
baseIntroSubtitle=3 つのキーボードに共通するもの
baseIntroText=<p>本ライブラリの 3 つのキーボードが違うのは 1 点だけ、キーがどこから来るかです。<code>tc:Keyboard</code> は言語といくつかのスイッチから組み立て、<code>tc:NumberPad</code> は数字の並びから組み立て、<code>tc:CustomKeyboard</code> は行ごとに渡されます。それ以外はすべてこのクラスであり、3 つとも同じように働きます。</p><p>つまり、値とキーによるその変化、キーのセットとその切り替え、Shift と Caps Lock、実際のキーボードからの入力、サイズ、幅、画面下端への固定です。キーそのものは本ライブラリの <code>tc:Button</code> コントロールです &mdash; 背後にサードパーティのキーボードはなく、他のすべてを拡大縮小するのと同じ <code>size</code> プロパティがキーも拡大縮小します。</p><p>これは <code>tc:Input</code> と <code>tc:TextArea</code> の <code>keyboard</code> アグリゲーションの型でもあり、だからこそ 3 つのどれでも項目に付けられます。</p>
basePropsTitle=3 つに共通するもの
basePropsSubtitle=本ライブラリのすべてのキーボードが持つプロパティ
basePropsText=これらに加えて、3 つはそれぞれ自分のキーを作るためのプロパティを持ちます &mdash; <code>tc:Keyboard</code> と <code>tc:NumberPad</code> の <code>mode</code> と各スイッチ、<code>tc:CustomKeyboard</code> の <code>layout</code> と <code>layouts</code> です。
baseEventsTitle=イベント
baseEventsSubtitle=本ライブラリのすべてのキーボードが発生させます
baseKeysTitle=固有の意味を持つキー
baseKeysSubtitle=3 つのキーボードすべてが理解します
baseKeysText=1 行は空白で区切ったキーの並びで、波括弧で囲まれたキーが下の表のいずれかです。これらはここで処理されるため、3 つのキーボードで意味は同じです。キーボードが決めるのは、画面に出すかどうかだけです。
baseSubclassesTitle=3 つのキーボード
baseSubclassesSubtitle=どれを選ぶか
baseHowTitle=大きさについてひとこと
baseHowText=<p>どれほど場所が狭くても、キーボードを横にスクロールする必要はありません。キーは高さと同じ幅でありたいと考えますが、場所が詰まればその幅を譲ります。高さは <code>size</code> から決まり、変わりません。</p><p><code>docked</code> を付けると、キーボードはページの流れを離れ、内容の上に重なって画面下端に位置します。携帯電話の画面キーボードと同じです。携帯電話やタブレットではこのとき画面の幅いっぱいになり、<code>width</code> は参照されません。項目に付けたキーボードも同じように固定されますが、そのポップオーバーがキーボードを静的領域に置くため、モーダルダイアログの上にも重なります &mdash; ダイアログの中の項目に入力できるのはこのおかげです。</p>
propValue=キーボードの現在の入力値。
propEmphasizedKeys=強調して描くキー。配列に書かれているとおりに指定します ― 特殊キーの波括弧は省略できます。修飾キーは、ここでの指定にかかわらず、有効な間は強調されます。
propMaxLength=最大文字数。0 は無制限を意味します。
propEnabled=キーボードをそもそも使えるかどうか。
propHardwareKeys=キーボードにフォーカスがある間、実際のキーボードからの入力を受け取るかどうか。受け取るのは配列に含まれるキーだけです。Enter とバックスペースは常に処理されます。
propSize=各キーのタッチサイズ。全体の大きさがこれに従います。
propWidth=キーボードの幅。携帯電話やタブレットで固定表示している場合は参照されません。
propDocked=キーボードをページの流れの中に置くのではなく、内容の上に重ねて画面下端に置くかどうか。
evtChange=値が変わるたびに発生します ― キー、バックスペース、値を動かすものすべてが対象です。
evtKeyPress=キーが押されるたびに発生し、配列に書かれているとおりのキーを伴います。
evtEnter=Enter キーが押されたときに、現在の値とともに発生します。
evtEscape=Esc キーが押されたときに発生します。キーボード自身は何もしません。キーボードを表示している項目は、これを受けてポップオーバーを閉じます。
subKeyboard=テキストの項目向け。国ごとの配列を 1 行で書けます。
subNumberPad=数字の項目向け。パソコン、電話、電卓のいずれかの並びによる 3 列のパッドです。
subCustomKeyboard=それ以外すべて。キーを行ごとに、必要なだけのセットで書き出します。
