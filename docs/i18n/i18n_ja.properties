# ---------------------------------------------------------------------------
# コントロール一覧
# ---------------------------------------------------------------------------
docButtonSummary=全体の大きさが 1 つの size プロパティに従うボタン。指が当てるべき領域もそれに合わせて広がります。それ以外 ― テキスト、アイコン、種類、press ― は sap.m.Button と同じように読めます。
docButtonOriginal=sap.m の標準ボタン。テキスト、アイコン、アイコンの位置、ボタンの種類、press イベント。高さはテーマが定めたもので、変わりません。
docButtonDescription=サイズを指定できるボタン。アイコン、アイコンの位置、種類（sap.m.ButtonType のすべての値）、左右の余白、幅。press を発生させます。
docSegmentedButtonSummary=つながったボタンが 1 列に並び、そのうちちょうど 1 つが選ばれている状態。どのセグメントも指で押せる大きさです。
docSegmentedButtonOriginal=つながったボタンが 1 列に並び、そのうちちょうど 1 つが選ばれます。sap.m.SegmentedButtonItem で内容を与えます。selectionChange を発生させます。
docSegmentedButtonDescription=つながったボタンが 1 列に並び、そのうちちょうど 1 つが選ばれます。tc:SegmentedButtonItem（key、text、icon、enabled）で内容を与えます。selectedKey、セグメントを均等に割り付ける width に対応し、selectionChange を発生させます。
docCheckBoxSummary=四角、チェックマーク、ラベル、タッチ領域がテーマ任せの大きさに留まらず、そろって拡大縮小するチェックボックス。
docCheckBoxOriginal=sap.m の標準チェックボックス。ラベル、3 状態の選択、値の状態を備えます。四角とタッチ領域の大きさはテーマが定めます。
docCheckBoxDescription=四角、チェックマーク、ラベル、タッチ領域がそろって拡大縮小するチェックボックス ― サイズ M では sap.m.CheckBox と同じ大きさになります。selected、partiallySelected、text、editable、wrapping、値の状態、width に対応。select を発生させます。
docRadioButtonSummary=size プロパティに合わせて拡大縮小するラジオボタンと、それらを列に並べて自分の設定を渡すグループコントロール。
docRadioButtonOriginal=同じ groupName の他のボタンと排他になるラジオボタンと、それらを列に並べるグループコントロール。
docRadioButtonDescription=円、点、ラベル、タッチ領域がそろって拡大縮小します ― サイズ M では sap.m.RadioButton と同じ大きさになります。同じ groupName のボタンは互いに排他です。tc:RadioButtonGroup はそれらを列に並べ、自分の size、enabled、editable、値の状態を渡します。select を発生させます。
docSwitchSummary=size プロパティに合わせて大きくなるオン／オフのスイッチ。sap.m.Switch は 4rem × 2rem で固定です。
docSwitchOriginal=大きさが固定のオン／オフスイッチ。承認／却下の変種と、2 つの状態それぞれに独自の文字を指定できます。
docSwitchDescription=溝、つまみ、ラベルがそろって拡大縮小します。sap.m.Switch は 4rem x 2rem で固定です。state、customTextOn、customTextOff、AcceptReject の種類に対応。色は @sapButton_Track_* / @sapButton_Handle_* のテーマパラメータから取ります。change を発生させます。
docSelectSummary=開いた一覧の行の高さが項目そのものと同じになるドロップダウン。指でひとつ選べます。
docSelectOriginal=sap.ui.core.Item で内容を与えるドロップダウン。開く一覧は、項目がどれほど大きくても標準の行高のままです。
docSelectDescription=素の sap.ui.core.Item で内容を与えるドロップダウン。一覧はポップオーバーで開き、行の高さは項目と同じなので指で押せます ― sap.m.Select の一覧は、項目がどれほど大きくても標準の行高のままです。selectedKey、editable、forceSelection、値の状態、width に対応。携帯電話では sap.m と同じく一覧が画面全体を占めます。change を発生させます。
docComboBoxSummary=入力もできる Select。自由なテキストを許し、打った内容で一覧を絞り込み、行の高さは項目と同じです。
docComboBoxOriginal=入力もできるドロップダウン。打った内容で一覧を絞り込み、一覧にない値も許します。
docComboBoxDescription=入力もできる Select。自由なテキストを許し、打った内容で一覧を絞り込みます。一覧の行の高さは項目と同じです。キーボードのない端末では、本ライブラリのキーボードと組み合わせて使えます。value、selectedKey、placeholder、editable、値の状態、width、そして sap.ui.core.ListItem の additionalText を行末に置く showSecondaryValues に対応。携帯電話では sap.m と同じく一覧が画面全体を占め、入力を続けるための項目も備えます。change と selectionChange を発生させます。
docDatePickerSummary=カレンダーを本ライブラリのボタンで組み立てた日付項目。1 日が size プロパティに合わせて大きくなる四角になります。
docDatePickerOriginal=sap.ui.unified.Calendar を土台にしたカレンダーをポップアップで開く項目。minDate/maxDate と、値・表示それぞれの書式を指定できます。
docDatePickerDescription=カレンダーをライブラリ自身のボタンで組み立てた項目。sap.ui.unified.Calendar の固定した格子ではなく、1 日が size プロパティに合わせて大きくなる四角になります。日表示と月表示、minDate/maxDate、valueFormat と displayFormat（スタイルまたはパターン）。value、dateValue、valid とともに change を発生させます。
docTimePickerSummary=スライダをドラッグする代わりに、時を 1 回、分を 1 回押すだけで入力できる時刻項目。
docTimePickerOriginal=ポップアップで時と分をスライダのドラッグで設定する項目。
docTimePickerDescription=時と分の 2 列のボタンを備えた項目。size に合わせて大きくなる的を 1 回押すだけで時刻を選べます。sap.m.TimePicker はドラッグの必要なスライダを使います。minutesStep、valueFormat、displayFormat に対応。change はポップオーバーが閉じるときに 1 度だけ発生します。
docInputSummary=size プロパティに合わせて拡大縮小する 1 行の入力項目。キーボードのない端末のために、本ライブラリのキーボードを連れて来られます。
docInputOriginal=sap.m の標準的な 1 行入力項目。プレースホルダ、最大文字数、値の状態、入力候補を備えます。
docInputDescription=サイズを指定できる 1 行の入力項目。本ライブラリのキーボード ― tc:Keyboard、tc:NumberPad、tc:CustomKeyboard ― を keyboard アグリゲーションに置けます。showKeyboard を有効にすると、項目にフォーカスがある間、項目の下のポップオーバーに開いてそこへ入力します。
docTextAreaSummary=size プロパティに合わせて拡大縮小する複数行の入力項目。本ライブラリのキーボードを収められ、その Enter キーはここでは改行を入れます。
docTextAreaOriginal=sap.m の標準的な複数行入力項目。行数、最大文字数、値の状態を備えます。
docTextAreaDescription=サイズ、行数、最大文字数、値の状態を指定できる複数行の入力項目。Input と同じく keyboard アグリゲーションにキーボードを収められ、そこでは Enter キーが改行を入れます。change / liveChange を発生させます。
docTextSummary=文字サイズがライブラリの他のコントロールと同じ size プロパティに従うテキスト。隣の項目と同じ尺度でラベルを置けます。
docTextOriginal=折り返しと最大行数を持つテキストコントロール。
docTextDescription=サイズと色を指定できるテキスト。press を発生させます。
docLinkSummary=文字 ― そしてそれに伴う指で押せる領域 ― が size プロパティに合わせて大きくなるリンク。
docLinkOriginal=href と target を持つリンク。控えめな変種と強調した変種があります。
docLinkDescription=サイズを指定できるリンク。指で押せる領域が文字とともに広がります。href、target、wrapping、subtle、emphasized、width に対応。target="_blank" のリンクには rel="noopener noreferrer" が自動的に付きます。press を発生させます。
docToolbarSummary=本ライブラリのコントロールを載せるバー。それでいて sap.m が自前のツールバーを期待する場所 ― たとえば Page や Dialog のフッタ ― にそのまま収まります。
docToolbarOriginal=内容を 1 列に並べるバー。sap.m の多くのヘッダ・フッタのアグリゲーションがこの型を要求します。
docToolbarDescription=content アグリゲーションを持つツールバーのコンテナ。Page や Dialog のフッタなど、標準のアグリゲーションで使えます。
docOverflowToolbarSummary=収まりきらないものを三点ボタンの奥のポップオーバーへ移す Toolbar。sap.m.OverflowToolbarLayoutData の優先度で制御します。
docOverflowToolbarOriginal=収まりきらないものを三点ボタンの奥のポップオーバーへ移す Toolbar。sap.m.OverflowToolbarLayoutData の優先度で制御します。
docOverflowToolbarDescription=tc:Toolbar と同じですが、使える幅に収まりきらない内容は三点ボタンの奥へ移り、そのボタンが残りを収めたポップオーバーを開きます。sap.m.OverflowToolbarLayoutData の優先度を解釈します。
docStepInputSummary=マイナスとプラスのボタンが一緒に大きさを変える数値項目。親指で値を刻めます。
docStepInputOriginal=マイナスとプラスのボタンを備えた数値項目。min、max、刻み幅を指定できます。
docStepInputDescription=マイナスボタン、入力欄、プラスボタンが一緒に大きさを変えます。min、max、step に対応。change を発生させます。
docBarcodeInputSummary=バーコードスキャナと人の手入力を見分け、両者を別のイベントとして報告する入力項目。
docBarcodeInputDescription=バーコードスキャナと人の手入力を見分ける入力項目。minLength 文字以上が続き、その間隔が scanTimeout を下回り、Enter で締めくくられた場合は scan を、それ以外は change を発生させます。prefix と suffix はコードから取り除かれ、clearOnScan は次に備えて項目を空にします。
docKeyboardSummary=キーボードのない端末のための、画面上の文字キーボード。mode が国ごとの配列を選び、いくつかのスイッチが他に何を載せるかを決めます。
docKeyboardDescription=ライブラリ自身のボタンで組み立てた、画面上の文字キーボード。mode プロパティが国ごとの配列 ― 英語、ドイツ語、フランス語、スペイン語、ウクライナ語、ロシア語、ヒンディー語 ― を選び、いくつかのスイッチが他に何を載せるかを決めます。displayNumbers は数字を文字の上かキーの奥に置き、showSpecialCharacters は記号のセットを加え、letterCase はキーボードを大文字か小文字に固定し、showCapsLock と showEscape はそれぞれキーを 1 つ加えます。物理キーボードからの入力（任意）、値のバインド、change / keyPress / enter / escape の各イベント。
docNumberPadSummary=数字として入力するものすべてに向けた、3 列の画面上の数字パッド。mode が並びを選びます ― パソコンのパッド、電話のパッド、電卓。
docNumberPadDescription=3 列の画面上の数字パッド。mode プロパティが並びを選び ― Simple（パソコンのパッド）、Phone（電話のパッド）、Calculator（四則演算付き）― showDecimalSeparator、decimalSeparator、showSign、showSpecialCharacters が、数字のほかに項目が必要とするものを加えます。値の扱い、サイズ、画面下端への固定は他のキーボードと共通です。
docCustomKeyboardSummary=キーを行ごとに渡すキーボード。出来合いのキーボードでは足りないすべてに応えます。
docCustomKeyboardDescription=キーを渡して使う画面上のキーボード。layout プロパティは 1 セット分の行、layouts アグリゲーションは必要なだけセットを持て、セット名を書いたキーがそこへ切り替えます。display アグリゲーションは、あるキーに何を表示するかを決めます。出来合いのキーボードでは足りないすべてに応えるキーボードです。
docKeyboardBaseSummary=3 つのキーボードすべての土台となる仕組み。それ自身をビューに置くことはありません ― 知らないのはどのキーを見せるかだけで、まさにそこが各サブクラスの違いです。
docKeyboardBaseDescription=本ライブラリの画面キーボードの基底クラス。サードパーティに頼らず、ライブラリ自身の Button コントロールで組み立てられています。どのキーを見せるかに関わらない部分はすべてここにあります。値とキーによるその変化、キーのセットとその切り替え、Shift と Caps Lock、hardwareKeys による実際のキーボードからの入力、サイズ、幅、画面下端への固定。Input や TextArea の keyboard アグリゲーションの型でもあるため、Keyboard、NumberPad、CustomKeyboard のいずれもそこに収まります。
docSignaturePadSummary=指やスタイラスで署名する項目。署名は PNG のデータ URL として得られるので、他の値と同じようにモデルにバインドできます。
docSignaturePadDescription=指やスタイラスで署名する項目。canvas に描画し、署名を PNG のデータ URL として value に渡すので、モデルにバインドできます。線の太さ、プレースホルダ、消去ボタンは size プロパティに従い、描いた線は大きさを変えても残ります。change を発生させます。
docQuickDialogSummary=タッチコントロールで組み立てた出来合いのダイアログ。ビューに書くのではなくコントローラから呼び出します。どのメソッドも Promise を返します。
docQuickDialogDescription=タッチ向けのダイアログのためのヘルパークラス。ビューではなくコントローラから使います: show、confirm、information、error、input、select、details。どのメソッドも Promise を返します。
docThemeHorizon=デモの既定テーマ
docThemeHorizonDark=Horizon のダーク版
docThemeHorizonHcb=高コントラスト、暗い背景
docThemeHorizonHcw=高コントラスト、明るい背景
docThemeFiori3=UI5 の以前の既定テーマ
docThemeFiori3Dark=Fiori 3 のダーク版
