# ---------------------------------------------------------------------------
# справочник элементов: что представляет собой элемент, что делает оригинал
# из sap.m и что из этого сделала библиотека. Показывается в шапке страницы
# элемента и в таблицах страницы документации.
# ---------------------------------------------------------------------------
docButtonSummary=Кнопка, вся геометрия которой следует одному свойству size: площадь, в которую нужно попасть пальцем, растёт вместе с ним. Всё остальное — текст, значок, тип и press — ведёт себя как у sap.m.Button.
docButtonOriginal=Стандартная кнопка sap.m: текст, значок, положение значка, тип кнопки и событие press. Высоту задаёт тема, и она не меняется.
docButtonDescription=Кнопка с настраиваемым размером, значком, положением значка, типом (все значения sap.m.ButtonType), боковыми отступами и шириной. Вызывает press.
docSegmentedButtonSummary=Ряд слитных кнопок, из которых выбрана ровно одна — достаточно крупных, чтобы попасть в каждый сегмент пальцем.
docSegmentedButtonOriginal=Ряд слитных кнопок, из которых выбрана ровно одна, наполняется через sap.m.SegmentedButtonItem. Вызывает selectionChange.
docSegmentedButtonDescription=Ряд слитных кнопок, из которых выбрана ровно одна, наполняется через tc:SegmentedButtonItem (key, text, icon, enabled). Поддерживает selectedKey и width для равномерно распределённых сегментов, вызывает selectionChange.
docCheckBoxSummary=Флажок, у которого рамка, галочка, подпись и область нажатия растут вместе, а не остаются того размера, что даёт тема.
docCheckBoxOriginal=Стандартный флажок sap.m с подписью, трёхпозиционным выбором и value state. Размер рамки и области нажатия задаёт тема.
docCheckBoxDescription=Флажок, у которого рамка, галочка, подпись и область нажатия растут вместе — при размере M геометрия совпадает с sap.m.CheckBox. Поддерживает selected, partiallySelected, text, editable, wrapping, value state и width. Вызывает select.
docRadioButtonSummary=Переключатель, который растёт вместе со своим свойством size, и групповой элемент, раскладывающий набор таких переключателей по столбцам и передающий им свои настройки.
docRadioButtonOriginal=Переключатель, взаимоисключающий с остальными из своего groupName, и групповой элемент, раскладывающий набор таких переключателей по столбцам.
docRadioButtonDescription=Круг, точка, подпись и область нажатия растут вместе — при размере M геометрия совпадает с sap.m.RadioButton. Переключатели с одним groupName исключают друг друга; tc:RadioButtonGroup раскладывает их по столбцам и передаёт им size, enabled, editable и value state. Вызывает select.
docSwitchSummary=Выключатель, который растёт вместе со своим свойством size, тогда как sap.m.Switch остаётся при 4rem × 2rem.
docSwitchOriginal=Выключатель фиксированного размера с вариантом accept/reject и собственными надписями для обоих состояний.
docSwitchDescription=Дорожка, ползунок и подпись растут вместе, тогда как sap.m.Switch остаётся при 4rem × 2rem. Поддерживает state, customTextOn, customTextOff и тип AcceptReject; цвета берутся из параметров темы @sapButton_Track_* / @sapButton_Handle_*. Вызывает change.
docSelectSummary=Выпадающий список, строки которого такие же крупные, как само поле, — в запись можно попасть пальцем.
docSelectOriginal=Выпадающий список из элементов sap.ui.core.Item. Открываемый им список сохраняет стандартную высоту строки, как бы велико ни было поле.
docSelectDescription=Выпадающий список из обычных элементов sap.ui.core.Item. Список открывается во всплывающем окне, строки которого такие же крупные, как поле, и потому доступны пальцу — родной список sap.m.Select сохраняет стандартную высоту строки, как бы велико ни было поле. Поддерживает selectedKey, editable, forceSelection, value state и width. На телефоне список занимает весь экран, как и в sap.m. Вызывает change.
docComboBoxSummary=Select, в который можно печатать: свободный текст разрешён, набранное фильтрует список, а строки такие же крупные, как поле.
docComboBoxOriginal=Выпадающий список, в который можно и печатать: набранное фильтрует список, а значение вне списка тоже допустимо.
docComboBoxDescription=Select, в который можно печатать: свободный текст разрешён, набранное фильтрует список, а его строки такие же крупные, как поле. На устройстве без собственной клавиатуры работает вместе с клавиатурами этой библиотеки. Поддерживает value, selectedKey, placeholder, editable, value state, width и showSecondaryValues, который ставит additionalText элемента sap.ui.core.ListItem в конец строки. На телефоне список занимает весь экран и приносит собственное поле, чтобы продолжать набор, — как и в sap.m. Вызывает change и selectionChange.
docDatePickerSummary=Поле даты, календарь которого собран из кнопок этой библиотеки: день — квадрат, растущий вместе со свойством size.
docDatePickerOriginal=Поле с всплывающим календарём на основе sap.ui.unified.Calendar, с minDate/maxDate и настраиваемыми форматами значения и отображения.
docDatePickerDescription=Поле с календарём из собственных кнопок библиотеки: день — квадрат, растущий вместе со свойством size, вместо жёсткой сетки sap.ui.unified.Calendar. Вид дней и месяцев, minDate/maxDate, valueFormat и displayFormat (стиль или шаблон). Вызывает change с value, dateValue и valid.
docTimePickerSummary=Поле времени, которое заполняется одним касанием часа и одним касанием минуты, вместо ползунка, который нужно тянуть.
docTimePickerOriginal=Поле со всплывающим окном, где часы и минуты выставляются ползунками, которые нужно тянуть.
docTimePickerDescription=Поле с двумя столбцами кнопок — часы и минуты: время выбирается одним касанием цели, которая растёт вместе с size, тогда как sap.m.TimePicker использует ползунок. Поддерживает minutesStep, valueFormat и displayFormat. Вызывает change один раз — при закрытии всплывающего окна.
docInputSummary=Однострочное поле ввода, которое масштабируется своим свойством size и может принести с собой клавиатуру этой библиотеки — для устройств без собственной.
docInputOriginal=Стандартное однострочное поле ввода sap.m с подсказкой, максимальной длиной, value state и предложениями.
docInputDescription=Однострочное поле ввода с настраиваемым размером. В его агрегацию keyboard можно поставить клавиатуру этой библиотеки — tc:Keyboard, tc:NumberPad или tc:CustomKeyboard; при showKeyboard она открывается во всплывающем окне под полем, пока у поля есть фокус, и пишет в него.
docTextAreaSummary=Многострочное поле ввода, которое масштабируется своим свойством size и принимает клавиатуру этой библиотеки: её Enter вставляет здесь перевод строки.
docTextAreaOriginal=Стандартное многострочное поле ввода sap.m с числом строк, максимальной длиной и value state.
docTextAreaDescription=Многострочное поле ввода с настраиваемым размером, числом строк, максимальной длиной и value state. Принимает клавиатуру в агрегацию keyboard так же, как Input; там Enter вставляет перевод строки. Вызывает change / liveChange.
docTextSummary=Текст, кегль которого следует тому же свойству size, что и у любого другого элемента библиотеки, — подпись оказывается в масштабе поля рядом.
docTextOriginal=Элемент текста с переносом и ограничением на число строк.
docTextDescription=Текст с настраиваемым размером и цветом. Вызывает press.
docLinkSummary=Ссылка, у которой подпись — а вместе с ней и площадь, в которую можно попасть пальцем, — растёт вместе со свойством size.
docLinkOriginal=Ссылка с href и target, а также варианты subtle и emphasized.
docLinkDescription=Ссылка с настраиваемым размером: площадь, в которую можно попасть пальцем, растёт вместе с подписью. Поддерживает href, target, wrapping, subtle, emphasized и width; ссылке с target="_blank" автоматически добавляется rel="noopener noreferrer". Вызывает press.
docToolbarSummary=Панель для элементов этой библиотеки, которая при этом входит всюду, где sap.m ждёт собственную панель, — например, в подвал Page или Dialog.
docToolbarOriginal=Панель, раскладывающая содержимое в строку. На неё типизированы многие агрегации шапки и подвала в sap.m.
docToolbarDescription=Контейнер-панель с агрегацией content. Годится для стандартных агрегаций, например для подвала Page или Dialog.
docOverflowToolbarSummary=Панель, которая переносит всё, что не помещается, за кнопку с тремя точками во всплывающее окно — по приоритетам из sap.m.OverflowToolbarLayoutData.
docOverflowToolbarOriginal=Панель, которая переносит всё, что не помещается, за кнопку с тремя точками во всплывающее окно — по приоритетам из sap.m.OverflowToolbarLayoutData.
docOverflowToolbarDescription=Как tc:Toolbar, только содержимое, которое не влезает в доступную ширину, уходит за кнопку с тремя точками, открывающую всплывающее окно с остальным. Понимает приоритеты sap.m.OverflowToolbarLayoutData.
docStepInputSummary=Числовое поле с кнопками «минус» и «плюс», которые масштабируются вместе с ним, — значение можно менять большим пальцем.
docStepInputOriginal=Числовое поле с кнопками «минус» и «плюс», с min, max и step.
docStepInputDescription=Кнопка «минус», поле ввода и кнопка «плюс», масштабируемые вместе. Поддерживает min, max и step. Вызывает change.
docBarcodeInputSummary=Поле ввода, которое отличает сканер штрихкода от человека за клавиатурой и сообщает о них разными событиями.
docBarcodeInputDescription=Поле ввода, которое отличает сканер штрихкода от человека за клавиатурой: серия не менее чем из minLength символов с паузами короче scanTimeout, завершённая клавишей Enter, вызывает scan, всё остальное — change. prefix и suffix отрезаются от кода, clearOnScan очищает поле для следующего.
docKeyboardSummary=Экранная клавиатура из букв для устройств без собственной. mode выбирает раскладку страны; несколько переключателей решают, что ещё на ней есть.
docKeyboardDescription=Экранная клавиатура из букв, собранная из собственных кнопок библиотеки. Свойство mode выбирает раскладку страны — английскую, немецкую, французскую, испанскую, итальянскую, португальскую, шведскую, турецкую, румынскую, украинскую, русскую, хинди, — а несколько переключателей решают, что ещё на ней есть: displayNumbers кладёт цифры над буквами или убирает за клавишу, showSpecialCharacters добавляет набор знаков, letterCase закрепляет за клавиатурой верхний или нижний регистр, showCapsLock и showEscape добавляют по клавише. Плюс ввод с настоящей клавиатуры, связываемое значение и события change / keyPress / enter / escape.
docNumberPadSummary=Экранный цифровой блок в три столбца — для всего, что вводится числом. mode выбирает блок: компьютерный, телефонный или калькуляторный.
docNumberPadDescription=Экранный цифровой блок в три столбца. Свойство mode выбирает блок — Simple (как у компьютера), Phone (как у телефона) или Calculator (с четырьмя арифметическими действиями), — а showDecimalSeparator, decimalSeparator, showSign и showSpecialCharacters добавляют то, что нужно полю сверх цифр. Работу со значением, масштабирование и стыковку он делит с остальными клавиатурами.
docCustomKeyboardSummary=Клавиатура, которой клавиши передают построчно. Это ответ на всё, чего готовые клавиатуры не покрывают.
docCustomKeyboardDescription=Экранная клавиатура, которой передают её клавиши: свойство layout — это ряды одного набора, агрегация layouts несёт столько наборов, сколько нужно, а клавиша с именем набора переключает на него. Агрегация display задаёт, что написано на отдельной клавише. Это клавиатура для всего, чего готовые не покрывают.
docKeyboardBaseSummary=Механика всех трёх клавиатур. Сама в представление не ставится: ей недостаёт решения, какие клавиши показывать, — а именно оно и различает её подклассы.
docKeyboardBaseDescription=Базовый класс экранных клавиатур этой библиотеки, собранный из её же элементов Button, без сторонних зависимостей. Здесь лежит всё, что не касается выбора клавиш: значение и то, как клавиша его меняет, наборы клавиш и переключение между ними, Shift и Caps Lock, клавиши настоящей клавиатуры через hardwareKeys, размер, ширина и стыковка. Под него типизирована агрегация keyboard у Input и TextArea — потому Keyboard, NumberPad и CustomKeyboard входят туда одинаково.
docSignaturePadSummary=Поле для подписи пальцем или стилусом. Подпись выходит как PNG в виде data-URL, поэтому её можно связать с моделью, как любое другое значение.
docSignaturePadDescription=Поле для подписи пальцем или стилусом. Рисует на canvas и отдаёт подпись в value как PNG в виде data-URL, так что её можно связать с моделью. Толщина линии, подсказка и кнопка очистки следуют свойству size; штрихи переживают изменение размера. Вызывает change.
docQuickDialogSummary=Готовые диалоги из сенсорных элементов, вызываемые из контроллера, а не выписываемые в представлении. Каждый метод возвращает Promise.
docQuickDialogDescription=Вспомогательный класс для сенсорных диалогов, вызываемый из контроллера, а не из представления: show, confirm, information, error, input, select, details. Каждый метод возвращает Promise.
docThemeHorizon=Тема демо по умолчанию
docThemeHorizonDark=Тёмный вариант Horizon
docThemeHorizonHcb=Высокий контраст, тёмный фон
docThemeHorizonHcw=Высокий контраст, светлый фон
docThemeFiori3=Прежняя тема UI5 по умолчанию
docThemeFiori3Dark=Тёмный вариант Fiori 3
