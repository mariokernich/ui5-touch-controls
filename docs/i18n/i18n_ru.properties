kbIntroSubtitle=Клавиатура из букв, заданная одной строкой
kbIntroText=<p>На цеховом терминале, в киоске или на устройстве, которым работают в перчатках, аппаратной клавиатуры чаще всего нет, а экранная клавиатура операционной системы либо недоступна, либо закрывает пол-экрана. <code>tc:Keyboard</code> — ответ для текстового поля: <code>mode</code> задаёт раскладку страны, а несколько переключателей решают, что ещё на ней есть. Раскладку выписывать не нужно.</p><p>Это одна из трёх клавиатур, и всё, что не касается клавиш, у них общее: значение, <code>size</code>, <code>docked</code>, клавиши настоящей клавиатуры через <code>hardwareKeys</code> и события <code>change</code>, <code>keyPress</code>, <code>enter</code> и <code>escape</code>. Для полей из цифр есть <code>tc:NumberPad</code>, для собственных клавиш — <code>tc:CustomKeyboard</code>. Все три помещаются в агрегацию <code>keyboard</code> элемента <code>tc:Input</code> или <code>tc:TextArea</code>.</p>
padIntroSubtitle=Цифровой блок, заданный одной строкой
padIntroText=<p>Количество, штуки, код, цена &mdash; поля терминала чаще состоят из цифр, чем из букв, а блок в три столбца большой палец находит не глядя. <code>tc:NumberPad</code> и есть такой блок: <code>mode</code> выбирает набор цифр, а переключатели рядом добавляют то, что нужно полю сверх них.</p><p>Это одна из трёх клавиатур, и всё, что не касается клавиш, у них общее: значение, <code>size</code>, <code>docked</code>, клавиши настоящей клавиатуры через <code>hardwareKeys</code> и события <code>change</code>, <code>keyPress</code>, <code>enter</code> и <code>escape</code>. Для текстовых полей есть <code>tc:Keyboard</code>, для собственных клавиш — <code>tc:CustomKeyboard</code>.</p>
customIntroSubtitle=Клавиши передаются ей построчно
customIntroText=<p><code>tc:CustomKeyboard</code> — клавиатура для всего, чего готовые не покрывают: размеры, которыми торгует магазин, буквы, допустимые в автомобильном номере, клавиши станка. Свойство <code>layout</code> — это ряды одного набора; агрегация <code>layouts</code> несёт столько наборов, сколько нужно, а клавиша с именем набора переключает на него. Агрегация <code>display</code> задаёт, что написано на отдельной клавише.</p><p>Это одна из трёх клавиатур, и всё, что не касается клавиш, у них общее: значение, <code>size</code>, <code>docked</code>, клавиши настоящей клавиатуры через <code>hardwareKeys</code> и события <code>change</code>, <code>keyPress</code>, <code>enter</code> и <code>escape</code>. Там, где нужна клавиатура из букв или блок цифр, <code>tc:Keyboard</code> и <code>tc:NumberPad</code> говорят то же самое одной строкой.</p>
colProperty=Property
colDefault=По умолчанию
baseNote=tc:KeyboardBase — базовый класс, его никогда не ставят в представление. Берите tc:Keyboard, tc:NumberPad или tc:CustomKeyboard; эта страница рассказывает, что у всех трёх общего.
baseIntroSubtitle=Что общего у трёх клавиатур
baseIntroText=<p>Три клавиатуры этой библиотеки различаются ровно одним: откуда берутся клавиши. <code>tc:Keyboard</code> строит их из языка и нескольких переключателей, <code>tc:NumberPad</code> — из цифрового блока, <code>tc:CustomKeyboard</code> получает их построчно. Всё остальное — этот класс, и работает оно у всех трёх одинаково.</p><p>Это значение и то, как клавиша его меняет, наборы клавиш и переключение между ними, Shift и Caps Lock, клавиши настоящей клавиатуры, размер, ширина и стыковка. Сами клавиши — это элементы <code>tc:Button</code> этой библиотеки: за ними не стоит чужая клавиатура, и то же свойство <code>size</code>, что масштабирует всё остальное, масштабирует и их.</p><p>Это ещё и тип, под который типизирована агрегация <code>keyboard</code> у <code>tc:Input</code> и <code>tc:TextArea</code> — потому любая из трёх подходит полю.</p>
basePropsTitle=Что общего у трёх
basePropsSubtitle=Свойства, которые есть у каждой клавиатуры этой библиотеки
basePropsText=Кроме них у каждой из трёх есть свойства, из которых складываются её собственные клавиши &mdash; <code>mode</code> и переключатели у <code>tc:Keyboard</code> и <code>tc:NumberPad</code>, <code>layout</code> и <code>layouts</code> у <code>tc:CustomKeyboard</code>.
baseEventsTitle=События
baseEventsSubtitle=Их вызывает каждая клавиатура этой библиотеки
baseKeysTitle=Клавиши со своим значением
baseKeysSubtitle=Их понимают все три клавиатуры
baseKeysText=Ряд — это клавиши через пробел, а клавиша в фигурных скобках — одна из перечисленных ниже. Обрабатываются они здесь и потому означают одно и то же на всех трёх клавиатурах; клавиатура решает лишь, выводить ли их на экран.
baseSubclassesTitle=Три клавиатуры
baseSubclassesSubtitle=Какую когда брать
baseHowTitle=Несколько слов о геометрии
baseHowText=<p>Как бы ни было тесно, клавиатуру никогда не приходится прокручивать вбок: клавиша хотела бы быть такой же широкой, как высокой, и уступает эту ширину, когда места мало. Высота идёт от <code>size</code> и остаётся неизменной.</p><p>При <code>docked</code> клавиатура выходит из потока страницы и садится у нижнего края экрана поверх содержимого — так же, как экранная клавиатура телефона. На телефоне и планшете она занимает тогда всю ширину экрана, а <code>width</code> не учитывается. Клавиатура при поле пристыковывается так же, только её всплывающее окно помещает её в статическую область, поэтому она перекрывает и модальный диалог &mdash; именно это и позволяет печатать в поле внутри диалога.</p>
propValue=Текущее введённое значение клавиатуры.
propEmphasizedKeys=Клавиши, которые рисуются выделенными; записываются так же, как стоят в раскладке — фигурные скобки у специальной клавиши необязательны. Модификатор выделен, пока он включён.
propMaxLength=Максимальное число символов. 0 — без ограничения.
propEnabled=Можно ли вообще пользоваться клавиатурой.
propHardwareKeys=Принимается ли ввод с настоящей клавиатуры, пока у экранной есть фокус. Берутся только клавиши, входящие в раскладку; Enter и Backspace обрабатываются всегда.
propSize=Сенсорный размер каждой клавиши. Вся геометрия следует за ним.
propWidth=Ширина клавиатуры. У пристыкованной клавиатуры на телефоне или планшете не учитывается.
propDocked=Сидит ли клавиатура у нижнего края экрана поверх содержимого вместо того, чтобы стоять в потоке страницы.
evtChange=Вызывается всякий раз, когда меняется значение — клавиша, обратный пробел, что угодно.
evtKeyPress=Вызывается на каждое нажатие клавиши; передаётся клавиша в том виде, в каком она стоит в раскладке.
evtEnter=Вызывается при нажатии клавиши Enter, с текущим значением.
evtEscape=Вызывается при нажатии клавиши Escape. Сама клавиатура при этом ничего не делает; поле, которое её показывает, закрывает своё всплывающее окно.
subKeyboard=Текстовое поле: раскладка страны, заданная одной строкой.
subNumberPad=Поле из цифр: блок в три столбца — как у компьютера, телефона или калькулятора.
subCustomKeyboard=Всё остальное: клавиши выписываются построчно, и наборов столько, сколько нужно.
colType=Тип
colParameters=Параметры
exampleBaseField=Любая из трёх на поле ввода (XML-представление)

