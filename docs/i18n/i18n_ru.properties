qdYesNo=Вопрос с кнопками Yes (выделена) и No.
qdOkCancel=Классический выбор Ok/Cancel, Ok выделена.
qdRetry=Три действия, например для поправимых ошибок; выделена Retry.
qdDelete=Подтверждение необратимого действия; выделена Delete.
qdConfirm=Подтверждение «да/нет», возвращает логическое значение.
qdInput=Запрашивает текст; Enter подтверждает как Ok.
qdSelect=Выбор из списка через ComboBox; возвращает выбранный key.
qdError=Диалог ошибки: состояние Error, значок ошибки и кнопка Close.
qdInformation=Информационный диалог: состояние Information, значок сведений и кнопка Ok.
qdDetails=Сообщение со ссылкой «Show details», которая по желанию раскрывает подробности.
qdSaveDiscard=Только собственные действия строками; выделена Save.
qdPublish=Смесь собственных действий и MessageAction; выделена Publish.
qdRename=Диалог ввода с собственным действием Rename (выделено).
qdTheme=Диалог выбора с собственными действиями Apply/Reset; выделена Apply.
