keyboardLayoutsTitle=Раскладки
keyboardLayoutsSubtitle=Что показывает каждое значение свойства mode
keyboardLayoutsText=<code>mode</code> — это клавиатура страны, названная по языку, для которого её используют. Ряды ниже показывают, что даёт раскладка при <code>displayNumbers=&quot;Always&quot;</code>; что ещё лежит на клавиатуре, решают переключатели рядом. Щёлкните раскладку, чтобы переключить на неё клавиатуру выше. Там, где язык записывается буквами, которые клавиатура с клавишами собирает мёртвой клавишей, — гласные с диакритикой португальского и итальянского — они лежат в отдельном наборе, к которому ведёт клавиша рядом с пробелом.
keyboardSwitchesTitle=Переключатели
keyboardSwitchesSubtitle=Что каждый из них добавляет к клавиатуре
keyboardSwitchesText=<p><b>displayNumbers</b> решает судьбу цифр. <code>Always</code> кладёт их рядом над буквами, как на клавиатуре с клавишами. <code>Toggle</code> оставляет буквы при себе и убирает цифры за клавишу <code>{numbers}</code>, как это делает телефон &mdash; ряд цифр сделал бы там каждую клавишу узкой. <code>ToggleOnMobile</code>, значение по умолчанию, ведёт себя как первое на компьютере и планшете и как второе на телефоне; что именно из двух, решается один раз — по устройству, на котором открыли страницу. <code>Never</code> убирает цифры вовсе.</p><p><b>showSpecialCharacters</b> добавляет набор скобок, знаков и валют. Если цифры уже за отдельной клавишей, набор становится за ними — как телефон переходит от букв к цифрам, потом к символам и обратно; иначе к нему ведёт клавиша <code>{symbols}</code>.</p><p><b>letterCase</b> закрепляет за клавиатурой один регистр. При <code>Upper</code> и <code>Lower</code> клавиши Shift и Caps Lock не появляются &mdash; переключать нечего, и это именно то, чего хочет поле с собственным регистром: номер материала, автомобильный номер, партия. Для хинди не учитывается: там вместо заглавных второй набор букв.</p><p><b>showEmojis</b> вешает набор рожиц за отдельную клавишу — тем же способом, каким доступны цифры и спецсимволы. На нём только те, что состоят из одного символа: составное — семья, флаг — обратный пробел разобрал бы обратно на части.</p><p><b>extraKeys</b> — клавиши, которые стоят рядом с пробелом в каждом наборе, какой бы сейчас ни был на экране. Туда идёт клавиша, которая нужна полю под рукой, а не за переключателем: <code>extraKeys=&quot;@,.&quot;</code> для адреса, единица измерения для количества. Собака есть и в наборе спецсимволов — на одну клавишу дальше.</p><p><b>showCapsLock</b> добавляет рядом с Shift клавишу <code>{lock}</code>. Shift отпадает после одной буквы, Caps Lock держится, пока его не нажмут снова &mdash; а Shift при включённом Caps Lock пишет строчными, как на клавиатуре с клавишами.</p><p><b>showEscape</b> добавляет клавишу <code>{esc}</code> первой в верхнем ряду, там же, где она на клавиатуре с клавишами, и так в каждом наборе. Она вызывает <code>escape</code> и больше ничего не делает; что это должно означать, решает приложение.</p><p><b>enterText</b> — надпись на клавише Enter. Пусто оставляет ту стрелку, что там и есть.</p>
padLayoutsTitle=Цифровые блоки
padLayoutsSubtitle=Что показывает каждое значение свойства mode
padLayoutsText=<code>mode</code> выбирает цифровой блок, и блок сохраняет свою форму, что бы ещё ни было включено: минус и десятичный разделитель встают в ряд нуля, клавиша к спецсимволам и Escape — в ряд функциональных клавиш под ним. Если ни минус, ни разделитель не нужны, в ряд нуля переезжают обратный пробел и Enter &mdash; ноль в отдельной строке был бы клавишей в три столбца шириной. Щёлкните режим, чтобы переключить на него блок выше.
customKeysTitle=Как пишется раскладка
customKeysSubtitle=Ряды, клавиши и те, у которых есть своё значение
customKeysText=Ряд — это клавиши через пробел; в представлении ряды разделяются запятыми. Всё, чего нет в таблице ниже, пишет само себя &mdash; буква, цифра, целое слово. Клавиша, названная именем одного из наборов в агрегации <code>layouts</code>, переключает на этот набор, а клавиша с именем набора, на котором она уже стоит, выводит обратно.
