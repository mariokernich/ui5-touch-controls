apiKbDisplayNumbers=Куда попадают цифры: в ряд над буквами, за отдельную клавишу, или первое на компьютере и второе на телефоне.
apiKbShowSpecialCharacters=Доступен ли с клавиатуры набор скобок, знаков и валют.
apiKbShowCapsLock=Стоит ли рядом с Shift фиксатор регистра. Он остаётся включённым, пока его не нажмут снова.
apiKbLetterCase=В каком регистре пишутся буквы. Upper и Lower закрепляют клавиатуру за одним из них и убирают Shift и фиксатор.
apiKbShowEmojis=Лежит ли за отдельной клавишей набор рожиц. На нём только те, что состоят из одного символа.
apiKbExtraKeys=Свои клавиши рядом с пробелом, на каждом наборе — собака адреса, точка домена, единица измерения.
apiKbShowEscape=Несёт ли верхний левый угол клавишу Escape. Она вызывает escape и больше ничего.
apiKbEnterText=Что написано на клавише Enter. Пустое оставляет ей ту стрелку, что есть.
apiPadMode=Блок цифр: Simple как на компьютере, Phone со звёздочкой и решёткой, Calculator с четырьмя действиями.
apiPadShowSpecialCharacters=Доступен ли с панели набор знаков — тех, из которых состоит пароль, и знаков препинания заметки.
apiPadShowDecimalSeparator=Есть ли на панели клавиша десятичного разделителя. Учитывается только в Simple; у двух других блоков четвёртый ряд занят.
apiPadDecimalSeparator=Знак, который пишет эта клавиша. Пустое берёт знак текущего языка: запятую в русском, точку в английском.
apiPadShowSign=Есть ли на панели клавиша минуса, для значения, которое может быть отрицательным. Учитывается только в Simple.
apiPadShowEscape=Несёт ли ряд функциональных клавиш клавишу Escape. Она вызывает escape и больше ничего.
apiPadEnterText=Что написано на клавише Enter. Пустое оставляет ей ту стрелку, что есть.
apiCustomLayout=Ряды клавиш для клавиатуры, которая всегда показывает только один набор. Клавиши разделяются пробелами, ряды — запятыми.
apiCustomLayouts=Наборы клавиш, которые клавиатура умеет показывать. Клавиша с именем набора переключает на него, и наборы важнее свойства layout.
apiCustomDisplay=Что говорит отдельная клавиша, когда знак, который выбрала бы клавиатура, не тот.
apiBcValue=Значение поля.
apiBcPlaceholder=Текст, который виден, пока поле пусто.
apiBcScanTimeout=Наибольший промежуток между двумя нажатиями в миллисекундах, который ещё считается сканером. Человек и близко к нему не подходит.
apiBcMinLength=Самый короткий код, который ещё принимается за скан. Более короткая очередь считается набором с рук.
apiBcPrefix=Символы, которые сканер посылает перед кодом. Они срезаются со значения.
apiBcSuffix=Символы, которые сканер посылает после кода, кроме завершающего Enter. Они срезаются со значения.
apiBcClearOnScan=Очищает поле после скана, чтобы следующий код сразу попал в него.
apiBcEnabled=Можно ли вообще работать с полем.
apiBcEditable=Можно ли менять значение.
apiBcValueState=Состояние проверки, которое показывает поле: Error, Warning, Success, Information.
apiBcWidth=Ширина поля.
apiBcSize=Сенсорный размер поля.
apiBcScan=Вызывается, когда отсканирован штрихкод.
apiBcChange=Вызывается, когда значение изменили вручную — по Enter или когда поле теряет фокус.
apiBcLiveChange=Вызывается на каждое нажатие клавиши.
apiSpValue=Подпись как data URL PNG, пусто, пока ничего не нарисовано. Пустая строка очищает поле.
apiSpPlaceholder=Подсказка на линии, пока поле пусто. Пустая строка оставляет линию голой.
