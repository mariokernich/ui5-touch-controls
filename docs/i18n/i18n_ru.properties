# ---------------------------------------------------------------------------
# С чего начать
# ---------------------------------------------------------------------------
gsTitle=С чего начать
gsSubtitle=Стандартные элементы UI5, пересобранные под палец — и вдобавок те, которых в sap.m нет

gsWhatTitle=Обзор
gsWhatSubtitle=Почему одного sap.m на сенсорном устройстве мало
gsWhatText1=Элементы <code>sap.m</code> рассчитаны на мышь и клавиатуру. На планшете, на цеховом терминале или на устройстве, которым работают в перчатках, они попросту слишком мелкие &mdash; и плотностью содержимого «cozy» тут дело не решается.
gsWhatText2=Библиотека берётся за это с двух сторон:<ul><li><strong>Она пересобирает важнейшие элементы <code>sap.m</code></strong> на их же основе и открывает их для масштабирования через одно свойство <code>size</code> (<code>S</code>&ndash;<code>6XL</code>), которое работает одинаково у каждого элемента. Приложение переписывать не нужно: элементы сохраняют привычные свойства, агрегации и события оригиналов, поэтому годятся как прямая замена.</li><li><strong>Она добавляет элементы, которых в <code>sap.m</code> нет вовсе</strong> &mdash; для случаев, которые возникают только на сенсорных устройствах; первый пример тому экранные клавиатуры.</li></ul>

gsSizesTitle=Одно свойство, девять размеров
gsSizesSubtitle=S · M (по умолчанию) · L · XL · 2XL · 3XL · 4XL · 5XL · 6XL
gsSizesText=Размер меняет кегль, размер значка, внутренние отступы и высоту разом, поэтому элементы остаются соразмерными на каждой ступени. Свяжите <code>size</code> с моделью — и размер всего приложения переключается на ходу.

gsDropInTitle=Прямая замена
gsDropInSubtitle=Добавить пространство имён, поставить tc: перед элементом, выбрать размер
gsBeforeTitle=До — обычный sap.m
gsAfterTitle=После — ui5.touch.controls
gsDropInText=Те же агрегации, те же свойства, те же обработчики &mdash; <code>press=".onSave"</code> по-прежнему вызывает тот же метод в вашем контроллере. Элементы <code>sap.m</code> вроде <code>ToolbarSpacer</code> остаются ровно там, где стояли.

gsRequirementsTitle=Требования
gsRequirementsStrip=Нужен UI5 версии 1.116 или выше (OpenUI5 либо SAPUI5).
gsRequirementsText=Библиотека опубликована в npm под именем <code>ui5.touch.controls</code> и подходит любому приложению UI5, которое собирается через UI5 Tooling (v3 и выше). Она несёт собственный <code>ui5.yaml</code>, поэтому инструментарий сам подхватывает её как зависимость-библиотеку.

gsNextTitle=Следующие шаги
gsNextSubtitle=Куда двигаться дальше
gsNextText=<ul><li><strong>Установка</strong> &mdash; поставить пакет, объявить библиотеку и настроить TypeScript.</li><li><strong>Документация</strong> &mdash; полный справочник элементов, шкала размеров, интерфейс <code>ISized</code> и известные подводные камни.</li><li><strong>Элементы</strong> &mdash; по одной интерактивной странице на элемент, рядом с оригиналом из <code>sap.m</code>.</li></ul>

# ---------------------------------------------------------------------------
# Установка
# ---------------------------------------------------------------------------
setupTitle=Установка
setupSubtitle=Поставить библиотеку, объявить её в приложении и настроить TypeScript

setupPrereqTitle=Что нужно заранее
setupPrereqSubtitle=Что должно быть в проекте до начала
setupPrereqStrip=UI5 версии 1.116 или выше (OpenUI5 либо SAPUI5) и UI5 Tooling v3 или выше.
setupPrereqText=Библиотека опубликована в npm под именем <a href="https://www.npmjs.com/package/ui5.touch.controls" target="_blank">ui5.touch.controls</a> и подходит любому приложению UI5, которое собирается через <a href="https://sap.github.io/ui5-tooling/" target="_blank">UI5 Tooling</a>.

setupInstallTitle=1. Установить пакет
setupInstallSubtitle=Как обычную зависимость, не как devDependency
setupInstallText=Ставьте библиотеку <strong>обычной зависимостью</strong>, чтобы UI5 Tooling увидел её как зависимость проекта. В пакете лежит <code>ui5.yaml</code>, поэтому инструментарий сам разрешает её как зависимость-библиотеку.

setupMiddlewareTitle=1b. Через UI5-middleware (другой способ)
setupMiddlewareSubtitle=Отдавать библиотеку статикой вместо зависимости проекта
setupMiddlewareText=Вместо того чтобы подключать библиотеку зависимостью проекта UI5 Tooling, её можно отдавать статикой через <a href="https://www.npmjs.com/package/ui5-middleware-servestatic" target="_blank">ui5-middleware-servestatic</a>.

setupManifestTitle=2. Объявить библиотеку в manifest.json
setupManifestSubtitle=Чтобы приложение загружало её при запуске

setupNamespaceTitle=3. Добавить пространство имён в представления
setupNamespaceSubtitle=Префикс tc — только соглашение, подойдёт любой

setupTypeScriptTitle=4. Поддержка TypeScript (по желанию)
setupTypeScriptSubtitle=Полная типизация из коробки
setupTypeScriptStrip=Без записи в «types» UI5 Tooling не загрузит библиотеку автоматически.
setupTypeScriptText=В проектах на TypeScript добавьте пакет в запись <code>types</code> вашего <code>tsconfig.json</code>. Определения типов лежат в пакете (<code>dist/index.d.ts</code>).

# ---------------------------------------------------------------------------
# Документация
# ---------------------------------------------------------------------------
docTitle=Документация
docSubtitle=Справочник элементов, шкала размеров, интерфейс ISized и известные подводные камни

docPortedTitle=Сенсорные версии элементов sap.m
docPortedSubtitle=В столбце «Заменяет» указан элемент sap.m, вместо которого он идёт
docPortedText=Это пересборки стандартных элементов. В обычных случаях они сохраняют свойства, агрегации и события оригиналов, поэтому годятся как прямая замена. Щёлкните элемент, чтобы открыть его интерактивную страницу.

docNewTitle=Дополнительные элементы для сенсорных экранов
docNewSubtitle=Есть только в этой библиотеке
docNewText=Они закрывают то, что возникает только на сенсорном устройстве: терминал без аппаратной клавиатуры, сканер штрихкода вместо набора, подпись прямо на экране. Щёлкните элемент, чтобы открыть его интерактивную страницу.

docClassesTitle=Классы
docClassesSubtitle=Вызываются из контроллера, а не ставятся в представление
docClassesText=Не всё, что добавляет библиотека, — элемент управления. Эти вызываются из кода контроллера и строят свой интерфейс сами, из сенсорных элементов. Щёлкните класс, чтобы открыть его интерактивную страницу.

docThemesTitle=Совместимость с темами
docThemesSubtitle=Для этих тем все элементы несут собственную библиотеку темы
docThemesText1=Цвета, рамки и тени элементы берут из параметров активной темы, поэтому они вписываются в окружение из элементов <code>sap.m</code>. Тему задают как обычно: через <code>data-sap-ui-theme</code> в бутстрапе или на ходу через <code>Theming.setTheme()</code>.
docThemesText2=Темы, которых здесь нет, библиотека не поставляет. Тогда UI5 откатывается для <code>ui5.touch.controls</code> на базовую тему: элементы остаются работоспособными, но по цветам с остальным приложением не сойдутся.

docSizesTitle=Размеры
docSizesSubtitle=У каждого элемента одно и то же свойство size
docSizesText1=Возможные значения: <code>S</code> &middot; <code>M</code> (по умолчанию) &middot; <code>L</code> &middot; <code>XL</code> &middot; <code>2XL</code> &middot; <code>3XL</code> &middot; <code>4XL</code> &middot; <code>5XL</code> &middot; <code>6XL</code>
docSizesText2=Размер меняет кегль, размер значка, внутренние отступы и высоту разом, поэтому элементы остаются соразмерными на каждой ступени. Свяжите <code>size</code> с моделью — и размер всего приложения переключается на ходу.

docISizedTitle=ISized
docISizedSubtitle=ui5.touch.controls.ISized
docISizedText=Все элементы со свойством <code>size</code> реализуют интерфейс-маркер <code>ui5.touch.controls.ISized</code>. Это позволяет работать с размером обобщённо — например, применить пользовательскую настройку сразу ко всему представлению.

docKeyboardTitle=Клавиатуры
docKeyboardSubtitle=Соответствия в sap.m нет
docKeyboardText1=На цеховом терминале, в киоске или на устройстве, которым работают в перчатках, аппаратной клавиатуры чаще всего нет, а экранная клавиатура операционной системы либо недоступна, либо закрывает пол-экрана. Элемента для этого в UI5 нет. Библиотека приносит три экранные клавиатуры, собранные из её же кнопок &mdash; без сторонних зависимостей и с тем же свойством <code>size</code>, что и всё остальное.
docKeyboardText2=<code>tc:Keyboard</code> — клавиатура из букв: <code>mode</code> задаёт раскладку страны, а несколько переключателей решают, лежат ли цифры над буквами или за отдельной клавишей, есть ли спецсимволы и в каком регистре она пишет. <code>tc:NumberPad</code> — то же самое для поля из цифр. <code>tc:CustomKeyboard</code> получает свои клавиши построчно, для всего, что первые две не покрывают: <code>&#123;shift&#125;</code>, <code>&#123;space&#125;</code>, <code>&#123;bksp&#125;</code> и <code>&#123;enter&#125;</code> — специальные клавиши, любая другая пишет собственную надпись. Все три принимают ввод с настоящей клавиатуры при <code>hardwareKeys="true"</code>, пристают к нижнему краю экрана при <code>docked</code> и помещаются в агрегацию <code>keyboard</code> поля ввода.

docPitfallTitle=Подводный камень: агрегации, которые принимают только sap.m.Button
docPitfallSubtitle=buttons, beginButton и endButton у sap.m.Dialog
docPitfallStrip=Некоторые стандартные агрегации типизированы под sap.m.Button и отклоняют tc:Button на этапе выполнения: "Element ui5.touch.controls.Button#__button0" is not valid for aggregation "buttons".
docPitfallText1=Да и увеличивать эти кнопочные места не предполагалось &mdash; они рассчитаны на стандартную высоту кнопки.
docPitfallText2=<strong>Выход — агрегация <code>footer</code>.</strong> Она типизирована под <code>sap.m.Toolbar</code> (доступна с UI5 1.110), а так как <code>tc:Toolbar</code> и <code>tc:OverflowToolbar</code> наследуют от <code>sap.m.Toolbar</code>, они входят туда как есть. Диалог тогда подгоняет высоту подвала под панель, и кнопки сенсорного размера отрисовываются как надо. Если диалог может стать узким, берите <code>tc:OverflowToolbar</code>.
docPitfallText3=Для простых диалогов-сообщений собирать это вручную не нужно &mdash; <code>QuickDialog</code> уже строит свой подвал именно так, с размером из своей настройки <code>size</code>.
docSizesExample=Привязка размера
docPitfallBrokenTitle=Не работает
docPitfallWorksTitle=Работает

# ---------------------------------------------------------------------------
# страницы элементов
# ---------------------------------------------------------------------------
barcodeHint=Соответствия в <code>sap.m</code> нет: сканер штрихкода в режиме keyboard wedge за считаные миллисекунды вводит код в поле с фокусом и завершает его клавишей <kbd>Enter</kbd>. Элемент замеряет время между нажатиями, поэтому сканирование вызывает <code>scan</code>, а те же символы, набранные вручную, — <code>change</code>.
signatureHint=Соответствия в <code>sap.m</code> нет. Поле рисует на canvas и отдаёт результат в <code>value</code> как PNG в виде data-URL, так что его можно связать с моделью и отправить на сервер, как любое другое значение. Толщина линии, подсказка и кнопка очистки следуют свойству <code>size</code>.

overflowPlainHint=Потяните ползунок влево: то, что перестаёт помещаться, уходит за кнопку с тремя точками. На полной ширине кнопки переполнения нет вовсе.
overflowPriorityHint=У «Печать» приоритет Low, поэтому она уходит первой. У «Сохранить» — NeverOverflow, и она остаётся на панели, пока там вообще есть место; на самой малой ширине она тоже уходит во всплывающее окно, чтобы кнопка переполнения оставалась доступной. У «О программе» — AlwaysOverflow, она всегда во всплывающем окне: потому эта панель показывает кнопку с тремя точками даже когда места вдоволь.
overflowFooterHint=Сузьте окно браузера, чтобы увидеть переполнение панели в подвале — всплывающее окно тогда открывается над ней.
overflowDialogHint=Агрегация buttons у sap.m.Dialog принимает только sap.m.Button, а вот footer берёт любую sap.m.Toolbar — сенсорная OverflowToolbar входит туда как есть. Из двух панелей здесь лучше именно она: диалог узок по своей природе, и то, что не помещается, уходит в меню переполнения, а не обрезается.
inputKeyboardHint=При включённой «Экранной клавиатуре» клавиатура из агрегации keyboard открывается под полем, пока у поля есть фокус, и закрывается, как только фокус уходит.
textAreaKeyboardHint=При включённой «Экранной клавиатуре» клавиатура из агрегации keyboard открывается под полем, пока у поля есть фокус, и закрывается, как только фокус уходит. Её клавиша Enter вставляет перевод строки — как Enter и делает в многострочном поле.

