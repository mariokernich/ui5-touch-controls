# ---------------------------------------------------------------------------
# Getting Started
# ---------------------------------------------------------------------------
gsTitle=Getting Started
gsSubtitle=Standard UI5 controls, rebuilt for touch — plus the ones sap.m is missing

gsWhatTitle=What it is
gsWhatSubtitle=Why sap.m alone is not enough on a touch device
gsWhatText1=<code>sap.m</code> controls are made for mouse and keyboard. On a tablet, a shop floor terminal or a device operated with gloves they are simply too small &mdash; and the cozy content density only gets you one step further.
gsWhatText2=The library does two things about that:<ul><li><strong>It rebuilds the most important <code>sap.m</code> controls</strong> on their original structure and opens them up for sizing through one central <code>size</code> property (<code>S</code>&ndash;<code>6XL</code>) that works the same way on every control. You do not have to rebuild your app: the controls keep the familiar properties, aggregations and events of their originals, so you can use them as a drop-in replacement.</li><li><strong>It adds controls that <code>sap.m</code> does not have at all</strong>, for situations that only come up on touch devices &mdash; the prime example being the on-screen keyboards.</li></ul>

gsSizesTitle=One property, nine sizes
gsSizesSubtitle=S · M (default) · L · XL · 2XL · 3XL · 4XL · 5XL · 6XL
gsSizesText=The size scales font size, icon size, padding and height together, so the controls stay proportional at every step. Bind <code>size</code> to a model to switch the size of the whole app at runtime.

gsDropInTitle=Drop-in replacement
gsDropInSubtitle=Add the namespace, put tc: in front of the control, set a size
gsDropInText=Same aggregations, same properties, same event handlers &mdash; <code>press=".onSave"</code> still calls the same method in your controller. <code>sap.m</code> controls such as <code>ToolbarSpacer</code> can stay exactly where they are.

gsRequirementsTitle=Requirements
gsRequirementsStrip=UI5 version 1.116 or higher (OpenUI5 or SAPUI5) is required.
gsRequirementsText=The library is published on npm as <code>ui5.touch.controls</code> and can be consumed in any UI5 application that is built with the UI5 Tooling (v3 or higher). It ships its own <code>ui5.yaml</code>, so the tooling resolves it as a library dependency automatically.

gsNextTitle=Next steps
gsNextSubtitle=Where to go from here
gsNextText=<ul><li><strong>Setup</strong> &mdash; install the package, declare the library and wire up TypeScript.</li><li><strong>Documentation</strong> &mdash; the full control reference, the size scale, the <code>ISized</code> interface and the known pitfalls.</li><li><strong>Controls</strong> &mdash; one interactive page per control, side by side with the <code>sap.m</code> original.</li></ul>

# ---------------------------------------------------------------------------
# Setup
# ---------------------------------------------------------------------------
setupTitle=Setup
setupSubtitle=Install the library, declare it in your app and wire up TypeScript

setupPrereqTitle=Prerequisites
setupPrereqSubtitle=What your project needs before you start
setupPrereqStrip=UI5 version 1.116 or higher (OpenUI5 or SAPUI5) and UI5 Tooling v3 or higher.
setupPrereqText=The library is published on npm as <a href="https://www.npmjs.com/package/ui5.touch.controls" target="_blank">ui5.touch.controls</a> and can be consumed in any UI5 application that is built with the <a href="https://sap.github.io/ui5-tooling/" target="_blank">UI5 Tooling</a>.

setupInstallTitle=1. Install the package
setupInstallSubtitle=As a regular dependency, not a devDependency
setupInstallText=Install the library as a <strong>regular dependency</strong> so the UI5 Tooling picks it up as a project dependency. The package ships a <code>ui5.yaml</code>, so the tooling resolves it as a library dependency automatically.

setupMiddlewareTitle=1b. With UI5 middleware (alternative setup)
setupMiddlewareSubtitle=Serve the library statically instead of resolving it as a project dependency
setupMiddlewareText=Instead of consuming the library as a UI5 Tooling project dependency, you can serve it statically with <a href="https://www.npmjs.com/package/ui5-middleware-servestatic" target="_blank">ui5-middleware-servestatic</a>.

setupManifestTitle=2. Declare the library in manifest.json
setupManifestSubtitle=So the app loads the library at startup

setupNamespaceTitle=3. Add the namespace to your views
setupNamespaceSubtitle=The tc prefix is only a convention — any prefix works

setupTypeScriptTitle=4. TypeScript support (optional)
setupTypeScriptSubtitle=Full typing out of the box
setupTypeScriptStrip=Without the "types" entry the UI5 Tooling does not load the library automatically.
setupTypeScriptText=For TypeScript projects, add the package to the <code>types</code> entry in your <code>tsconfig.json</code>. The package includes the type definitions (<code>dist/index.d.ts</code>).

# ---------------------------------------------------------------------------
# Documentation
# ---------------------------------------------------------------------------
docTitle=Documentation
docSubtitle=Control reference, the size scale, the ISized interface and known pitfalls

docPortedTitle=Touch versions of sap.m controls
docPortedSubtitle=The Replaces column names the sap.m control each one steps in for
docPortedText=These are rebuilds of standard controls. They keep the properties, aggregations and events of their originals for the common cases, so they can be used as a drop-in replacement. Click a control to open its interactive page.

docNewTitle=Controls without a sap.m equivalent
docNewSubtitle=They exist only in this library
docNewText=These cover situations that only come up on a touch device: a terminal without a hardware keyboard, a barcode scanner instead of typing, a signature on the screen. Click a control to open its interactive page.

docClassesTitle=Classes
docClassesSubtitle=Used from a controller, not put into a view
docClassesText=Not everything the library adds is a control. These are called from controller code and build their user interface themselves, from the touch controls. Click a class to open its interactive page.

docThemesTitle=Theme compatibility
docThemesSubtitle=All controls ship their own theme library for these themes
docThemesText1=The controls take their colours, borders and shadows from the theme parameters of the active theme, so they blend in with the surrounding <code>sap.m</code> controls. Set the theme as usual through <code>data-sap-ui-theme</code> in the bootstrap or at runtime through <code>Theming.setTheme()</code>.
docThemesText2=Themes that are not listed here are not shipped with the library. UI5 then falls back to the base theme for <code>ui5.touch.controls</code>, so the controls stay usable, but they will not match the colours of the rest of the application.

docSizesTitle=Sizes
docSizesSubtitle=Every control has the same size property
docSizesText1=Available values: <code>S</code> &middot; <code>M</code> (default) &middot; <code>L</code> &middot; <code>XL</code> &middot; <code>2XL</code> &middot; <code>3XL</code> &middot; <code>4XL</code> &middot; <code>5XL</code> &middot; <code>6XL</code>
docSizesText2=The size scales font size, icon size, padding and height together, so the controls stay proportional at every step. Bind <code>size</code> to a model to switch the size of the whole app at runtime.

docISizedTitle=ISized
docISizedSubtitle=ui5.touch.controls.ISized
docISizedText=All controls with a <code>size</code> property implement the marker interface <code>ui5.touch.controls.ISized</code>. This allows generic size handling, e.g. to apply a user setting to a whole view.

docKeyboardTitle=New controls for touch — the keyboards
docKeyboardSubtitle=There is no sap.m equivalent
docKeyboardText1=On a shop floor terminal, a kiosk or a device operated with gloves there is often no hardware keyboard, and the on-screen keyboard of the operating system is either unavailable or covers half the screen. UI5 has no control for this. The library brings three on-screen keyboards, rendered from its own buttons &mdash; no third-party dependency, and sized through the same <code>size</code> property as everything else.
docKeyboardText2=<code>tc:Keyboard</code> is a keyboard of letters: the <code>mode</code> is the arrangement of a country, and a handful of switches say whether the digits sit over the letters or behind a key, whether there are special characters, and which case it writes. <code>tc:NumberPad</code> is the same idea for a field of digits. <code>tc:CustomKeyboard</code> is handed its keys row by row, for everything the other two do not cover: <code>&#123;shift&#125;</code>, <code>&#123;space&#125;</code>, <code>&#123;bksp&#125;</code> and <code>&#123;enter&#125;</code> are the special keys, every other key writes its own label. All three take the keys of a real keyboard with <code>hardwareKeys="true"</code>, dock to the bottom edge of the screen with <code>docked</code>, and fit into the <code>keyboard</code> aggregation of a field.

docPitfallTitle=Pitfall: aggregations that only accept sap.m.Button
docPitfallSubtitle=buttons, beginButton and endButton of sap.m.Dialog
docPitfallStrip=Some standard aggregations are typed to sap.m.Button and reject a tc:Button at runtime: "Element ui5.touch.controls.Button#__button0" is not valid for aggregation "buttons".
docPitfallText1=And these button slots are not meant to be resized either &mdash; they are laid out for the standard button height.
docPitfallText2=<strong>The way around it is the <code>footer</code> aggregation.</strong> It is typed to <code>sap.m.Toolbar</code> (available since UI5 1.110), and because <code>tc:Toolbar</code> and <code>tc:OverflowToolbar</code> extend <code>sap.m.Toolbar</code>, they fit straight in. The dialog then sizes its footer to the toolbar, so touch-sized buttons are rendered properly. Prefer <code>tc:OverflowToolbar</code> whenever the dialog can get narrow.
docPitfallText3=For plain message-box style dialogs you do not have to build this yourself &mdash; <code>QuickDialog</code> already creates its footer this way, sized through its <code>size</code> option.
docSizesExample=Binding the size
docPitfallBrokenTitle=Does not work
docPitfallWorksTitle=Works

# ---------------------------------------------------------------------------
# control pages
# ---------------------------------------------------------------------------
barcodeHint=There is no <code>sap.m</code> equivalent: a barcode scanner in keyboard wedge mode types the code into the focused field within a few milliseconds and closes it with <kbd>Enter</kbd>. The control measures the time between the keystrokes, so a scan fires <code>scan</code> while typing the same characters by hand fires <code>change</code>.
signatureHint=There is no <code>sap.m</code> equivalent. The pad draws on a canvas and hands the result over as a PNG data URL in <code>value</code>, so it can be bound to a model and sent to the backend like any other value. Stroke width, placeholder and clear button follow the <code>size</code> property.

overflowPlainHint=Drag the slider to the left: the content that does not fit any more moves behind the button with the three dots. At full width there is no overflow button at all.
overflowPriorityHint="Print" has priority Low and therefore overflows first. "Save" has NeverOverflow and stays in the toolbar as long as there is room for it at all — at the smallest width it moves into the popover too, so the overflow button stays reachable. "About" has AlwaysOverflow and is always in the popover — that is why this toolbar shows the button with the three dots even when there is plenty of space.
overflowFooterHint=Make the browser window narrower to see the footer toolbar overflow — the popover then opens above the toolbar.
overflowDialogHint=The buttons aggregation of sap.m.Dialog only accepts sap.m.Button, but the footer takes any sap.m.Toolbar — so a touch OverflowToolbar fits straight in. It is the better of the two toolbars here: a dialog is narrow by nature, and what does not fit moves into the overflow menu instead of being cut off.
inputKeyboardHint=With "Virtual keyboard" the keyboard from the keyboard aggregation opens below the field while the field has the focus, and closes as soon as the focus leaves it.
textAreaKeyboardHint=With "Virtual keyboard" the keyboard from the keyboard aggregation opens below the field while the field has the focus, and closes as soon as the focus leaves it. Its Enter key adds a line break, as Enter does in a multi-line field.

