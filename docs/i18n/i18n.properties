keyboardLayoutsTitle=The arrangements
keyboardLayoutsSubtitle=What each value of the mode property shows
keyboardLayoutsText=The <code>mode</code> is the keyboard of a country, named after the language it is used for. The rows below are what that arrangement shows with <code>displayNumbers=&quot;Always&quot;</code>; the switches beside it decide what else is on the keyboard. Click an arrangement to switch the keyboard above to it.
keyboardSwitchesTitle=The switches
keyboardSwitchesSubtitle=What each of them adds to the keyboard
keyboardSwitchesText=<p><b>displayNumbers</b> decides what becomes of the digits. <code>Always</code> puts a row of them over the letters, the way a keyboard of keys has it. <code>Toggle</code> leaves the letters to themselves and puts the digits behind a <code>{numbers}</code> key, the way a phone does it &mdash; a row of digits there would make every key narrow. <code>ToggleOnMobile</code>, the default, is the first on a computer and a tablet and the second on a phone; which of the two it is is decided once, by the device the page was opened on. <code>Never</code> leaves the digits off altogether.</p><p><b>showSpecialCharacters</b> adds a set of brackets, signs and currencies. Where the digits are behind a key of their own the set sits behind them, the way a phone goes from its letters to its digits to its symbols and back; otherwise a <code>{symbols}</code> key leads there.</p><p><b>letterCase</b> pins the keyboard to one case. <code>Upper</code> and <code>Lower</code> leave the shift key and the caps lock off &mdash; there is nothing to switch, which is what a field with a case of its own wants: a material number, a licence plate, a batch. Not looked at for Hindi, which has a second set of letters instead of capitals.</p><p><b>showEmojis</b> hangs a set of faces behind a key of its own, the same way the digits and the special characters are reached. Only faces of a single character are on it: one put together from several &mdash; a family, a flag &mdash; would be taken apart again by the backspace.</p><p><b>extraKeys</b> are keys that stand beside the space bar on every set, whichever one is on screen. That is where a key goes that a field needs at hand rather than behind a switch: <code>extraKeys=&quot;@,.&quot;</code> for an address, a unit for a quantity. The at sign is also on the set of special characters, one key further away.</p><p><b>showCapsLock</b> adds a <code>{lock}</code> next to the shift key. Shift falls away after one letter, the lock stays on until it is pressed again &mdash; and shift while the lock is on writes lower case, the way it does on a keyboard of keys.</p><p><b>showEscape</b> adds an <code>{esc}</code> key as the first key of the top row, where a keyboard of keys has it, on every set. It fires <code>escape</code> and does nothing else; what it should mean is left to the application.</p><p><b>enterText</b> is what the Enter key says. Empty leaves it the arrow it is.</p>
padLayoutsTitle=The digit blocks
padLayoutsSubtitle=What each value of the mode property shows
padLayoutsText=The <code>mode</code> picks the block of digits, and the block keeps its shape whatever else is switched on: a minus and a decimal separator go into the row of the zero, the key to the special characters and the escape key into the row of function keys under it. Where neither the minus nor the separator was asked for, the backspace and the enter come into the row of the zero instead &mdash; a zero on a line of its own would be a key three columns wide. Click a mode to switch the pad above to it.
customKeysTitle=Writing a layout
customKeysSubtitle=Rows, keys, and the ones with a meaning of their own
customKeysText=A row is a string of keys separated by spaces; in a view the rows are separated by commas. Everything that is not in the table below writes itself &mdash; a letter, a digit, a whole word. A key written as the name of one of the sets in the <code>layouts</code> aggregation switches to that set, and a key that names the set it is already on leads back out of it.
colKey=Key
colKeyMeaning=What it does
keyBksp=removes the last character
keyEnter=fires the enter event
keySpace=writes a space, and is wider than the other keys
keyShift=the next letter in upper case, then it falls away
keyLock=the caps lock: stays on until it is pressed again
keyTab=writes a tab character
keyEsc=fires the escape event and does nothing else
keySet=switches to the set of that name, e.g. {numbers}
exPlate=Licence plate
exSizes=Sizes of a shop
exSets=Three sets of keys
