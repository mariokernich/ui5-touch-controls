# ---------------------------------------------------------------------------
# control reference: what each control is, what the sap.m original does and
# what this library made of it. Shown at the head of the page of a control
# and in the tables of the documentation page.
# ---------------------------------------------------------------------------
docButtonSummary=A button whose whole geometry follows one size property, so the area a finger has to hit grows with it. Everything else — text, icon, type and press — reads like sap.m.Button.
docButtonOriginal=The standard button of sap.m: text, icon, icon position, a button type and a press event. Its height is the one the theme prescribes and does not change.
docButtonDescription=Button with configurable size, icon, icon position, type (all sap.m.ButtonType values), side padding and width. Fires press.
docSegmentedButtonSummary=A row of joined buttons of which exactly one is selected, sized so every segment can be hit with a finger.
docSegmentedButtonOriginal=A row of joined buttons of which exactly one is selected, filled through sap.m.SegmentedButtonItem. Fires selectionChange.
docSegmentedButtonDescription=A row of joined buttons of which exactly one is selected, filled through tc:SegmentedButtonItem (key, text, icon, enabled). Supports selectedKey, width for evenly spread segments and fires selectionChange.
docCheckBoxSummary=A check box whose box, check mark, label and hit area scale together instead of staying at the size the theme gives them.
docCheckBoxOriginal=The standard check box of sap.m, with a label, a tristate selection and value states. Box and hit area have the size the theme gives them.
docCheckBoxDescription=Check box whose box, check mark, label and hit area scale together — at size M the geometry matches sap.m.CheckBox. Supports selected, partiallySelected, text, editable, wrapping, value states and width. Fires select.
docRadioButtonSummary=A radio button that scales with its size property, and a group control that arranges a set of them in columns and hands its settings down to them.
docRadioButtonOriginal=A radio button that is mutually exclusive with the others of its groupName, plus a group control that arranges a set of them in columns.
docRadioButtonDescription=Circle, dot, label and hit area scale together — at size M the geometry matches sap.m.RadioButton. Buttons sharing a groupName are mutually exclusive; tc:RadioButtonGroup arranges them in columns and hands its size, enabled, editable and value state down to them. Fires select.
docSwitchSummary=An on/off switch that grows with its size property, where sap.m.Switch is fixed at 4rem by 2rem.
docSwitchOriginal=An on/off switch of a fixed size, with an accept/reject variant and custom texts for the two states.
docSwitchDescription=Track, handle and label scale together, where sap.m.Switch is fixed at 4rem x 2rem. Supports state, customTextOn, customTextOff and the AcceptReject type; the colors come from the @sapButton_Track_* / @sapButton_Handle_* theme parameters. Fires change.
docSelectSummary=A drop-down whose list opens in rows as big as the field itself, so an entry can be picked with a finger.
docSelectOriginal=A drop-down filled with sap.ui.core.Item elements. The list it opens keeps the standard row height, however large the field is.
docSelectDescription=Drop-down filled with plain sap.ui.core.Item elements. The list opens in a popover whose rows are as big as the field, so they can be hit with a finger — the native list of sap.m.Select keeps its standard row height however large the field is. Supports selectedKey, editable, forceSelection, value states and width. On a phone the list takes the whole screen, as it does in sap.m. Fires change.
docComboBoxSummary=A Select the user can type into: free text is allowed, what is typed filters the list, and the rows are as big as the field.
docComboBoxOriginal=A drop-down the user can also type into: what is typed filters the list, and a value that is not in the list is allowed.
docComboBoxDescription=A Select the user can type into: free text is allowed and what is typed filters the list, whose rows are as big as the field. Works together with the keyboards of this library on a device without one. Supports value, selectedKey, placeholder, editable, value states, width and showSecondaryValues, which puts the additionalText of a sap.ui.core.ListItem at the end of a row. On a phone the list takes the whole screen and brings a field of its own to go on typing in, as it does in sap.m. Fires change and selectionChange.
docDatePickerSummary=A date field whose calendar is built from the buttons of this library, so a day is a square that grows with the size property.
docDatePickerOriginal=A field with a calendar popup built on sap.ui.unified.Calendar, with minDate/maxDate and configurable value and display formats.
docDatePickerDescription=Field with a calendar that is built from the library's own buttons, so a day is a square that grows with the size property instead of the fixed grid of sap.ui.unified.Calendar. Days and months view, minDate/maxDate, valueFormat and displayFormat (style or pattern). Fires change with value, dateValue and valid.
docTimePickerSummary=A time field that is filled with one tap on an hour and one on a minute, instead of a slider that has to be dragged.
docTimePickerOriginal=A field with a popup in which hours and minutes are set on sliders that have to be dragged.
docTimePickerDescription=Field with two columns of buttons - hours and minutes - so a time is picked with one tap on a target that grows with size, where sap.m.TimePicker uses a slider that has to be dragged. Supports minutesStep, valueFormat and displayFormat. Fires change once, when the popover closes.
docInputSummary=A single-line input that scales with its size property and can bring a keyboard of this library along, for a device that has none of its own.
docInputOriginal=The standard single-line input of sap.m, with placeholder, maximum length, value states and suggestions.
docInputDescription=Single-line input with configurable size. A keyboard of this library - tc:Keyboard, tc:NumberPad or tc:CustomKeyboard - can be put into its keyboard aggregation; with showKeyboard it then opens in a popover below the field while the field has the focus and types into it.
docTextAreaSummary=A multi-line input that scales with its size property and takes a keyboard of this library, whose Enter key adds a line break here.
docTextAreaOriginal=The standard multi-line input of sap.m, with rows, a maximum length and value states.
docTextAreaDescription=Multi-line input with configurable size, rows, max length and value states. Takes a keyboard in its keyboard aggregation just like the Input does; there the Enter key adds a line break. Fires change / liveChange.
docTextSummary=A text whose font size follows the same size property as every other control of the library, so a label sits at the scale of the field beside it.
docTextOriginal=A text control with wrapping and a maximum number of lines.
docTextDescription=Text with configurable size and color. Fires press.
docLinkSummary=An anchor whose label — and with it the area that can be hit with a finger — grows with the size property.
docLinkOriginal=An anchor with href and target, and the subtle and emphasized variants.
docLinkDescription=Anchor with configurable size, so the area that can be hit with a finger grows with the label. Supports href, target, wrapping, subtle, emphasized and width; a target="_blank" link automatically gets rel="noopener noreferrer". Fires press.
docToolbarSummary=A bar for the controls of this library that still fits wherever sap.m expects a toolbar of its own — the footer of a Page or a Dialog, for instance.
docToolbarOriginal=A bar that lays its content out in a row. Many header and footer aggregations in sap.m are typed to it.
docToolbarDescription=Toolbar container with a content aggregation. Usable in standard aggregations such as the footer of a Page or Dialog.
docOverflowToolbarSummary=A Toolbar that moves what does not fit into a popover behind a button with three dots, steered by the priorities of sap.m.OverflowToolbarLayoutData.
docOverflowToolbarOriginal=A Toolbar that moves what does not fit into a popover behind a button with three dots, steered by the priorities of sap.m.OverflowToolbarLayoutData.
docOverflowToolbarDescription=Like tc:Toolbar, but content that does not fit into the available width is moved behind a button with three dots which opens a popover with the remaining content. Understands the priorities of sap.m.OverflowToolbarLayoutData.
docStepInputSummary=A numeric field with a minus and a plus button that are sized together with it, so a value can be stepped with a thumb.
docStepInputOriginal=A numeric field with a minus and a plus button, with min, max and step.
docStepInputDescription=Minus button, input and plus button, sized together. Supports min, max, step. Fires change.
docBarcodeInputSummary=An input field that tells a barcode scanner from a person typing and reports the two as different events.
docBarcodeInputDescription=Input field that tells a barcode scanner from a person typing: a run of at least minLength characters whose gaps stay below scanTimeout and that is closed by Enter fires scan, everything else fires change. prefix and suffix are cut off the code, clearOnScan empties the field for the next one.
docKeyboardSummary=An on-screen keyboard of letters for a device that has none of its own. The mode picks the arrangement of a country; a handful of switches say what else is on it.
docKeyboardDescription=On-screen keyboard of letters, built from the library's own buttons. The mode property picks the arrangement of a country - English, German, French, Spanish, Ukrainian, Russian, Hindi - and a handful of switches say what else is on it: displayNumbers puts the digits over the letters or behind a key, showSpecialCharacters adds a set of signs, letterCase pins the keyboard to capitals or lower case, showCapsLock and showEscape add a key each. Optional hardware key input, value binding and change / keyPress / enter / escape events.
docNumberPadSummary=An on-screen pad of digits in three columns, for everything that is typed as a number. The mode picks the block: a computer pad, a telephone pad or a calculator.
docNumberPadDescription=On-screen pad of digits in three columns. The mode property picks the block - Simple (the pad of a computer), Phone (the pad of a telephone) or Calculator (with the four basic operations) - and showDecimalSeparator, decimalSeparator, showSign and showSpecialCharacters add what a field needs beyond the digits. Shares its value handling, sizing and docking with the other keyboards.
docCustomKeyboardSummary=The keyboard whose keys are handed to it, row by row. It is the answer to everything the ready-made keyboards do not cover.
docCustomKeyboardDescription=On-screen keyboard whose keys are handed to it: the layout property is the rows of one set, the layouts aggregation carries as many sets as are needed, and a key written as the name of a set switches to it. The display aggregation says what a single key reads. This is the keyboard for everything the ready-made ones do not cover.
docKeyboardBaseSummary=The machine behind all three keyboards. It is not put into a view itself - what it does not know is which keys to show, and that is what tells its subclasses apart.
docKeyboardBaseDescription=Base class of the on-screen keyboards of this library, built natively from the library's own Button controls with no third-party dependency. Everything that is not about which keys to show lives here: the value and how a key changes it, the sets of keys and the switching between them, shift and the caps lock, the keys of a real keyboard through hardwareKeys, the size, the width and the docking. It is the type the keyboard aggregation of an Input or a TextArea is typed to, so a Keyboard, a NumberPad and a CustomKeyboard all fit in there.
docSignaturePadSummary=A field to sign in with a finger or a stylus. The signature comes out as a PNG data URL, so it can be bound to a model like any other value.
docSignaturePadDescription=A field to sign in with a finger or a stylus. Draws on a canvas and hands the signature over as a PNG data URL in value, so it can be bound to a model. Stroke width, placeholder and clear button follow the size property; the strokes survive a resize. Fires change.
docQuickDialogSummary=Ready-made dialogs built from the touch controls, called from the controller instead of written into a view. Every method returns a Promise.
docQuickDialogDescription=Helper class for touch-ready dialogs, used from the controller instead of a view: show, confirm, information, error, input, select, details. Every method returns a Promise.
docThemeHorizon=Default theme of the demo
docThemeHorizonDark=Dark variant of Horizon
docThemeHorizonHcb=High contrast, dark background
docThemeHorizonHcw=High contrast, light background
docThemeFiori3=Previous default theme of UI5
docThemeFiori3Dark=Dark variant of Fiori 3
