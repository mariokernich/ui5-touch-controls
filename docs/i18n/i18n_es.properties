# ---------------------------------------------------------------------------
# Primeros pasos
# ---------------------------------------------------------------------------
gsTitle=Primeros pasos
gsSubtitle=Los controles estándar de UI5, rehechos para el dedo — y los que le faltan a sap.m
gsWhatTitle=De qué se trata
gsWhatSubtitle=Por qué sap.m por sí solo no basta en un dispositivo táctil
gsWhatText1=Los controles de <code>sap.m</code> están hechos para el ratón y el teclado. En una tableta, en un terminal de planta o en un equipo que se maneja con guantes son sencillamente demasiado pequeños &mdash; y la densidad de contenido «cozy» solo aporta un paso más.
gsWhatText2=La biblioteca lo resuelve de dos maneras:<ul><li><strong>Rehace los controles de <code>sap.m</code> más importantes</strong> sobre su estructura original y los abre al dimensionado mediante una única propiedad <code>size</code> (<code>S</code>&ndash;<code>6XL</code>) que funciona igual en todos ellos. No hace falta rehacer la aplicación: los controles conservan las propiedades, agregaciones y eventos conocidos de sus originales, de modo que sirven de sustituto directo.</li><li><strong>Añade controles que <code>sap.m</code> no tiene en absoluto</strong>, para situaciones que solo se dan en dispositivos táctiles &mdash; el ejemplo por excelencia son los teclados en pantalla.</li></ul>
gsSizesTitle=Una propiedad, nueve tamaños
gsSizesSubtitle=S · M (predeterminado) · L · XL · 2XL · 3XL · 4XL · 5XL · 6XL
gsSizesText=El tamaño escala a la vez el cuerpo del texto, el tamaño de los iconos, el relleno y la altura, de modo que los controles siguen siendo proporcionados en cada escalón. Enlace <code>size</code> a un modelo para cambiar el tamaño de toda la aplicación en tiempo de ejecución.
gsDropInTitle=Sustituto directo
gsDropInSubtitle=Añadir el espacio de nombres, poner tc: delante del control, elegir un tamaño
gsBeforeTitle=Antes — sap.m a secas
gsAfterTitle=Después — ui5.touch.controls
gsDropInText=Las mismas agregaciones, las mismas propiedades, los mismos manejadores de eventos &mdash; <code>press=".onSave"</code> sigue llamando al mismo método de su controlador. Los controles de <code>sap.m</code> como <code>ToolbarSpacer</code> pueden quedarse exactamente donde están.
gsRequirementsTitle=Requisitos
gsRequirementsStrip=Se necesita UI5 1.116 o superior (OpenUI5 o SAPUI5).
gsRequirementsText=La biblioteca se publica en npm como <code>ui5.touch.controls</code> y puede usarse en cualquier aplicación UI5 construida con UI5 Tooling (v3 o superior). Trae su propio <code>ui5.yaml</code>, así que las herramientas la resuelven solas como dependencia de biblioteca.
gsNextTitle=Siguientes pasos
gsNextSubtitle=Por dónde continuar
gsNextText=<ul><li><strong>Instalación</strong> &mdash; instalar el paquete, declarar la biblioteca y preparar TypeScript.</li><li><strong>Documentación</strong> &mdash; la referencia completa de controles, la escala de tamaños, la interfaz <code>ISized</code> y los escollos conocidos.</li><li><strong>Controles</strong> &mdash; una página interactiva por control, junto al original de <code>sap.m</code>.</li></ul>

# ---------------------------------------------------------------------------
# Instalación
# ---------------------------------------------------------------------------
setupTitle=Instalación
setupSubtitle=Instalar la biblioteca, declararla en la aplicación y preparar TypeScript
setupPrereqTitle=Requisitos previos
setupPrereqSubtitle=Lo que necesita el proyecto antes de empezar
setupPrereqStrip=UI5 1.116 o superior (OpenUI5 o SAPUI5) y UI5 Tooling v3 o superior.
setupPrereqText=La biblioteca se publica en npm como <a href="https://www.npmjs.com/package/ui5.touch.controls" target="_blank">ui5.touch.controls</a> y puede usarse en cualquier aplicación UI5 construida con <a href="https://sap.github.io/ui5-tooling/" target="_blank">UI5 Tooling</a>.
setupInstallTitle=1. Instalar el paquete
setupInstallSubtitle=Como dependencia normal, no como devDependency
setupInstallText=Instale la biblioteca como <strong>dependencia normal</strong> para que UI5 Tooling la reconozca como dependencia del proyecto. El paquete trae un <code>ui5.yaml</code>, así que las herramientas la resuelven solas como dependencia de biblioteca.
setupMiddlewareTitle=1b. Con middleware de UI5 (alternativa)
setupMiddlewareSubtitle=Servir la biblioteca como archivos estáticos en lugar de resolverla como dependencia del proyecto
setupMiddlewareText=En lugar de consumir la biblioteca como dependencia de proyecto de UI5 Tooling, puede servirla como archivos estáticos con <a href="https://www.npmjs.com/package/ui5-middleware-servestatic" target="_blank">ui5-middleware-servestatic</a>.
setupManifestTitle=2. Declarar la biblioteca en manifest.json
setupManifestSubtitle=Para que la aplicación la cargue al arrancar
setupNamespaceTitle=3. Añadir el espacio de nombres a sus vistas
setupNamespaceSubtitle=El prefijo tc es solo una convención — vale cualquiera
setupTypeScriptTitle=4. Compatibilidad con TypeScript (opcional)
setupTypeScriptSubtitle=Tipado completo desde el primer momento
setupTypeScriptStrip=Sin la entrada «types», UI5 Tooling no carga la biblioteca automáticamente.
setupTypeScriptText=En proyectos TypeScript, añada el paquete a la entrada <code>types</code> de su <code>tsconfig.json</code>. El paquete incluye las definiciones de tipos (<code>dist/index.d.ts</code>).

# ---------------------------------------------------------------------------
# Documentación
# ---------------------------------------------------------------------------
docTitle=Documentación
docSubtitle=Referencia de controles, escala de tamaños, interfaz ISized y escollos conocidos
docPortedTitle=Versiones táctiles de los controles de sap.m
docPortedSubtitle=La columna «Sustituye a» nombra el control de sap.m al que cada uno reemplaza
docPortedText=Son reconstrucciones de controles estándar. Conservan las propiedades, agregaciones y eventos de sus originales para los casos habituales, así que sirven de sustituto directo. Pulse un control para abrir su página interactiva.
docNewTitle=Controles adicionales para el táctil
docNewSubtitle=Solo existen en esta biblioteca
docNewText=Cubren situaciones que solo se dan en un dispositivo táctil: un terminal sin teclado físico, un lector de códigos de barras en lugar de teclear, una firma en la pantalla. Pulse un control para abrir su página interactiva.
docClassesTitle=Clases
docClassesSubtitle=Se usan desde un controlador, no se ponen en una vista
docClassesText=No todo lo que añade la biblioteca es un control. Estas clases se llaman desde el código del controlador y construyen ellas mismas su interfaz, a partir de los controles táctiles. Pulse una clase para abrir su página interactiva.
docThemesTitle=Temas compatibles
docThemesSubtitle=Todos los controles traen su propia biblioteca de temas para estos
docThemesText1=Los controles toman sus colores, bordes y sombras de los parámetros del tema activo, así que encajan con los controles de <code>sap.m</code> que los rodean. Fije el tema como de costumbre, mediante <code>data-sap-ui-theme</code> en el bootstrap o en tiempo de ejecución mediante <code>Theming.setTheme()</code>.
docThemesText2=Los temas que no aparecen aquí no se entregan con la biblioteca. UI5 recurre entonces al tema base para <code>ui5.touch.controls</code>: los controles siguen siendo utilizables, pero no coincidirán con los colores del resto de la aplicación.
docSizesTitle=Tamaños
docSizesSubtitle=Todos los controles tienen la misma propiedad size
docSizesText1=Valores posibles: <code>S</code> &middot; <code>M</code> (predeterminado) &middot; <code>L</code> &middot; <code>XL</code> &middot; <code>2XL</code> &middot; <code>3XL</code> &middot; <code>4XL</code> &middot; <code>5XL</code> &middot; <code>6XL</code>
docSizesText2=El tamaño escala a la vez el cuerpo del texto, el tamaño de los iconos, el relleno y la altura, de modo que los controles siguen siendo proporcionados en cada escalón. Enlace <code>size</code> a un modelo para cambiar el tamaño de toda la aplicación en tiempo de ejecución.
docISizedTitle=ISized
docISizedSubtitle=ui5.touch.controls.ISized
docISizedText=Todos los controles con una propiedad <code>size</code> llevan la interfaz de marcado <code>ui5.touch.controls.ISized</code>. Permite tratar el tamaño de forma genérica, por ejemplo para aplicar un ajuste del usuario a toda una vista.
docKeyboardTitle=Los teclados
docKeyboardSubtitle=sap.m no tiene equivalente
docKeyboardText1=En un terminal de planta, un quiosco o un equipo que se maneja con guantes muchas veces no hay teclado físico, y el teclado en pantalla del sistema operativo o no está disponible o tapa media pantalla. UI5 no tiene ningún control para esto. La biblioteca trae tres teclados en pantalla, dibujados con sus propios botones &mdash; sin dependencias de terceros, y dimensionados con la misma propiedad <code>size</code> que todo lo demás.
docKeyboardText2=<code>tc:Keyboard</code> es un teclado de letras: el <code>mode</code> es la distribución de un país, y un puñado de interruptores dice si los dígitos van sobre las letras o detrás de una tecla, si hay caracteres especiales y en qué caja escribe. <code>tc:NumberPad</code> es la misma idea para un campo de dígitos. A <code>tc:CustomKeyboard</code> se le entregan las teclas fila por fila, para todo lo que los otros dos no cubren: <code>&#123;shift&#125;</code>, <code>&#123;space&#125;</code>, <code>&#123;bksp&#125;</code> y <code>&#123;enter&#125;</code> son las teclas especiales, cualquier otra tecla escribe su propia etiqueta. Los tres aceptan las teclas de un teclado real con <code>hardwareKeys="true"</code>, se anclan al borde inferior de la pantalla con <code>docked</code> y encajan en la agregación <code>keyboard</code> de un campo.
docPitfallTitle=Escollo: agregaciones que solo admiten sap.m.Button
docPitfallSubtitle=buttons, beginButton y endButton de sap.m.Dialog
docPitfallStrip=Algunas agregaciones estándar están tipadas a sap.m.Button y rechazan un tc:Button en tiempo de ejecución: "Element ui5.touch.controls.Button#__button0" is not valid for aggregation "buttons".
docPitfallText1=Y esos huecos de botón tampoco están pensados para redimensionarse &mdash; están dispuestos para la altura de botón estándar.
docPitfallText2=<strong>La salida es la agregación <code>footer</code>.</strong> Está tipada a <code>sap.m.Toolbar</code> (disponible desde UI5 1.110), y como <code>tc:Toolbar</code> y <code>tc:OverflowToolbar</code> heredan de <code>sap.m.Toolbar</code>, encajan directamente. El diálogo ajusta entonces la altura de su pie a la barra de herramientas, y los botones de tamaño táctil se dibujan correctamente. Prefiera <code>tc:OverflowToolbar</code> siempre que el diálogo pueda quedar estrecho.
docPitfallText3=Para diálogos sencillos al estilo MessageBox no hace falta construir nada de esto &mdash; <code>QuickDialog</code> ya compone su pie así, con el tamaño que indica su opción <code>size</code>.
docSizesExample=Enlazar el tamaño
docPitfallBrokenTitle=No funciona
docPitfallWorksTitle=Funciona

# ---------------------------------------------------------------------------
# páginas de los controles
# ---------------------------------------------------------------------------
barcodeHint=<code>sap.m</code> no tiene equivalente: en modo «keyboard wedge», un lector de códigos de barras teclea el código en el campo enfocado en unos pocos milisegundos y lo cierra con <kbd>Intro</kbd>. El control mide el tiempo entre pulsaciones, así que una lectura dispara <code>scan</code>, mientras que teclear los mismos caracteres a mano dispara <code>change</code>.
signatureHint=<code>sap.m</code> no tiene equivalente. El panel dibuja sobre un canvas y entrega el resultado como URL de datos PNG en <code>value</code>, de modo que puede enlazarse a un modelo y enviarse al backend como cualquier otro valor. El grosor del trazo, el texto de ayuda y el botón de borrado siguen la propiedad <code>size</code>.
overflowPlainHint=Arrastre el deslizador hacia la izquierda: lo que ya no cabe pasa detrás del botón de los tres puntos. A anchura completa no hay botón de desbordamiento en absoluto.
overflowPriorityHint=«Imprimir» tiene prioridad Low y por eso desborda primero. «Guardar» tiene NeverOverflow y se queda en la barra mientras haya algo de sitio — a la anchura mínima también pasa al popover, para que el botón de desbordamiento siga siendo alcanzable. «Acerca de» tiene AlwaysOverflow y está siempre en el popover — por eso esta barra muestra el botón de los tres puntos incluso cuando sobra espacio.
overflowFooterHint=Estreche la ventana del navegador para ver desbordar la barra del pie — el popover se abre entonces por encima de la barra.
overflowDialogHint=La agregación buttons de sap.m.Dialog solo admite sap.m.Button, pero el pie acepta cualquier sap.m.Toolbar — así que una OverflowToolbar táctil encaja directamente. Es la mejor de las dos barras aquí: un diálogo es estrecho por naturaleza, y lo que no cabe pasa al menú de desbordamiento en lugar de quedar cortado.
inputKeyboardHint=Con «Teclado virtual», el teclado de la agregación keyboard se abre bajo el campo mientras este tiene el foco, y se cierra en cuanto lo pierde.
textAreaKeyboardHint=Con «Teclado virtual», el teclado de la agregación keyboard se abre bajo el campo mientras este tiene el foco, y se cierra en cuanto lo pierde. Su tecla Intro inserta un salto de línea, como hace Intro en un campo de varias líneas.

