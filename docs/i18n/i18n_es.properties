keyEnter=dispara el evento enter
keySpace=escribe un espacio, y es más ancha que las demás teclas
keyShift=la siguiente letra en mayúscula, luego decae
keyLock=el bloqueo de mayúsculas: se mantiene hasta que se vuelve a pulsar
keyTab=escribe un tabulador
