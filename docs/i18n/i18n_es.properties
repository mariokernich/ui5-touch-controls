kbIntroSubtitle=Un teclado de letras, dicho en una línea
kbIntroText=<p>En un terminal de planta, un quiosco o un equipo que se maneja con guantes muchas veces no hay teclado físico, y el teclado en pantalla del sistema operativo o no está disponible o tapa media pantalla. <code>tc:Keyboard</code> es la respuesta para un campo de texto: el <code>mode</code> es la distribución de un país, y un puñado de interruptores dice qué más hay en él. No hay ninguna distribución que escribir.</p><p>Es uno de los tres teclados, y comparten todo lo que no tiene que ver con las teclas: el valor, el <code>size</code>, <code>docked</code>, las teclas de un teclado real mediante <code>hardwareKeys</code>, y los eventos <code>change</code>, <code>keyPress</code>, <code>enter</code> y <code>escape</code>. Recurra a <code>tc:NumberPad</code> donde el campo espere dígitos, y a <code>tc:CustomKeyboard</code> donde las teclas le corresponda escribirlas a usted. Los tres encajan en la agregación <code>keyboard</code> de un <code>tc:Input</code> o de un <code>tc:TextArea</code>.</p>
padIntroSubtitle=Un panel de dígitos, dicho en una línea
padIntroText=<p>Una cantidad, un recuento, un código, un precio &mdash; los campos de un terminal son dígitos más a menudo que letras, y un panel de tres columnas es lo que el pulgar encuentra sin mirar. <code>tc:NumberPad</code> es ese panel: el <code>mode</code> elige el bloque de dígitos, y los interruptores de al lado añaden lo que el campo necesita más allá de ellos.</p><p>Es uno de los tres teclados, y comparten todo lo que no tiene que ver con las teclas: el valor, el <code>size</code>, <code>docked</code>, las teclas de un teclado real mediante <code>hardwareKeys</code>, y los eventos <code>change</code>, <code>keyPress</code>, <code>enter</code> y <code>escape</code>. Recurra a <code>tc:Keyboard</code> donde el campo espere texto, y a <code>tc:CustomKeyboard</code> donde las teclas le corresponda escribirlas a usted.</p>
customIntroSubtitle=Las teclas se le entregan, fila por fila
customIntroText=<p><code>tc:CustomKeyboard</code> es el teclado para todo lo que los teclados ya hechos no cubren: las tallas que vende una tienda, las letras que puede llevar una matrícula, las teclas de una máquina. La propiedad <code>layout</code> son las filas de un juego; la agregación <code>layouts</code> lleva tantos juegos como hagan falta, y una tecla escrita con el nombre de un juego cambia a él. La agregación <code>display</code> dice qué muestra una tecla concreta.</p><p>Es uno de los tres teclados, y comparten todo lo que no tiene que ver con las teclas: el valor, el <code>size</code>, <code>docked</code>, las teclas de un teclado real mediante <code>hardwareKeys</code>, y los eventos <code>change</code>, <code>keyPress</code>, <code>enter</code> y <code>escape</code>. Cuando lo que hace falta es un teclado de letras o un panel de dígitos, <code>tc:Keyboard</code> y <code>tc:NumberPad</code> lo dicen en una línea.</p>
colProperty=Propiedad
colDefault=Predeterminado
baseNote=tc:KeyboardBase es una clase base y nunca se pone en una vista. Use tc:Keyboard, tc:NumberPad o tc:CustomKeyboard; esta página dice lo que los tres tienen en común.
baseIntroSubtitle=Lo que comparten los tres teclados
baseIntroText=<p>Los tres teclados de esta biblioteca se diferencian en una sola cosa: de dónde salen las teclas. <code>tc:Keyboard</code> las construye a partir de un idioma y un puñado de interruptores, <code>tc:NumberPad</code> a partir de un bloque de dígitos, a <code>tc:CustomKeyboard</code> se le entregan fila por fila. Todo lo demás es esta clase, y funciona igual en los tres.</p><p>Eso es el valor y cómo lo cambia una tecla, los juegos de teclas y el paso de uno a otro, la mayúscula y el bloqueo, las teclas de un teclado real, el tamaño, la anchura y el anclaje. Las teclas mismas son controles <code>tc:Button</code> de esta biblioteca &mdash; no hay ningún teclado de terceros detrás, y la misma propiedad <code>size</code> que escala todo lo demás las escala a ellas.</p><p>Es además el tipo al que está tipada la agregación <code>keyboard</code> de un <code>tc:Input</code> y de un <code>tc:TextArea</code>, y por eso cualquiera de los tres encaja en un campo.</p>
basePropsTitle=Lo que los tres tienen en común
basePropsSubtitle=Las propiedades que tiene todo teclado de esta biblioteca
basePropsText=Junto a estas, cada uno de los tres tiene las propiedades que hacen sus propias teclas &mdash; <code>mode</code> y los interruptores en <code>tc:Keyboard</code> y <code>tc:NumberPad</code>, <code>layout</code> y <code>layouts</code> en <code>tc:CustomKeyboard</code>.
baseEventsTitle=Los eventos
baseEventsSubtitle=Los dispara todo teclado de esta biblioteca
baseKeysTitle=Las teclas con un significado propio
baseKeysSubtitle=Las entienden los tres teclados
baseKeysText=Una fila es una sucesión de teclas separadas por espacios, y una tecla entre llaves es una de las de abajo. Se tratan aquí, así que significan lo mismo en los tres teclados; un teclado solo decide si las pone en pantalla.
baseSubclassesTitle=Los tres teclados
baseSubclassesSubtitle=A cuál recurrir
baseHowTitle=Unas palabras sobre la geometría
baseHowText=<p>Por estrecho que sea el sitio, un teclado nunca tiene que desplazarse lateralmente: una tecla querría ser tan ancha como alta y cede esa anchura cuando el sitio aprieta. Su altura viene del <code>size</code> y no se mueve.</p><p>Con <code>docked</code>, el teclado abandona el flujo de la página y se sitúa en el borde inferior de la pantalla, sobre el contenido, como hace el teclado en pantalla de un teléfono. En un teléfono o una tableta ocupa entonces todo el ancho de la pantalla y <code>width</code> no se tiene en cuenta. Un teclado puesto en un campo se ancla igual, solo que su popover lo coloca en el área estática: así tapa también un diálogo modal &mdash; y eso es lo que hace que se pueda escribir en un campo dentro de un diálogo.</p>
propValue=El valor de entrada actual del teclado.
propEmphasizedKeys=Las teclas que se dibujan destacadas, escritas tal como figuran en la distribución — las llaves de una tecla especial son opcionales. Un modificador se destaca mientras está activo, diga lo que diga esto.
propMaxLength=Número máximo de caracteres. 0 significa sin límite.
propEnabled=Si el teclado puede usarse.
propHardwareKeys=Si se acepta la entrada de un teclado real mientras el teclado tiene el foco. Solo se toman las teclas que forman parte de la distribución; Intro y Retroceso se tratan siempre.
propSize=El tamaño táctil de cada tecla. Toda la geometría lo sigue.
propWidth=Anchura del teclado. No se tiene en cuenta en un teclado anclado en un teléfono o una tableta.
propDocked=Si el teclado se sitúa en el borde inferior de la pantalla, sobre el contenido, en lugar de estar en el flujo de la página.
evtChange=Se dispara cada vez que cambia el valor — una tecla, el retroceso, lo que sea que lo mueva.
evtKeyPress=Se dispara por cada tecla pulsada, con la tecla tal como figura en la distribución.
evtEnter=Se dispara cuando se pulsa la tecla Intro, con el valor actual.
evtEscape=Se dispara cuando se pulsa la tecla Esc. El teclado no hace nada por su cuenta; un campo que muestra uno cierra con ello su popover.
subKeyboard=Un campo de texto: la distribución de un país, dicha en una línea.
subNumberPad=Un campo de dígitos: un panel de tres columnas, en el bloque de un ordenador, un teléfono o una calculadora.
subCustomKeyboard=Todo lo demás: las teclas se escriben, fila por fila, y en tantos juegos como hagan falta.
