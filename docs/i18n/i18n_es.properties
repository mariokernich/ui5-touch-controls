apiProperties=Propiedades
apiPropertiesSubtitle=Con qué se configura el control
apiEvents=Eventos
apiEventsSubtitle=Qué dispara y qué entrega con ello
apiAggregations=Agregaciones
apiAggregationsSubtitle=Qué va dentro
apiInherited=El resto de su API viene de
apiKbMode=La disposición de las letras: el teclado de un país, nombrado por el idioma para el que se usa.
apiKbDisplayNumbers=Dónde van los dígitos: en una fila sobre las letras, tras una tecla propia, o lo primero en un ordenador y lo segundo en un móvil.
apiKbShowSpecialCharacters=Si desde el teclado se llega a un juego de paréntesis, signos y monedas.
apiKbShowCapsLock=Si junto a la tecla de mayúsculas hay un bloqueo. Permanece activo hasta que se vuelve a pulsar.
apiKbLetterCase=En qué caja se escriben las letras. Upper y Lower fijan el teclado en una de ellas y dejan fuera mayúsculas y bloqueo.
apiKbShowEmojis=Si tras una tecla propia hay un juego de caras. Solo están las de un único carácter.
apiKbExtraKeys=Teclas propias junto a la barra espaciadora, en todos los juegos: la arroba de una dirección, el punto de un dominio, una unidad.
apiKbShowEscape=Si la esquina superior izquierda lleva una tecla de escape. Dispara escape y nada más.
apiKbEnterText=Lo que dice la tecla Intro. Vacío le deja la flecha que trae.
apiPadMode=El bloque de dígitos: Simple como el de un ordenador, Phone con asterisco y almohadilla, Calculator con las cuatro operaciones.
apiPadShowSpecialCharacters=Si desde el teclado se llega a un juego de signos: los de una contraseña y la puntuación de una nota.
apiPadShowDecimalSeparator=Si el teclado tiene una tecla para el separador decimal. Solo se mira en Simple; los otros dos bloques tienen ocupada su cuarta fila.
apiPadDecimalSeparator=El signo que escribe esa tecla. Vacío toma el del idioma actual: una coma en español, un punto en inglés.
apiPadShowSign=Si el teclado tiene una tecla de menos, para un valor que puede ser negativo. Solo se mira en Simple.
apiPadShowEscape=Si la fila de teclas de función lleva una tecla de escape. Dispara escape y nada más.
apiPadEnterText=Lo que dice la tecla Intro. Vacío le deja la flecha que trae.
apiCustomLayout=Las filas de teclas, para un teclado que solo muestra un juego. Las teclas se separan con espacios y las filas con comas.
apiCustomLayouts=Los juegos de teclas que el teclado puede mostrar. Una tecla con el nombre de un juego cambia a él, y los juegos tienen prioridad sobre la propiedad layout.
apiCustomDisplay=Lo que dice una tecla concreta, cuando el signo que el teclado elegiría no es el adecuado.
apiBcValue=El valor del campo.
apiBcPlaceholder=El texto que se ve mientras el campo está vacío.
apiBcScanTimeout=El mayor intervalo entre dos pulsaciones, en milisegundos, que aún cuenta como escáner. Una persona no se acerca ni de lejos.
apiBcMinLength=El código más corto que aún se toma como escaneo. Una ráfaga más corta cuenta como tecleo.
apiBcPrefix=Caracteres que el escáner envía antes del código. Se recortan del valor.
apiBcSuffix=Caracteres que el escáner envía después del código, aparte del Intro final. Se recortan del valor.
apiBcClearOnScan=Vacía el campo tras un escaneo, para que el siguiente código entre directamente.
apiBcEnabled=Si el campo se puede usar.
apiBcEditable=Si el valor se puede cambiar.
apiBcValueState=El estado de validación que muestra el campo: Error, Warning, Success, Information.
apiBcWidth=Ancho del campo.
apiBcSize=El tamaño táctil del campo.
apiBcScan=Se dispara cuando se ha escaneado un código de barras.
apiBcChange=Se dispara cuando el valor se ha cambiado a mano: con Intro o cuando el campo pierde el foco.
apiBcLiveChange=Se dispara en cada pulsación.
apiSpValue=La firma como data URL PNG, vacía mientras no haya nada trazado. Una cadena vacía borra el panel.
apiSpPlaceholder=La indicación sobre la línea mientras el panel está vacío. Una cadena vacía deja la línea desnuda.
apiSpHeight=Alto del panel.
apiSpWidth=Ancho del panel.
apiSpShowClearButton=Si se muestra el botón que borra el panel.
apiSpEnabled=Si se puede firmar.
apiSpValueState=El estado de validación que muestra el panel: Error, Warning, Success, Information.
apiSpSize=El tamaño táctil: escala el trazo, la indicación y el botón de borrar.
apiSpChange=Se dispara al terminar un trazo y al borrar el panel.

