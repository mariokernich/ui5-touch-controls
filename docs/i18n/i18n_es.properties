docButtonSummary=Un botón cuya geometría entera sigue una única propiedad size, así que el área que el dedo tiene que acertar crece con ella. Todo lo demás — texto, icono, tipo y press — se lee como en sap.m.Button.
docButtonOriginal=El botón estándar de sap.m: texto, icono, posición del icono, tipo de botón y evento press. Su altura es la que prescribe el tema y no cambia.
docButtonDescription=Botón con tamaño configurable, icono, posición del icono, tipo (todos los valores de sap.m.ButtonType), relleno lateral y anchura. Dispara press.
docSegmentedButtonSummary=Una fila de botones unidos de los que exactamente uno está seleccionado, dimensionada para que cada segmento se pueda acertar con el dedo.
docSegmentedButtonOriginal=Una fila de botones unidos de los que exactamente uno está seleccionado, llenada con sap.m.SegmentedButtonItem. Dispara selectionChange.
docSegmentedButtonDescription=Una fila de botones unidos de los que exactamente uno está seleccionado, llenada con tc:SegmentedButtonItem (key, text, icon, enabled). Admite selectedKey, width para repartir los segmentos por igual, y dispara selectionChange.
docCheckBoxSummary=Una casilla cuyo cuadro, marca, etiqueta y área táctil escalan juntos en lugar de quedarse al tamaño que les da el tema.
docCheckBoxOriginal=La casilla estándar de sap.m, con etiqueta, selección de tres estados y estados de valor. El cuadro y el área táctil tienen el tamaño que les da el tema.
docCheckBoxDescription=Casilla cuyo cuadro, marca, etiqueta y área táctil escalan juntos — al tamaño M la geometría coincide con la de sap.m.CheckBox. Admite selected, partiallySelected, text, editable, wrapping, los estados de valor y width. Dispara select.
docRadioButtonSummary=Un botón de opción que escala con su propiedad size, y un control de grupo que dispone un conjunto de ellos en columnas y les traslada sus ajustes.
docRadioButtonOriginal=Un botón de opción excluyente con los demás de su groupName, más un control de grupo que dispone un conjunto de ellos en columnas.
docRadioButtonDescription=Círculo, punto, etiqueta y área táctil escalan juntos — al tamaño M la geometría coincide con la de sap.m.RadioButton. Los botones que comparten un groupName se excluyen entre sí; tc:RadioButtonGroup los dispone en columnas y les traslada sus size, enabled, editable y estado de valor. Dispara select.
docSwitchSummary=Un interruptor de encendido/apagado que crece con su propiedad size, donde sap.m.Switch está fijo en 4rem por 2rem.
docSwitchOriginal=Un interruptor de encendido/apagado de tamaño fijo, con una variante aceptar/rechazar y textos propios para los dos estados.
docSwitchDescription=Carril, mando y etiqueta escalan juntos, donde sap.m.Switch está fijo en 4rem x 2rem. Admite state, customTextOn, customTextOff y el tipo AcceptReject; los colores vienen de los parámetros de tema @sapButton_Track_* / @sapButton_Handle_*. Dispara change.
docSelectSummary=Un desplegable cuya lista se abre en filas tan altas como el propio campo, de modo que una entrada puede elegirse con el dedo.
docSelectOriginal=Un desplegable lleno de elementos sap.ui.core.Item. La lista que abre mantiene la altura de fila estándar, por grande que sea el campo.
docSelectDescription=Desplegable lleno de simples elementos sap.ui.core.Item. La lista se abre en un popover cuyas filas son tan altas como el campo, así que pueden acertarse con el dedo — la lista nativa de sap.m.Select mantiene su altura de fila estándar por grande que sea el campo. Admite selectedKey, editable, forceSelection, los estados de valor y width. En un teléfono la lista ocupa toda la pantalla, como en sap.m. Dispara change.
docComboBoxSummary=Un Select en el que se puede escribir: se admite texto libre, lo que se escribe filtra la lista, y las filas son tan altas como el campo.
docComboBoxOriginal=Un desplegable en el que además se puede escribir: lo que se escribe filtra la lista, y se admite un valor que no esté en ella.
docComboBoxDescription=Un Select en el que se puede escribir: se admite texto libre y lo que se escribe filtra la lista, cuyas filas son tan altas como el campo. Funciona junto con los teclados de esta biblioteca en un dispositivo que no tiene ninguno. Admite value, selectedKey, placeholder, editable, los estados de valor, width y showSecondaryValues, que pone el additionalText de un sap.ui.core.ListItem al final de la fila. En un teléfono la lista ocupa toda la pantalla y trae un campo propio para seguir escribiendo, como en sap.m. Dispara change y selectionChange.
docDatePickerSummary=Un campo de fecha cuyo calendario está hecho con los botones de esta biblioteca, así que un día es un cuadrado que crece con la propiedad size.
docDatePickerOriginal=Un campo con un calendario emergente basado en sap.ui.unified.Calendar, con minDate/maxDate y formatos de valor y visualización configurables.
docDatePickerDescription=Campo con un calendario hecho con los propios botones de la biblioteca, así que un día es un cuadrado que crece con la propiedad size, en lugar de la rejilla fija de sap.ui.unified.Calendar. Vistas de días y meses, minDate/maxDate, valueFormat y displayFormat (estilo o patrón). Dispara change con value, dateValue y valid.
docTimePickerSummary=Un campo de hora que se rellena con un toque en la hora y otro en el minuto, en lugar de un deslizador que hay que arrastrar.
docTimePickerOriginal=Un campo con un emergente en el que las horas y los minutos se ajustan con deslizadores que hay que arrastrar.
docTimePickerDescription=Campo con dos columnas de botones — horas y minutos — para elegir una hora con un solo toque en un blanco que crece con size, donde sap.m.TimePicker usa un deslizador que hay que arrastrar. Admite minutesStep, valueFormat y displayFormat. Dispara change una sola vez, al cerrarse el popover.
docInputSummary=Un campo de entrada de una línea que escala con su propiedad size y puede traer consigo un teclado de esta biblioteca, para un dispositivo que no tiene ninguno.
docInputOriginal=El campo de entrada estándar de una línea de sap.m, con texto de ayuda, longitud máxima, estados de valor y sugerencias.
docInputDescription=Campo de entrada de una línea con tamaño configurable. Un teclado de esta biblioteca — tc:Keyboard, tc:NumberPad o tc:CustomKeyboard — puede ponerse en su agregación keyboard; con showKeyboard se abre entonces en un popover bajo el campo mientras este tiene el foco, y escribe en él.
docTextAreaSummary=Un campo de entrada de varias líneas que escala con su propiedad size y acepta un teclado de esta biblioteca, cuya tecla Intro inserta aquí un salto de línea.
docTextAreaOriginal=El campo de entrada de varias líneas estándar de sap.m, con número de filas, longitud máxima y estados de valor.
docTextAreaDescription=Campo de varias líneas con tamaño configurable, número de filas, longitud máxima y estados de valor. Acepta un teclado en su agregación keyboard igual que el Input; allí la tecla Intro inserta un salto de línea. Dispara change / liveChange.
docTextSummary=Un texto cuyo cuerpo sigue la misma propiedad size que todos los demás controles de la biblioteca, así que una etiqueta queda a la escala del campo contiguo.
docTextOriginal=Un control de texto con salto de línea y número máximo de líneas.
docTextDescription=Texto con tamaño y color configurables. Dispara press.
docLinkSummary=Un enlace cuya etiqueta — y con ella el área que puede acertarse con el dedo — crece con la propiedad size.
docLinkOriginal=Un enlace con href y target, y las variantes discreta y destacada.
docLinkDescription=Enlace con tamaño configurable, así que el área que puede acertarse con el dedo crece con la etiqueta. Admite href, target, wrapping, subtle, emphasized y width; un enlace con target="_blank" recibe automáticamente rel="noopener noreferrer". Dispara press.
docToolbarSummary=Una barra para los controles de esta biblioteca que aun así encaja allí donde sap.m espera una barra propia — el pie de una Page o de un Dialog, por ejemplo.
docToolbarOriginal=Una barra que dispone su contenido en una fila. Muchas agregaciones de cabecera y pie de sap.m están tipadas a ella.
docToolbarDescription=Contenedor de barra de herramientas con una agregación content. Utilizable en agregaciones estándar como el pie de una Page o un Dialog.
docOverflowToolbarSummary=Una Toolbar que lleva lo que no cabe a un popover detrás de un botón de tres puntos, guiada por las prioridades de sap.m.OverflowToolbarLayoutData.
docOverflowToolbarOriginal=Una Toolbar que lleva lo que no cabe a un popover detrás de un botón de tres puntos, guiada por las prioridades de sap.m.OverflowToolbarLayoutData.
docOverflowToolbarDescription=Como tc:Toolbar, pero el contenido que no cabe en la anchura disponible pasa detrás de un botón de tres puntos que abre un popover con el resto. Entiende las prioridades de sap.m.OverflowToolbarLayoutData.
docStepInputSummary=Un campo numérico con un botón de menos y otro de más dimensionados junto a él, para ajustar el valor con el pulgar.
docStepInputOriginal=Un campo numérico con un botón de menos y otro de más, con min, max y paso.
docStepInputDescription=Botón de menos, campo de entrada y botón de más, dimensionados a la vez. Admite min, max, step. Dispara change.
docBarcodeInputSummary=Un campo de entrada que distingue un lector de códigos de barras de una persona escribiendo y comunica ambos como eventos distintos.
docBarcodeInputDescription=Campo de entrada que distingue un lector de códigos de barras de una persona escribiendo: una tirada de al menos minLength caracteres cuyos intervalos se mantienen por debajo de scanTimeout y que se cierra con Intro dispara scan, todo lo demás dispara change. prefix y suffix se recortan del código, clearOnScan vacía el campo para el siguiente.
docKeyboardSummary=Un teclado de letras en pantalla para un dispositivo que no tiene ninguno. El mode elige la distribución de un país; un puñado de interruptores dice qué más hay en él.
docKeyboardDescription=Teclado de letras en pantalla, construido con los propios botones de la biblioteca. La propiedad mode elige la distribución de un país — inglés, alemán, francés, español, italiano, portugués, sueco, turco, rumano, ucraniano, ruso, hindi — y un puñado de interruptores dice qué más hay en él: displayNumbers pone los dígitos sobre las letras o detrás de una tecla, showSpecialCharacters añade un juego de signos, letterCase fija el teclado en mayúsculas o minúsculas, showCapsLock y showEscape añaden una tecla cada uno. Entrada por teclado físico opcional, enlace del valor y eventos change / keyPress / enter / escape.
docNumberPadSummary=Un panel de dígitos en pantalla en tres columnas, para todo lo que se escribe como número. El mode elige el bloque: panel de ordenador, panel de teléfono o calculadora.
docNumberPadDescription=Panel de dígitos en pantalla en tres columnas. La propiedad mode elige el bloque — Simple (el panel de un ordenador), Phone (el de un teléfono) o Calculator (con las cuatro operaciones básicas) — y showDecimalSeparator, decimalSeparator, showSign y showSpecialCharacters añaden lo que el campo necesita más allá de los dígitos. Comparte con los demás teclados el tratamiento del valor, el dimensionado y el anclaje.
docCustomKeyboardSummary=El teclado al que se le entregan las teclas, fila por fila. Es la respuesta a todo lo que los teclados ya hechos no cubren.
docCustomKeyboardDescription=Teclado en pantalla al que se le entregan las teclas: la propiedad layout son las filas de un juego, la agregación layouts lleva tantos juegos como hagan falta, y una tecla escrita con el nombre de un juego cambia a él. La agregación display dice qué muestra una tecla concreta. Es el teclado para todo lo que los ya hechos no cubren.
docKeyboardBaseSummary=La maquinaria detrás de los tres teclados. Ella misma no se pone en una vista: lo que no sabe es qué teclas mostrar, y justo eso distingue a sus subclases.
docKeyboardBaseDescription=Clase base de los teclados en pantalla de esta biblioteca, construida de forma nativa con sus propios controles Button, sin dependencias de terceros. Todo lo que no tiene que ver con qué teclas mostrar vive aquí: el valor y cómo lo cambia una tecla, los juegos de teclas y el paso de uno a otro, la mayúscula y el bloqueo, las teclas de un teclado real mediante hardwareKeys, el tamaño, la anchura y el anclaje. Es el tipo al que está tipada la agregación keyboard de un Input o un TextArea, así que un Keyboard, un NumberPad y un CustomKeyboard encajan todos ahí.
docSignaturePadSummary=Un campo donde firmar con el dedo o un lápiz digital. La firma sale como URL de datos PNG, así que puede enlazarse a un modelo como cualquier otro valor.
docSignaturePadDescription=Un campo donde firmar con el dedo o un lápiz digital. Dibuja sobre un canvas y entrega la firma como URL de datos PNG en value, para enlazarla a un modelo. El grosor del trazo, el texto de ayuda y el botón de borrado siguen la propiedad size; los trazos sobreviven a un redimensionado. Dispara change.
docQuickDialogSummary=Diálogos ya hechos con los controles táctiles, llamados desde el controlador en lugar de escribirse en una vista. Cada método devuelve una Promise.
docQuickDialogDescription=Clase auxiliar para diálogos listos para el táctil, usada desde el controlador en lugar de una vista: show, confirm, information, error, input, select, details. Cada método devuelve una Promise.
docThemeHorizon=Tema predeterminado de la demo
docThemeHorizonDark=Variante oscura de Horizon
docThemeHorizonHcb=Alto contraste, fondo oscuro
docThemeHorizonHcw=Alto contraste, fondo claro
docThemeFiori3=Antiguo tema predeterminado de UI5
docThemeFiori3Dark=Variante oscura de Fiori 3
