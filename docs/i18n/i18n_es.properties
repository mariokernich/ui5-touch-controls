keyboardLayoutsTitle=Las distribuciones
keyboardLayoutsSubtitle=Lo que muestra cada valor de la propiedad mode
keyboardLayoutsText=El <code>mode</code> es el teclado de un país, nombrado por el idioma para el que se usa. Las filas de abajo son lo que esa distribución muestra con <code>displayNumbers=&quot;Always&quot;</code>; los interruptores de al lado deciden qué más hay en el teclado. Pulse una distribución para cambiar a ella el teclado de arriba. Donde un idioma se escribe con letras que un teclado de teclas compone con una tecla muerta —las vocales acentuadas del portugués y del italiano—, estas van en un juego propio, al que se llega con una tecla junto a la barra espaciadora.
keyboardSwitchesTitle=Los interruptores
keyboardSwitchesSubtitle=Lo que cada uno añade al teclado
keyboardSwitchesText=<p><b>displayNumbers</b> decide qué pasa con los dígitos. <code>Always</code> pone una fila de ellos sobre las letras, como en un teclado de teclas. <code>Toggle</code> deja las letras a solas y pone los dígitos detrás de una tecla <code>{numbers}</code>, como hace un teléfono &mdash; una fila de dígitos ahí estrecharía cada tecla. <code>ToggleOnMobile</code>, el valor predeterminado, es lo primero en un ordenador y una tableta y lo segundo en un teléfono; cuál de los dos se decide una sola vez, según el dispositivo en el que se abrió la página. <code>Never</code> deja los dígitos fuera del todo.</p><p><b>showSpecialCharacters</b> añade un juego de paréntesis, signos y monedas. Donde los dígitos están detrás de una tecla propia, el juego va a continuación de ellos, como un teléfono pasa de sus letras a sus dígitos y a sus símbolos y vuelve; si no, una tecla <code>{symbols}</code> lleva hasta allí.</p><p><b>letterCase</b> fija el teclado en una sola caja. <code>Upper</code> y <code>Lower</code> dejan fuera la tecla de mayúsculas y el bloqueo &mdash; no hay nada que alternar, que es lo que quiere un campo con una caja impuesta: un número de material, una matrícula, un lote. No se tiene en cuenta en hindi, que tiene un segundo juego de letras en lugar de mayúsculas.</p><p><b>showEmojis</b> cuelga un juego de caritas detrás de una tecla propia, igual que se llega a los dígitos y a los caracteres especiales. Solo lleva caritas de un único carácter: una compuesta de varios &mdash; una familia, una bandera &mdash; volvería a deshacerla el retroceso.</p><p><b>extraKeys</b> son teclas que se sitúan junto a la barra espaciadora en todos los juegos, sea cual sea el que está en pantalla. Ahí va la tecla que un campo quiere a mano en lugar de detrás de un cambio: <code>extraKeys=&quot;@,.&quot;</code> para una dirección, una unidad para una cantidad. La arroba está también en el juego de caracteres especiales, una tecla más allá.</p><p><b>showCapsLock</b> añade un <code>{lock}</code> junto a la tecla de mayúsculas. La mayúscula decae tras una letra, el bloqueo se mantiene hasta que se vuelve a pulsar &mdash; y la mayúscula con el bloqueo activo escribe en minúsculas, como en un teclado de teclas.</p><p><b>showEscape</b> añade una tecla <code>{esc}</code> al principio de la fila superior, donde la tiene un teclado de teclas, en todos los juegos. Dispara <code>escape</code> y nada más; lo que deba significar queda para la aplicación.</p><p><b>enterText</b> es lo que dice la tecla Intro. Vacío la deja como la flecha que es.</p>
padLayoutsTitle=Los bloques de dígitos
padLayoutsSubtitle=Lo que muestra cada valor de la propiedad mode
padLayoutsText=El <code>mode</code> elige el bloque de dígitos, y el bloque conserva su forma se active lo que se active: un menos y un separador decimal van a la fila del cero, la tecla hacia los caracteres especiales y la tecla Esc a la fila de funciones de debajo. Donde no se han pedido ni el menos ni el separador, el retroceso y el intro pasan en su lugar a la fila del cero &mdash; un cero solo en su línea sería una tecla de tres columnas de ancho. Pulse un modo para cambiar a él el panel de arriba.
customKeysTitle=Escribir una distribución
customKeysSubtitle=Filas, teclas y las que tienen un significado propio
customKeysText=Una fila es una sucesión de teclas separadas por espacios; en una vista, las filas se separan por comas. Todo lo que no aparece en la tabla de abajo se escribe a sí mismo &mdash; una letra, un dígito, una palabra entera. Una tecla escrita con el nombre de uno de los juegos de la agregación <code>layouts</code> cambia a ese juego, y una tecla que nombra el juego en el que ya se está lleva de vuelta fuera de él.
