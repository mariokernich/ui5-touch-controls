# ---------------------------------------------------------------------------
# Primeiros passos
# ---------------------------------------------------------------------------
gsTitle=Primeiros passos
gsSubtitle=Os controles padrão do UI5, refeitos para o dedo — e os que faltam no sap.m
gsWhatTitle=Do que se trata
gsWhatSubtitle=Por que só o sap.m não basta em um dispositivo de toque
gsWhatText1=Os controles do <code>sap.m</code> são feitos para mouse e teclado. Em um tablet, em um terminal de chão de fábrica ou em um aparelho operado com luvas eles são simplesmente pequenos demais &mdash; e a densidade de conteúdo «cozy» só ajuda um passo.
gsWhatText2=A biblioteca resolve isso de duas formas:<ul><li><strong>Ela refaz os controles mais importantes do <code>sap.m</code></strong> sobre a estrutura original e os abre ao dimensionamento por uma única propriedade <code>size</code> (<code>S</code>&ndash;<code>6XL</code>) que funciona igual em todos eles. Não é preciso refazer o aplicativo: os controles mantêm as propriedades, agregações e eventos conhecidos dos originais e servem de substituto direto.</li><li><strong>Ela acrescenta controles que o <code>sap.m</code> não tem</strong>, para situações que só surgem em dispositivos de toque &mdash; o exemplo principal são os teclados na tela.</li></ul>
gsSizesTitle=Uma propriedade, nove tamanhos
gsSizesSubtitle=S · M (padrão) · L · XL · 2XL · 3XL · 4XL · 5XL · 6XL
gsSizesText=O tamanho escala junto o corpo do texto, o tamanho dos ícones, o preenchimento e a altura, de modo que os controles continuam proporcionais em cada degrau. Vincule <code>size</code> a um modelo para mudar o tamanho do aplicativo inteiro em tempo de execução.
gsDropInTitle=Substituto direto
gsDropInSubtitle=Acrescentar o namespace, pôr tc: na frente do controle, escolher um tamanho
gsBeforeTitle=Antes — só sap.m
gsAfterTitle=Depois — ui5.touch.controls
gsDropInText=As mesmas agregações, as mesmas propriedades, os mesmos manipuladores de evento &mdash; <code>press=".onSave"</code> continua chamando o mesmo método do seu controller. Controles do <code>sap.m</code> como o <code>ToolbarSpacer</code> podem ficar exatamente onde estão.
gsRequirementsTitle=Requisitos
gsRequirementsStrip=É necessário UI5 1.116 ou superior (OpenUI5 ou SAPUI5).
gsRequirementsText=A biblioteca é publicada no npm como <code>ui5.touch.controls</code> e pode ser usada em qualquer aplicativo UI5 construído com o UI5 Tooling (v3 ou superior). Ela traz o próprio <code>ui5.yaml</code>, então o tooling a resolve sozinho como dependência de biblioteca.
gsNextTitle=Próximos passos
gsNextSubtitle=Por onde seguir
gsNextText=<ul><li><strong>Instalação</strong> &mdash; instalar o pacote, declarar a biblioteca e preparar o TypeScript.</li><li><strong>Documentação</strong> &mdash; a referência completa dos controles, a escala de tamanhos, a interface <code>ISized</code> e as armadilhas conhecidas.</li><li><strong>Controles</strong> &mdash; uma página interativa por controle, lado a lado com o original do <code>sap.m</code>.</li></ul>

# ---------------------------------------------------------------------------
# Instalação
# ---------------------------------------------------------------------------
setupTitle=Instalação
setupSubtitle=Instalar a biblioteca, declará-la no aplicativo e preparar o TypeScript
setupPrereqTitle=Pré-requisitos
setupPrereqSubtitle=O que o projeto precisa antes de começar
setupPrereqStrip=UI5 1.116 ou superior (OpenUI5 ou SAPUI5) e UI5 Tooling v3 ou superior.
setupPrereqText=A biblioteca é publicada no npm como <a href="https://www.npmjs.com/package/ui5.touch.controls" target="_blank">ui5.touch.controls</a> e pode ser usada em qualquer aplicativo UI5 construído com o <a href="https://sap.github.io/ui5-tooling/" target="_blank">UI5 Tooling</a>.
setupInstallTitle=1. Instalar o pacote
setupInstallSubtitle=Como dependência normal, não como devDependency
setupInstallText=Instale a biblioteca como <strong>dependência normal</strong> para que o UI5 Tooling a reconheça como dependência do projeto. O pacote traz um <code>ui5.yaml</code>, então o tooling a resolve sozinho como dependência de biblioteca.
setupMiddlewareTitle=1b. Com middleware do UI5 (alternativa)
setupMiddlewareSubtitle=Servir a biblioteca como arquivos estáticos em vez de resolvê-la como dependência do projeto
setupMiddlewareText=Em vez de consumir a biblioteca como dependência de projeto do UI5 Tooling, você pode servi-la como arquivos estáticos com o <a href="https://www.npmjs.com/package/ui5-middleware-servestatic" target="_blank">ui5-middleware-servestatic</a>.
setupManifestTitle=2. Declarar a biblioteca no manifest.json
setupManifestSubtitle=Para que o aplicativo a carregue na inicialização
setupNamespaceTitle=3. Acrescentar o namespace às suas views
setupNamespaceSubtitle=O prefixo tc é só uma convenção — qualquer um serve
setupTypeScriptTitle=4. Suporte a TypeScript (opcional)
setupTypeScriptSubtitle=Tipagem completa desde o início
setupTypeScriptStrip=Sem a entrada «types», o UI5 Tooling não carrega a biblioteca automaticamente.
setupTypeScriptText=Em projetos TypeScript, acrescente o pacote à entrada <code>types</code> do seu <code>tsconfig.json</code>. O pacote inclui as definições de tipo (<code>dist/index.d.ts</code>).

# ---------------------------------------------------------------------------
# Documentação
# ---------------------------------------------------------------------------
docTitle=Documentação
docSubtitle=Referência dos controles, escala de tamanhos, interface ISized e armadilhas conhecidas
docPortedTitle=Versões para toque dos controles do sap.m
docPortedSubtitle=A coluna «Substitui» nomeia o controle do sap.m que cada um vem substituir
docPortedText=São reconstruções de controles padrão. Elas mantêm as propriedades, agregações e eventos dos originais para os casos comuns, então servem de substituto direto. Clique em um controle para abrir sua página interativa.
docNewTitle=Controles adicionais para o toque
docNewSubtitle=Só existem nesta biblioteca
docNewText=Eles atendem a situações que só surgem em um dispositivo de toque: um terminal sem teclado físico, um leitor de código de barras em vez da digitação, uma assinatura na tela. Clique em um controle para abrir sua página interativa.
docClassesTitle=Classes
docClassesSubtitle=Usadas a partir de um controller, não colocadas em uma view
docClassesText=Nem tudo o que a biblioteca acrescenta é um controle. Estas classes são chamadas do código do controller e montam elas mesmas a sua interface, a partir dos controles de toque. Clique em uma classe para abrir sua página interativa.
docThemesTitle=Temas compatíveis
docThemesSubtitle=Todos os controles trazem a própria biblioteca de temas para estes
docThemesText1=Os controles tiram suas cores, bordas e sombras dos parâmetros do tema ativo, então combinam com os controles <code>sap.m</code> ao redor. Defina o tema como de costume, por <code>data-sap-ui-theme</code> no bootstrap ou em tempo de execução por <code>Theming.setTheme()</code>.
docThemesText2=Temas que não aparecem aqui não acompanham a biblioteca. O UI5 recorre então ao tema base para <code>ui5.touch.controls</code>: os controles continuam utilizáveis, mas não vão combinar com as cores do restante do aplicativo.
docSizesTitle=Tamanhos
docSizesSubtitle=Todo controle tem a mesma propriedade size
docSizesText1=Valores possíveis: <code>S</code> &middot; <code>M</code> (padrão) &middot; <code>L</code> &middot; <code>XL</code> &middot; <code>2XL</code> &middot; <code>3XL</code> &middot; <code>4XL</code> &middot; <code>5XL</code> &middot; <code>6XL</code>
docSizesText2=O tamanho escala junto o corpo do texto, o tamanho dos ícones, o preenchimento e a altura, de modo que os controles continuam proporcionais em cada degrau. Vincule <code>size</code> a um modelo para mudar o tamanho do aplicativo inteiro em tempo de execução.
docISizedTitle=ISized
docISizedSubtitle=ui5.touch.controls.ISized
docISizedText=Todos os controles com uma propriedade <code>size</code> carregam a interface de marcação <code>ui5.touch.controls.ISized</code>. Ela permite tratar o tamanho de forma genérica, por exemplo para aplicar uma preferência do usuário a uma view inteira.
docKeyboardTitle=Os teclados
docKeyboardSubtitle=O sap.m não tem equivalente
docKeyboardText1=Em um terminal de chão de fábrica, um totem ou um aparelho operado com luvas muitas vezes não há teclado físico, e o teclado na tela do sistema operacional ou não está disponível ou cobre metade da tela. O UI5 não tem controle algum para isso. A biblioteca traz três teclados na tela, desenhados com os próprios botões dela &mdash; sem dependência de terceiros, e dimensionados pela mesma propriedade <code>size</code> de todo o resto.
docKeyboardText2=<code>tc:Keyboard</code> é um teclado de letras: o <code>mode</code> é o layout de um país, e um punhado de chaves diz se os dígitos ficam sobre as letras ou atrás de uma tecla, se há caracteres especiais e em que caixa ele escreve. <code>tc:NumberPad</code> é a mesma ideia para um campo de dígitos. Ao <code>tc:CustomKeyboard</code> as teclas são entregues linha a linha, para tudo o que os outros dois não cobrem: <code>&#123;shift&#125;</code>, <code>&#123;space&#125;</code>, <code>&#123;bksp&#125;</code> e <code>&#123;enter&#125;</code> são as teclas especiais, qualquer outra tecla escreve o próprio rótulo. Os três aceitam as teclas de um teclado real com <code>hardwareKeys="true"</code>, ancoram na borda inferior da tela com <code>docked</code> e cabem na agregação <code>keyboard</code> de um campo.
docPitfallTitle=Armadilha: agregações que só aceitam sap.m.Button
docPitfallSubtitle=buttons, beginButton e endButton do sap.m.Dialog
docPitfallStrip=Algumas agregações padrão são tipadas como sap.m.Button e recusam um tc:Button em tempo de execução: "Element ui5.touch.controls.Button#__button0" is not valid for aggregation "buttons".
docPitfallText1=E esses espaços de botão também não foram pensados para mudar de tamanho &mdash; estão dispostos para a altura de botão padrão.
docPitfallText2=<strong>A saída é a agregação <code>footer</code>.</strong> Ela é tipada como <code>sap.m.Toolbar</code> (disponível desde o UI5 1.110), e como <code>tc:Toolbar</code> e <code>tc:OverflowToolbar</code> herdam de <code>sap.m.Toolbar</code>, elas entram direto. O diálogo ajusta então a altura do rodapé à barra de ferramentas, e os botões em tamanho de toque aparecem corretamente. Prefira a <code>tc:OverflowToolbar</code> sempre que o diálogo puder ficar estreito.
docPitfallText3=Para diálogos simples no estilo MessageBox você não precisa montar nada disso &mdash; o <code>QuickDialog</code> já monta o rodapé assim, no tamanho indicado pela opção <code>size</code>.
docSizesExample=Vincular o tamanho
docPitfallBrokenTitle=Não funciona
docPitfallWorksTitle=Funciona

# ---------------------------------------------------------------------------
# páginas dos controles
# ---------------------------------------------------------------------------
barcodeHint=O <code>sap.m</code> não tem equivalente: em modo «keyboard wedge», um leitor de código de barras digita o código no campo em foco em poucos milissegundos e o encerra com <kbd>Enter</kbd>. O controle mede o tempo entre as teclas, então uma leitura dispara <code>scan</code>, enquanto digitar os mesmos caracteres à mão dispara <code>change</code>.
signatureHint=O <code>sap.m</code> não tem equivalente. O painel desenha em um canvas e entrega o resultado como URL de dados PNG em <code>value</code>, então pode ser vinculado a um modelo e enviado ao backend como qualquer outro valor. A espessura do traço, o texto de apoio e o botão de limpar seguem a propriedade <code>size</code>.
overflowPlainHint=Arraste o controle deslizante para a esquerda: o conteúdo que não cabe mais passa para trás do botão de três pontos. Na largura total não há botão de estouro algum.
overflowPriorityHint=«Imprimir» tem prioridade Low e por isso transborda primeiro. «Salvar» tem NeverOverflow e fica na barra enquanto houver algum espaço — na largura mínima ele também passa para o popover, para que o botão de estouro continue alcançável. «Sobre» tem AlwaysOverflow e está sempre no popover — por isso esta barra mostra o botão de três pontos mesmo quando sobra espaço.
overflowFooterHint=Estreite a janela do navegador para ver a barra do rodapé transbordar — o popover então abre acima da barra.
overflowDialogHint=A agregação buttons do sap.m.Dialog só aceita sap.m.Button, mas o rodapé aceita qualquer sap.m.Toolbar — então uma OverflowToolbar de toque entra direto. Ela é a melhor das duas barras aqui: um diálogo é estreito por natureza, e o que não cabe passa para o menu de estouro em vez de ficar cortado.
inputKeyboardHint=Com «Teclado virtual», o teclado da agregação keyboard abre abaixo do campo enquanto ele tem o foco, e fecha assim que o perde.
textAreaKeyboardHint=Com «Teclado virtual», o teclado da agregação keyboard abre abaixo do campo enquanto ele tem o foco, e fecha assim que o perde. A tecla Enter dele insere uma quebra de linha, como o Enter faz em um campo de várias linhas.

