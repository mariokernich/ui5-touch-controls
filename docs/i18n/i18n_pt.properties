docButtonSummary=Um botão cuja geometria inteira segue uma única propriedade size, então a área que o dedo precisa acertar cresce junto. Todo o resto — texto, ícone, tipo e press — se lê como no sap.m.Button.
docButtonOriginal=O botão padrão do sap.m: texto, ícone, posição do ícone, tipo de botão e evento press. A altura dele é a que o tema prescreve e não muda.
docButtonDescription=Botão com tamanho configurável, ícone, posição do ícone, tipo (todos os valores de sap.m.ButtonType), preenchimento lateral e largura. Dispara press.
docSegmentedButtonSummary=Uma fileira de botões unidos dos quais exatamente um fica selecionado, dimensionada para que cada segmento possa ser acertado com o dedo.
docSegmentedButtonOriginal=Uma fileira de botões unidos dos quais exatamente um fica selecionado, preenchida com sap.m.SegmentedButtonItem. Dispara selectionChange.
docSegmentedButtonDescription=Uma fileira de botões unidos dos quais exatamente um fica selecionado, preenchida com tc:SegmentedButtonItem (key, text, icon, enabled). Aceita selectedKey, width para distribuir os segmentos por igual, e dispara selectionChange.
docCheckBoxSummary=Uma caixa de seleção cujo quadro, marca, rótulo e área de toque escalam juntos em vez de ficarem no tamanho que o tema lhes dá.
docCheckBoxOriginal=A caixa de seleção padrão do sap.m, com rótulo, seleção de três estados e estados de valor. O quadro e a área de toque têm o tamanho que o tema lhes dá.
docCheckBoxDescription=Caixa de seleção cujo quadro, marca, rótulo e área de toque escalam juntos — no tamanho M a geometria coincide com a do sap.m.CheckBox. Aceita selected, partiallySelected, text, editable, wrapping, os estados de valor e width. Dispara select.
docRadioButtonSummary=Um botão de opção que escala com sua propriedade size, e um controle de grupo que dispõe um conjunto deles em colunas e lhes repassa suas configurações.
docRadioButtonOriginal=Um botão de opção mutuamente exclusivo com os demais do seu groupName, mais um controle de grupo que dispõe um conjunto deles em colunas.
docRadioButtonDescription=Círculo, ponto, rótulo e área de toque escalam juntos — no tamanho M a geometria coincide com a do sap.m.RadioButton. Botões que compartilham um groupName se excluem; tc:RadioButtonGroup os dispõe em colunas e lhes repassa seus size, enabled, editable e estado de valor. Dispara select.
docSwitchSummary=Um interruptor liga/desliga que cresce com sua propriedade size, enquanto o sap.m.Switch é fixo em 4rem por 2rem.
docSwitchOriginal=Um interruptor liga/desliga de tamanho fixo, com uma variante aceitar/recusar e textos próprios para os dois estados.
docSwitchDescription=Trilho, alça e rótulo escalam juntos, enquanto o sap.m.Switch é fixo em 4rem x 2rem. Aceita state, customTextOn, customTextOff e o tipo AcceptReject; as cores vêm dos parâmetros de tema @sapButton_Track_* / @sapButton_Handle_*. Dispara change.
docSelectSummary=Uma lista suspensa cujas entradas abrem em linhas tão altas quanto o próprio campo, de modo que uma entrada pode ser escolhida com o dedo.
docSelectOriginal=Uma lista suspensa preenchida com elementos sap.ui.core.Item. A lista que ela abre mantém a altura de linha padrão, por maior que seja o campo.
docSelectDescription=Lista suspensa preenchida com simples elementos sap.ui.core.Item. A lista abre em um popover cujas linhas são tão altas quanto o campo, então podem ser acertadas com o dedo — a lista nativa do sap.m.Select mantém sua altura de linha padrão por maior que seja o campo. Aceita selectedKey, editable, forceSelection, os estados de valor e width. Em um celular a lista ocupa a tela inteira, como no sap.m. Dispara change.
docComboBoxSummary=Um Select em que se pode digitar: texto livre é permitido, o que se digita filtra a lista, e as linhas são tão altas quanto o campo.
docComboBoxOriginal=Uma lista suspensa em que também se pode digitar: o que se digita filtra a lista, e um valor fora dela é permitido.
docComboBoxDescription=Um Select em que se pode digitar: texto livre é permitido e o que se digita filtra a lista, cujas linhas são tão altas quanto o campo. Funciona junto com os teclados desta biblioteca em um aparelho que não tem nenhum. Aceita value, selectedKey, placeholder, editable, os estados de valor, width e showSecondaryValues, que põe o additionalText de um sap.ui.core.ListItem no fim da linha. Em um celular a lista ocupa a tela inteira e traz um campo próprio para continuar digitando, como no sap.m. Dispara change e selectionChange.
docDatePickerSummary=Um campo de data cujo calendário é montado com os botões desta biblioteca, então um dia é um quadrado que cresce com a propriedade size.
docDatePickerOriginal=Um campo com um calendário em pop-up baseado no sap.ui.unified.Calendar, com minDate/maxDate e formatos de valor e exibição configuráveis.
docDatePickerDescription=Campo com um calendário montado com os próprios botões da biblioteca, então um dia é um quadrado que cresce com a propriedade size, em vez da grade fixa do sap.ui.unified.Calendar. Visões de dias e meses, minDate/maxDate, valueFormat e displayFormat (estilo ou padrão). Dispara change com value, dateValue e valid.
docTimePickerSummary=Um campo de horário que se preenche com um toque na hora e um no minuto, em vez de um controle deslizante que precisa ser arrastado.
docTimePickerOriginal=Um campo com um pop-up em que horas e minutos são ajustados em controles deslizantes que precisam ser arrastados.
docTimePickerDescription=Campo com duas colunas de botões — horas e minutos — para escolher um horário com um único toque em um alvo que cresce com size, enquanto o sap.m.TimePicker usa um controle deslizante que precisa ser arrastado. Aceita minutesStep, valueFormat e displayFormat. Dispara change uma única vez, ao fechar o popover.
docInputSummary=Um campo de entrada de uma linha que escala com sua propriedade size e pode trazer junto um teclado desta biblioteca, para um aparelho que não tem nenhum.
docInputOriginal=O campo de entrada padrão de uma linha do sap.m, com texto de apoio, comprimento máximo, estados de valor e sugestões.
docInputDescription=Campo de entrada de uma linha com tamanho configurável. Um teclado desta biblioteca — tc:Keyboard, tc:NumberPad ou tc:CustomKeyboard — pode ser colocado na sua agregação keyboard; com showKeyboard ele abre então em um popover abaixo do campo enquanto este tem o foco, e digita nele.
docTextAreaSummary=Um campo de entrada de várias linhas que escala com sua propriedade size e aceita um teclado desta biblioteca, cuja tecla Enter insere aqui uma quebra de linha.
docTextAreaOriginal=O campo de entrada de várias linhas padrão do sap.m, com número de linhas, comprimento máximo e estados de valor.
docTextAreaDescription=Campo de várias linhas com tamanho configurável, número de linhas, comprimento máximo e estados de valor. Aceita um teclado na sua agregação keyboard, como o Input; ali a tecla Enter insere uma quebra de linha. Dispara change / liveChange.
docTextSummary=Um texto cujo corpo segue a mesma propriedade size de todos os outros controles da biblioteca, então um rótulo fica na escala do campo ao lado.
docTextOriginal=Um controle de texto com quebra de linha e número máximo de linhas.
docTextDescription=Texto com tamanho e cor configuráveis. Dispara press.
docLinkSummary=Um link cujo rótulo — e com ele a área que pode ser acertada com o dedo — cresce com a propriedade size.
docLinkOriginal=Um link com href e target, e as variantes discreta e em destaque.
docLinkDescription=Link com tamanho configurável, então a área que pode ser acertada com o dedo cresce junto com o rótulo. Aceita href, target, wrapping, subtle, emphasized e width; um link com target="_blank" recebe automaticamente rel="noopener noreferrer". Dispara press.
docToolbarSummary=Uma barra para os controles desta biblioteca que ainda assim cabe onde o sap.m espera uma barra própria — o rodapé de uma Page ou de um Dialog, por exemplo.
docToolbarOriginal=Uma barra que dispõe seu conteúdo em uma fileira. Muitas agregações de cabeçalho e rodapé do sap.m são tipadas para ela.
docToolbarDescription=Contêiner de barra de ferramentas com uma agregação content. Utilizável em agregações padrão como o rodapé de uma Page ou de um Dialog.
docOverflowToolbarSummary=Uma Toolbar que leva o que não cabe para um popover atrás de um botão de três pontos, guiada pelas prioridades de sap.m.OverflowToolbarLayoutData.
docOverflowToolbarOriginal=Uma Toolbar que leva o que não cabe para um popover atrás de um botão de três pontos, guiada pelas prioridades de sap.m.OverflowToolbarLayoutData.
docOverflowToolbarDescription=Como a tc:Toolbar, mas o conteúdo que não cabe na largura disponível passa para trás de um botão de três pontos que abre um popover com o restante. Entende as prioridades de sap.m.OverflowToolbarLayoutData.
docStepInputSummary=Um campo numérico com um botão de menos e um de mais dimensionados junto com ele, para ajustar o valor com o polegar.
docStepInputOriginal=Um campo numérico com um botão de menos e um de mais, com min, max e passo.
docStepInputDescription=Botão de menos, campo de entrada e botão de mais, dimensionados juntos. Aceita min, max, step. Dispara change.
docBarcodeInputSummary=Um campo de entrada que distingue um leitor de código de barras de uma pessoa digitando e relata os dois como eventos diferentes.
docBarcodeInputDescription=Campo de entrada que distingue um leitor de código de barras de uma pessoa digitando: uma sequência de pelo menos minLength caracteres cujos intervalos ficam abaixo de scanTimeout e que termina com Enter dispara scan, todo o resto dispara change. prefix e suffix são cortados do código, clearOnScan esvazia o campo para o próximo.
docKeyboardSummary=Um teclado de letras na tela para um aparelho que não tem nenhum. O mode escolhe o layout de um país; um punhado de chaves diz o que mais há nele.
docKeyboardDescription=Teclado de letras na tela, montado com os próprios botões da biblioteca. A propriedade mode escolhe o layout de um país — inglês, alemão, francês, espanhol, ucraniano, russo, hindi — e um punhado de chaves diz o que mais há nele: displayNumbers põe os dígitos sobre as letras ou atrás de uma tecla, showSpecialCharacters acrescenta um conjunto de sinais, letterCase fixa o teclado em maiúsculas ou minúsculas, showCapsLock e showEscape acrescentam uma tecla cada. Entrada por teclado físico opcional, vinculação do valor e eventos change / keyPress / enter / escape.
docNumberPadSummary=Um painel de dígitos na tela em três colunas, para tudo o que se digita como número. O mode escolhe o bloco: painel de computador, painel de telefone ou calculadora.
docNumberPadDescription=Painel de dígitos na tela em três colunas. A propriedade mode escolhe o bloco — Simple (o painel de um computador), Phone (o de um telefone) ou Calculator (com as quatro operações básicas) — e showDecimalSeparator, decimalSeparator, showSign e showSpecialCharacters acrescentam o que o campo precisa além dos dígitos. Compartilha com os outros teclados o tratamento do valor, o dimensionamento e a ancoragem.
docCustomKeyboardSummary=O teclado a que as teclas são entregues, linha a linha. Ele é a resposta para tudo o que os teclados prontos não cobrem.
docCustomKeyboardDescription=Teclado na tela a que as teclas são entregues: a propriedade layout são as linhas de um conjunto, a agregação layouts carrega quantos conjuntos forem necessários, e uma tecla escrita com o nome de um conjunto muda para ele. A agregação display diz o que uma tecla específica mostra. É o teclado para tudo o que os prontos não cobrem.
docKeyboardBaseSummary=A engrenagem por trás dos três teclados. Ela mesma não é colocada em uma view — o que ela não sabe é quais teclas mostrar, e é justamente isso que distingue suas subclasses.
docKeyboardBaseDescription=Classe base dos teclados na tela desta biblioteca, montada nativamente com os próprios controles Button dela, sem dependência de terceiros. Tudo o que não tem a ver com quais teclas mostrar mora aqui: o valor e como uma tecla o muda, os conjuntos de teclas e a troca entre eles, o shift e o caps lock, as teclas de um teclado real por hardwareKeys, o tamanho, a largura e a ancoragem. É o tipo da agregação keyboard de um Input ou de um TextArea, então um Keyboard, um NumberPad e um CustomKeyboard cabem todos ali.
docSignaturePadSummary=Um campo para assinar com o dedo ou uma caneta. A assinatura sai como URL de dados PNG, então pode ser vinculada a um modelo como qualquer outro valor.
docSignaturePadDescription=Um campo para assinar com o dedo ou uma caneta. Desenha em um canvas e entrega a assinatura como URL de dados PNG em value, para vinculá-la a um modelo. A espessura do traço, o texto de apoio e o botão de limpar seguem a propriedade size; os traços sobrevivem a um redimensionamento. Dispara change.
docQuickDialogSummary=Diálogos prontos montados com os controles de toque, chamados do controller em vez de escritos em uma view. Cada método devolve uma Promise.
docQuickDialogDescription=Classe auxiliar para diálogos prontos para o toque, usada a partir do controller em vez de uma view: show, confirm, information, error, input, select, details. Cada método devolve uma Promise.
docThemeHorizon=Tema padrão da demonstração
docThemeHorizonDark=Variante escura do Horizon
docThemeHorizonHcb=Alto contraste, fundo escuro
docThemeHorizonHcw=Alto contraste, fundo claro
docThemeFiori3=Antigo tema padrão do UI5
docThemeFiori3Dark=Variante escura do Fiori 3
