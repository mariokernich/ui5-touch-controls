kbIntroSubtitle=Um teclado de letras, dito em uma linha
kbIntroText=<p>Em um terminal de chão de fábrica, um totem ou um aparelho operado com luvas muitas vezes não há teclado físico, e o teclado na tela do sistema operacional ou não está disponível ou cobre metade da tela. <code>tc:Keyboard</code> é a resposta para um campo de texto: o <code>mode</code> é o layout de um país, e um punhado de chaves diz o que mais há nele. Não há layout algum para escrever.</p><p>Ele é um dos três teclados, e eles compartilham tudo o que não tem a ver com as teclas: o valor, o <code>size</code>, <code>docked</code>, as teclas de um teclado real por <code>hardwareKeys</code>, e os eventos <code>change</code>, <code>keyPress</code>, <code>enter</code> e <code>escape</code>. Recorra ao <code>tc:NumberPad</code> onde o campo espera dígitos, e ao <code>tc:CustomKeyboard</code> onde as teclas cabe a você escrever. Os três cabem na agregação <code>keyboard</code> de um <code>tc:Input</code> ou de um <code>tc:TextArea</code>.</p>
padIntroSubtitle=Um painel de dígitos, dito em uma linha
padIntroText=<p>Uma quantidade, uma contagem, um código, um preço &mdash; os campos de um terminal são dígitos mais vezes do que letras, e um painel de três colunas é o que o polegar encontra sem olhar. <code>tc:NumberPad</code> é esse painel: o <code>mode</code> escolhe o bloco de dígitos, e as chaves ao lado acrescentam o que o campo precisa além deles.</p><p>Ele é um dos três teclados, e eles compartilham tudo o que não tem a ver com as teclas: o valor, o <code>size</code>, <code>docked</code>, as teclas de um teclado real por <code>hardwareKeys</code>, e os eventos <code>change</code>, <code>keyPress</code>, <code>enter</code> e <code>escape</code>. Recorra ao <code>tc:Keyboard</code> onde o campo espera texto, e ao <code>tc:CustomKeyboard</code> onde as teclas cabe a você escrever.</p>
customIntroSubtitle=As teclas são entregues a ele, linha a linha
customIntroText=<p><code>tc:CustomKeyboard</code> é o teclado para tudo o que os teclados prontos não cobrem: os tamanhos que uma loja vende, as letras que uma placa pode ter, as teclas de uma máquina. A propriedade <code>layout</code> são as linhas de um conjunto; a agregação <code>layouts</code> carrega quantos conjuntos forem necessários, e uma tecla escrita com o nome de um conjunto muda para ele. A agregação <code>display</code> diz o que uma tecla específica mostra.</p><p>Ele é um dos três teclados, e eles compartilham tudo o que não tem a ver com as teclas: o valor, o <code>size</code>, <code>docked</code>, as teclas de um teclado real por <code>hardwareKeys</code>, e os eventos <code>change</code>, <code>keyPress</code>, <code>enter</code> e <code>escape</code>. Quando o que se quer é um teclado de letras ou um painel de dígitos, <code>tc:Keyboard</code> e <code>tc:NumberPad</code> dizem isso em uma linha.</p>
colProperty=Propriedade
colDefault=Padrão
baseNote=tc:KeyboardBase é uma classe base e nunca é colocada em uma view. Use tc:Keyboard, tc:NumberPad ou tc:CustomKeyboard; esta página diz o que os três têm em comum.
baseIntroSubtitle=O que os três teclados compartilham
baseIntroText=<p>Os três teclados desta biblioteca diferem em uma só coisa: de onde vêm as teclas. <code>tc:Keyboard</code> as monta a partir de um idioma e um punhado de chaves, <code>tc:NumberPad</code> a partir de um bloco de dígitos, ao <code>tc:CustomKeyboard</code> elas são entregues linha a linha. Todo o resto é esta classe, e funciona igual nos três.</p><p>Isso é o valor e como uma tecla o muda, os conjuntos de teclas e a troca entre eles, o shift e o caps lock, as teclas de um teclado real, o tamanho, a largura e a ancoragem. As teclas em si são controles <code>tc:Button</code> desta biblioteca &mdash; não há teclado de terceiros por trás, e a mesma propriedade <code>size</code> que escala todo o resto escala também elas.</p><p>Ela é ainda o tipo da agregação <code>keyboard</code> de um <code>tc:Input</code> e de um <code>tc:TextArea</code>, e é por isso que qualquer um dos três serve em um campo.</p>
basePropsTitle=O que os três têm em comum
basePropsSubtitle=As propriedades que todo teclado desta biblioteca tem
basePropsText=Além destas, cada um dos três tem as propriedades que fazem as próprias teclas &mdash; <code>mode</code> e as chaves no <code>tc:Keyboard</code> e no <code>tc:NumberPad</code>, <code>layout</code> e <code>layouts</code> no <code>tc:CustomKeyboard</code>.
baseEventsTitle=Os eventos
baseEventsSubtitle=Disparados por todo teclado desta biblioteca
baseKeysTitle=As teclas com significado próprio
baseKeysSubtitle=Entendidas pelos três teclados
baseKeysText=Uma linha é uma sequência de teclas separadas por espaços, e uma tecla entre chaves é uma das de baixo. Elas são tratadas aqui, então significam o mesmo nos três teclados; um teclado só decide se as põe na tela.
baseSubclassesTitle=Os três teclados
baseSubclassesSubtitle=Qual deles usar
baseHowTitle=Uma palavra sobre a geometria
baseHowText=<p>Por mais estreito que seja o espaço, um teclado nunca precisa ser rolado de lado: uma tecla gostaria de ser tão larga quanto alta e abre mão dessa largura quando o espaço aperta. A altura dela vem do <code>size</code> e não muda.</p><p>Com <code>docked</code>, o teclado sai do fluxo da página e se coloca na borda inferior da tela, sobre o conteúdo, como faz o teclado na tela de um celular. Em um celular ou tablet ele ocupa então toda a largura da tela e <code>width</code> não é considerado. Um teclado em um campo é ancorado do mesmo jeito, só que seu popover o coloca na área estática: assim ele cobre também um diálogo modal &mdash; e é isso que torna digitável um campo dentro de um diálogo.</p>
propValue=O valor de entrada atual do teclado.
propEmphasizedKeys=As teclas desenhadas em destaque, escritas como aparecem no layout — as chaves de uma tecla especial são opcionais. Um modificador fica em destaque enquanto está ativo, diga isto o que disser.
propMaxLength=Número máximo de caracteres. 0 significa sem limite.
propEnabled=Se o teclado pode ser usado.
propHardwareKeys=Se a entrada de um teclado real é aceita enquanto o teclado tem o foco. Só são aceitas as teclas que fazem parte do layout; Enter e Backspace são sempre tratados.
propSize=O tamanho de toque de cada tecla. Toda a geometria o segue.
propWidth=Largura do teclado. Não é considerada em um teclado ancorado em um celular ou tablet.
propDocked=Se o teclado se coloca na borda inferior da tela, sobre o conteúdo, em vez de ficar no fluxo da página.
evtChange=Disparado sempre que o valor muda — uma tecla, o backspace, o que quer que o altere.
evtKeyPress=Disparado a cada tecla pressionada, com a tecla como aparece no layout.
evtEnter=Disparado quando a tecla Enter é pressionada, com o valor atual.
evtEscape=Disparado quando a tecla Esc é pressionada. O teclado não faz nada por conta própria; um campo que mostra um fecha com isso o seu popover.
subKeyboard=Um campo de texto: o layout de um país, dito em uma linha.
subNumberPad=Um campo de dígitos: um painel de três colunas, no bloco de um computador, um telefone ou uma calculadora.
subCustomKeyboard=Todo o resto: as teclas são escritas, linha a linha, e em quantos conjuntos forem necessários.
colType=Tipo
colParameters=Parâmetros
exampleBaseField=Qualquer um dos três em um campo (view XML)

