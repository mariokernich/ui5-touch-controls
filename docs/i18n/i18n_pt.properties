keyboardLayoutsText=O <code>mode</code> é o teclado de um país, nomeado pelo idioma para o qual serve. As linhas abaixo são o que esse layout mostra com <code>displayNumbers=&quot;Always&quot;</code>; as chaves ao lado decidem o que mais há no teclado. Clique em um layout para mudar o teclado acima para ele.
keyboardSwitchesTitle=As chaves
keyboardSwitchesSubtitle=O que cada uma acrescenta ao teclado
keyboardSwitchesText=<p><b>displayNumbers</b> decide o destino dos dígitos. <code>Always</code> põe uma linha deles sobre as letras, como num teclado de teclas. <code>Toggle</code> deixa as letras sozinhas e põe os dígitos atrás de uma tecla <code>{numbers}</code>, como faz um celular &mdash; uma linha de dígitos ali deixaria cada tecla estreita. <code>ToggleOnMobile</code>, o padrão, é o primeiro em um computador e um tablet e o segundo em um celular; qual dos dois é decidido uma única vez, pelo aparelho em que a página foi aberta. <code>Never</code> deixa os dígitos de fora por completo.</p><p><b>showSpecialCharacters</b> acrescenta um conjunto de parênteses, sinais e moedas. Onde os dígitos ficam atrás de uma tecla própria, o conjunto vem logo depois deles, como um celular vai das letras aos dígitos e aos símbolos e volta; caso contrário, uma tecla <code>{symbols}</code> leva até lá.</p><p><b>letterCase</b> fixa o teclado em uma só caixa. <code>Upper</code> e <code>Lower</code> deixam de fora a tecla shift e o caps lock &mdash; não há o que alternar, e é isso que um campo de caixa imposta quer: um número de material, uma placa, um lote. Não é considerado no hindi, que tem um segundo conjunto de letras em vez de maiúsculas.</p><p><b>showEmojis</b> pendura um conjunto de carinhas atrás de uma tecla própria, do mesmo jeito que se chega aos dígitos e aos caracteres especiais. Só há nele carinhas de um único caractere: uma composta de vários &mdash; uma família, uma bandeira &mdash; seria desmontada pelo backspace.</p><p><b>extraKeys</b> são teclas que ficam ao lado da barra de espaço em todos os conjuntos, seja qual for o que está na tela. É ali que vai a tecla que um campo quer à mão em vez de atrás de uma troca: <code>extraKeys=&quot;@,.&quot;</code> para um endereço, uma unidade para uma quantidade. O arroba está também no conjunto de caracteres especiais, uma tecla adiante.</p><p><b>showCapsLock</b> acrescenta um <code>{lock}</code> ao lado da tecla shift. O shift cai depois de uma letra, o lock fica até ser pressionado de novo &mdash; e o shift com o lock ligado escreve em minúsculas, como num teclado de teclas.</p><p><b>showEscape</b> acrescenta uma tecla <code>{esc}</code> no início da linha de cima, onde um teclado de teclas a tem, em todos os conjuntos. Ela dispara <code>escape</code> e nada mais; o que deve significar fica para o aplicativo.</p><p><b>enterText</b> é o que a tecla Enter diz. Vazio, ela continua a seta que é.</p>
padLayoutsTitle=Os blocos de dígitos
padLayoutsSubtitle=O que cada valor da propriedade mode mostra
padLayoutsText=O <code>mode</code> escolhe o bloco de dígitos, e o bloco mantém sua forma seja o que for que se ative: um menos e um separador decimal vão para a linha do zero, a tecla dos caracteres especiais e a tecla Esc para a linha de funções abaixo dela. Onde nem o menos nem o separador foram pedidos, o backspace e o enter vêm para a linha do zero &mdash; um zero sozinho na linha seria uma tecla de três colunas de largura. Clique em um modo para mudar o painel acima para ele.
customKeysTitle=Escrever um layout
customKeysSubtitle=Linhas, teclas e as que têm significado próprio
customKeysText=Uma linha é uma sequência de teclas separadas por espaços; em uma view, as linhas são separadas por vírgulas. Tudo o que não estiver na tabela abaixo escreve a si mesmo &mdash; uma letra, um dígito, uma palavra inteira. Uma tecla escrita com o nome de um dos conjuntos da agregação <code>layouts</code> muda para esse conjunto, e uma tecla que nomeia o conjunto em que já se está leva de volta para fora dele.
colKey=Tecla
colKeyMeaning=O que ela faz
keyBksp=apaga o último caractere
keyEnter=dispara o evento enter
keySpace=escreve um espaço, e é mais larga que as outras teclas
keyShift=a próxima letra em maiúscula, depois ela cai
keyLock=o caps lock: fica ligado até ser pressionado de novo
keyTab=escreve uma tabulação
keyEsc=dispara o evento escape e nada mais
keySet=muda para o conjunto desse nome, p. ex. {numbers}
exPlate=Placa de veículo
exSizes=Tamanhos de uma loja
exSets=Três conjuntos de teclas
