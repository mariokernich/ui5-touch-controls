# ---------------------------------------------------------------------------
# довідник елементів: чим є елемент, що робить оригінал із sap.m і що з цього
# зробила бібліотека. Показується в шапці сторінки елемента та в таблицях
# сторінки документації.
# ---------------------------------------------------------------------------
docButtonSummary=Кнопка, уся геометрія якої йде за однією властивістю size: площа, у яку треба поцілити пальцем, росте разом із ним. Усе інше — текст, піктограма, тип і press — поводиться як у sap.m.Button.
docButtonOriginal=Стандартна кнопка sap.m: текст, піктограма, її розташування, тип кнопки та подія press. Висоту задає тема, і вона не змінюється.
docButtonDescription=Кнопка з налаштовним розміром, піктограмою, її розташуванням, типом (усі значення sap.m.ButtonType), бічними відступами та шириною. Викликає press.
docSegmentedButtonSummary=Ряд злитих кнопок, з яких вибрана рівно одна — досить великих, щоб поцілити в кожен сегмент пальцем.
docSegmentedButtonOriginal=Ряд злитих кнопок, з яких вибрана рівно одна, наповнюється через sap.m.SegmentedButtonItem. Викликає selectionChange.
docSegmentedButtonDescription=Ряд злитих кнопок, з яких вибрана рівно одна, наповнюється через tc:SegmentedButtonItem (key, text, icon, enabled). Підтримує selectedKey і width для рівномірно розподілених сегментів, викликає selectionChange.
docCheckBoxSummary=Прапорець, у якого рамка, галочка, підпис і область натискання ростуть разом, а не лишаються того розміру, що дає тема.
docCheckBoxOriginal=Стандартний прапорець sap.m із підписом, тристановим вибором і value state. Розмір рамки й області натискання задає тема.
docCheckBoxDescription=Прапорець, у якого рамка, галочка, підпис і область натискання ростуть разом — за розміру M геометрія збігається з sap.m.CheckBox. Підтримує selected, partiallySelected, text, editable, wrapping, value state і width. Викликає select.
docRadioButtonSummary=Перемикач, що росте разом зі своєю властивістю size, і груповий елемент, який розкладає набір таких перемикачів по стовпцях і передає їм свої налаштування.
docRadioButtonOriginal=Перемикач, взаємовиключний з рештою зі свого groupName, і груповий елемент, який розкладає набір таких перемикачів по стовпцях.
docRadioButtonDescription=Коло, крапка, підпис і область натискання ростуть разом — за розміру M геометрія збігається з sap.m.RadioButton. Перемикачі з одним groupName виключають один одного; tc:RadioButtonGroup розкладає їх по стовпцях і передає їм size, enabled, editable та value state. Викликає select.
docSwitchSummary=Вимикач, що росте разом зі своєю властивістю size, тоді як sap.m.Switch лишається при 4rem × 2rem.
docSwitchOriginal=Вимикач сталого розміру з варіантом accept/reject і власними написами для обох станів.
docSwitchDescription=Доріжка, повзунок і підпис ростуть разом, тоді як sap.m.Switch лишається при 4rem × 2rem. Підтримує state, customTextOn, customTextOff і тип AcceptReject; кольори беруться з параметрів теми @sapButton_Track_* / @sapButton_Handle_*. Викликає change.
docSelectSummary=Спадний список, рядки якого такі самі великі, як саме поле, — у запис можна поцілити пальцем.
docSelectOriginal=Спадний список з елементів sap.ui.core.Item. Список, який він відкриває, зберігає стандартну висоту рядка, хоч би яким великим було поле.
docSelectDescription=Спадний список зі звичайних елементів sap.ui.core.Item. Список відкривається у спливному вікні, рядки якого такі самі великі, як поле, і тому доступні пальцю — рідний список sap.m.Select зберігає стандартну висоту рядка, хоч би яким великим було поле. Підтримує selectedKey, editable, forceSelection, value state і width. На телефоні список займає весь екран, як і в sap.m. Викликає change.
docComboBoxSummary=Select, у який можна друкувати: вільний текст дозволено, набране фільтрує список, а рядки такі самі великі, як поле.
docComboBoxOriginal=Спадний список, у який можна й друкувати: набране фільтрує список, а значення поза списком теж припустиме.
docComboBoxDescription=Select, у який можна друкувати: вільний текст дозволено, набране фільтрує список, а його рядки такі самі великі, як поле. На пристрої без власної клавіатури працює разом із клавіатурами цієї бібліотеки. Підтримує value, selectedKey, placeholder, editable, value state, width і showSecondaryValues, який ставить additionalText елемента sap.ui.core.ListItem у кінець рядка. На телефоні список займає весь екран і приносить власне поле, щоб продовжувати набір, — як і в sap.m. Викликає change і selectionChange.
docDatePickerSummary=Поле дати, календар якого зібраний із кнопок цієї бібліотеки: день — квадрат, що росте разом із властивістю size.
docDatePickerOriginal=Поле зі спливним календарем на основі sap.ui.unified.Calendar, з minDate/maxDate і налаштовними форматами значення та відображення.
docDatePickerDescription=Поле з календарем із власних кнопок бібліотеки: день — квадрат, що росте разом із властивістю size, замість жорсткої сітки sap.ui.unified.Calendar. Вигляд днів і місяців, minDate/maxDate, valueFormat і displayFormat (стиль або шаблон). Викликає change з value, dateValue і valid.
docTimePickerSummary=Поле часу, яке заповнюється одним дотиком до години й одним до хвилини, замість повзунка, що його треба тягнути.
docTimePickerOriginal=Поле зі спливним вікном, де години та хвилини виставляються повзунками, що їх треба тягнути.
docTimePickerDescription=Поле з двома стовпцями кнопок — години та хвилини: час вибирається одним дотиком до цілі, що росте разом із size, тоді як sap.m.TimePicker використовує повзунок. Підтримує minutesStep, valueFormat і displayFormat. Викликає change один раз — коли спливне вікно закривається.
docInputSummary=Однорядкове поле вводу, що масштабується своєю властивістю size і може принести із собою клавіатуру цієї бібліотеки — для пристроїв без власної.
docInputOriginal=Стандартне однорядкове поле вводу sap.m із підказкою, максимальною довжиною, value state і пропозиціями.
docInputDescription=Однорядкове поле вводу з налаштовним розміром. У його агрегацію keyboard можна поставити клавіатуру цієї бібліотеки — tc:Keyboard, tc:NumberPad або tc:CustomKeyboard; за showKeyboard вона відкривається у спливному вікні під полем, доки поле має фокус, і пише в нього.
docTextAreaSummary=Багаторядкове поле вводу, що масштабується своєю властивістю size і приймає клавіатуру цієї бібліотеки: її Enter вставляє тут перенесення рядка.
docTextAreaOriginal=Стандартне багаторядкове поле вводу sap.m із кількістю рядків, максимальною довжиною та value state.
docTextAreaDescription=Багаторядкове поле вводу з налаштовним розміром, кількістю рядків, максимальною довжиною та value state. Приймає клавіатуру в агрегацію keyboard так само, як Input; там Enter вставляє перенесення рядка. Викликає change / liveChange.
docTextSummary=Текст, кегль якого йде за тією самою властивістю size, що й у будь-якого іншого елемента бібліотеки, — підпис опиняється в масштабі поля поруч.
docTextOriginal=Елемент тексту з перенесенням і обмеженням на кількість рядків.
docTextDescription=Текст із налаштовним розміром і кольором. Викликає press.
docLinkSummary=Посилання, у якого підпис — а разом із ним і площа, у яку можна поцілити пальцем, — росте разом із властивістю size.
docLinkOriginal=Посилання з href і target, а також варіанти subtle та emphasized.
docLinkDescription=Посилання з налаштовним розміром: площа, у яку можна поцілити пальцем, росте разом із підписом. Підтримує href, target, wrapping, subtle, emphasized і width; посиланню з target="_blank" автоматично додається rel="noopener noreferrer". Викликає press.
docToolbarSummary=Панель для елементів цієї бібліотеки, яка при цьому входить усюди, де sap.m чекає власну панель, — наприклад, у підвал Page чи Dialog.
docToolbarOriginal=Панель, що розкладає вміст у рядок. На неї типізовано чимало агрегацій шапки й підвалу в sap.m.
docToolbarDescription=Контейнер-панель з агрегацією content. Годиться для стандартних агрегацій, наприклад для підвалу Page чи Dialog.
docOverflowToolbarSummary=Панель, яка переносить усе, що не вміщається, за кнопку з трьома крапками у спливне вікно — за пріоритетами з sap.m.OverflowToolbarLayoutData.
docOverflowToolbarOriginal=Панель, яка переносить усе, що не вміщається, за кнопку з трьома крапками у спливне вікно — за пріоритетами з sap.m.OverflowToolbarLayoutData.
docOverflowToolbarDescription=Як tc:Toolbar, тільки вміст, що не влазить у доступну ширину, іде за кнопку з трьома крапками, яка відкриває спливне вікно з рештою. Розуміє пріоритети sap.m.OverflowToolbarLayoutData.
docStepInputSummary=Числове поле з кнопками «мінус» і «плюс», що масштабуються разом із ним, — значення можна змінювати великим пальцем.
docStepInputOriginal=Числове поле з кнопками «мінус» і «плюс», із min, max і step.
docStepInputDescription=Кнопка «мінус», поле вводу та кнопка «плюс», масштабовані разом. Підтримує min, max і step. Викликає change.
docBarcodeInputSummary=Поле вводу, яке відрізняє сканер штрихкоду від людини за клавіатурою й повідомляє про них різними подіями.
docBarcodeInputDescription=Поле вводу, яке відрізняє сканер штрихкоду від людини за клавіатурою: серія щонайменше з minLength символів із паузами, коротшими за scanTimeout, завершена клавішею Enter, викликає scan, усе інше — change. prefix і suffix відрізаються від коду, clearOnScan очищає поле для наступного.
docKeyboardSummary=Екранна клавіатура з літер для пристроїв без власної. mode вибирає розкладку країни; кілька перемикачів вирішують, що ще на ній є.
docKeyboardDescription=Екранна клавіатура з літер, зібрана з власних кнопок бібліотеки. Властивість mode вибирає розкладку країни — англійську, німецьку, французьку, іспанську, українську, російську, гінді, — а кілька перемикачів вирішують, що ще на ній є: displayNumbers кладе цифри над літерами або ховає за клавішу, showSpecialCharacters додає набір знаків, letterCase закріплює за клавіатурою верхній чи нижній регістр, showCapsLock і showEscape додають по клавіші. Плюс ввід зі справжньої клавіатури, прив'язуване значення та події change / keyPress / enter / escape.
docNumberPadSummary=Екранний цифровий блок у три стовпці — для всього, що вводиться числом. mode вибирає блок: комп'ютерний, телефонний або калькуляторний.
docNumberPadDescription=Екранний цифровий блок у три стовпці. Властивість mode вибирає блок — Simple (як у комп'ютера), Phone (як у телефона) або Calculator (з чотирма арифметичними діями), — а showDecimalSeparator, decimalSeparator, showSign і showSpecialCharacters додають те, що потрібно полю понад цифри. Роботу зі значенням, масштабування та стикування він ділить з рештою клавіатур.
docCustomKeyboardSummary=Клавіатура, якій клавіші передають рядок за рядком. Це відповідь на все, чого готові клавіатури не покривають.
docCustomKeyboardDescription=Екранна клавіатура, якій передають її клавіші: властивість layout — це ряди одного набору, агрегація layouts несе стільки наборів, скільки треба, а клавіша з іменем набору перемикає на нього. Агрегація display задає, що написано на окремій клавіші. Це клавіатура для всього, чого готові не покривають.
docKeyboardBaseSummary=Механіка всіх трьох клавіатур. Сама в подання не ставиться: їй бракує рішення, які клавіші показувати, — а саме воно й різнить її підкласи.
docKeyboardBaseDescription=Базовий клас екранних клавіатур цієї бібліотеки, зібраний з її ж елементів Button, без сторонніх залежностей. Тут лежить усе, що не стосується вибору клавіш: значення й те, як клавіша його змінює, набори клавіш і перемикання між ними, Shift і Caps Lock, клавіші справжньої клавіатури через hardwareKeys, розмір, ширина та стикування. Під нього типізовано агрегацію keyboard в Input і TextArea — тому Keyboard, NumberPad і CustomKeyboard входять туди однаково.
docSignaturePadSummary=Поле для підпису пальцем або стилусом. Підпис виходить як PNG у вигляді data-URL, тож його можна прив'язати до моделі, як будь-яке інше значення.
docSignaturePadDescription=Поле для підпису пальцем або стилусом. Малює на canvas і віддає підпис у value як PNG у вигляді data-URL, тож його можна прив'язати до моделі. Товщина лінії, підказка та кнопка очищення підпорядковані властивості size; штрихи переживають зміну розміру. Викликає change.
docQuickDialogSummary=Готові діалоги із сенсорних елементів, які викликають із контролера, а не виписують у поданні. Кожен метод повертає Promise.
docQuickDialogDescription=Допоміжний клас для сенсорних діалогів, який викликають із контролера, а не з подання: show, confirm, information, error, input, select, details. Кожен метод повертає Promise.
docThemeHorizon=Типова тема демо
docThemeHorizonDark=Темний варіант Horizon
docThemeHorizonHcb=Високий контраст, темне тло
docThemeHorizonHcw=Високий контраст, світле тло
docThemeFiori3=Колишня типова тема UI5
docThemeFiori3Dark=Темний варіант Fiori 3
