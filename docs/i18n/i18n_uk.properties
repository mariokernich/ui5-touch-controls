kbIntroSubtitle=Клавіатура з літер, задана одним рядком
kbIntroText=<p>На цеховому терміналі, у кіоску чи на пристрої, з яким працюють у рукавицях, апаратної клавіатури здебільшого немає, а екранна клавіатура операційної системи або недоступна, або затуляє півекрана. <code>tc:Keyboard</code> — відповідь для текстового поля: <code>mode</code> задає розкладку країни, а кілька перемикачів вирішують, що ще на ній є. Розкладку виписувати не потрібно.</p><p>Це одна з трьох клавіатур, і все, що не стосується клавіш, у них спільне: значення, <code>size</code>, <code>docked</code>, клавіші справжньої клавіатури через <code>hardwareKeys</code> та події <code>change</code>, <code>keyPress</code>, <code>enter</code> і <code>escape</code>. Для полів із цифр є <code>tc:NumberPad</code>, для власних клавіш — <code>tc:CustomKeyboard</code>. Усі три вміщаються в агрегацію <code>keyboard</code> елемента <code>tc:Input</code> чи <code>tc:TextArea</code>.</p>
padIntroSubtitle=Цифровий блок, заданий одним рядком
padIntroText=<p>Кількість, штуки, код, ціна &mdash; поля термінала частіше складаються з цифр, ніж із літер, а блок у три стовпці великий палець знаходить не дивлячись. <code>tc:NumberPad</code> і є такий блок: <code>mode</code> вибирає набір цифр, а перемикачі поруч додають те, що потрібно полю понад них.</p><p>Це одна з трьох клавіатур, і все, що не стосується клавіш, у них спільне: значення, <code>size</code>, <code>docked</code>, клавіші справжньої клавіатури через <code>hardwareKeys</code> та події <code>change</code>, <code>keyPress</code>, <code>enter</code> і <code>escape</code>. Для текстових полів є <code>tc:Keyboard</code>, для власних клавіш — <code>tc:CustomKeyboard</code>.</p>
customIntroSubtitle=Клавіші передають їй рядок за рядком
customIntroText=<p><code>tc:CustomKeyboard</code> — клавіатура для всього, чого готові не покривають: розміри, якими торгує магазин, літери, дозволені в автомобільному номері, клавіші верстата. Властивість <code>layout</code> — це ряди одного набору; агрегація <code>layouts</code> несе стільки наборів, скільки треба, а клавіша з іменем набору перемикає на нього. Агрегація <code>display</code> задає, що написано на окремій клавіші.</p><p>Це одна з трьох клавіатур, і все, що не стосується клавіш, у них спільне: значення, <code>size</code>, <code>docked</code>, клавіші справжньої клавіатури через <code>hardwareKeys</code> та події <code>change</code>, <code>keyPress</code>, <code>enter</code> і <code>escape</code>. Там, де потрібна клавіатура з літер або блок цифр, <code>tc:Keyboard</code> і <code>tc:NumberPad</code> кажуть те саме одним рядком.</p>
colProperty=Property
colDefault=Типово
baseNote=tc:KeyboardBase — базовий клас, його ніколи не ставлять у подання. Беріть tc:Keyboard, tc:NumberPad або tc:CustomKeyboard; ця сторінка розповідає, що в усіх трьох спільного.
baseIntroSubtitle=Що спільного у трьох клавіатур
baseIntroText=<p>Три клавіатури цієї бібліотеки різняться рівно одним: звідки беруться клавіші. <code>tc:Keyboard</code> будує їх із мови та кількох перемикачів, <code>tc:NumberPad</code> — із цифрового блока, <code>tc:CustomKeyboard</code> дістає їх рядок за рядком. Усе інше — цей клас, і працює воно в усіх трьох однаково.</p><p>Це значення і те, як клавіша його змінює, набори клавіш і перемикання між ними, Shift і Caps Lock, клавіші справжньої клавіатури, розмір, ширина та стикування. Самі клавіші — це елементи <code>tc:Button</code> цієї бібліотеки: за ними не стоїть чужа клавіатура, і та сама властивість <code>size</code>, що масштабує все інше, масштабує і їх.</p><p>Це ще й тип, під який типізовано агрегацію <code>keyboard</code> у <code>tc:Input</code> та <code>tc:TextArea</code> — тому будь-яка з трьох пасує полю.</p>
basePropsTitle=Що спільного у трьох
basePropsSubtitle=Властивості, які має кожна клавіатура цієї бібліотеки
basePropsText=Крім них, у кожної з трьох є властивості, з яких складаються її власні клавіші &mdash; <code>mode</code> і перемикачі в <code>tc:Keyboard</code> та <code>tc:NumberPad</code>, <code>layout</code> і <code>layouts</code> у <code>tc:CustomKeyboard</code>.
baseEventsTitle=Події
baseEventsSubtitle=Їх викликає кожна клавіатура цієї бібліотеки
baseKeysTitle=Клавіші з власним значенням
baseKeysSubtitle=Їх розуміють усі три клавіатури
baseKeysText=Ряд — це клавіші через пробіл, а клавіша у фігурних дужках — одна з перелічених нижче. Обробляються вони тут і тому означають те саме на всіх трьох клавіатурах; клавіатура вирішує лише, чи виводити їх на екран.
baseSubclassesTitle=Три клавіатури
baseSubclassesSubtitle=Яку коли брати
baseHowTitle=Кілька слів про геометрію
baseHowText=<p>Хоч би як було тісно, клавіатуру ніколи не доводиться гортати вбік: клавіша хотіла б бути такою самою завширшки, як заввишки, і поступається цією шириною, коли місця бракує. Висота йде від <code>size</code> і лишається незмінною.</p><p>За <code>docked</code> клавіатура виходить із потоку сторінки й сідає біля нижнього краю екрана поверх вмісту — так само, як екранна клавіатура телефона. На телефоні й планшеті вона займає тоді всю ширину екрана, а <code>width</code> не враховується. Клавіатура при полі пристиковується так само, тільки її спливне вікно ставить її в статичну область, тому вона перекриває й модальний діалог &mdash; саме це й дає змогу друкувати в полі всередині діалогу.</p>
propValue=Поточне введене значення клавіатури.
propEmphasizedKeys=Клавіші, що малюються виділеними; записуються так само, як стоять у розкладці — фігурні дужки в спеціальної клавіші необов'язкові. Модифікатор виділений, доки він увімкнений.
propMaxLength=Максимальна кількість символів. 0 — без обмеження.
propEnabled=Чи можна взагалі користуватися клавіатурою.
propHardwareKeys=Чи приймається ввід зі справжньої клавіатури, доки екранна має фокус. Беруться лише клавіші, що входять до розкладки; Enter і Backspace обробляються завжди.
propSize=Сенсорний розмір кожної клавіші. Уся геометрія йде за ним.
propWidth=Ширина клавіатури. У пристикованої клавіатури на телефоні чи планшеті не враховується.
propDocked=Чи сидить клавіатура біля нижнього краю екрана поверх вмісту замість того, щоб стояти в потоці сторінки.
evtChange=Викликається щоразу, коли змінюється значення — клавіша, зворотний пробіл, будь-що.
evtKeyPress=Викликається на кожне натискання клавіші; передається клавіша в тому вигляді, як вона стоїть у розкладці.
evtEnter=Викликається при натисканні клавіші Enter, з поточним значенням.
evtEscape=Викликається при натисканні клавіші Escape. Сама клавіатура при цьому нічого не робить; поле, яке її показує, закриває своє спливне вікно.
subKeyboard=Текстове поле: розкладка країни, задана одним рядком.
subNumberPad=Поле з цифр: блок у три стовпці — як у комп'ютера, телефона чи калькулятора.
subCustomKeyboard=Усе інше: клавіші виписуються рядок за рядком, і наборів стільки, скільки треба.
colType=Тип
colParameters=Параметри
exampleBaseField=Будь-яка з трьох на полі вводу (XML-подання)

