# ---------------------------------------------------------------------------
# З чого почати
# ---------------------------------------------------------------------------
gsTitle=З чого почати
gsSubtitle=Стандартні елементи UI5, перезібрані під палець — і на додачу ті, яких у sap.m немає

gsWhatTitle=Огляд
gsWhatSubtitle=Чому самого sap.m на сенсорному пристрої замало
gsWhatText1=Елементи <code>sap.m</code> розраховані на мишу та клавіатуру. На планшеті, на цеховому терміналі чи на пристрої, з яким працюють у рукавицях, вони просто заслабкі на розмір &mdash; і щільністю вмісту «cozy» тут справу не залагодиш.
gsWhatText2=Бібліотека береться до цього з двох боків:<ul><li><strong>Вона перезбирає найважливіші елементи <code>sap.m</code></strong> на їхній же основі й відкриває їх для масштабування через одну властивість <code>size</code> (<code>S</code>&ndash;<code>6XL</code>), яка працює однаково в кожного елемента. Переписувати застосунок не треба: елементи зберігають звичні властивості, агрегації та події своїх оригіналів, тож годяться як пряма заміна.</li><li><strong>Вона додає елементи, яких у <code>sap.m</code> немає взагалі</strong> &mdash; для випадків, що трапляються лише на сенсорних пристроях; найперший приклад — екранні клавіатури.</li></ul>

gsSizesTitle=Одна властивість, дев'ять розмірів
gsSizesSubtitle=S · M (типово) · L · XL · 2XL · 3XL · 4XL · 5XL · 6XL
gsSizesText=Розмір змінює кегль, розмір піктограми, внутрішні відступи та висоту разом, тому елементи лишаються співмірними на кожному щаблі. Прив'яжіть <code>size</code> до моделі — і розмір усього застосунку перемикається на ходу.

gsDropInTitle=Пряма заміна
gsDropInSubtitle=Додати простір імен, поставити tc: перед елементом, вибрати розмір
gsBeforeTitle=До — звичайний sap.m
gsAfterTitle=Після — ui5.touch.controls
gsDropInText=Ті самі агрегації, ті самі властивості, ті самі обробники &mdash; <code>press=".onSave"</code> так само викликає той самий метод у вашому контролері. Елементи <code>sap.m</code> на кшталт <code>ToolbarSpacer</code> лишаються рівно там, де стояли.

gsRequirementsTitle=Вимоги
gsRequirementsStrip=Потрібен UI5 версії 1.116 або вище (OpenUI5 чи SAPUI5).
gsRequirementsText=Бібліотека опублікована в npm під назвою <code>ui5.touch.controls</code> і надається будь-якому застосунку UI5, що збирається через UI5 Tooling (v3 і вище). Вона несе власний <code>ui5.yaml</code>, тож інструментарій сам підхоплює її як залежність-бібліотеку.

gsNextTitle=Наступні кроки
gsNextSubtitle=Куди рухатися далі
gsNextText=<ul><li><strong>Встановлення</strong> &mdash; поставити пакет, оголосити бібліотеку й налаштувати TypeScript.</li><li><strong>Документація</strong> &mdash; повний довідник елементів, шкала розмірів, інтерфейс <code>ISized</code> і відомі підводні камені.</li><li><strong>Елементи</strong> &mdash; по одній інтерактивній сторінці на елемент, поруч з оригіналом із <code>sap.m</code>.</li></ul>

# ---------------------------------------------------------------------------
# Встановлення
# ---------------------------------------------------------------------------
setupTitle=Встановлення
setupSubtitle=Поставити бібліотеку, оголосити її в застосунку й налаштувати TypeScript

setupPrereqTitle=Що потрібно заздалегідь
setupPrereqSubtitle=Що має бути в проєкті до початку
setupPrereqStrip=UI5 версії 1.116 або вище (OpenUI5 чи SAPUI5) та UI5 Tooling v3 або вище.
setupPrereqText=Бібліотека опублікована в npm під назвою <a href="https://www.npmjs.com/package/ui5.touch.controls" target="_blank">ui5.touch.controls</a> і надається будь-якому застосунку UI5, що збирається через <a href="https://sap.github.io/ui5-tooling/" target="_blank">UI5 Tooling</a>.

setupInstallTitle=1. Встановити пакет
setupInstallSubtitle=Як звичайну залежність, а не devDependency
setupInstallText=Ставте бібліотеку <strong>звичайною залежністю</strong>, щоб UI5 Tooling побачив її як залежність проєкту. У пакеті лежить <code>ui5.yaml</code>, тож інструментарій сам розв'язує її як залежність-бібліотеку.

setupMiddlewareTitle=1b. Через UI5-middleware (інший спосіб)
setupMiddlewareSubtitle=Віддавати бібліотеку статикою замість залежності проєкту
setupMiddlewareText=Замість того щоб під'єднувати бібліотеку залежністю проєкту UI5 Tooling, її можна віддавати статикою через <a href="https://www.npmjs.com/package/ui5-middleware-servestatic" target="_blank">ui5-middleware-servestatic</a>.

setupManifestTitle=2. Оголосити бібліотеку в manifest.json
setupManifestSubtitle=Щоб застосунок завантажував її під час запуску

setupNamespaceTitle=3. Додати простір імен до подань
setupNamespaceSubtitle=Префікс tc — лише домовленість, підійде будь-який

setupTypeScriptTitle=4. Підтримка TypeScript (за бажанням)
setupTypeScriptSubtitle=Повна типізація з коробки
setupTypeScriptStrip=Без запису в «types» UI5 Tooling не завантажить бібліотеку автоматично.
setupTypeScriptText=У проєктах на TypeScript додайте пакет до запису <code>types</code> вашого <code>tsconfig.json</code>. Визначення типів лежать у пакеті (<code>dist/index.d.ts</code>).

# ---------------------------------------------------------------------------
# Документація
# ---------------------------------------------------------------------------
docTitle=Документація
docSubtitle=Довідник елементів, шкала розмірів, інтерфейс ISized і відомі підводні камені

docPortedTitle=Сенсорні версії елементів sap.m
docPortedSubtitle=У стовпці «Замінює» вказано елемент sap.m, замість якого він іде
docPortedText=Це перезбирання стандартних елементів. У звичайних випадках вони зберігають властивості, агрегації та події оригіналів, тож годяться як пряма заміна. Клацніть елемент, щоб відкрити його інтерактивну сторінку.

docNewTitle=Додаткові елементи для сенсорних екранів
docNewSubtitle=Є лише в цій бібліотеці
docNewText=Вони закривають те, що трапляється лише на сенсорному пристрої: термінал без апаратної клавіатури, сканер штрихкоду замість набору, підпис просто на екрані. Клацніть елемент, щоб відкрити його інтерактивну сторінку.

docClassesTitle=Класи
docClassesSubtitle=Викликаються з контролера, а не ставляться в подання
docClassesText=Не все, що додає бібліотека, — елемент керування. Ці викликаються з коду контролера й будують свій інтерфейс самі, із сенсорних елементів. Клацніть клас, щоб відкрити його інтерактивну сторінку.

docThemesTitle=Сумісність із темами
docThemesSubtitle=Для цих тем усі елементи несуть власну бібліотеку теми
docThemesText1=Кольори, рамки й тіні елементи беруть із параметрів активної теми, тому вони вписуються в оточення з елементів <code>sap.m</code>. Тему задають як звичайно: через <code>data-sap-ui-theme</code> у бутстрапі або на ходу через <code>Theming.setTheme()</code>.
docThemesText2=Теми, яких тут немає, бібліотека не постачає. Тоді UI5 відкочується для <code>ui5.touch.controls</code> на базову тему: елементи лишаються придатними до роботи, але за кольорами з рештою застосунку не зійдуться.

docSizesTitle=Розміри
docSizesSubtitle=У кожного елемента та сама властивість size
docSizesText1=Можливі значення: <code>S</code> &middot; <code>M</code> (типово) &middot; <code>L</code> &middot; <code>XL</code> &middot; <code>2XL</code> &middot; <code>3XL</code> &middot; <code>4XL</code> &middot; <code>5XL</code> &middot; <code>6XL</code>
docSizesText2=Розмір змінює кегль, розмір піктограми, внутрішні відступи та висоту разом, тому елементи лишаються співмірними на кожному щаблі. Прив'яжіть <code>size</code> до моделі — і розмір усього застосунку перемикається на ходу.

docISizedTitle=ISized
docISizedSubtitle=ui5.touch.controls.ISized
docISizedText=Усі елементи з властивістю <code>size</code> реалізують інтерфейс-маркер <code>ui5.touch.controls.ISized</code>. Це дає змогу працювати з розміром узагальнено — наприклад, застосувати користувацьке налаштування одразу до цілого подання.

docKeyboardTitle=Клавіатури
docKeyboardSubtitle=Відповідника в sap.m немає
docKeyboardText1=На цеховому терміналі, у кіоску чи на пристрої, з яким працюють у рукавицях, апаратної клавіатури здебільшого немає, а екранна клавіатура операційної системи або недоступна, або затуляє півекрана. Елемента для цього в UI5 немає. Бібліотека приносить три екранні клавіатури, зібрані з її ж кнопок &mdash; без сторонніх залежностей і з тією самою властивістю <code>size</code>, що й усе інше.
docKeyboardText2=<code>tc:Keyboard</code> — клавіатура з літер: <code>mode</code> задає розкладку країни, а кілька перемикачів вирішують, чи лежать цифри над літерами, чи за окремою клавішею, чи є спецсимволи і в якому регістрі вона пише. <code>tc:NumberPad</code> — те саме для поля з цифр. <code>tc:CustomKeyboard</code> дістає свої клавіші рядок за рядком, для всього, чого перші дві не покривають: <code>&#123;shift&#125;</code>, <code>&#123;space&#125;</code>, <code>&#123;bksp&#125;</code> та <code>&#123;enter&#125;</code> — спеціальні клавіші, будь-яка інша пише власний напис. Усі три приймають ввід зі справжньої клавіатури за <code>hardwareKeys="true"</code>, пристають до нижнього краю екрана за <code>docked</code> і вміщаються в агрегацію <code>keyboard</code> поля вводу.

docPitfallTitle=Підводний камінь: агрегації, які приймають лише sap.m.Button
docPitfallSubtitle=buttons, beginButton і endButton у sap.m.Dialog
docPitfallStrip=Деякі стандартні агрегації типізовані під sap.m.Button і відхиляють tc:Button під час виконання: "Element ui5.touch.controls.Button#__button0" is not valid for aggregation "buttons".
docPitfallText1=Та й збільшувати ці кнопкові місця не передбачалося &mdash; вони розраховані на стандартну висоту кнопки.
docPitfallText2=<strong>Вихід — агрегація <code>footer</code>.</strong> Вона типізована під <code>sap.m.Toolbar</code> (доступна з UI5 1.110), а що <code>tc:Toolbar</code> й <code>tc:OverflowToolbar</code> успадковують від <code>sap.m.Toolbar</code>, вони входять туди як є. Діалог тоді підганяє висоту підвалу під панель, і кнопки сенсорного розміру малюються як слід. Якщо діалог може стати вузьким, беріть <code>tc:OverflowToolbar</code>.
docPitfallText3=Для простих діалогів-повідомлень збирати це вручну не треба &mdash; <code>QuickDialog</code> уже будує свій підвал саме так, з розміром із власного налаштування <code>size</code>.
docSizesExample=Прив'язка розміру
docPitfallBrokenTitle=Не працює
docPitfallWorksTitle=Працює

# ---------------------------------------------------------------------------
# сторінки елементів
# ---------------------------------------------------------------------------
barcodeHint=Відповідника в <code>sap.m</code> немає: сканер штрихкоду в режимі keyboard wedge за лічені мілісекунди вводить код у поле з фокусом і завершує його клавішею <kbd>Enter</kbd>. Елемент вимірює час між натисканнями, тому сканування викликає <code>scan</code>, а ті самі символи, набрані вручну, — <code>change</code>.
signatureHint=Відповідника в <code>sap.m</code> немає. Поле малює на canvas і віддає результат у <code>value</code> як PNG у вигляді data-URL, тож його можна прив'язати до моделі й надіслати на сервер, як будь-яке інше значення. Товщина лінії, підказка та кнопка очищення підпорядковані властивості <code>size</code>.

overflowPlainHint=Потягніть повзунок ліворуч: те, що перестає вміщатися, іде за кнопку з трьома крапками. На повній ширині кнопки переповнення немає взагалі.
overflowPriorityHint=У «Друк» пріоритет Low, тому вона йде першою. У «Зберегти» — NeverOverflow, і вона лишається на панелі, доки там узагалі є місце; на найменшій ширині вона теж іде у спливне вікно, щоб кнопка переповнення лишалася досяжною. У «Про програму» — AlwaysOverflow, вона завжди у спливному вікні: тому ця панель показує кнопку з трьома крапками навіть тоді, коли місця вдосталь.
overflowFooterHint=Звузьте вікно браузера, щоб побачити переповнення панелі в підвалі — спливне вікно тоді відкривається над нею.
overflowDialogHint=Агрегація buttons у sap.m.Dialog приймає лише sap.m.Button, а от footer бере будь-яку sap.m.Toolbar — сенсорна OverflowToolbar входить туди як є. Із двох панелей тут краща саме вона: діалог вузький за своєю природою, і те, що не вміщається, іде в меню переповнення, а не обрізається.
inputKeyboardHint=За ввімкненої «Екранної клавіатури» клавіатура з агрегації keyboard відкривається під полем, доки поле має фокус, і закривається, щойно фокус іде геть.
textAreaKeyboardHint=За ввімкненої «Екранної клавіатури» клавіатура з агрегації keyboard відкривається під полем, доки поле має фокус, і закривається, щойно фокус іде геть. Її клавіша Enter вставляє перенесення рядка — як Enter і робить у багаторядковому полі.

