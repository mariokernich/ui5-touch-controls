keyboardLayoutsTitle=Розкладки
keyboardLayoutsSubtitle=Що показує кожне значення властивості mode
keyboardLayoutsText=<code>mode</code> — це клавіатура країни, названа за мовою, для якої її вживають. Ряди нижче показують, що дає розкладка за <code>displayNumbers=&quot;Always&quot;</code>; що ще лежить на клавіатурі, вирішують перемикачі поруч. Клацніть розкладку, щоб перемкнути на неї клавіатуру вище.
keyboardSwitchesTitle=Перемикачі
keyboardSwitchesSubtitle=Що кожен із них додає до клавіатури
keyboardSwitchesText=<p><b>displayNumbers</b> вирішує долю цифр. <code>Always</code> кладе їх рядом над літерами, як на клавіатурі з клавішами. <code>Toggle</code> лишає літери при собі й ховає цифри за клавішу <code>{numbers}</code>, як це робить телефон &mdash; ряд цифр зробив би там кожну клавішу вузькою. <code>ToggleOnMobile</code>, значення за замовчуванням, поводиться як перше на комп'ютері й планшеті та як друге на телефоні; що саме з двох, вирішується один раз — за пристроєм, на якому відкрили сторінку. <code>Never</code> прибирає цифри взагалі.</p><p><b>showSpecialCharacters</b> додає набір дужок, знаків і валют. Якщо цифри вже за окремою клавішею, набір стає за ними — як телефон переходить від літер до цифр, потім до символів і назад; інакше до нього веде клавіша <code>{symbols}</code>.</p><p><b>letterCase</b> закріплює за клавіатурою один регістр. За <code>Upper</code> і <code>Lower</code> клавіші Shift і Caps Lock не з'являються &mdash; перемикати нічого, і це саме те, чого хоче поле з власним регістром: номер матеріалу, автомобільний номер, партія. Для гінді не враховується: там замість великих літер другий набір літер.</p><p><b>showEmojis</b> вішає набір усміхнених облич за окрему клавішу — тим самим способом, яким доступні цифри та спецсимволи. На ньому лише ті, що складаються з одного символу: складене — родина, прапор — зворотний пробіл розібрав би назад на частини.</p><p><b>extraKeys</b> — клавіші, що стоять поруч із пробілом у кожному наборі, хоч би який зараз був на екрані. Туди йде клавіша, потрібна полю під рукою, а не за перемикачем: <code>extraKeys=&quot;@,.&quot;</code> для адреси, одиниця виміру для кількості. Равлик є й у наборі спецсимволів — на одну клавішу далі.</p><p><b>showCapsLock</b> додає поруч із Shift клавішу <code>{lock}</code>. Shift відпадає після однієї літери, Caps Lock тримається, доки його не натиснуть знову &mdash; а Shift за ввімкненого Caps Lock пише малими, як на клавіатурі з клавішами.</p><p><b>showEscape</b> додає клавішу <code>{esc}</code> першою у верхньому ряду, там само, де вона на клавіатурі з клавішами, і так у кожному наборі. Вона викликає <code>escape</code> і більше нічого не робить; що це має означати, вирішує застосунок.</p><p><b>enterText</b> — напис на клавіші Enter. Порожньо лишає ту стрілку, що там і є.</p>
padLayoutsTitle=Цифрові блоки
padLayoutsSubtitle=Що показує кожне значення властивості mode
padLayoutsText=<code>mode</code> вибирає цифровий блок, і блок зберігає свою форму, хоч би що ще було ввімкнено: мінус і десятковий роздільник стають у ряд нуля, клавіша до спецсимволів та Escape — у ряд функціональних клавіш під ним. Якщо ні мінус, ні роздільник не потрібні, у ряд нуля переїжджають зворотний пробіл та Enter &mdash; нуль в окремому рядку був би клавішею на три стовпці завширшки. Клацніть режим, щоб перемкнути на нього блок вище.
customKeysTitle=Як пишеться розкладка
customKeysSubtitle=Ряди, клавіші й ті, що мають власне значення
customKeysText=Ряд — це клавіші через пробіл; у поданні ряди розділяються комами. Усе, чого немає в таблиці нижче, пише саме себе &mdash; літера, цифра, ціле слово. Клавіша, названа іменем одного з наборів в агрегації <code>layouts</code>, перемикає на цей набір, а клавіша з іменем набору, на якому вона вже стоїть, виводить назад.
