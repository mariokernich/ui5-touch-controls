docButtonSummary=Un bouton dont toute la géométrie suit une seule propriété size : la zone que le doigt doit atteindre grandit avec elle. Tout le reste — texte, icône, type et press — se lit comme sur sap.m.Button.
docButtonOriginal=Le bouton standard de sap.m : texte, icône, position de l'icône, type de bouton et événement press. Sa hauteur est celle que prescrit le thème et ne change pas.
docButtonDescription=Bouton à taille réglable, avec icône, position d'icône, type (toutes les valeurs de sap.m.ButtonType), marge latérale et largeur. Déclenche press.
docSegmentedButtonSummary=Une rangée de boutons accolés dont exactement un est sélectionné, dimensionnée pour que chaque segment s'atteigne au doigt.
docSegmentedButtonOriginal=Une rangée de boutons accolés dont exactement un est sélectionné, remplie par sap.m.SegmentedButtonItem. Déclenche selectionChange.
docSegmentedButtonDescription=Une rangée de boutons accolés dont exactement un est sélectionné, remplie par tc:SegmentedButtonItem (key, text, icon, enabled). Gère selectedKey, width pour répartir les segments également, et déclenche selectionChange.
docCheckBoxSummary=Une case à cocher dont la case, la coche, le libellé et la zone tactile grandissent ensemble au lieu de rester à la taille imposée par le thème.
docCheckBoxOriginal=La case à cocher standard de sap.m, avec libellé, sélection à trois états et états de valeur. La case et la zone tactile ont la taille imposée par le thème.
docCheckBoxDescription=Case à cocher dont la case, la coche, le libellé et la zone tactile grandissent ensemble — à la taille M, la géométrie correspond à celle de sap.m.CheckBox. Gère selected, partiallySelected, text, editable, wrapping, les états de valeur et width. Déclenche select.
docRadioButtonSummary=Un bouton radio qui grandit avec sa propriété size, et un contrôle de groupe qui en dispose un ensemble en colonnes et leur transmet ses réglages.
docRadioButtonOriginal=Un bouton radio exclusif des autres de son groupName, plus un contrôle de groupe qui en dispose un ensemble en colonnes.
docRadioButtonDescription=Cercle, point, libellé et zone tactile grandissent ensemble — à la taille M, la géométrie correspond à celle de sap.m.RadioButton. Les boutons partageant un groupName s'excluent ; tc:RadioButtonGroup les dispose en colonnes et leur transmet ses size, enabled, editable et état de valeur. Déclenche select.
docSwitchSummary=Un interrupteur marche/arrêt qui grandit avec sa propriété size, là où sap.m.Switch est figé à 4rem sur 2rem.
docSwitchOriginal=Un interrupteur marche/arrêt de taille fixe, avec une variante accepter/refuser et des textes personnalisés pour les deux états.
docSwitchDescription=Rail, curseur et libellé grandissent ensemble, là où sap.m.Switch est figé à 4rem x 2rem. Gère state, customTextOn, customTextOff et le type AcceptReject ; les couleurs viennent des paramètres de thème @sapButton_Track_* / @sapButton_Handle_*. Déclenche change.
docSelectSummary=Une liste déroulante dont les entrées s'ouvrent en rangées aussi hautes que le champ lui-même : on en choisit une au doigt.
docSelectOriginal=Une liste déroulante remplie d'éléments sap.ui.core.Item. La liste qu'elle ouvre garde la hauteur de rangée standard, quelle que soit la taille du champ.
docSelectDescription=Liste déroulante remplie de simples éléments sap.ui.core.Item. La liste s'ouvre dans un popover dont les rangées sont aussi hautes que le champ : elles s'atteignent au doigt — là où la liste native de sap.m.Select garde sa hauteur de rangée standard quelle que soit la taille du champ. Gère selectedKey, editable, forceSelection, les états de valeur et width. Sur un téléphone, la liste prend tout l'écran, comme dans sap.m. Déclenche change.
docComboBoxSummary=Un Select dans lequel on peut taper : le texte libre est permis, ce qui est tapé filtre la liste, et les rangées sont aussi hautes que le champ.
docComboBoxOriginal=Une liste déroulante dans laquelle on peut aussi taper : ce qui est tapé filtre la liste, et une valeur absente de la liste est permise.
docComboBoxDescription=Un Select dans lequel on peut taper : le texte libre est permis et ce qui est tapé filtre la liste, dont les rangées sont aussi hautes que le champ. Fonctionne de pair avec les claviers de cette bibliothèque sur un appareil qui n'en a pas. Gère value, selectedKey, placeholder, editable, les états de valeur, width et showSecondaryValues, qui place l'additionalText d'un sap.ui.core.ListItem en fin de rangée. Sur un téléphone, la liste prend tout l'écran et apporte son propre champ pour continuer à taper, comme dans sap.m. Déclenche change et selectionChange.
docDatePickerSummary=Un champ de date dont le calendrier est bâti avec les boutons de cette bibliothèque : un jour est un carré qui grandit avec la propriété size.
docDatePickerOriginal=Un champ avec un calendrier en popup bâti sur sap.ui.unified.Calendar, avec minDate/maxDate et des formats de valeur et d'affichage réglables.
docDatePickerDescription=Champ avec un calendrier bâti sur les boutons de la bibliothèque : un jour est un carré qui grandit avec la propriété size, au lieu de la grille figée de sap.ui.unified.Calendar. Vues jours et mois, minDate/maxDate, valueFormat et displayFormat (style ou motif). Déclenche change avec value, dateValue et valid.
docTimePickerSummary=Un champ d'heure que l'on remplit d'une touche sur l'heure et d'une touche sur la minute, au lieu d'un curseur à faire glisser.
docTimePickerOriginal=Un champ avec un popup où les heures et les minutes se règlent sur des curseurs à faire glisser.
docTimePickerDescription=Champ à deux colonnes de boutons — heures et minutes — pour choisir une heure d'une seule touche sur une cible qui grandit avec size, là où sap.m.TimePicker emploie un curseur à faire glisser. Gère minutesStep, valueFormat et displayFormat. Déclenche change une seule fois, à la fermeture du popover.
docInputSummary=Un champ de saisie sur une ligne qui grandit avec sa propriété size et peut apporter un clavier de cette bibliothèque, pour un appareil qui n'en a pas.
docInputOriginal=Le champ de saisie standard d'une ligne de sap.m, avec texte indicatif, longueur maximale, états de valeur et suggestions.
docInputDescription=Champ de saisie d'une ligne à taille réglable. Un clavier de cette bibliothèque — tc:Keyboard, tc:NumberPad ou tc:CustomKeyboard — se place dans son agrégation keyboard ; avec showKeyboard, il s'ouvre alors dans un popover sous le champ tant que celui-ci a le focus, et y écrit.
docTextAreaSummary=Un champ de saisie multiligne qui grandit avec sa propriété size et accueille un clavier de cette bibliothèque, dont la touche Entrée insère ici un saut de ligne.
docTextAreaOriginal=Le champ de saisie multiligne standard de sap.m, avec nombre de lignes, longueur maximale et états de valeur.
docTextAreaDescription=Champ multiligne à taille réglable, avec nombre de lignes, longueur maximale et états de valeur. Accueille un clavier dans son agrégation keyboard comme le fait l'Input ; là, la touche Entrée insère un saut de ligne. Déclenche change / liveChange.
docTextSummary=Un texte dont le corps suit la même propriété size que tous les autres contrôles de la bibliothèque : un libellé se tient à l'échelle du champ voisin.
docTextOriginal=Un contrôle de texte avec retour à la ligne et nombre maximal de lignes.
docTextDescription=Texte à taille et couleur réglables. Déclenche press.
docLinkSummary=Un lien dont le libellé — et avec lui la zone que le doigt peut atteindre — grandit avec la propriété size.
docLinkOriginal=Un lien avec href et target, et les variantes discrète et mise en avant.
docLinkDescription=Lien à taille réglable : la zone que le doigt peut atteindre grandit avec le libellé. Gère href, target, wrapping, subtle, emphasized et width ; un lien target="_blank" reçoit automatiquement rel="noopener noreferrer". Déclenche press.
docToolbarSummary=Une barre pour les contrôles de cette bibliothèque, qui entre néanmoins partout où sap.m attend une barre à elle — le pied d'une Page ou d'un Dialog, par exemple.
docToolbarOriginal=Une barre qui dispose son contenu en rangée. Beaucoup d'agrégations d'en-tête et de pied de sap.m sont typées à elle.
docToolbarDescription=Conteneur de barre d'outils avec une agrégation content. Utilisable dans les agrégations standard telles que le pied d'une Page ou d'un Dialog.
docOverflowToolbarSummary=Une Toolbar qui déplace ce qui ne tient pas dans un popover derrière un bouton aux trois points, pilotée par les priorités de sap.m.OverflowToolbarLayoutData.
docOverflowToolbarOriginal=Une Toolbar qui déplace ce qui ne tient pas dans un popover derrière un bouton aux trois points, pilotée par les priorités de sap.m.OverflowToolbarLayoutData.
docOverflowToolbarDescription=Comme tc:Toolbar, mais le contenu qui ne tient pas dans la largeur disponible passe derrière un bouton aux trois points, qui ouvre un popover avec le reste. Comprend les priorités de sap.m.OverflowToolbarLayoutData.
docStepInputSummary=Un champ numérique avec un bouton moins et un bouton plus dimensionnés avec lui : la valeur se règle au pouce.
docStepInputOriginal=Un champ numérique avec un bouton moins et un bouton plus, avec min, max et pas.
docStepInputDescription=Bouton moins, champ de saisie et bouton plus, dimensionnés ensemble. Gère min, max, step. Déclenche change.
docBarcodeInputSummary=Un champ de saisie qui distingue un lecteur de code-barres d'une personne qui tape, et rapporte les deux comme des événements différents.
docBarcodeInputDescription=Champ de saisie qui distingue un lecteur de code-barres d'une personne qui tape : une suite d'au moins minLength caractères dont les intervalles restent sous scanTimeout et qui se termine par Entrée déclenche scan, tout le reste déclenche change. prefix et suffix sont retirés du code, clearOnScan vide le champ pour le suivant.
docKeyboardSummary=Un clavier de lettres à l'écran, pour un appareil qui n'en a pas. Le mode choisit la disposition d'un pays ; quelques interrupteurs disent ce qu'il y a d'autre dessus.
docKeyboardDescription=Clavier de lettres à l'écran, bâti sur les boutons de la bibliothèque. La propriété mode choisit la disposition d'un pays — anglais, allemand, français, espagnol, italien, portugais, suédois, turc, roumain, ukrainien, russe, hindi — et quelques interrupteurs disent ce qu'il y a d'autre dessus : displayNumbers place les chiffres au-dessus des lettres ou derrière une touche, showSpecialCharacters ajoute un jeu de signes, letterCase fixe le clavier en majuscules ou en minuscules, showCapsLock et showEscape ajoutent une touche chacun. Saisie au clavier physique en option, liaison de la valeur et événements change / keyPress / enter / escape.
docNumberPadSummary=Un pavé de chiffres à l'écran, en trois colonnes, pour tout ce qui se saisit en nombre. Le mode choisit le bloc : pavé d'ordinateur, pavé de téléphone ou calculatrice.
docNumberPadDescription=Pavé de chiffres à l'écran, en trois colonnes. La propriété mode choisit le bloc — Simple (le pavé d'un ordinateur), Phone (celui d'un téléphone) ou Calculator (avec les quatre opérations) — et showDecimalSeparator, decimalSeparator, showSign et showSpecialCharacters ajoutent ce dont le champ a besoin en plus des chiffres. Il partage avec les autres claviers la gestion de la valeur, le dimensionnement et l'ancrage.
docCustomKeyboardSummary=Le clavier dont les touches lui sont remises, rangée par rangée. Il est la réponse à tout ce que les claviers tout faits ne couvrent pas.
docCustomKeyboardDescription=Clavier à l'écran dont les touches lui sont remises : la propriété layout est la suite des rangées d'un jeu, l'agrégation layouts porte autant de jeux qu'il en faut, et une touche écrite avec le nom d'un jeu y fait passer. L'agrégation display dit ce qu'une touche donnée affiche. C'est le clavier de tout ce que les claviers tout faits ne couvrent pas.
docKeyboardBaseSummary=La mécanique derrière les trois claviers. Elle ne se place pas elle-même dans une vue — ce qu'elle ignore, ce sont les touches à montrer, et c'est justement ce qui distingue ses sous-classes.
docKeyboardBaseDescription=Classe de base des claviers à l'écran de cette bibliothèque, bâtie nativement sur ses propres contrôles Button, sans dépendance tierce. Tout ce qui ne touche pas au choix des touches vit ici : la valeur et la façon dont une touche la change, les jeux de touches et le passage de l'un à l'autre, la majuscule et le verrouillage, les touches d'un vrai clavier par hardwareKeys, la taille, la largeur et l'ancrage. C'est le type de l'agrégation keyboard d'un Input ou d'un TextArea : un Keyboard, un NumberPad et un CustomKeyboard y entrent donc tous.
docSignaturePadSummary=Un champ où signer du doigt ou au stylet. La signature sort en URL de données PNG : elle se lie à un modèle comme n'importe quelle autre valeur.
docSignaturePadDescription=Un champ où signer du doigt ou au stylet. Dessine sur un canvas et restitue la signature en URL de données PNG dans value, pour la lier à un modèle. L'épaisseur du trait, le texte indicatif et le bouton d'effacement suivent la propriété size ; les tracés survivent à un redimensionnement. Déclenche change.
docQuickDialogSummary=Des boîtes de dialogue toutes faites, bâties avec les contrôles tactiles, appelées depuis le contrôleur au lieu d'être écrites dans une vue. Chaque méthode renvoie une Promise.
docQuickDialogDescription=Classe utilitaire pour des boîtes de dialogue adaptées au tactile, employée depuis le contrôleur plutôt que dans une vue : show, confirm, information, error, input, select, details. Chaque méthode renvoie une Promise.
docThemeHorizon=Thème par défaut de la démo
docThemeHorizonDark=Variante sombre de Horizon
docThemeHorizonHcb=Contraste élevé, fond sombre
docThemeHorizonHcw=Contraste élevé, fond clair
docThemeFiori3=Ancien thème par défaut d'UI5
docThemeFiori3Dark=Variante sombre de Fiori 3
