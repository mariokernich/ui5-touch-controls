# ---------------------------------------------------------------------------
# Pour commencer
# ---------------------------------------------------------------------------
gsTitle=Pour commencer
gsSubtitle=Les contrôles UI5 standard, refaits pour le doigt — et ceux qui manquent à sap.m
gsWhatTitle=Vue d'ensemble
gsWhatSubtitle=Pourquoi sap.m seul ne suffit pas sur un appareil tactile
gsWhatText1=Les contrôles <code>sap.m</code> sont faits pour la souris et le clavier. Sur une tablette, sur un terminal d'atelier ou sur un appareil manipulé avec des gants, ils sont tout simplement trop petits &mdash; et la densité de contenu « cozy » n'y change pas grand-chose.
gsWhatText2=La bibliothèque s'y prend de deux façons :<ul><li><strong>Elle refait les contrôles <code>sap.m</code> les plus utilisés</strong> sur leur structure d'origine et les ouvre au dimensionnement par une seule propriété <code>size</code> (<code>S</code>&ndash;<code>6XL</code>) qui fonctionne pareil sur chacun d'eux. Nul besoin de refaire votre application : les contrôles gardent les propriétés, agrégations et événements familiers de leurs originaux et s'y substituent directement.</li><li><strong>Elle ajoute des contrôles que <code>sap.m</code> n'a pas du tout</strong>, pour ce qui n'arrive que sur un appareil tactile &mdash; le premier exemple étant les claviers à l'écran.</li></ul>
gsSizesTitle=Une propriété, neuf tailles
gsSizesSubtitle=S · M (par défaut) · L · XL · 2XL · 3XL · 4XL · 5XL · 6XL
gsSizesText=La taille fait varier ensemble le corps du texte, la taille des icônes, les marges intérieures et la hauteur : les contrôles restent proportionnés à chaque échelon. Liez <code>size</code> à un modèle pour changer la taille de toute l'application à l'exécution.
gsDropInTitle=Remplacement direct
gsDropInSubtitle=Ajouter l'espace de noms, mettre tc: devant le contrôle, choisir une taille
gsBeforeTitle=Avant — sap.m seul
gsAfterTitle=Après — ui5.touch.controls
gsDropInText=Mêmes agrégations, mêmes propriétés, mêmes gestionnaires d'événements &mdash; <code>press=".onSave"</code> appelle toujours la même méthode dans votre contrôleur. Les contrôles <code>sap.m</code> comme <code>ToolbarSpacer</code> restent exactement où ils sont.
gsRequirementsTitle=Prérequis
gsRequirementsStrip=UI5 1.116 ou plus récent est nécessaire (OpenUI5 ou SAPUI5).
gsRequirementsText=La bibliothèque est publiée sur npm sous le nom <code>ui5.touch.controls</code> et s'utilise dans toute application UI5 construite avec l'UI5 Tooling (v3 ou plus). Elle apporte son propre <code>ui5.yaml</code>, si bien que l'outillage la résout tout seul comme dépendance de bibliothèque.
gsNextTitle=Étapes suivantes
gsNextSubtitle=Par où continuer
gsNextText=<ul><li><strong>Installation</strong> &mdash; installer le paquet, déclarer la bibliothèque et régler TypeScript.</li><li><strong>Documentation</strong> &mdash; la référence complète des contrôles, l'échelle des tailles, l'interface <code>ISized</code> et les pièges connus.</li><li><strong>Contrôles</strong> &mdash; une page interactive par contrôle, côte à côte avec l'original <code>sap.m</code>.</li></ul>

# ---------------------------------------------------------------------------
# Installation
# ---------------------------------------------------------------------------
setupTitle=Installation
setupSubtitle=Installer la bibliothèque, la déclarer dans l'application et régler TypeScript
setupPrereqTitle=Prérequis
setupPrereqSubtitle=Ce qu'il faut dans le projet avant de commencer
setupPrereqStrip=UI5 1.116 ou plus récent (OpenUI5 ou SAPUI5) et UI5 Tooling v3 ou plus.
setupPrereqText=La bibliothèque est publiée sur npm sous le nom <a href="https://www.npmjs.com/package/ui5.touch.controls" target="_blank">ui5.touch.controls</a> et s'utilise dans toute application UI5 construite avec l'<a href="https://sap.github.io/ui5-tooling/" target="_blank">UI5 Tooling</a>.
setupInstallTitle=1. Installer le paquet
setupInstallSubtitle=En dépendance ordinaire, pas en devDependency
setupInstallText=Installez la bibliothèque en <strong>dépendance ordinaire</strong> pour que l'UI5 Tooling la reconnaisse comme dépendance du projet. Le paquet contient un <code>ui5.yaml</code>, si bien que l'outillage la résout tout seul comme dépendance de bibliothèque.
setupMiddlewareTitle=1b. Avec un middleware UI5 (autre méthode)
setupMiddlewareSubtitle=Servir la bibliothèque en fichiers statiques plutôt qu'en dépendance du projet
setupMiddlewareText=Plutôt que d'intégrer la bibliothèque comme dépendance de projet de l'UI5 Tooling, vous pouvez la servir en fichiers statiques avec <a href="https://www.npmjs.com/package/ui5-middleware-servestatic" target="_blank">ui5-middleware-servestatic</a>.
setupManifestTitle=2. Déclarer la bibliothèque dans manifest.json
setupManifestSubtitle=Pour que l'application la charge au démarrage
setupNamespaceTitle=3. Ajouter l'espace de noms à vos vues
setupNamespaceSubtitle=Le préfixe tc n'est qu'une convention — n'importe lequel convient
setupTypeScriptTitle=4. Prise en charge de TypeScript (facultatif)
setupTypeScriptSubtitle=Typage complet dès l'installation
setupTypeScriptStrip=Sans l'entrée « types », l'UI5 Tooling ne charge pas la bibliothèque automatiquement.
setupTypeScriptText=Dans un projet TypeScript, ajoutez le paquet à l'entrée <code>types</code> de votre <code>tsconfig.json</code>. Les définitions de types sont dans le paquet (<code>dist/index.d.ts</code>).

# ---------------------------------------------------------------------------
# Documentation
# ---------------------------------------------------------------------------
docTitle=Documentation
docSubtitle=Référence des contrôles, échelle des tailles, interface ISized et pièges connus
docPortedTitle=Versions tactiles des contrôles sap.m
docPortedSubtitle=La colonne « Remplace » nomme le contrôle sap.m auquel chacun se substitue
docPortedText=Ce sont des reprises de contrôles standard. Elles gardent les propriétés, agrégations et événements de leurs originaux pour les cas courants et s'y substituent donc directement. Cliquez sur un contrôle pour ouvrir sa page interactive.
docNewTitle=Contrôles supplémentaires pour le tactile
docNewSubtitle=Ils n'existent que dans cette bibliothèque
docNewText=Ils répondent à ce qui n'arrive que sur un appareil tactile : un terminal sans clavier physique, un lecteur de code-barres à la place de la frappe, une signature à l'écran. Cliquez sur un contrôle pour ouvrir sa page interactive.
docClassesTitle=Classes
docClassesSubtitle=Appelées depuis un contrôleur, pas placées dans une vue
docClassesText=Tout ce qu'apporte la bibliothèque n'est pas un contrôle. Ces classes s'appellent depuis le code du contrôleur et construisent elles-mêmes leur interface, à partir des contrôles tactiles. Cliquez sur une classe pour ouvrir sa page interactive.
docThemesTitle=Thèmes pris en charge
docThemesSubtitle=Tous les contrôles apportent leur propre bibliothèque de thèmes pour ceux-ci
docThemesText1=Les contrôles tirent leurs couleurs, bordures et ombres des paramètres du thème actif : ils s'accordent donc aux contrôles <code>sap.m</code> qui les entourent. Réglez le thème comme d'habitude, par <code>data-sap-ui-theme</code> dans le bootstrap ou à l'exécution par <code>Theming.setTheme()</code>.
docThemesText2=Les thèmes qui ne figurent pas ici ne sont pas livrés avec la bibliothèque. UI5 se rabat alors sur le thème de base pour <code>ui5.touch.controls</code> : les contrôles restent utilisables, mais leurs couleurs ne s'accorderont pas au reste de l'application.
docSizesTitle=Tailles
docSizesSubtitle=Chaque contrôle a la même propriété size
docSizesText1=Valeurs possibles : <code>S</code> &middot; <code>M</code> (par défaut) &middot; <code>L</code> &middot; <code>XL</code> &middot; <code>2XL</code> &middot; <code>3XL</code> &middot; <code>4XL</code> &middot; <code>5XL</code> &middot; <code>6XL</code>
docSizesText2=La taille fait varier ensemble le corps du texte, la taille des icônes, les marges intérieures et la hauteur : les contrôles restent proportionnés à chaque échelon. Liez <code>size</code> à un modèle pour changer la taille de toute l'application à l'exécution.
docISizedTitle=ISized
docISizedSubtitle=ui5.touch.controls.ISized
docISizedText=Tous les contrôles dotés d'une propriété <code>size</code> portent l'interface de marquage <code>ui5.touch.controls.ISized</code>. Elle permet de traiter la taille de façon générique, par exemple pour appliquer un réglage de l'utilisateur à toute une vue.
docKeyboardTitle=Les claviers
docKeyboardSubtitle=sap.m n'a pas d'équivalent
docKeyboardText1=Sur un terminal d'atelier, une borne ou un appareil manipulé avec des gants, il n'y a souvent pas de clavier physique, et le clavier à l'écran du système est soit indisponible, soit occupe la moitié de l'écran. UI5 n'a aucun contrôle pour cela. La bibliothèque apporte trois claviers à l'écran, dessinés à partir de ses propres boutons &mdash; sans dépendance tierce, et dimensionnés par la même propriété <code>size</code> que tout le reste.
docKeyboardText2=<code>tc:Keyboard</code> est un clavier de lettres : le <code>mode</code> est la disposition d'un pays, et quelques interrupteurs disent si les chiffres se placent au-dessus des lettres ou derrière une touche, s'il y a des caractères spéciaux et dans quelle casse il écrit. <code>tc:NumberPad</code> reprend la même idée pour un champ de chiffres. <code>tc:CustomKeyboard</code> reçoit ses touches rangée par rangée, pour tout ce que les deux autres ne couvrent pas : <code>&#123;shift&#125;</code>, <code>&#123;space&#125;</code>, <code>&#123;bksp&#125;</code> et <code>&#123;enter&#125;</code> sont les touches spéciales, chaque autre touche écrit son propre libellé. Les trois acceptent les touches d'un vrai clavier avec <code>hardwareKeys="true"</code>, s'ancrent au bas de l'écran avec <code>docked</code> et entrent dans l'agrégation <code>keyboard</code> d'un champ.
docPitfallTitle=Piège : les agrégations qui n'acceptent que sap.m.Button
docPitfallSubtitle=buttons, beginButton et endButton de sap.m.Dialog
docPitfallStrip=Certaines agrégations standard sont typées sap.m.Button et rejettent un tc:Button à l'exécution : "Element ui5.touch.controls.Button#__button0" is not valid for aggregation "buttons".
docPitfallText1=Et ces emplacements de boutons ne sont pas prévus pour être redimensionnés non plus &mdash; ils sont réglés sur la hauteur de bouton standard.
docPitfallText2=<strong>Le contournement, c'est l'agrégation <code>footer</code>.</strong> Elle est typée <code>sap.m.Toolbar</code> (depuis UI5 1.110), et comme <code>tc:Toolbar</code> et <code>tc:OverflowToolbar</code> héritent de <code>sap.m.Toolbar</code>, elles y entrent telles quelles. La boîte de dialogue règle alors la hauteur de son pied sur la barre d'outils, et les boutons à taille tactile s'affichent correctement. Préférez <code>tc:OverflowToolbar</code> dès que la boîte de dialogue peut devenir étroite.
docPitfallText3=Pour de simples boîtes de dialogue de type MessageBox, vous n'avez rien à construire &mdash; <code>QuickDialog</code> compose déjà son pied ainsi, à la taille indiquée par son option <code>size</code>.
docSizesExample=Lier la taille
docPitfallBrokenTitle=Ne fonctionne pas
docPitfallWorksTitle=Fonctionne

# ---------------------------------------------------------------------------
# pages des contrôles
# ---------------------------------------------------------------------------
barcodeHint=<code>sap.m</code> n'a pas d'équivalent : en mode « keyboard wedge », un lecteur de code-barres tape le code dans le champ actif en quelques millisecondes et le termine par <kbd>Entrée</kbd>. Le contrôle mesure le temps entre les frappes : une lecture déclenche donc <code>scan</code>, alors que les mêmes caractères tapés à la main déclenchent <code>change</code>.
signatureHint=<code>sap.m</code> n'a pas d'équivalent. Le pavé dessine sur un canvas et restitue le résultat sous forme d'URL de données PNG dans <code>value</code> : il se lie donc à un modèle et part au backend comme n'importe quelle autre valeur. L'épaisseur du trait, le texte indicatif et le bouton d'effacement suivent la propriété <code>size</code>.
overflowPlainHint=Faites glisser le curseur vers la gauche : ce qui ne tient plus passe derrière le bouton aux trois points. En pleine largeur, il n'y a pas de bouton de débordement du tout.
overflowPriorityHint=« Imprimer » a la priorité Low et déborde donc en premier. « Enregistrer » est en NeverOverflow et reste dans la barre tant qu'il y a la moindre place — à la largeur la plus faible, il passe lui aussi dans le popover, pour que le bouton de débordement reste atteignable. « À propos » est en AlwaysOverflow et se trouve toujours dans le popover — c'est pourquoi cette barre montre le bouton aux trois points même quand la place ne manque pas.
overflowFooterHint=Rétrécissez la fenêtre du navigateur pour voir déborder la barre de pied — le popover s'ouvre alors au-dessus de la barre.
overflowDialogHint=L'agrégation buttons de sap.m.Dialog n'accepte que des sap.m.Button, mais le pied accueille toute sap.m.Toolbar — une OverflowToolbar tactile y entre donc telle quelle. C'est la meilleure des deux barres ici : une boîte de dialogue est étroite par nature, et ce qui ne tient pas passe dans le menu de débordement au lieu d'être coupé.
inputKeyboardHint=Avec « Clavier virtuel », le clavier de l'agrégation keyboard s'ouvre sous le champ tant que celui-ci a le focus, et se referme dès qu'il le perd.
textAreaKeyboardHint=Avec « Clavier virtuel », le clavier de l'agrégation keyboard s'ouvre sous le champ tant que celui-ci a le focus, et se referme dès qu'il le perd. Sa touche Entrée insère un saut de ligne, comme Entrée dans un champ multiligne.

