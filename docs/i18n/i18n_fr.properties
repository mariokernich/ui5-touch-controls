keyboardLayoutsTitle=Les dispositions
keyboardLayoutsSubtitle=Ce que montre chaque valeur de la propriété mode
keyboardLayoutsText=Le <code>mode</code> est le clavier d'un pays, nommé d'après la langue pour laquelle il sert. Les rangées ci-dessous sont ce que cette disposition montre avec <code>displayNumbers=&quot;Always&quot;</code> ; les interrupteurs à côté décident du reste. Cliquez sur une disposition pour y faire passer le clavier ci-dessus. Là où une langue s'écrit avec des lettres qu'un clavier à touches compose avec une touche morte — les voyelles accentuées du portugais et de l'italien —, celles-ci se trouvent sur un jeu à part, accessible par une touche à côté de la barre d'espace.
keyboardSwitchesTitle=Les interrupteurs
keyboardSwitchesSubtitle=Ce que chacun ajoute au clavier
keyboardSwitchesText=<p><b>displayNumbers</b> décide du sort des chiffres. <code>Always</code> en place une rangée au-dessus des lettres, comme sur un clavier à touches. <code>Toggle</code> laisse les lettres entre elles et met les chiffres derrière une touche <code>{numbers}</code>, comme le fait un téléphone &mdash; une rangée de chiffres y rendrait chaque touche étroite. <code>ToggleOnMobile</code>, la valeur par défaut, est le premier sur un ordinateur et une tablette, le second sur un téléphone ; lequel des deux est décidé une fois pour toutes, par l'appareil sur lequel la page a été ouverte. <code>Never</code> laisse les chiffres de côté.</p><p><b>showSpecialCharacters</b> ajoute un jeu de parenthèses, de signes et de devises. Là où les chiffres sont derrière une touche, le jeu se place à leur suite, comme un téléphone passe de ses lettres à ses chiffres puis à ses symboles et revient ; sinon, une touche <code>{symbols}</code> y mène.</p><p><b>letterCase</b> fixe le clavier dans une seule casse. <code>Upper</code> et <code>Lower</code> laissent de côté la touche majuscule et le verrouillage &mdash; il n'y a rien à basculer, et c'est ce qu'attend un champ à la casse imposée : un numéro d'article, une plaque d'immatriculation, un lot. Sans effet pour le hindi, qui a un second jeu de lettres au lieu de capitales.</p><p><b>showEmojis</b> accroche un jeu de frimousses derrière une touche à elles, comme on atteint les chiffres et les caractères spéciaux. Seules y figurent les frimousses d'un seul caractère : une frimousse composée de plusieurs &mdash; une famille, un drapeau &mdash; serait démontée par la touche de retour arrière.</p><p><b>extraKeys</b> sont des touches qui se tiennent à côté de la barre d'espace sur chaque jeu, quel qu'il soit à l'écran. C'est là que va la touche qu'un champ veut sous la main plutôt que derrière un basculement : <code>extraKeys=&quot;@,.&quot;</code> pour une adresse, une unité pour une quantité. L'arobase figure aussi dans le jeu des caractères spéciaux, une touche plus loin.</p><p><b>showCapsLock</b> ajoute un <code>{lock}</code> à côté de la touche majuscule. La majuscule retombe après une lettre, le verrouillage tient jusqu'à ce qu'on le presse à nouveau &mdash; et la majuscule pendant le verrouillage écrit en minuscules, comme sur un clavier à touches.</p><p><b>showEscape</b> ajoute une touche <code>{esc}</code> en tête de la rangée du haut, là où un clavier à touches la place, sur chaque jeu. Elle déclenche <code>escape</code> et rien d'autre ; ce qu'elle doit signifier est laissé à l'application.</p><p><b>enterText</b> est ce que dit la touche Entrée. Vide, elle reste la flèche qu'elle est.</p>
padLayoutsTitle=Les blocs de chiffres
padLayoutsSubtitle=Ce que montre chaque valeur de la propriété mode
padLayoutsText=Le <code>mode</code> choisit le bloc de chiffres, et le bloc garde sa forme quoi qu'on active par ailleurs : un moins et un séparateur décimal prennent place dans la rangée du zéro, la touche vers les caractères spéciaux et la touche Échap dans la rangée de fonctions en dessous. Là où ni le moins ni le séparateur n'ont été demandés, le retour arrière et l'entrée viennent dans la rangée du zéro &mdash; un zéro seul sur sa ligne serait une touche large de trois colonnes. Cliquez sur un mode pour y faire passer le pavé ci-dessus.
customKeysTitle=Écrire une disposition
customKeysSubtitle=Rangées, touches, et celles qui ont un sens propre
customKeysText=Une rangée est une suite de touches séparées par des espaces ; dans une vue, les rangées sont séparées par des virgules. Tout ce qui ne figure pas dans le tableau ci-dessous s'écrit soi-même &mdash; une lettre, un chiffre, un mot entier. Une touche écrite avec le nom d'un des jeux de l'agrégation <code>layouts</code> fait passer à ce jeu, et une touche qui nomme le jeu où l'on se trouve déjà en fait ressortir.
colKey=Touche
colKeyMeaning=Ce qu'elle fait
keyBksp=supprime le dernier caractère
keyEnter=déclenche l'événement enter
keySpace=écrit une espace, et est plus large que les autres touches
keyShift=la lettre suivante en majuscule, puis elle retombe
keyLock=le verrouillage majuscules : tient jusqu'à ce qu'on le presse à nouveau
keyTab=écrit une tabulation
keyEsc=déclenche l'événement escape et rien d'autre
keySet=passe au jeu de ce nom, p. ex. {numbers}
exPlate=Plaque d'immatriculation
