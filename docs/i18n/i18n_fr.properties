kbIntroSubtitle=Un clavier de lettres, dit en une ligne
kbIntroText=<p>Sur un terminal d'atelier, une borne ou un appareil manipulé avec des gants, il n'y a souvent pas de clavier physique, et le clavier à l'écran du système est soit indisponible, soit occupe la moitié de l'écran. <code>tc:Keyboard</code> est la réponse pour un champ de texte : le <code>mode</code> est la disposition d'un pays, et quelques interrupteurs disent ce qu'il y a d'autre dessus. Il n'y a aucune disposition à écrire.</p><p>C'est l'un des trois claviers, et ils partagent tout ce qui ne touche pas aux touches : la valeur, la <code>size</code>, <code>docked</code>, les touches d'un vrai clavier par <code>hardwareKeys</code>, et les événements <code>change</code>, <code>keyPress</code>, <code>enter</code> et <code>escape</code>. Prenez <code>tc:NumberPad</code> là où le champ attend des chiffres, et <code>tc:CustomKeyboard</code> là où les touches sont à vous d'écrire. Les trois entrent dans l'agrégation <code>keyboard</code> d'un <code>tc:Input</code> ou d'un <code>tc:TextArea</code>.</p>
padIntroSubtitle=Un pavé de chiffres, dit en une ligne
padIntroText=<p>Une quantité, un compte, un code, un prix &mdash; les champs d'un terminal sont plus souvent des chiffres que des lettres, et un pavé de trois colonnes est ce qu'un pouce trouve sans regarder. <code>tc:NumberPad</code> est ce pavé : le <code>mode</code> choisit le bloc de chiffres, et les interrupteurs à côté ajoutent ce dont le champ a besoin en plus.</p><p>C'est l'un des trois claviers, et ils partagent tout ce qui ne touche pas aux touches : la valeur, la <code>size</code>, <code>docked</code>, les touches d'un vrai clavier par <code>hardwareKeys</code>, et les événements <code>change</code>, <code>keyPress</code>, <code>enter</code> et <code>escape</code>. Prenez <code>tc:Keyboard</code> là où le champ attend du texte, et <code>tc:CustomKeyboard</code> là où les touches sont à vous d'écrire.</p>
customIntroSubtitle=Les touches lui sont remises, rangée par rangée
customIntroText=<p><code>tc:CustomKeyboard</code> est le clavier de tout ce que les claviers tout faits ne couvrent pas : les tailles que vend un magasin, les lettres qu'une plaque d'immatriculation peut porter, les touches d'une machine. La propriété <code>layout</code> est la suite des rangées d'un jeu ; l'agrégation <code>layouts</code> porte autant de jeux qu'il en faut, et une touche écrite avec le nom d'un jeu y fait passer. L'agrégation <code>display</code> dit ce qu'une touche donnée affiche.</p><p>C'est l'un des trois claviers, et ils partagent tout ce qui ne touche pas aux touches : la valeur, la <code>size</code>, <code>docked</code>, les touches d'un vrai clavier par <code>hardwareKeys</code>, et les événements <code>change</code>, <code>keyPress</code>, <code>enter</code> et <code>escape</code>. Quand c'est un clavier de lettres ou un pavé de chiffres qu'il faut, <code>tc:Keyboard</code> et <code>tc:NumberPad</code> le disent en une ligne.</p>
colProperty=Propriété
colDefault=Par défaut
baseNote=tc:KeyboardBase est une classe de base et ne se place jamais dans une vue. Utilisez tc:Keyboard, tc:NumberPad ou tc:CustomKeyboard ; cette page dit ce que les trois ont en commun.
baseIntroSubtitle=Ce que les trois claviers partagent
baseIntroText=<p>Les trois claviers de cette bibliothèque ne diffèrent que sur un point : d'où viennent les touches. <code>tc:Keyboard</code> les construit à partir d'une langue et de quelques interrupteurs, <code>tc:NumberPad</code> à partir d'un bloc de chiffres, <code>tc:CustomKeyboard</code> les reçoit rangée par rangée. Tout le reste est cette classe, et fonctionne pareil sur les trois.</p><p>C'est la valeur et la façon dont une touche la change, les jeux de touches et le passage de l'un à l'autre, la majuscule et le verrouillage, les touches d'un vrai clavier, la taille, la largeur et l'ancrage. Les touches elles-mêmes sont des contrôles <code>tc:Button</code> de cette bibliothèque &mdash; il n'y a aucun clavier tiers derrière, et la même propriété <code>size</code> qui dimensionne tout le reste les dimensionne aussi.</p><p>C'est également le type de l'agrégation <code>keyboard</code> d'un <code>tc:Input</code> et d'un <code>tc:TextArea</code>, et c'est pourquoi n'importe lequel des trois convient sur un champ.</p>
basePropsTitle=Ce que les trois ont en commun
basePropsSubtitle=Les propriétés que possède chaque clavier de cette bibliothèque
basePropsText=À côté de celles-ci, chacun des trois a les propriétés qui font ses propres touches &mdash; <code>mode</code> et les interrupteurs sur <code>tc:Keyboard</code> et <code>tc:NumberPad</code>, <code>layout</code> et <code>layouts</code> sur <code>tc:CustomKeyboard</code>.
baseEventsTitle=Les événements
baseEventsSubtitle=Déclenchés par chaque clavier de cette bibliothèque
baseKeysTitle=Les touches qui ont un sens propre
baseKeysSubtitle=Comprises par les trois claviers
baseKeysText=Une rangée est une suite de touches séparées par des espaces, et une touche entre accolades est l'une de celles ci-dessous. Elles sont traitées ici : elles ont donc le même sens sur les trois claviers ; un clavier décide seulement s'il les met à l'écran.
baseSubclassesTitle=Les trois claviers
baseSubclassesSubtitle=Lequel choisir
baseHowTitle=Un mot sur la géométrie
baseHowText=<p>Si étroite que soit la place, un clavier n'a jamais à être fait défiler latéralement : une touche aimerait être aussi large que haute et cède sur cette largeur quand la place manque. Sa hauteur vient de la <code>size</code> et ne bouge pas.</p><p>Avec <code>docked</code>, le clavier quitte le flux de la page et se pose au bas de l'écran, par-dessus le contenu, comme le fait le clavier à l'écran d'un téléphone. Sur un téléphone ou une tablette, il prend alors toute la largeur de l'écran et <code>width</code> n'est pas pris en compte. Un clavier posé sur un champ est ancré de la même façon, à ceci près que son popover le place dans la zone statique : il recouvre donc aussi une boîte de dialogue modale &mdash; et c'est ce qui rend saisissable un champ à l'intérieur d'une boîte de dialogue.</p>
propValue=La valeur saisie actuelle du clavier.
propEmphasizedKeys=Les touches dessinées en mise en avant, écrites telles qu'elles figurent dans la disposition — les accolades d'une touche spéciale sont facultatives. Un modificateur est mis en avant tant qu'il est actif, quoi qu'indique ceci.
propMaxLength=Nombre maximal de caractères. 0 signifie sans limite.
propEnabled=Si le clavier peut être utilisé.
propHardwareKeys=Si la saisie d'un vrai clavier est acceptée tant que le clavier a le focus. Seules les touches qui font partie de la disposition sont prises ; Entrée et Retour arrière sont toujours traitées.
propSize=La taille tactile de chaque touche. Toute la géométrie la suit.
propWidth=Largeur du clavier. Sans effet pour un clavier ancré sur un téléphone ou une tablette.
propDocked=Si le clavier se pose au bas de l'écran, par-dessus le contenu, au lieu de se tenir dans le flux de la page.
evtChange=Déclenché chaque fois que la valeur change — une touche, le retour arrière, quoi que ce soit qui la modifie.
evtKeyPress=Déclenché pour chaque touche pressée, avec la touche telle qu'elle figure dans la disposition.
evtEnter=Déclenché quand la touche Entrée est pressée, avec la valeur actuelle.
evtEscape=Déclenché quand la touche Échap est pressée. Le clavier n'en fait rien de lui-même ; un champ qui en affiche un referme son popover.
subKeyboard=Un champ de texte : la disposition d'un pays, dite en une ligne.
subNumberPad=Un champ de chiffres : un pavé de trois colonnes, dans le bloc d'un ordinateur, d'un téléphone ou d'une calculatrice.
subCustomKeyboard=Tout le reste : les touches sont écrites, rangée par rangée, et en autant de jeux qu'il en faut.
colType=Type
colParameters=Paramètres
exampleBaseField=N'importe lequel des trois sur un champ (vue XML)

