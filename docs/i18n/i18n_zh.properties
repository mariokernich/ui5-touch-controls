kbIntroSubtitle=一行说清的字母键盘
kbIntroText=<p>在车间终端、自助机或戴着手套操作的设备上，往往没有硬件键盘，而操作系统的屏幕键盘要么用不了，要么遮掉半个屏幕。对文本字段来说，<code>tc:Keyboard</code> 就是答案：<code>mode</code> 是某个国家的布局，几个开关说明上面还有什么。不需要写任何布局。</p><p>它是三种键盘之一，凡是与按键无关的部分它们都共用：值、<code>size</code>、<code>docked</code>、经由 <code>hardwareKeys</code> 接受的真实键盘按键，以及 <code>change</code>、<code>keyPress</code>、<code>enter</code> 和 <code>escape</code> 事件。字段收数字时请取 <code>tc:NumberPad</code>，按键要由你自己写时请取 <code>tc:CustomKeyboard</code>。三者都能放进 <code>tc:Input</code> 或 <code>tc:TextArea</code> 的 <code>keyboard</code> 聚合。</p>
padIntroSubtitle=一行说清的数字键区
padIntroText=<p>数量、件数、代码、价格 &mdash; 终端上的字段更多是数字而非字母，而三列的键区正是拇指不用看就能找到的东西。<code>tc:NumberPad</code> 就是这样的键区：<code>mode</code> 挑选数字键区，旁边的开关再补上字段在数字之外所需要的东西。</p><p>它是三种键盘之一，凡是与按键无关的部分它们都共用：值、<code>size</code>、<code>docked</code>、经由 <code>hardwareKeys</code> 接受的真实键盘按键，以及 <code>change</code>、<code>keyPress</code>、<code>enter</code> 和 <code>escape</code> 事件。字段收文本时请取 <code>tc:Keyboard</code>，按键要由你自己写时请取 <code>tc:CustomKeyboard</code>。</p>
customIntroSubtitle=按键由你逐行交给它
customIntroText=<p><code>tc:CustomKeyboard</code> 是应付现成键盘覆盖不到的一切的键盘：商店在卖的尺码、车牌号允许出现的字母、机器上的按键。<code>layout</code> 属性是一套按键的各行；<code>layouts</code> 聚合能带上所需的任意多套，写成某一套名称的按键会切换过去。<code>display</code> 聚合说明某个键上写什么。</p><p>它是三种键盘之一，凡是与按键无关的部分它们都共用：值、<code>size</code>、<code>docked</code>、经由 <code>hardwareKeys</code> 接受的真实键盘按键，以及 <code>change</code>、<code>keyPress</code>、<code>enter</code> 和 <code>escape</code> 事件。如果要的就是字母键盘或数字键区，<code>tc:Keyboard</code> 和 <code>tc:NumberPad</code> 一行就能说清同样的事。</p>
colProperty=属性
colDefault=默认值
baseNote=tc:KeyboardBase 是基类，绝不会放进视图。请使用 tc:Keyboard、tc:NumberPad 或 tc:CustomKeyboard；本页讲的是三者共同之处。
baseIntroSubtitle=三种键盘的共同之处
baseIntroText=<p>本库这三种键盘只有一点不同：按键从哪里来。<code>tc:Keyboard</code> 由一种语言加几个开关生成，<code>tc:NumberPad</code> 由一个数字键区生成，<code>tc:CustomKeyboard</code> 则由你逐行交给它。其余一切都在这个类里，并且在三者上表现一致。</p><p>那就是值以及按键如何改变它、各套按键以及它们之间的切换、上档与大写锁定、真实键盘的按键、尺寸、宽度和停靠。按键本身就是本库的 <code>tc:Button</code> 控件 &mdash; 背后没有第三方键盘，缩放其他一切的那个 <code>size</code> 属性同样缩放它们。</p><p>它也是 <code>tc:Input</code> 和 <code>tc:TextArea</code> 的 <code>keyboard</code> 聚合所限定的类型，因此三者中的任何一个都能装在字段上。</p>
basePropsTitle=三者的共同之处
basePropsSubtitle=本库每种键盘都有的属性
basePropsText=除此之外，三者各自还有生成自身按键的属性 &mdash; <code>tc:Keyboard</code> 和 <code>tc:NumberPad</code> 上的 <code>mode</code> 及各个开关，<code>tc:CustomKeyboard</code> 上的 <code>layout</code> 和 <code>layouts</code>。
baseEventsTitle=事件
baseEventsSubtitle=本库每种键盘都会触发
baseKeysTitle=自带含义的按键
baseKeysSubtitle=三种键盘都能理解
baseKeysText=一行就是以空格分隔的一串按键，用花括号括起来的键即下表中的某一个。它们在这里统一处理，因此在三种键盘上含义相同；键盘只决定要不要把它们显示出来。
baseSubclassesTitle=三种键盘
baseSubclassesSubtitle=该取哪一个
baseHowTitle=关于几何尺寸的一点说明
baseHowText=<p>无论地方多窄，键盘都不必左右滚动：一个键希望自己的宽度等于高度，地方紧张时便放弃这个宽度。它的高度来自 <code>size</code>，始终不变。</p><p>设了 <code>docked</code> 后，键盘会脱离页面流，落在屏幕下沿、盖住内容，就像手机的屏幕键盘那样。在手机或平板上它此时占满屏幕宽度，<code>width</code> 不再生效。装在字段上的键盘同样是停靠的，只是它的弹出框把它放进了静态区，因此也能盖住模态对话框 &mdash; 正是这一点让对话框内部的字段可以输入。</p>
propValue=键盘当前的输入值。
propEmphasizedKeys=以强调方式绘制的按键，写法与它们在布局中的写法一致 —— 特殊键的花括号可以省略。修饰键在生效期间一律强调显示，与此处所写无关。
propMaxLength=最大字符数。0 表示不限。
propEnabled=键盘是否可用。
propHardwareKeys=键盘获得焦点期间是否接受真实键盘的输入。只接受属于该布局的按键；回车和退格始终会被处理。
propSize=每个按键的触控尺寸。整体几何尺寸都随它而定。
propWidth=键盘的宽度。手机或平板上停靠的键盘不考虑此项。
propDocked=键盘是落在屏幕下沿、盖住内容，还是待在页面流中。
evtChange=只要值发生变化就触发 —— 按键、退格，凡是改动它的都算。
evtKeyPress=每按下一个键都触发，附带该键在布局中的写法。
evtEnter=按下回车键时触发，附带当前值。
evtEscape=按下 Esc 键时触发。键盘自身不作任何处理；显示键盘的字段会据此关闭它的弹出框。
subKeyboard=文本字段：某个国家的布局，一行说清。
subNumberPad=数字字段：三列的键区，形如电脑、电话或计算器的按键区。
subCustomKeyboard=其余一切：按键逐行写出，需要多少套就写多少套。
