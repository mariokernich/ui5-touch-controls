# 控件参考
# ---------------------------------------------------------------------------
docButtonSummary=一个按钮，整体几何尺寸都随一个 size 属性而定，手指要点中的区域也随之变大。其余一切 —— 文本、图标、类型和 press —— 读起来都和 sap.m.Button 一样。
docButtonOriginal=sap.m 的标准按钮：文本、图标、图标位置、按钮类型和 press 事件。高度由主题规定，不会改变。
docButtonDescription=尺寸可调的按钮，含图标、图标位置、类型（sap.m.ButtonType 的全部取值）、侧边内边距和宽度。触发 press。
docSegmentedButtonSummary=一排相连的按钮，其中恰好一个处于选中状态，尺寸做得让每个分段都能用手指点中。
docSegmentedButtonOriginal=一排相连的按钮，其中恰好一个处于选中状态，由 sap.m.SegmentedButtonItem 填充。触发 selectionChange。
docSegmentedButtonDescription=一排相连的按钮，其中恰好一个处于选中状态，由 tc:SegmentedButtonItem（key、text、icon、enabled）填充。支持 selectedKey、用于均分各分段的 width，并触发 selectionChange。
docCheckBoxSummary=一个复选框，方框、勾号、标签和触控区一同缩放，而不是停留在主题给定的尺寸上。
docCheckBoxOriginal=sap.m 的标准复选框，带标签、三态选择和值状态。方框和触控区的大小由主题给定。
docCheckBoxDescription=复选框，方框、勾号、标签和触控区一同缩放 —— 在尺寸 M 下几何尺寸与 sap.m.CheckBox 一致。支持 selected、partiallySelected、text、editable、wrapping、值状态和 width。触发 select。
docRadioButtonSummary=一个随 size 属性缩放的单选按钮，外加一个分组控件，把一组单选按钮排成若干列并把自己的设置传给它们。
docRadioButtonOriginal=与同一 groupName 中其他按钮互斥的单选按钮，外加一个把一组按钮排成若干列的分组控件。
docRadioButtonDescription=圆圈、圆点、标签和触控区一同缩放 —— 在尺寸 M 下几何尺寸与 sap.m.RadioButton 一致。共享 groupName 的按钮互斥；tc:RadioButtonGroup 把它们排成若干列，并把自己的 size、enabled、editable 和值状态传给它们。触发 select。
docSwitchSummary=一个随 size 属性变大的开关，而 sap.m.Switch 固定为 4rem × 2rem。
docSwitchOriginal=尺寸固定的开关，带接受/拒绝变体，两种状态的文字可自定义。
docSwitchDescription=滑轨、滑块和标签一同缩放，而 sap.m.Switch 固定为 4rem x 2rem。支持 state、customTextOn、customTextOff 和 AcceptReject 类型；颜色来自 @sapButton_Track_* / @sapButton_Handle_* 主题参数。触发 change。
docSelectSummary=一个下拉框，展开的列表行高与字段本身相同，因此可以用手指挑选条目。
docSelectOriginal=由 sap.ui.core.Item 元素填充的下拉框。无论字段多大，它展开的列表都保持标准行高。
docSelectDescription=由普通 sap.ui.core.Item 元素填充的下拉框。列表在弹出框中展开，行高与字段相同，因此可以用手指点中 —— 而 sap.m.Select 的原生列表无论字段多大都保持标准行高。支持 selectedKey、editable、forceSelection、值状态和 width。在手机上列表会占满整个屏幕，与 sap.m 一致。触发 change。
docComboBoxSummary=可以输入的 Select：允许自由文本，输入的内容会过滤列表，行高与字段相同。
docComboBoxOriginal=也可以输入的下拉框：输入的内容会过滤列表，且允许填写列表中没有的值。
docComboBoxDescription=可以输入的 Select：允许自由文本，输入的内容会过滤列表，列表行高与字段相同。在没有键盘的设备上可与本库的键盘配合使用。支持 value、selectedKey、placeholder、editable、值状态、width 以及 showSecondaryValues —— 后者把 sap.ui.core.ListItem 的 additionalText 放在行尾。在手机上列表会占满整个屏幕，并带上自己的字段以便继续输入，与 sap.m 一致。触发 change 和 selectionChange。
docDatePickerSummary=一个日期字段，日历由本库自己的按钮搭成，因此每一天都是随 size 属性变大的方块。
docDatePickerOriginal=带日历弹窗的字段，基于 sap.ui.unified.Calendar，支持 minDate/maxDate 以及可配置的值格式和显示格式。
docDatePickerDescription=带日历的字段，日历由本库自己的按钮搭成，因此每一天都是随 size 属性变大的方块，而不是 sap.ui.unified.Calendar 的固定网格。支持日视图和月视图、minDate/maxDate、valueFormat 和 displayFormat（样式或模式）。触发 change，附带 value、dateValue 和 valid。
docTimePickerSummary=一个时间字段，点一下小时、再点一下分钟即可填好，无需拖动滑块。
docTimePickerOriginal=带弹窗的字段，小时和分钟需在滑块上拖动设置。
docTimePickerDescription=带两列按钮的字段 —— 小时和分钟 —— 因此点一下随 size 变大的目标就能选定时间，而 sap.m.TimePicker 用的是需要拖动的滑块。支持 minutesStep、valueFormat 和 displayFormat。仅在弹出框关闭时触发一次 change。
docInputSummary=随 size 属性缩放的单行输入字段，还能带上本库的键盘，供本身没有键盘的设备使用。
docInputOriginal=sap.m 的标准单行输入字段，带占位文字、最大长度、值状态和建议项。
docInputDescription=尺寸可调的单行输入字段。本库的键盘 —— tc:Keyboard、tc:NumberPad 或 tc:CustomKeyboard —— 可放进它的 keyboard 聚合；配合 showKeyboard，键盘会在字段获得焦点时于字段下方的弹出框中打开并向其输入。
docTextAreaSummary=随 size 属性缩放的多行输入字段，可接纳本库的键盘，其回车键在这里会插入换行。
docTextAreaOriginal=sap.m 的标准多行输入字段，带行数、最大长度和值状态。
docTextAreaDescription=尺寸可调的多行输入字段，带行数、最大长度和值状态。与 Input 一样，可在 keyboard 聚合中接纳一个键盘；在这里回车键会插入换行。触发 change / liveChange。
docTextSummary=一段文本，其字号随本库其他控件共用的同一个 size 属性变化，因此标签能与旁边的字段处在同一尺度上。
docTextOriginal=带自动换行和最大行数的文本控件。
docTextDescription=尺寸和颜色可调的文本。触发 press。
docLinkSummary=一个链接，其文字 —— 以及随之而来的可点中区域 —— 随 size 属性变大。
docLinkOriginal=带 href 和 target 的链接，含淡化和强调两种变体。
docLinkDescription=尺寸可调的链接，可点中的区域随文字一同变大。支持 href、target、wrapping、subtle、emphasized 和 width；target="_blank" 的链接会自动获得 rel="noopener noreferrer"。触发 press。
docToolbarSummary=一条用于承载本库控件的工具栏，同时仍能放进 sap.m 期待自家工具栏的位置 —— 比如 Page 或 Dialog 的页脚。
docToolbarOriginal=把内容排成一行的工具栏。sap.m 中许多页头和页脚聚合的类型都限定为它。
docToolbarDescription=带 content 聚合的工具栏容器。可用于 Page 或 Dialog 的页脚等标准聚合。
docOverflowToolbarSummary=一条 Toolbar，会把放不下的内容移进三个点按钮后面的弹出框，由 sap.m.OverflowToolbarLayoutData 的优先级驱动。
docOverflowToolbarOriginal=一条 Toolbar，会把放不下的内容移进三个点按钮后面的弹出框，由 sap.m.OverflowToolbarLayoutData 的优先级驱动。
docOverflowToolbarDescription=与 tc:Toolbar 相同，但在可用宽度内放不下的内容会移到三个点的按钮后面，点击该按钮会打开装着其余内容的弹出框。能理解 sap.m.OverflowToolbarLayoutData 的优先级。
docStepInputSummary=一个数字字段，减号和加号按钮与它一同调整尺寸，值可以用拇指逐步调节。
docStepInputOriginal=带减号和加号按钮的数字字段，支持 min、max 和步长。
docStepInputDescription=减号按钮、输入框和加号按钮，一同调整尺寸。支持 min、max、step。触发 change。
docBarcodeInputSummary=一个能分辨条码扫描枪和真人输入的输入字段，并把两者报告为不同的事件。
docBarcodeInputDescription=能分辨条码扫描枪和真人输入的输入字段：若一串至少 minLength 个字符、彼此间隔均低于 scanTimeout 且以回车结束，则触发 scan，其他情况触发 change。prefix 和 suffix 会从代码中截去，clearOnScan 会清空字段以便扫描下一个。
docKeyboardSummary=面向自身没有键盘的设备的屏幕字母键盘。mode 挑选某个国家的布局；几个开关说明上面还有什么。
docKeyboardDescription=由本库自己的按钮搭成的屏幕字母键盘。mode 属性挑选某个国家的布局 —— 英语、德语、法语、西班牙语、乌克兰语、俄语、印地语 —— 几个开关说明上面还有什么：displayNumbers 把数字放在字母上方或某个键后面，showSpecialCharacters 添上一套符号，letterCase 把键盘固定为大写或小写，showCapsLock 和 showEscape 各添一个键。可选的硬件按键输入、值绑定，以及 change / keyPress / enter / escape 事件。
docNumberPadSummary=三列的屏幕数字键区，供一切以数字录入的场景使用。mode 挑选键区：电脑键区、电话键区或计算器。
docNumberPadDescription=三列的屏幕数字键区。mode 属性挑选键区 —— Simple（电脑的键区）、Phone（电话的键区）或 Calculator（含四则运算）—— 而 showDecimalSeparator、decimalSeparator、showSign 和 showSpecialCharacters 补上字段在数字之外所需要的东西。值处理、尺寸缩放和停靠与其他键盘共用。
docCustomKeyboardSummary=按键由你逐行交给它的键盘。现成键盘覆盖不到的一切都由它来应付。
docCustomKeyboardDescription=按键由你交给它的屏幕键盘：layout 属性是一套按键的各行，layouts 聚合能带上所需的任意多套，写成某一套名称的按键会切换过去。display 聚合说明某个键上写什么。现成键盘覆盖不到的一切都由它来应付。
docKeyboardBaseSummary=三种键盘背后的机制。它自己不会放进视图 —— 它唯一不知道的就是该显示哪些按键，而这正是区分其子类的地方。
docKeyboardBaseDescription=本库屏幕键盘的基类，原生地由本库自己的 Button 控件搭成，不依赖第三方。凡是与“显示哪些按键”无关的部分都在这里：值以及按键如何改变它、各套按键以及它们之间的切换、上档与大写锁定、经由 hardwareKeys 接受的真实键盘按键、尺寸、宽度和停靠。它是 Input 和 TextArea 的 keyboard 聚合所限定的类型，因此 Keyboard、NumberPad 和 CustomKeyboard 都能放进去。
docSignaturePadSummary=可用手指或触控笔签名的字段。签名以 PNG data URL 的形式给出，因此能像其他任何值一样绑定到模型。
docSignaturePadDescription=可用手指或触控笔签名的字段。在 canvas 上作画，并把签名以 PNG data URL 的形式放进 value，便于绑定到模型。笔画粗细、占位文字和清除按钮都随 size 属性变化；改变尺寸后笔迹依然保留。触发 change。
docQuickDialogSummary=用触控控件搭成的现成对话框，从控制器调用，而不是写进视图。每个方法都返回一个 Promise。
docQuickDialogDescription=面向触控的对话框辅助类，从控制器而非视图中使用：show、confirm、information、error、input、select、details。每个方法都返回一个 Promise。
docThemeHorizon=演示应用的默认主题
docThemeHorizonDark=Horizon 的深色变体
docThemeHorizonHcb=高对比度，深色背景
docThemeHorizonHcw=高对比度，浅色背景
docThemeFiori3=UI5 此前的默认主题
docThemeFiori3Dark=Fiori 3 的深色变体
