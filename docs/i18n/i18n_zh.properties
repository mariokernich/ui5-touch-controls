keyboardLayoutsTitle=各种布局
keyboardLayoutsSubtitle=mode 属性的每个取值分别显示什么
keyboardLayoutsText=<code>mode</code> 就是某个国家的键盘，以它所服务的语言命名。下面几行是该布局在 <code>displayNumbers=&quot;Always&quot;</code> 下显示的样子；旁边的开关决定键盘上还有什么。点击某个布局，上方的键盘就会切换过去。
keyboardSwitchesTitle=各个开关
keyboardSwitchesSubtitle=它们各自往键盘上添了什么
keyboardSwitchesText=<p><b>displayNumbers</b> 决定数字的去向。<code>Always</code> 在字母上方排一行数字，就像实体键盘那样。<code>Toggle</code> 把字母留给自己，把数字藏到 <code>{numbers}</code> 键后面，像手机那样 &mdash; 在手机上排一行数字会让每个键都变窄。默认值 <code>ToggleOnMobile</code> 在电脑和平板上取前者、在手机上取后者；究竟取哪一种，由打开页面的设备一次性决定。<code>Never</code> 则完全不放数字。</p><p><b>showSpecialCharacters</b> 添上一套括号、符号和货币。数字藏在专门按键后面时，这套符号紧接在它们之后，就像手机从字母到数字再到符号又绕回来一样；否则由一个 <code>{symbols}</code> 键通往那里。</p><p><b>letterCase</b> 把键盘固定在一种大小写上。<code>Upper</code> 和 <code>Lower</code> 会去掉上档键和大写锁定 &mdash; 没有什么可切换的，而这正是大小写固定的字段所需要的：物料号、车牌号、批次号。对印地语不予考虑，它有的是第二套字母，而非大写。</p><p><b>showEmojis</b> 在一个专门按键后面挂上一套表情，就像取用数字和特殊字符那样。上面只有单字符的表情：由多个字符拼成的 &mdash; 一家人、一面旗 &mdash; 会被退格键重新拆开。</p><p><b>extraKeys</b> 是在每一套按键上都紧挨空格键的按键，无论屏幕上当前是哪一套。字段希望随手可及、而不是藏在切换后面的按键就放这里：地址用 <code>extraKeys=&quot;@,.&quot;</code>，数量用某个单位。@ 符号在特殊字符那一套里也有，只是多隔一个键。</p><p><b>showCapsLock</b> 在上档键旁边添一个 <code>{lock}</code>。上档在一个字母后就失效，锁定则一直保持到再次按下 &mdash; 而在锁定状态下按上档会输出小写，和实体键盘一样。</p><p><b>showEscape</b> 在每一套按键顶行的第一个位置添上 <code>{esc}</code> 键，正是实体键盘上它所在的位置。它只触发 <code>escape</code>，此外什么也不做；它该表示什么，交给应用决定。</p><p><b>enterText</b> 是回车键上的文字。留空则保持原来的箭头。</p>
padLayoutsTitle=数字键区
padLayoutsSubtitle=mode 属性的每个取值分别显示什么
padLayoutsText=<code>mode</code> 挑选数字键区，无论还开了什么，键区都保持原有形状：负号和小数分隔符进入零所在的那一行，通往特殊字符的键和 Esc 键进入其下的功能行。若既没要负号也没要分隔符，退格和回车便改而进入零所在的那一行 &mdash; 让零独占一行会使它成为三列宽的键。点击某个模式，上方的键区就会切换过去。
customKeysTitle=写一份布局
customKeysSubtitle=行、键，以及那些自带含义的键
customKeysText=一行就是以空格分隔的一串按键；在视图中，行与行之间用逗号分隔。凡是不在下表中的内容都输出自身 &mdash; 一个字母、一个数字、一整个词。写成 <code>layouts</code> 聚合中某一套名称的按键会切换到那一套，而写成当前所在那一套名称的按键则会退出它。
