# ---------------------------------------------------------------------------
# 快速上手
# ---------------------------------------------------------------------------
gsTitle=快速上手
gsSubtitle=为手指重做的标准 UI5 控件 —— 外加 sap.m 所缺少的那些
gsWhatTitle=这是什么
gsWhatSubtitle=为什么在触控设备上仅有 sap.m 还不够
gsWhatText1=<code>sap.m</code> 控件是为鼠标和键盘设计的。在平板、车间终端或者戴着手套操作的设备上，它们实在太小了 &mdash; 而 cozy 内容密度也只能往前挪一小步。
gsWhatText2=本库从两方面着手：<ul><li><strong>它按原有结构重做了最重要的 <code>sap.m</code> 控件</strong>，并用一个统一的 <code>size</code> 属性（<code>S</code>&ndash;<code>6XL</code>）打开了尺寸调节的口子，这个属性在每个控件上的用法完全一致。你不必重做应用：控件保留了原版熟悉的属性、聚合和事件，可以直接替换。</li><li><strong>它补上了 <code>sap.m</code> 根本没有的控件</strong>，用于只在触控设备上才会遇到的场景 &mdash; 最典型的就是屏幕键盘。</li></ul>
gsSizesTitle=一个属性，九种尺寸
gsSizesSubtitle=S · M（默认）· L · XL · 2XL · 3XL · 4XL · 5XL · 6XL
gsSizesText=尺寸会同时缩放字号、图标大小、内边距和高度，因此控件在每一档上都保持匀称。把 <code>size</code> 绑定到模型，就能在运行时切换整个应用的尺寸。
gsDropInTitle=直接替换
gsDropInSubtitle=加上命名空间，在控件前写 tc:，再设一个尺寸
gsBeforeTitle=之前 —— 纯 sap.m
gsAfterTitle=之后 —— ui5.touch.controls
gsDropInText=聚合一样、属性一样、事件处理器也一样 &mdash; <code>press=".onSave"</code> 调用的仍是控制器里的同一个方法。像 <code>ToolbarSpacer</code> 这样的 <code>sap.m</code> 控件可以原封不动地留在那里。
gsRequirementsTitle=运行要求
gsRequirementsStrip=需要 UI5 1.116 或更高版本（OpenUI5 或 SAPUI5）。
gsRequirementsText=本库以 <code>ui5.touch.controls</code> 之名发布在 npm 上，可用于任何以 UI5 Tooling（v3 及以上）构建的 UI5 应用。它自带 <code>ui5.yaml</code>，因此工具链会自动把它识别为库依赖。
gsNextTitle=接下来
gsNextSubtitle=从这里往哪走
gsNextText=<ul><li><strong>安装</strong> &mdash; 安装包、声明库并配置 TypeScript。</li><li><strong>文档</strong> &mdash; 完整的控件参考、尺寸刻度、<code>ISized</code> 接口以及已知的坑。</li><li><strong>控件</strong> &mdash; 每个控件一个交互页面，与 <code>sap.m</code> 原版并排展示。</li></ul>

# ---------------------------------------------------------------------------
# 安装
# ---------------------------------------------------------------------------
setupTitle=安装
setupSubtitle=安装本库、在应用中声明它并配置 TypeScript
setupPrereqTitle=前置条件
setupPrereqSubtitle=开始之前项目需要具备什么
setupPrereqStrip=UI5 1.116 或更高版本（OpenUI5 或 SAPUI5），以及 UI5 Tooling v3 或更高版本。
setupPrereqText=本库以 <a href="https://www.npmjs.com/package/ui5.touch.controls" target="_blank">ui5.touch.controls</a> 之名发布在 npm 上，可用于任何以 <a href="https://sap.github.io/ui5-tooling/" target="_blank">UI5 Tooling</a> 构建的 UI5 应用。
setupInstallTitle=1. 安装这个包
setupInstallSubtitle=作为普通依赖，而不是 devDependency
setupInstallText=请把本库装成<strong>普通依赖</strong>，这样 UI5 Tooling 才会把它当作项目依赖。包中带有 <code>ui5.yaml</code>，因此工具链会自动把它识别为库依赖。
setupMiddlewareTitle=1b. 使用 UI5 中间件（另一种做法）
setupMiddlewareSubtitle=把库作为静态文件提供，而不是解析为项目依赖
setupMiddlewareText=除了把本库作为 UI5 Tooling 的项目依赖使用之外，你也可以用 <a href="https://www.npmjs.com/package/ui5-middleware-servestatic" target="_blank">ui5-middleware-servestatic</a> 把它作为静态文件提供。
setupManifestTitle=2. 在 manifest.json 中声明本库
setupManifestSubtitle=让应用在启动时加载它
setupNamespaceTitle=3. 在视图中加上命名空间
setupNamespaceSubtitle=前缀 tc 只是约定 —— 用任何前缀都行
setupTypeScriptTitle=4. TypeScript 支持（可选）
setupTypeScriptSubtitle=开箱即用的完整类型
setupTypeScriptStrip=没有 “types” 条目，UI5 Tooling 不会自动加载本库。
setupTypeScriptText=在 TypeScript 项目中，请把这个包加入 <code>tsconfig.json</code> 的 <code>types</code> 条目。包中已包含类型定义（<code>dist/index.d.ts</code>）。

# ---------------------------------------------------------------------------
# 文档
# ---------------------------------------------------------------------------
docTitle=文档
docSubtitle=控件参考、尺寸刻度、ISized 接口以及已知的坑
docPortedTitle=sap.m 控件的触控版本
docPortedSubtitle=“替代”一列写明了各自替代的 sap.m 控件
docPortedText=这些是标准控件的重做版。在常见场景下它们保留了原版的属性、聚合和事件，因此可以直接替换。点击某个控件即可打开它的交互页面。
docNewTitle=面向触控的额外控件
docNewSubtitle=它们只存在于本库中
docNewText=它们针对的是只在触控设备上才会遇到的场景：没有硬件键盘的终端、用条码扫描枪代替手工输入、在屏幕上签名。点击某个控件即可打开它的交互页面。
docClassesTitle=类
docClassesSubtitle=从控制器里调用，而不是写进视图
docClassesText=本库添加的东西并非都是控件。这些类从控制器代码中调用，并用触控控件自行搭出界面。点击某个类即可打开它的交互页面。
docThemesTitle=主题兼容性
docThemesSubtitle=所有控件都自带面向这些主题的主题库
docThemesText1=控件的颜色、边框和阴影取自当前主题的主题参数，因此能与周围的 <code>sap.m</code> 控件融为一体。主题照常设置：在引导脚本里用 <code>data-sap-ui-theme</code>，或在运行时用 <code>Theming.setTheme()</code>。
docThemesText2=这里没有列出的主题不随本库提供。UI5 届时会为 <code>ui5.touch.controls</code> 回退到基础主题：控件仍然可用，但颜色不会与应用的其余部分一致。
docSizesTitle=尺寸
docSizesSubtitle=每个控件都有同一个 size 属性
docSizesText1=可选值：<code>S</code> &middot; <code>M</code>（默认）&middot; <code>L</code> &middot; <code>XL</code> &middot; <code>2XL</code> &middot; <code>3XL</code> &middot; <code>4XL</code> &middot; <code>5XL</code> &middot; <code>6XL</code>
docSizesText2=尺寸会同时缩放字号、图标大小、内边距和高度，因此控件在每一档上都保持匀称。把 <code>size</code> 绑定到模型，就能在运行时切换整个应用的尺寸。
docISizedTitle=ISized
docISizedSubtitle=ui5.touch.controls.ISized
docISizedText=所有带 <code>size</code> 属性的控件都实现了标记接口 <code>ui5.touch.controls.ISized</code>。借此可以统一处理尺寸，例如把用户的设置应用到整个视图。
docKeyboardTitle=键盘
docKeyboardSubtitle=sap.m 没有对应控件
docKeyboardText1=在车间终端、自助机或戴着手套操作的设备上，往往没有硬件键盘，而操作系统的屏幕键盘要么用不了，要么遮掉半个屏幕。UI5 对此没有任何控件。本库带来三种屏幕键盘，全部由自己的按钮绘出 &mdash; 不依赖第三方，并且和其他一切一样由同一个 <code>size</code> 属性控制大小。
docKeyboardText2=<code>tc:Keyboard</code> 是字母键盘：<code>mode</code> 就是某个国家的布局，几个开关决定数字是排在字母上方还是藏在一个键后面、有没有特殊字符、以及输出大写还是小写。<code>tc:NumberPad</code> 是同一思路的数字版。<code>tc:CustomKeyboard</code> 的按键由你逐行交给它，用于另外两者覆盖不到的一切：<code>&#123;shift&#125;</code>、<code>&#123;space&#125;</code>、<code>&#123;bksp&#125;</code> 和 <code>&#123;enter&#125;</code> 是特殊键，其余每个键都输出自己的标签。三者都能通过 <code>hardwareKeys="true"</code> 接受真实键盘的按键，通过 <code>docked</code> 停靠在屏幕下沿，并且都能放进字段的 <code>keyboard</code> 聚合里。
docPitfallTitle=坑：只接受 sap.m.Button 的聚合
docPitfallSubtitle=sap.m.Dialog 的 buttons、beginButton 和 endButton
docPitfallStrip=某些标准聚合的类型限定为 sap.m.Button，会在运行时拒绝 tc:Button："Element ui5.touch.controls.Button#__button0" is not valid for aggregation "buttons"。
docPitfallText1=而且这些按钮位本来也不是为改变尺寸准备的 &mdash; 它们是按标准按钮高度排布的。
docPitfallText2=<strong>绕开它的办法是 <code>footer</code> 聚合。</strong>它的类型是 <code>sap.m.Toolbar</code>（自 UI5 1.110 起可用），而 <code>tc:Toolbar</code> 和 <code>tc:OverflowToolbar</code> 都继承自 <code>sap.m.Toolbar</code>，因此可以直接放进去。对话框随后会按工具栏调整页脚高度，触控尺寸的按钮就能正常显示。只要对话框有可能变窄，就优先选 <code>tc:OverflowToolbar</code>。
docPitfallText3=对于普通的 MessageBox 式对话框，你不必自己搭这一套 &mdash; <code>QuickDialog</code> 已经这样组装它的页脚，尺寸由它的 <code>size</code> 选项决定。
docSizesExample=绑定尺寸
docPitfallBrokenTitle=行不通
docPitfallWorksTitle=可行

# ---------------------------------------------------------------------------
# 控件页面
# ---------------------------------------------------------------------------
barcodeHint=<code>sap.m</code> 没有对应控件：处于“键盘楔入”模式的条码扫描枪会在几毫秒内把代码敲进当前聚焦的字段，并以 <kbd>回车</kbd> 结束。本控件测量按键之间的间隔，因此一次扫描会触发 <code>scan</code>，而手工敲入同样的字符则触发 <code>change</code>。
signatureHint=<code>sap.m</code> 没有对应控件。签名板在 canvas 上作画，并把结果以 PNG data URL 的形式放进 <code>value</code>，因此它可以像其他任何值一样绑定到模型并送往后端。笔画粗细、占位文字和清除按钮都随 <code>size</code> 属性变化。
overflowPlainHint=把滑块往左拖：放不下的内容会移到三个点的按钮后面。在满宽状态下根本没有溢出按钮。
overflowPriorityHint=“打印”的优先级是 Low，因此最先溢出。“保存”设了 NeverOverflow，只要还有一点地方就留在工具栏里 —— 到最窄时它也会进入弹出框，好让溢出按钮仍然够得着。“关于”设了 AlwaysOverflow，永远待在弹出框里 —— 所以即便空间充裕，这条工具栏也会显示三个点的按钮。
overflowFooterHint=把浏览器窗口调窄，就能看到页脚工具栏溢出 —— 弹出框这时会开在工具栏上方。
overflowDialogHint=sap.m.Dialog 的 buttons 聚合只接受 sap.m.Button，但页脚接受任何 sap.m.Toolbar —— 所以触控版 OverflowToolbar 可以直接放进去。这里它是两条工具栏中更合适的一条：对话框天生就窄，放不下的内容会进入溢出菜单，而不是被截断。
inputKeyboardHint=打开“虚拟键盘”后，keyboard 聚合里的键盘会在字段获得焦点时开在字段下方，并在焦点离开时立即关闭。
textAreaKeyboardHint=打开“虚拟键盘”后，keyboard 聚合里的键盘会在字段获得焦点时开在字段下方，并在焦点离开时立即关闭。它的回车键会插入换行，正如回车在多行字段中的作用。

