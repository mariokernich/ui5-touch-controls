smpSteel20=Çelik çubuk 20 mm
smpCopper15=Bakır tel 1,5 mm²
smpCopper25=Bakır tel 2,5 mm²
smpStockAluminium2=1.240 adet
smpStockAluminium4=860 adet
smpStockSteel10=312 adet
smpStockSteel20=95 adet
smpStockCopper15=4.500 m
smpStockCopper25=2.100 m

# ---------------------------------------------------------------------------
# kontrol başvurusu: bir kontrolün ne olduğu, sap.m'deki özgün halinin ne
# yaptığı ve bu kitaplığın ondan ne çıkardığı. Kontrolün sayfasının başında
# ve belgeler sayfasının tablolarında görünür.
# ---------------------------------------------------------------------------
docButtonSummary=Bütün geometrisi tek bir size özelliğini izleyen bir düğme: parmağın dokunması gereken alan da onunla birlikte büyür. Geri kalan her şey — metin, simge, tür ve press — sap.m.Button'daki gibidir.
docButtonOriginal=sap.m'nin standart düğmesi: metin, simge, simgenin yeri, bir düğme türü ve bir press olayı. Yüksekliğini tema belirler ve o yükseklik değişmez.
docButtonDescription=Ayarlanabilir boyutu, simgesi, simge konumu, türü (sap.m.ButtonType değerlerinin tümü), yan iç boşluğu ve genişliği olan düğme. press olayını tetikler.
docSegmentedButtonSummary=Tam olarak biri seçili, birbirine bitişik düğmelerden bir sıra — her bölüme parmakla dokunulabilecek kadar büyük.
docSegmentedButtonOriginal=Tam olarak biri seçili, birbirine bitişik düğmelerden bir sıra; sap.m.SegmentedButtonItem ile doldurulur. selectionChange olayını tetikler.
docSegmentedButtonDescription=Tam olarak biri seçili, birbirine bitişik düğmelerden bir sıra; tc:SegmentedButtonItem ile doldurulur (key, text, icon, enabled). Eşit dağılmış bölümler için selectedKey ve width destekler, selectionChange olayını tetikler.
docCheckBoxSummary=Kutusu, işareti, etiketi ve dokunma alanı birlikte büyüyen bir onay kutusu; temanın verdiği boyutta kalmaz.
docCheckBoxOriginal=sap.m'nin standart onay kutusu; etiketi, üç durumlu seçimi ve value state değerleri vardır. Kutunun ve dokunma alanının boyutunu tema belirler.
docCheckBoxDescription=Kutusu, işareti, etiketi ve dokunma alanı birlikte büyüyen onay kutusu — M boyutunda geometrisi sap.m.CheckBox ile aynıdır. selected, partiallySelected, text, editable, wrapping, value state ve width destekler. select olayını tetikler.
docRadioButtonSummary=size özelliğiyle birlikte büyüyen bir seçenek düğmesi ve bunlardan birkaçını sütunlara dizip kendi ayarlarını onlara aktaran bir grup kontrolü.
docRadioButtonOriginal=Aynı groupName altındaki ötekilerle karşılıklı dışlayan bir seçenek düğmesi ve bunlardan birkaçını sütunlara dizen bir grup kontrolü.
docRadioButtonDescription=Çember, nokta, etiket ve dokunma alanı birlikte büyür — M boyutunda geometrisi sap.m.RadioButton ile aynıdır. Aynı groupName'e sahip düğmeler birbirini dışlar; tc:RadioButtonGroup onları sütunlara dizer ve size, enabled, editable ile value state değerlerini onlara aktarır. select olayını tetikler.
docSwitchSummary=size özelliğiyle birlikte büyüyen bir açma/kapama anahtarı; sap.m.Switch ise 4rem × 2rem ölçüsünde sabit kalır.
docSwitchOriginal=Sabit boyutlu bir açma/kapama anahtarı; accept/reject biçimi ve iki durum için kendi yazıları vardır.
docSwitchDescription=Ray, tutamak ve yazı birlikte büyür; sap.m.Switch ise 4rem × 2rem ölçüsünde sabit kalır. state, customTextOn, customTextOff ve AcceptReject türünü destekler; renkler @sapButton_Track_* / @sapButton_Handle_* tema değişkenlerinden gelir. change olayını tetikler.
docSelectSummary=Açılan listesi alanın kendisi kadar yüksek satırlarla açılan bir seçim kutusu; böylece bir kayda parmakla dokunulabilir.
docSelectOriginal=sap.ui.core.Item öğeleriyle doldurulan bir seçim kutusu. Açtığı liste, alan ne kadar büyük olursa olsun standart satır yüksekliğinde kalır.
docSelectDescription=Sıradan sap.ui.core.Item öğeleriyle doldurulan seçim kutusu. Liste, satırları alan kadar yüksek olan bir açılır pencerede açılır ve bu yüzden parmakla dokunulabilir — sap.m.Select'in kendi listesi, alan ne kadar büyük olursa olsun standart satır yüksekliğini korur. selectedKey, editable, forceSelection, value state ve width destekler. Telefonda liste, sap.m'de olduğu gibi ekranın tamamını kaplar. change olayını tetikler.
docComboBoxSummary=İçine yazılabilen bir Select: serbest metne izin verilir, yazılan liste süzer ve satırlar alan kadar yüksektir.
docComboBoxOriginal=İçine yazılabilen bir seçim kutusu: yazılan listeyi süzer ve listede olmayan bir değere de izin verilir.
docComboBoxDescription=İçine yazılabilen bir Select: serbest metne izin verilir, yazılan listeyi süzer ve listenin satırları alan kadar yüksektir. Kendi klavyesi olmayan bir cihazda bu kitaplığın klavyeleriyle birlikte çalışır. value, selectedKey, placeholder, editable, value state, width ve bir sap.ui.core.ListItem öğesinin additionalText değerini satırın sonuna koyan showSecondaryValues destekler. Telefonda liste ekranın tamamını kaplar ve yazmayı sürdürmek için kendi alanını getirir — sap.m'de olduğu gibi. change ve selectionChange olaylarını tetikler.
docDatePickerSummary=Takvimi bu kitaplığın düğmelerinden kurulan bir tarih alanı: bir gün, size özelliğiyle birlikte büyüyen bir karedir.
docDatePickerOriginal=sap.ui.unified.Calendar üzerine kurulu açılır takvimi olan bir alan; minDate/maxDate ile ayarlanabilir değer ve görüntüleme biçimleri vardır.
docDatePickerDescription=Kitaplığın kendi düğmelerinden kurulan takvimi olan alan: bir gün, sap.ui.unified.Calendar kontrolünün sabit ızgarası yerine size özelliğiyle büyüyen bir karedir. Gün ve ay görünümü, minDate/maxDate, valueFormat ve displayFormat (biçem ya da örüntü). change olayını value, dateValue ve valid ile tetikler.
docTimePickerSummary=Saate bir, dakikaya bir dokunuşla dolan bir saat alanı; sürüklenmesi gereken bir kaydırıcı yerine.
docTimePickerOriginal=Saatlerin ve dakikaların sürüklenmesi gereken kaydırıcılarla ayarlandığı, açılır pencereli bir alan.
docTimePickerDescription=İki sütun düğmesi olan alan — saatler ve dakikalar: bir saat, size ile büyüyen bir hedefe tek dokunuşla seçilir; sap.m.TimePicker ise sürüklenmesi gereken bir kaydırıcı kullanır. minutesStep, valueFormat ve displayFormat destekler. change olayını bir kez, açılır pencere kapanınca tetikler.
docInputSummary=size özelliğiyle ölçeklenen ve kendi klavyesi olmayan cihazlar için bu kitaplığın bir klavyesini yanında getirebilen tek satırlı bir giriş alanı.
docInputOriginal=sap.m'nin standart tek satırlı giriş alanı; yer tutucu, en büyük uzunluk, value state ve öneriler içerir.
docInputDescription=Ayarlanabilir boyutlu tek satırlı giriş alanı. keyboard birleşimine bu kitaplığın bir klavyesi konabilir — tc:Keyboard, tc:NumberPad ya da tc:CustomKeyboard; showKeyboard ile klavye, alan odaktayken alanın altında bir açılır pencerede açılır ve içine yazar.
docTextAreaSummary=size özelliğiyle ölçeklenen ve bu kitaplığın bir klavyesini alan çok satırlı bir giriş alanı; burada Enter tuşu satır sonu ekler.
docTextAreaOriginal=sap.m'nin standart çok satırlı giriş alanı; satır sayısı, en büyük uzunluk ve value state içerir.
docTextAreaDescription=Ayarlanabilir boyutu, satır sayısı, en büyük uzunluğu ve value state değerleri olan çok satırlı giriş alanı. Input gibi keyboard birleşiminde bir klavye alır; orada Enter tuşu satır sonu ekler. change / liveChange olaylarını tetikler.
docTextSummary=Yazı büyüklüğü, kitaplığın her kontrolündeki aynı size özelliğini izleyen bir metin; böylece bir etiket, yanındaki alanın ölçüsünde durur.
docTextOriginal=Satır kaydırması ve en fazla satır sayısı olan bir metin kontrolü.
docTextDescription=Ayarlanabilir boyutu ve rengi olan metin. press olayını tetikler.
docLinkSummary=Yazısı — ve onunla birlikte parmağın dokunabileceği alan — size özelliğiyle büyüyen bir bağlantı.
docLinkOriginal=href ve target ile bir bağlantı; subtle ve emphasized biçimleri de vardır.
docLinkDescription=Ayarlanabilir boyutlu bağlantı: parmağın dokunabileceği alan yazıyla birlikte büyür. href, target, wrapping, subtle, emphasized ve width destekler; target="_blank" olan bir bağlantıya kendiliğinden rel="noopener noreferrer" eklenir. press olayını tetikler.
docToolbarSummary=Bu kitaplığın kontrolleri için bir çubuk; yine de sap.m'nin kendi araç çubuğunu beklediği her yere girer — örneğin bir Page ya da Dialog altlığına.
docToolbarOriginal=İçeriğini bir satıra dizen bir çubuk. sap.m'deki pek çok başlık ve altlık birleşimi bu türe bağlıdır.
docToolbarDescription=content birleşimi olan araç çubuğu kabı. Standart birleşimlerde kullanılabilir, örneğin bir Page ya da Dialog altlığında.
docOverflowToolbarSummary=Sığmayan her şeyi üç noktalı bir düğmenin ardındaki açılır pencereye taşıyan bir araç çubuğu — sap.m.OverflowToolbarLayoutData öncelikleriyle yönetilir.
docOverflowToolbarOriginal=Sığmayan her şeyi üç noktalı bir düğmenin ardındaki açılır pencereye taşıyan bir araç çubuğu — sap.m.OverflowToolbarLayoutData öncelikleriyle yönetilir.
docOverflowToolbarDescription=tc:Toolbar gibidir, yalnızca var olan genişliğe sığmayan içerik üç noktalı bir düğmenin ardına geçer ve o düğme geri kalanı bir açılır pencerede açar. sap.m.OverflowToolbarLayoutData önceliklerini anlar.
docStepInputSummary=Kendisiyle birlikte ölçeklenen eksi ve artı düğmeleri olan sayısal bir alan; böylece bir değer başparmakla değiştirilebilir.
docStepInputOriginal=Eksi ve artı düğmeleri olan sayısal bir alan; min, max ve step içerir.
docStepInputDescription=Eksi düğmesi, giriş alanı ve artı düğmesi, birlikte ölçeklenir. min, max ve step destekler. change olayını tetikler.
docBarcodeInputSummary=Barkod okuyucuyu klavyede yazan bir insandan ayıran ve ikisini ayrı olaylar olarak bildiren bir giriş alanı.
docBarcodeInputDescription=Barkod okuyucuyu klavyede yazan bir insandan ayıran giriş alanı: aralıkları scanTimeout altında kalan, en az minLength karakterlik ve Enter ile biten bir dizi scan olayını tetikler, geri kalan her şey change olayını. prefix ile suffix koddan kırpılır, clearOnScan ise alanı bir sonraki kod için boşaltır.
docKeyboardSummary=Kendi klavyesi olmayan cihazlar için harflerden bir ekran klavyesi. mode bir ülkenin düzenini seçer; birkaç anahtar da üstünde başka ne olduğunu belirler.
docKeyboardDescription=Kitaplığın kendi düğmelerinden kurulan, harflerden bir ekran klavyesi. mode özelliği bir ülkenin düzenini seçer — İngilizce, Almanca, Fransızca, İspanyolca, Ukraynaca, Rusça, Hintçe — birkaç anahtar da üstünde başka ne olduğunu belirler: displayNumbers rakamları harflerin üstüne koyar ya da bir tuşun ardına alır, showSpecialCharacters bir işaret takımı ekler, letterCase klavyeyi büyük ya da küçük harfe bağlar, showCapsLock ile showEscape birer tuş ekler. Ayrıca gerçek klavyeden giriş, bağlanabilir bir değer ve change / keyPress / enter / escape olayları.
docNumberPadSummary=Sayı olarak girilen her şey için üç sütunluk bir ekran rakam bloğu. mode bloğu seçer: bir bilgisayarınki, bir telefonunki ya da bir hesap makinesininki.
docNumberPadDescription=Üç sütunluk ekran rakam bloğu. mode özelliği bloğu seçer — Simple (bir bilgisayarın bloğu), Phone (bir telefonunki) ya da Calculator (dört işlemle) — showDecimalSeparator, decimalSeparator, showSign ve showSpecialCharacters ise alanın rakamların ötesinde neye ihtiyacı varsa onu ekler. Değerin işlenmesini, ölçeklenmeyi ve yanaşmayı öteki klavyelerle paylaşır.
docCustomKeyboardSummary=Tuşları kendisine satır satır teslim edilen klavye. Hazır klavyelerin karşılamadığı her şeyin yanıtı odur.
docCustomKeyboardDescription=Tuşları kendisine teslim edilen ekran klavyesi: layout özelliği bir takımın satırlarıdır, layouts birleşimi gerektiği kadar takım taşır ve bir takımın adını taşıyan tuş o takıma geçirir. display birleşimi ise tek bir tuşun üstünde ne yazdığını belirler. Hazır olanların karşılamadığı her şey için klavye budur.
docKeyboardBaseSummary=Üç klavyenin de ardındaki düzenek. Kendisi bir görünüme konmaz: eksik olan, hangi tuşların gösterileceği kararıdır — alt sınıflarını birbirinden ayıran da tam olarak odur.
docKeyboardBaseDescription=Bu kitaplığın ekran klavyelerinin temel sınıfı; kitaplığın kendi Button kontrollerinden, dışarıdan hiçbir bağımlılık olmadan kurulmuştur. Hangi tuşların gösterileceği dışındaki her şey buradadır: değer ve bir tuşun onu nasıl değiştirdiği, tuş takımları ve aralarında geçiş, shift ile caps lock, hardwareKeys üzerinden gerçek klavyenin tuşları, boyut, genişlik ve yanaşma. Bir Input ile bir TextArea kontrolünün keyboard birleşimi de bu türe bağlıdır — Keyboard, NumberPad ve CustomKeyboard bu yüzden oraya aynı şekilde girer.
docSignaturePadSummary=Parmakla ya da kalemle imzalamak için bir alan. İmza, PNG veri URL'si olarak çıkar; böylece herhangi bir değer gibi bir modele bağlanabilir.
docSignaturePadDescription=Parmakla ya da kalemle imzalamak için bir alan. Bir canvas üzerine çizer ve imzayı value içinde PNG veri URL'si olarak verir, böylece bir modele bağlanabilir. Çizgi kalınlığı, yer tutucu ve temizleme düğmesi size özelliğine uyar; çizgiler boyut değişikliğinden sağ çıkar. change olayını tetikler.
docQuickDialogSummary=Dokunmatik kontrollerden kurulu hazır iletişim kutuları; bir görünüme yazılmak yerine denetleyiciden çağrılır. Her yöntem bir Promise döndürür.
docQuickDialogDescription=Dokunmatiğe uygun iletişim kutuları için yardımcı sınıf; bir görünümden değil, denetleyiciden kullanılır: show, confirm, information, error, input, select, details. Her yöntem bir Promise döndürür.
docThemeHorizon=Tanıtımın varsayılan teması
docThemeHorizonDark=Horizon'un koyu biçimi
docThemeHorizonHcb=Yüksek karşıtlık, koyu arka plan
docThemeHorizonHcw=Yüksek karşıtlık, açık arka plan
docThemeFiori3=UI5'in önceki varsayılan teması
docThemeFiori3Dark=Fiori 3'ün koyu biçimi
