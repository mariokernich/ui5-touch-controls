kbIntroSubtitle=Harflerden bir klavye, tek satırda anlatılmış
kbIntroText=<p>Üretim sahasındaki bir terminalde, bir kioskta ya da eldivenle kullanılan bir cihazda çoğu zaman donanım klavyesi bulunmaz; işletim sisteminin ekran klavyesi ise ya yoktur ya da ekranın yarısını kapatır. Bir metin alanı için yanıt <code>tc:Keyboard</code>: <code>mode</code> bir ülkenin düzenini seçer, birkaç anahtar da üstünde başka ne olduğunu belirler. Ayrıca bir düzen yazmak gerekmez.</p><p>Bu, üç klavyeden biridir ve tuşlarla ilgili olmayan her şeyi paylaşırlar: değer, <code>size</code>, <code>docked</code>, <code>hardwareKeys</code> üzerinden gerçek klavyenin tuşları ve <code>change</code>, <code>keyPress</code>, <code>enter</code>, <code>escape</code> olayları. Rakam alanları için <code>tc:NumberPad</code>, kendi tuşlarınız için <code>tc:CustomKeyboard</code> vardır. Üçü de bir <code>tc:Input</code> ya da <code>tc:TextArea</code> kontrolünün <code>keyboard</code> birleşimine sığar.</p>
padIntroSubtitle=Rakamlardan bir blok, tek satırda anlatılmış
padIntroText=<p>Bir miktar, bir sayı, bir kod, bir fiyat &mdash; bir terminalin alanları harften çok rakamdır ve üç sütunluk bir bloğu başparmak bakmadan bulur. <code>tc:NumberPad</code> işte o bloktur: <code>mode</code> rakam bloğunu seçer, yanındaki anahtarlar da alanın rakamların ötesinde neye ihtiyacı varsa onu ekler.</p><p>Bu, üç klavyeden biridir ve tuşlarla ilgili olmayan her şeyi paylaşırlar: değer, <code>size</code>, <code>docked</code>, <code>hardwareKeys</code> üzerinden gerçek klavyenin tuşları ve <code>change</code>, <code>keyPress</code>, <code>enter</code>, <code>escape</code> olayları. Metin alanları için <code>tc:Keyboard</code>, kendi tuşlarınız için <code>tc:CustomKeyboard</code> vardır.</p>
customIntroSubtitle=Tuşları ona satır satır teslim edilir
customIntroText=<p><code>tc:CustomKeyboard</code>, hazır olanların karşılamadığı her şey için klavyedir: bir mağazanın sattığı bedenler, bir plakada bulunabilecek harfler, bir makinenin tuşları. <code>layout</code> özelliği bir takımın satırlarıdır; <code>layouts</code> birleşimi gerektiği kadar takım taşır ve bir takımın adıyla yazılan tuş o takıma geçirir. <code>display</code> birleşimi ise tek bir tuşun üstünde ne yazdığını söyler.</p><p>Bu, üç klavyeden biridir ve tuşlarla ilgili olmayan her şeyi paylaşırlar: değer, <code>size</code>, <code>docked</code>, <code>hardwareKeys</code> üzerinden gerçek klavyenin tuşları ve <code>change</code>, <code>keyPress</code>, <code>enter</code>, <code>escape</code> olayları. Harf klavyesi ya da rakam bloğu isteniyorsa <code>tc:Keyboard</code> ile <code>tc:NumberPad</code> aynı şeyi tek satırda söyler.</p>
colProperty=Property
colDefault=Varsayılan
baseNote=tc:KeyboardBase bir temel sınıftır ve hiçbir zaman bir görünüme konmaz. tc:Keyboard, tc:NumberPad ya da tc:CustomKeyboard kullanın; bu sayfa üçünün ortak yanını anlatır.
baseIntroSubtitle=Üç klavyenin ortak yanı
baseIntroText=<p>Bu kitaplığın üç klavyesi tek bir noktada ayrılır: tuşların nereden geldiği. <code>tc:Keyboard</code> onları bir dilden ve birkaç anahtardan kurar, <code>tc:NumberPad</code> bir rakam bloğundan, <code>tc:CustomKeyboard</code> ise satır satır teslim alır. Geri kalan her şey bu sınıftır ve üçünde de aynı biçimde çalışır.</p><p>Yani değer ve bir tuşun onu nasıl değiştirdiği, tuş takımları ve aralarında geçiş, shift ile caps lock, gerçek klavyenin tuşları, boyut, genişlik ve yanaşma. Tuşların kendisi bu kitaplığın <code>tc:Button</code> kontrolleridir &mdash; arkalarında yabancı bir klavye yoktur ve her şeyi ölçekleyen aynı <code>size</code> özelliği onları da ölçekler.</p><p>Ayrıca bir <code>tc:Input</code> ile bir <code>tc:TextArea</code> kontrolünün <code>keyboard</code> birleşiminin bağlı olduğu tür de budur — üçünden herhangi biri bu yüzden bir alana sığar.</p>
basePropsTitle=Üçünün ortak yanı
basePropsSubtitle=Bu kitaplığın her klavyesinde bulunan özellikler
basePropsText=Bunların yanında üçünün her birinde kendi tuşlarını oluşturan özellikler vardır &mdash; <code>tc:Keyboard</code> ile <code>tc:NumberPad</code> kontrolünde <code>mode</code> ve anahtarlar, <code>tc:CustomKeyboard</code> kontrolünde <code>layout</code> ile <code>layouts</code>.
baseEventsTitle=Olaylar
baseEventsSubtitle=Bu kitaplığın her klavyesi bunları tetikler
baseKeysTitle=Kendi anlamı olan tuşlar
baseKeysSubtitle=Üç klavyenin de anladığı tuşlar
baseKeysText=Bir satır, boşlukla ayrılmış tuşlardan oluşur; kaşlı ayraç içine alınmış bir tuş ise aşağıdakilerden biridir. Bunlar burada ele alınır, bu yüzden üç klavyede de aynı anlama gelirler; bir klavye yalnızca onları ekrana koyup koymayacağına karar verir.
baseSubclassesTitle=Üç klavye
baseSubclassesSubtitle=Hangisi ne zaman
baseHowTitle=Geometri üzerine bir söz
baseHowText=<p>Yer ne kadar dar olursa olsun, bir klavyeyi yana kaydırmak hiçbir zaman gerekmez: bir tuş, yüksekliği kadar geniş olmak ister ve yer sıkıştığında bu genişlikten vazgeçer. Yüksekliği <code>size</code> özelliğinden gelir ve olduğu gibi kalır.</p><p><code>docked</code> ile klavye sayfanın akışından çıkar ve içeriğin üstünde, ekranın alt kenarına oturur — bir telefonun ekran klavyesinin yaptığı gibi. Telefonda ya da tablette ekranın tamamını enlemesine kaplar ve <code>width</code> dikkate alınmaz. Bir alanın klavyesi de aynı biçimde yanaşır; tek farkı, açılır penceresinin onu duruk alana koymasıdır, böylece kipli bir iletişim kutusunun da üstünü örter &mdash; bir iletişim kutusundaki alana yazılabilmesini sağlayan da budur.</p>
