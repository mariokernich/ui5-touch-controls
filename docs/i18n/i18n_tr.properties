customKeysSubtitle=Satırlar, tuşlar ve kendi anlamı olanlar
customKeysText=Bir satır, boşlukla ayrılmış tuşlardan oluşur; bir görünümde satırları virgüller ayırır. Aşağıdaki tabloda bulunmayan her şey kendini yazar &mdash; bir harf, bir rakam, koca bir sözcük. <code>layouts</code> birleşimindeki takımlardan birinin adıyla yazılan bir tuş o takıma geçirir; hâlihazırda üstünde bulunduğu takımı adlandıran bir tuş ise oradan geri çıkarır.
