keyboardLayoutsTitle=Klavye düzenleri
keyboardLayoutsSubtitle=mode özelliğinin her değeri neyi gösterir
keyboardLayoutsText=<code>mode</code>, bir ülkenin klavyesidir; adını da kullanıldığı dilden alır. Aşağıdaki satırlar, o düzenin <code>displayNumbers=&quot;Always&quot;</code> ile neyi gösterdiğidir; klavyede başka ne bulunduğuna yanındaki anahtarlar karar verir. Yukarıdaki klavyeyi bir düzene çevirmek için o düzene tıklayın.
keyboardSwitchesTitle=Anahtarlar
keyboardSwitchesSubtitle=Her biri klavyeye neyi ekler
keyboardSwitchesText=<p><b>displayNumbers</b> rakamların ne olacağına karar verir. <code>Always</code> onları harflerin üstüne bir satır olarak koyar, tuşlu bir klavyedeki gibi. <code>Toggle</code> harfleri kendi başına bırakır ve rakamları bir <code>{numbers}</code> tuşunun ardına alır, bir telefonun yaptığı gibi &mdash; orada bir rakam satırı her tuşu incecik bırakırdı. Varsayılan olan <code>ToggleOnMobile</code>, bilgisayarda ve tablette birincisi, telefonda ikincisidir; hangisi olduğu bir kez, sayfanın açıldığı cihaza bakılarak belirlenir. <code>Never</code> rakamları büsbütün bırakır.</p><p><b>showSpecialCharacters</b> bir parantez, işaret ve para birimi takımı ekler. Rakamlar zaten kendi tuşunun ardındaysa takım onların ardına geçer — bir telefonun harflerden rakamlara, oradan simgelere gidip geri dönmesi gibi; değilse oraya bir <code>{symbols}</code> tuşu götürür.</p><p><b>letterCase</b> klavyeyi tek bir harf durumuna bağlar. <code>Upper</code> ve <code>Lower</code> ile shift tuşu da caps lock da görünmez &mdash; değiştirilecek bir şey yoktur, ki kendi harf durumu olan bir alanın istediği de budur: bir malzeme numarası, bir plaka, bir parti numarası. Hintçe için dikkate alınmaz; orada büyük harf yerine ikinci bir harf takımı vardır.</p><p><b>showEmojis</b> bir yüz ifadesi takımını kendi tuşunun ardına asar — rakamlara ve özel karakterlere ulaşıldığı gibi. Üstünde yalnızca tek karakterden oluşanlar bulunur: birkaç karakterden kurulmuş olanı — bir aile, bir bayrak — geri silme tuşu yeniden parçalarına ayırırdı.</p><p><b>extraKeys</b>, hangi takım ekranda olursa olsun her takımda boşluk tuşunun yanında duran tuşlardır. Bir alanın bir anahtarın ardında değil elinin altında istediği tuş oraya gider: bir adres için <code>extraKeys=&quot;@,.&quot;</code>, bir miktar için bir birim. At işareti özel karakter takımında da vardır — bir tuş ötede.</p><p><b>showCapsLock</b> shift tuşunun yanına bir <code>{lock}</code> ekler. Shift bir harften sonra düşer, kilit ise yeniden basılana dek açık kalır &mdash; kilit açıkken shift küçük harf yazar, tuşlu bir klavyedeki gibi.</p><p><b>showEscape</b> her takımda üst satırın ilk tuşu olarak bir <code>{esc}</code> ekler, tuşlu bir klavyede durduğu yere. Bu tuş <code>escape</code> olayını tetikler, başka bir şey yapmaz; ne anlama geleceği uygulamaya bırakılmıştır.</p><p><b>enterText</b>, Enter tuşunun üstünde ne yazdığıdır. Boş bırakılırsa üstündeki ok olduğu gibi kalır.</p>
padLayoutsTitle=Rakam blokları
padLayoutsSubtitle=mode özelliğinin her değeri neyi gösterir
padLayoutsText=<code>mode</code> rakam bloğunu seçer ve blok, başka ne açılırsa açılsın biçimini korur: eksi ile ondalık ayırıcı sıfırın satırına, özel karakterlere giden tuş ile escape tuşu ise altındaki işlev tuşları satırına girer. Ne eksi ne de ayırıcı istenmişse sıfırın satırına bunların yerine geri silme ve enter gelir &mdash; tek başına bir satırdaki sıfır, üç sütun genişliğinde bir tuş olurdu. Yukarıdaki bloğu bir kipe çevirmek için o kipe tıklayın.
