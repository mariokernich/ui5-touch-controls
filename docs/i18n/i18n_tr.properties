# ---------------------------------------------------------------------------
# Başlarken
# ---------------------------------------------------------------------------
gsTitle=Başlarken
gsSubtitle=Dokunmatik için yeniden yazılmış standart UI5 kontrolleri — üstüne de sap.m'de hiç olmayanlar

gsWhatTitle=Genel bakış
gsWhatSubtitle=Dokunmatik bir cihazda sap.m neden tek başına yetmiyor
gsWhatText1=<code>sap.m</code> kontrolleri fare ve klavye için tasarlanmıştır. Bir tablette, üretim sahasındaki bir terminalde ya da eldivenle kullanılan bir cihazda bunlar açıkça fazla küçüktür &mdash; ve iş, içerik yoğunluğunu «cozy» yapmakla bitmez.
gsWhatText2=Kitaplık bu işe iki yandan girişir:<ul><li><strong>En önemli <code>sap.m</code> kontrollerini</strong> kendi yapıları üzerine yeniden kurar ve her kontrolde aynı biçimde çalışan tek bir <code>size</code> özelliğiyle (<code>S</code>&ndash;<code>6XL</code>) ölçeklenmeye açar. Uygulamanızı yeniden yazmanız gerekmez: kontroller özgün hallerinin alışıldık özelliklerini, birleşimlerini ve olaylarını korur, böylece doğrudan yerlerine geçebilirler.</li><li><strong><code>sap.m</code>'de hiç bulunmayan kontroller ekler</strong> &mdash; yalnızca dokunmatik cihazlarda karşınıza çıkan durumlar için; bunun en tipik örneği ekran klavyeleridir.</li></ul>

gsSizesTitle=Tek özellik, dokuz boyut
gsSizesSubtitle=S · M (varsayılan) · L · XL · 2XL · 3XL · 4XL · 5XL · 6XL
gsSizesText=Boyut; yazı büyüklüğünü, simge büyüklüğünü, iç boşluğu ve yüksekliği birlikte ölçekler, böylece kontroller her basamakta oranlı kalır. <code>size</code> özelliğini bir modele bağlayın, uygulamanın tamamının boyutu çalışma sırasında değişsin.

gsDropInTitle=Doğrudan yerine geçer
gsDropInSubtitle=Ad alanını ekleyin, kontrolün önüne tc: koyun, bir boyut seçin
gsBeforeTitle=Öncesi — yalın sap.m
gsAfterTitle=Sonrası — ui5.touch.controls
gsDropInText=Aynı birleşimler, aynı özellikler, aynı olay işleyicileri &mdash; <code>press=".onSave"</code> denetleyicinizdeki aynı yöntemi çağırmayı sürdürür. <code>ToolbarSpacer</code> gibi <code>sap.m</code> kontrolleri tam durdukları yerde kalabilir.

gsRequirementsTitle=Gereksinimler
gsRequirementsStrip=UI5 1.116 ya da üstü gerekir (OpenUI5 veya SAPUI5).
gsRequirementsText=Kitaplık npm'de <code>ui5.touch.controls</code> adıyla yayımlanmıştır ve UI5 Tooling (v3 ve üstü) ile derlenen her UI5 uygulamasında kullanılabilir. Kendi <code>ui5.yaml</code> dosyasıyla gelir, bu yüzden araçlar onu kitaplık bağımlılığı olarak kendiliğinden çözer.

gsNextTitle=Sonraki adımlar
gsNextSubtitle=Buradan nereye
gsNextText=<ul><li><strong>Kurulum</strong> &mdash; paketi kurmak, kitaplığı bildirmek ve TypeScript'i ayarlamak.</li><li><strong>Belgeler</strong> &mdash; kontrollerin tam başvurusu, boyut ölçeği, <code>ISized</code> arayüzü ve bilinen tuzaklar.</li><li><strong>Kontroller</strong> &mdash; her kontrole bir etkileşimli sayfa, <code>sap.m</code> özgün haliyle yan yana.</li></ul>

