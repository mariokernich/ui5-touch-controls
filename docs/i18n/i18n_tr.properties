# Kurulum
# ---------------------------------------------------------------------------
setupTitle=Kurulum
setupSubtitle=Kitaplığı kurun, uygulamanızda bildirin ve TypeScript'i ayarlayın

setupPrereqTitle=Ön koşullar
setupPrereqSubtitle=Başlamadan önce projenizde ne olmalı
setupPrereqStrip=UI5 1.116 ya da üstü (OpenUI5 veya SAPUI5) ve UI5 Tooling v3 ya da üstü.
setupPrereqText=Kitaplık npm'de <a href="https://www.npmjs.com/package/ui5.touch.controls" target="_blank">ui5.touch.controls</a> adıyla yayımlanmıştır ve <a href="https://sap.github.io/ui5-tooling/" target="_blank">UI5 Tooling</a> ile derlenen her UI5 uygulamasında kullanılabilir.

setupInstallTitle=1. Paketi kurun
setupInstallSubtitle=devDependency olarak değil, sıradan bir bağımlılık olarak
setupInstallText=Kitaplığı <strong>sıradan bir bağımlılık</strong> olarak kurun ki UI5 Tooling onu proje bağımlılığı saysın. Pakette bir <code>ui5.yaml</code> bulunur, bu yüzden araçlar onu kitaplık bağımlılığı olarak kendiliğinden çözer.

setupMiddlewareTitle=1b. UI5 ara katmanıyla (başka bir yol)
setupMiddlewareSubtitle=Kitaplığı proje bağımlılığı yapmak yerine dosya olarak sunmak
setupMiddlewareText=Kitaplığı UI5 Tooling proje bağımlılığı olarak eklemek yerine <a href="https://www.npmjs.com/package/ui5-middleware-servestatic" target="_blank">ui5-middleware-servestatic</a> ile dosya olarak sunabilirsiniz.

setupManifestTitle=2. Kitaplığı manifest.json içinde bildirin
setupManifestSubtitle=Uygulama onu açılışta yüklesin diye

setupNamespaceTitle=3. Ad alanını görünümlerinize ekleyin
setupNamespaceSubtitle=tc öneki yalnızca bir alışkanlık — hangi önek olursa olsun çalışır

setupTypeScriptTitle=4. TypeScript desteği (isteğe bağlı)
setupTypeScriptSubtitle=Kutudan çıktığı gibi tam tip desteği
setupTypeScriptStrip=«types» girdisi olmadan UI5 Tooling kitaplığı kendiliğinden yüklemez.
setupTypeScriptText=TypeScript projelerinde paketi <code>tsconfig.json</code> dosyanızdaki <code>types</code> girdisine ekleyin. Tip tanımları paketin içindedir (<code>dist/index.d.ts</code>).

# ---------------------------------------------------------------------------
# Belgeler
# ---------------------------------------------------------------------------
docTitle=Belgeler
docSubtitle=Kontrol başvurusu, boyut ölçeği, ISized arayüzü ve bilinen tuzaklar

docPortedTitle=sap.m kontrollerinin dokunmatik sürümleri
docPortedSubtitle=«Yerine geçtiği» sütunu, her birinin hangi sap.m kontrolünün yerini aldığını söyler
docPortedText=Bunlar standart kontrollerin yeniden yazılmış halleridir. Alışılmış durumlarda özgün hallerinin özelliklerini, birleşimlerini ve olaylarını korurlar, böylece doğrudan yerlerine geçebilirler. Etkileşimli sayfasını açmak için bir kontrole tıklayın.

docNewTitle=Dokunmatik için ek kontroller
docNewSubtitle=Yalnızca bu kitaplıkta bulunur
docNewText=Bunlar yalnızca dokunmatik bir cihazda karşınıza çıkan durumları karşılar: donanım klavyesi olmayan bir terminal, yazmak yerine barkod okuyucu, ekranın üstüne atılan bir imza. Etkileşimli sayfasını açmak için bir kontrole tıklayın.

docClassesTitle=Sınıflar
docClassesSubtitle=Görünüme konmaz, denetleyiciden çağrılır
docClassesText=Kitaplığın eklediği her şey bir kontrol değildir. Bunlar denetleyici kodundan çağrılır ve arayüzlerini dokunmatik kontrollerden kendileri kurar. Etkileşimli sayfasını açmak için bir sınıfa tıklayın.

docThemesTitle=Tema uyumluluğu
docThemesSubtitle=Bu temalar için tüm kontroller kendi tema kitaplığıyla gelir
docThemesText1=Kontroller renklerini, kenarlıklarını ve gölgelerini etkin temanın tema değişkenlerinden alır, böylece çevrelerindeki <code>sap.m</code> kontrolleriyle bütünleşirler. Temayı her zamanki gibi belirleyin: açılışta <code>data-sap-ui-theme</code> ile ya da çalışma sırasında <code>Theming.setTheme()</code> ile.
docThemesText2=Burada sayılmayan temalar kitaplıkla birlikte gelmez. UI5 o durumda <code>ui5.touch.controls</code> için temel temaya döner: kontroller kullanılabilir kalır ama renkleri uygulamanın geri kalanıyla tutmaz.

docSizesTitle=Boyutlar
docSizesSubtitle=Her kontrolde aynı size özelliği bulunur
docSizesText1=Olası değerler: <code>S</code> &middot; <code>M</code> (varsayılan) &middot; <code>L</code> &middot; <code>XL</code> &middot; <code>2XL</code> &middot; <code>3XL</code> &middot; <code>4XL</code> &middot; <code>5XL</code> &middot; <code>6XL</code>
docSizesText2=Boyut; yazı büyüklüğünü, simge büyüklüğünü, iç boşluğu ve yüksekliği birlikte ölçekler, böylece kontroller her basamakta oranlı kalır. <code>size</code> özelliğini bir modele bağlayın, uygulamanın tamamının boyutu çalışma sırasında değişsin.

docISizedTitle=ISized
docISizedSubtitle=ui5.touch.controls.ISized
docISizedText=<code>size</code> özelliği olan bütün kontroller <code>ui5.touch.controls.ISized</code> işaretleyici arayüzünü uygular. Böylece boyut genel olarak ele alınabilir; örneğin bir kullanıcı ayarını bir görünümün tamamına uygulamak için.

docKeyboardTitle=Klavyeler
docKeyboardSubtitle=sap.m'de karşılığı yok
docKeyboardText1=Üretim sahasındaki bir terminalde, bir kioskta ya da eldivenle kullanılan bir cihazda çoğu zaman donanım klavyesi bulunmaz; işletim sisteminin ekran klavyesi ise ya yoktur ya da ekranın yarısını kapatır. UI5'te bunun için bir kontrol yok. Kitaplık, kendi düğmelerinden çizilen üç ekran klavyesi getirir &mdash; dışarıdan hiçbir bağımlılık olmadan ve her şey gibi aynı <code>size</code> özelliğiyle ölçeklenerek.
docKeyboardText2=<code>tc:Keyboard</code> harflerden oluşan bir klavyedir: <code>mode</code> bir ülkenin düzenini seçer, birkaç anahtar da rakamların harflerin üstünde mi yoksa bir tuşun ardında mı durduğunu, özel karakter olup olmadığını ve hangi harf durumunda yazdığını belirler. <code>tc:NumberPad</code> aynı düşüncenin rakam alanları için olanıdır. <code>tc:CustomKeyboard</code> tuşlarını satır satır teslim alır, diğer ikisinin karşılamadığı her şey için: <code>&#123;shift&#125;</code>, <code>&#123;space&#125;</code>, <code>&#123;bksp&#125;</code> ve <code>&#123;enter&#125;</code> özel tuşlardır, geri kalan her tuş kendi yazısını yazar. Üçü de <code>hardwareKeys="true"</code> ile gerçek klavyenin tuşlarını kabul eder, <code>docked</code> ile ekranın alt kenarına yanaşır ve bir alanın <code>keyboard</code> birleşimine sığar.

docPitfallTitle=Tuzak: yalnızca sap.m.Button kabul eden birleşimler
docPitfallSubtitle=sap.m.Dialog kontrolünün buttons, beginButton ve endButton birleşimleri
docPitfallStrip=Bazı standart birleşimler sap.m.Button türüne bağlıdır ve bir tc:Button kontrolünü çalışma sırasında geri çevirir: "Element ui5.touch.controls.Button#__button0" is not valid for aggregation "buttons".
docPitfallText1=Zaten bu düğme yerlerinin büyütülmesi de düşünülmemiştir &mdash; standart düğme yüksekliğine göre yerleştirilmişlerdir.
docPitfallText2=<strong>Çıkış yolu <code>footer</code> birleşimidir.</strong> O, <code>sap.m.Toolbar</code> türüne bağlıdır (UI5 1.110'dan beri vardır) ve <code>tc:Toolbar</code> ile <code>tc:OverflowToolbar</code> <code>sap.m.Toolbar</code> sınıfından türediği için oraya olduğu gibi girerler. İletişim kutusu o zaman altlığının yüksekliğini araç çubuğuna göre ayarlar ve dokunmatik boyuttaki düğmeler düzgün çizilir. İletişim kutusu darlaşabiliyorsa <code>tc:OverflowToolbar</code> tercih edin.
docPitfallText3=Yalın ileti kutusu türü iletişim kutuları için bunu elle kurmanız gerekmez &mdash; <code>QuickDialog</code> altlığını zaten böyle kurar, boyutunu da kendi <code>size</code> seçeneğinden alır.
docSizesExample=Boyutu bağlamak
docPitfallBrokenTitle=Çalışmaz
docPitfallWorksTitle=Çalışır

# ---------------------------------------------------------------------------
# kontrol sayfaları
# ---------------------------------------------------------------------------
barcodeHint=<code>sap.m</code>'de karşılığı yok: keyboard wedge kipindeki bir barkod okuyucu, kodu birkaç milisaniye içinde odaktaki alana yazar ve <kbd>Enter</kbd> ile bitirir. Kontrol, tuş vuruşları arasındaki süreyi ölçer; bu yüzden bir okuma <code>scan</code> olayını, aynı karakterlerin elle yazılması ise <code>change</code> olayını tetikler.
signatureHint=<code>sap.m</code>'de karşılığı yok. Alan bir canvas üzerine çizer ve sonucu <code>value</code> içinde PNG veri URL'si olarak verir, böylece bir modele bağlanıp herhangi bir değer gibi arka uca gönderilebilir. Çizgi kalınlığı, yer tutucu ve temizleme düğmesi <code>size</code> özelliğine uyar.

overflowPlainHint=Kaydırıcıyı sola çekin: artık sığmayan içerik üç noktalı düğmenin ardına geçer. Tam genişlikte taşma düğmesi hiç görünmez.
overflowPriorityHint=«Yazdır» düğmesinin önceliği Low, bu yüzden ilk o taşar. «Kaydet» düğmesininki NeverOverflow, o yüzden araç çubuğunda yer oldukça orada kalır; en dar genişlikte o da açılır pencereye geçer ki taşma düğmesi erişilebilir kalsın. «Hakkında» düğmesininki AlwaysOverflow, o hep açılır penceredir — bu araç çubuğunun bol yer varken bile üç noktalı düğmeyi göstermesinin nedeni budur.
overflowFooterHint=Altlıktaki araç çubuğunun taşmasını görmek için tarayıcı penceresini daraltın — açılır pencere o zaman araç çubuğunun üstünde açılır.
overflowDialogHint=sap.m.Dialog kontrolünün buttons birleşimi yalnızca sap.m.Button alır; altlık ise herhangi bir sap.m.Toolbar kabul eder — dokunmatik OverflowToolbar oraya olduğu gibi girer. İki araç çubuğundan burada daha iyisi odur: bir iletişim kutusu doğası gereği dardır ve sığmayan içerik kesilmek yerine taşma menüsüne geçer.
inputKeyboardHint=«Sanal klavye» açıkken keyboard birleşimindeki klavye, alan odaktayken alanın altında açılır ve odak alandan ayrılır ayrılmaz kapanır.
textAreaKeyboardHint=«Sanal klavye» açıkken keyboard birleşimindeki klavye, alan odaktayken alanın altında açılır ve odak alandan ayrılır ayrılmaz kapanır. Enter tuşu satır sonu ekler — çok satırlı bir alanda Enter'ın yaptığı gibi.

