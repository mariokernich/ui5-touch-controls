<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
		/>
		<meta
			http-equiv="Cache-Control"
			content="no-cache, no-store, must-revalidate"
		/>
		<meta http-equiv="Pragma" content="no-cache" />
		<meta http-equiv="Expires" content="0" />
		<title>ui5.touch.controls</title>
		<!-- the demo is served from test-resources/ui5/touch/controls/, so the
		     framework is four levels up -->
		<base href="../../../../" />
		<!-- the icon tile of the logo; the paths are written out because the
		     base above would resolve a relative one against the server root -->
		<link
			rel="icon"
			type="image/svg+xml"
			href="test-resources/ui5/touch/controls/logo-mark.svg"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="test-resources/ui5/touch/controls/favicon.png"
		/>
		<script>
			// Start in the dark variant when the visitor's system is set to dark
			// mode. This goes through the global configuration object instead of
			// data-sap-ui-theme, because the bootstrap attributes would take
			// precedence over it - and it keeps the sap-ui-theme URL parameter
			// working, which ranks above both.
			window["sap-ui-config"] = {
				theme: window.matchMedia("(prefers-color-scheme: dark)").matches
					? "sap_horizon_dark"
					: "sap_horizon",
			};
		</script>
		<script
			id="sap-ui-bootstrap"
			src="resources/sap-ui-core.js"
			data-sap-ui-async="true"
			data-sap-ui-compat-version="edge"
			data-sap-ui-on-init="module:sap/ui/core/ComponentSupport"
			data-sap-ui-resource-roots='{"ui5.touch.controls.demo": "./test-resources/ui5/touch/controls/", "ui5.touch.controls": "./resources/ui5/touch/controls/"}'
		></script>
	</head>
	<body class="sapUiBody">
		<div
			data-sap-ui-component
			data-name="ui5.touch.controls.demo"
			data-id="container"
			data-height="100%"
			data-settings='{"id": "demo"}'
		></div>
	</body>
</html>
