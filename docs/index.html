<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
		/>
		<meta
			http-equiv="Cache-Control"
			content="no-cache, no-store, must-revalidate"
		/>
		<meta http-equiv="Pragma" content="no-cache" />
		<meta http-equiv="Expires" content="0" />
		<title>ui5.touch.controls - Touch-Friendly OpenUI5 Controls</title>
		<meta
			name="description"
			content="ui5.touch.controls is an OpenUI5 library of touch-friendly controls. It rebuilds the sap.m controls with one central size property (S-6XL) as a drop-in replacement and adds what sap.m is missing, such as an on-screen keyboard, a number pad, a signature pad and a barcode input."
		/>
		<meta
			name="keywords"
			content="UI5, OpenUI5, SAPUI5, sap.m, touch controls, UI5 library, on-screen keyboard, touchscreen, kiosk, shop floor, TypeScript"
		/>
		<meta name="author" content="Mario Kernich" />
		<!-- A crawler that renders the page follows the router hash; the pages
		     behind it are all the same document, so one canonical URL is right. -->
		<link
			rel="canonical"
			href="https://mariokernich.github.io/ui5-touch-controls/test-resources/ui5/touch/controls/index.html"
		/>

		<!-- Open Graph: what Facebook, LinkedIn, Slack, WhatsApp and friends
		     read for the link preview. Every URL has to be absolute - the
		     <base> below does not apply to them, and a scraper does not run
		     the page anyway. -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="ui5.touch.controls" />
		<meta
			property="og:title"
			content="ui5.touch.controls - Touch-Friendly OpenUI5 Controls"
		/>
		<meta
			property="og:description"
			content="An OpenUI5 library of touch-friendly controls: the sap.m controls rebuilt with one central size property (S-6XL), plus an on-screen keyboard, number pad, signature pad and barcode input."
		/>
		<meta
			property="og:url"
			content="https://mariokernich.github.io/ui5-touch-controls/test-resources/ui5/touch/controls/index.html"
		/>
		<meta
			property="og:image"
			content="https://mariokernich.github.io/ui5-touch-controls/test-resources/ui5/touch/controls/img/og-image.png"
		/>
		<meta property="og:image:type" content="image/png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta
			property="og:image:alt"
			content="The ui5.touch.controls demo application showing touch-friendly UI5 controls in several sizes"
		/>
		<meta property="og:locale" content="en_US" />

		<!-- Twitter/X uses its own names and falls back to the og:* ones only
		     for some of them. -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta
			name="twitter:title"
			content="ui5.touch.controls - Touch-Friendly OpenUI5 Controls"
		/>
		<meta
			name="twitter:description"
			content="An OpenUI5 library of touch-friendly controls: the sap.m controls rebuilt with one central size property (S-6XL), plus an on-screen keyboard, number pad, signature pad and barcode input."
		/>
		<meta
			name="twitter:image"
			content="https://mariokernich.github.io/ui5-touch-controls/test-resources/ui5/touch/controls/img/og-image.png"
		/>
		<meta
			name="twitter:image:alt"
			content="The ui5.touch.controls demo application showing touch-friendly UI5 controls in several sizes"
		/>
		<!-- the demo is served from test-resources/ui5/touch/controls/, so the
		     framework is four levels up -->
		<base href="../../../../" />
		<!-- the icon tile of the logo; the paths are written out because the
		     base above would resolve a relative one against the server root -->
		<link
			rel="icon"
			type="image/svg+xml"
			href="test-resources/ui5/touch/controls/img/logo-mark.svg"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="test-resources/ui5/touch/controls/img/favicon.png"
		/>
		<script>
			// Start in the dark variant when the visitor's system is set to dark
			// mode. This goes through the global configuration object instead of
			// data-sap-ui-theme, because the bootstrap attributes would take
			// precedence over it - and it keeps the sap-ui-theme URL parameter
			// working, which ranks above both.
			window["sap-ui-config"] = {
				theme: window.matchMedia("(prefers-color-scheme: dark)").matches
					? "sap_horizon_dark"
					: "sap_horizon",
			};
		</script>
		<script
			id="sap-ui-bootstrap"
			src="resources/sap-ui-core.js"
			data-sap-ui-async="true"
			data-sap-ui-compat-version="edge"
			data-sap-ui-on-init="module:sap/ui/core/ComponentSupport"
			data-sap-ui-resource-roots='{"ui5.touch.controls.demo": "./test-resources/ui5/touch/controls/", "ui5.touch.controls": "./resources/ui5/touch/controls/"}'
		></script>
		<script
			async
			src="https://www.googletagmanager.com/gtag/js?id=G-PNZQK59N70"
		></script>
		<script>
			window.dataLayer = window.dataLayer || [];
			function gtag() {
				dataLayer.push(arguments);
			}
			gtag("js", new Date());
			gtag("config", "G-PNZQK59N70");
		</script>
		<!-- Structured data: the page is a UI5 application, so a crawler that
		     does not execute JavaScript sees an empty body. This tells it what
		     the site is about regardless. -->
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "SoftwareSourceCode",
				"name": "ui5.touch.controls",
				"description": "An OpenUI5 library of touch-friendly controls: the sap.m controls rebuilt with one central size property (S-6XL) as a drop-in replacement, plus an on-screen keyboard, number pad, signature pad and barcode input.",
				"url": "https://mariokernich.github.io/ui5-touch-controls/test-resources/ui5/touch/controls/index.html",
				"codeRepository": "https://github.com/mariokernich/ui5-touch-controls",
				"programmingLanguage": "TypeScript",
				"runtimePlatform": "OpenUI5",
				"license": "https://www.apache.org/licenses/LICENSE-2.0",
				"author": {
					"@type": "Person",
					"name": "Mario Kernich"
				},
				"keywords": [
					"UI5",
					"OpenUI5",
					"SAPUI5",
					"touch controls",
					"on-screen keyboard"
				]
			}
		</script>
	</head>
	<body class="sapUiBody">
		<div
			data-sap-ui-component
			data-name="ui5.touch.controls.demo"
			data-id="container"
			data-height="100%"
			data-settings='{"id": "demo"}'
		></div>
	</body>
</html>
