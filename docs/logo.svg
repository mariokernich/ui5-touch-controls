<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="ui5.touch.controls">
	<title>ui5.touch.controls</title>
	<defs>
		<linearGradient id="tile" x1="0" y1="0" x2="0.35" y2="1">
			<stop offset="0" stop-color="#1B90FF" />
			<stop offset="1" stop-color="#0040B0" />
		</linearGradient>
	</defs>

	<rect width="512" height="512" rx="116" fill="url(#tile)" />

	<!-- the 5 of UI5, drawn with the rounded, generous strokes the library
	     stands for; the dot in its bowl is the touch point -->
	<g transform="translate(19 6.9) scale(0.86)">
		<path
			d="M 344 156 H 196 V 268 H 268 A 78 78 0 1 1 200 356"
			fill="none"
			stroke="#FFFFFF"
			stroke-width="54"
			stroke-linecap="round"
			stroke-linejoin="round" />
		<circle cx="277" cy="345" r="26" fill="#FFFFFF" />
	</g>
</svg>
