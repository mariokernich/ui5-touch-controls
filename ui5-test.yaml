# Serves the plain test pages in test/ - one page per control, no application
# around them. They exist to see the controls on the older UI5 versions the
# library supports, which the demo application cannot do: that one is built
# against the latest release.
specVersion: "4.0"
metadata:
  name: ui5.touch.controls
type: library
resources:
  configuration:
    paths:
      src: src
      test: test
framework:
  name: OpenUI5
  # the version the start:test scripts override; the pages themselves use
  # nothing that is newer than the oldest supported release
  version: 1.151.0
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: themelib_sap_horizon
    - name: themelib_sap_fiori_3
builder:
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
      configuration:
        generateTsInterfaces: true
server:
  customMiddleware:
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: compression
      configuration:
          generateTsInterfaces: true
# No livereload here, unlike the demo: the UI tests run against this server, and
# a reload in the middle of a test takes the wdi5 bridge in the page with it.
