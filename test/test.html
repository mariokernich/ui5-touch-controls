<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>ui5.touch.controls test page</title>
		<!-- the page is served from test-resources/ui5/touch/controls/, so the
		     framework is four levels up -->
		<base href="../../../../" />
		<script
			id="sap-ui-bootstrap"
			src="resources/sap-ui-core.js"
			data-sap-ui-async="true"
			data-sap-ui-compat-version="edge"
			data-sap-ui-theme="sap_horizon"
			data-sap-ui-libs="sap.m,ui5.touch.controls"
			data-sap-ui-resourceroots='{"ui5.touch.controls": "./resources/ui5/touch/controls/", "ui5.touch.controls.test": "./test-resources/ui5/touch/controls/"}'
			data-sap-ui-oninit="module:ui5/touch/controls/test/boot"
		></script>
		<style>
			/* sap.m.Page positions its scroll section absolutely between header
			   and bottom, so it collapses to nothing unless the element it is
			   placed in has a height of its own */
			html,
			body,
			#content {
				height: 100%;
			}

			.touchTestRow {
				gap: 0.75rem;
				margin-bottom: 0.5rem;
			}

			.touchTestCaption {
				opacity: 0.7;
				font-size: 0.75rem;
			}
		</style>
	</head>
	<body class="sapUiBody">
		<div id="content"></div>
	</body>
</html>
