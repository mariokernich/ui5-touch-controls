<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>ui5.touch.controls test page</title>
		<!-- the page is served from test-resources/ui5/touch/controls/, so the
		     framework is four levels up -->
		<base href="../../../../" />
		<script>
			// Everything that goes wrong on the page is collected here, so the
			// UI tests can ask for it with one call - a failed module load
			// included, which fires an error event on its script element.
			window.touchTestErrors = [];
			window.addEventListener("error", (event) => {
				const source = event.target?.src ?? event.target?.href;
				window.touchTestErrors.push(
					source ? `failed to load ${source}` : String(event.message),
				);
			});
			window.addEventListener("unhandledrejection", (event) => {
				window.touchTestErrors.push(String(event.reason));
			});
		</script>
		<script
			id="sap-ui-bootstrap"
			src="resources/sap-ui-core.js"
			data-sap-ui-async="true"
			data-sap-ui-compat-version="edge"
			data-sap-ui-theme="sap_horizon"
			data-sap-ui-libs="sap.m,ui5.touch.controls"
			data-sap-ui-resourceroots='{"ui5.touch.controls": "./resources/ui5/touch/controls/", "ui5.touch.controls.test": "./test-resources/ui5/touch/controls/"}'
			data-sap-ui-oninit="module:ui5/touch/controls/test/boot"
		></script>
		<style>
			/* sap.m.Page positions its scroll section absolutely between header
			   and bottom, so it collapses to nothing unless the element it is
			   placed in has a height of its own */
			html,
			body,
			#content {
				height: 100%;
			}

			/* Layout only. The colors come from the theme through the sap.m
			   controls - a custom property such as var(--sapGroup_...) is no
			   help here, as up to UI5 1.120 the themes do not put them into
			   their stylesheet, and the page has to look the same from 1.102
			   on. Where a line is needed, a grey at low opacity works on a
			   light and on a dark theme alike. */

			.touchTestContent {
				max-width: 90rem;
				margin: 0 auto;
				padding: 1rem;
				box-sizing: border-box;
			}

			.touchTestGroup {
				margin-bottom: 1.5rem;
			}

			.touchTestGroupTitle {
				margin: 0.5rem 0 0.75rem;
			}

			.touchTestCard {
				margin-bottom: 1rem;
			}

			/* a row of a card: the caption in a column of its own, the
			   controls next to it, a hairline between the rows */
			.touchTestRow {
				display: grid !important;
				grid-template-columns: 10rem minmax(0, 1fr);
				column-gap: 1rem;
				align-items: center;
				padding: 0.5rem 0;
			}

			.touchTestRow + .touchTestRow {
				border-top: 1px solid rgba(128, 128, 128, 0.25);
			}

			/* the sap.m originals below the controls of the library, set off
			   by a line across the card - the title is an inline block of
			   sap.m otherwise, hence the two classes */
			.touchTestCard .touchTestOriginalTitle {
				display: block;
				margin-top: 0.75rem;
				padding-top: 0.75rem;
				border-top: 1px solid rgba(128, 128, 128, 0.5);
			}

			.touchTestCaption {
				opacity: 0.7;
				font-size: 0.875rem;
			}

			.touchTestControls {
				gap: 0.75rem;
			}

			/* on a narrow screen the caption goes above the controls */
			@media (max-width: 600px) {
				.touchTestRow {
					grid-template-columns: minmax(0, 1fr);
					row-gap: 0.25rem;
				}
			}
		</style>
	</head>
	<body class="sapUiBody">
		<div id="content"></div>
	</body>
</html>
