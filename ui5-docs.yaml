specVersion: "4.0"
metadata:
  name: ui5.touch.controls
type: library
resources:
  configuration:
    paths:
      src: src
      # the demo application, called "docs" because that is what it is; the
      # tooling still serves it under /test-resources
      test: docs
framework:
  name: OpenUI5
  version: 1.151.0
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.f
    - name: sap.tnt
    - name: sap.ui.unified
    - name: themelib_sap_horizon
    - name: themelib_sap_fiori_3
builder:
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
      configuration:
        generateTsInterfaces: true # always generate the TS interfaces in build
server:
  customMiddleware:
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: compression
      configuration:
          generateTsInterfaces: true
    - name: ui5-tooling-modules-middleware
      afterMiddleware: compression
      configuration:
        addToNamespace: true
    - name: ui5-middleware-livereload
      afterMiddleware: compression
      configuration:
          path:
              - "docs/"
              - "src/"
